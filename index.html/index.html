        </div>

        {/* Monthly Revenue Chart */}
        {(()=>{
          const now=new Date();
          // Build last 8 months labels
          const months=[];
          for(let i=7;i>=0;i--){
            const d=new Date(now.getFullYear(),now.getMonth()-i,1);
            months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'}),rev:0,count:0});
          }
          // Match clients by fechaCierre
          clients.forEach(c=>{
            if(!c.fechaCierre||!(c.montoContrato>0)) return;
            // fechaCierre is like "21 dic. 2025" or date string
            let d;
            try{d=new Date(c.fechaCierre);}catch{return;}
            if(isNaN(d)) return;
            const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
            const m=months.find(m=>m.key===key);
            if(m){m.rev+=c.montoContrato||0;m.count++;}
          });
          const hasData=months.some(m=>m.rev>0);
          if(!hasData) return null;
          const maxRev=Math.max(...months.map(m=>m.rev),1);
          const totalChartRev=months.reduce((s,m)=>s+m.rev,0);
          // Trend: compare last 4 months vs previous 4 months
          const half=months.length/2;
          const recent=months.slice(half).reduce((s,m)=>s+m.rev,0);
          const prev=months.slice(0,half).reduce((s,m)=>s+m.rev,0);
          const trend=prev>0?Math.round(((recent-prev)/prev)*100):null;
          return(
            <div className="glass" style={{padding:'24px',marginBottom:'24px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px',flexWrap:'wrap',gap:'10px'}}>
                <div>
                  <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.1em',textTransform:'uppercase',margin:'0 0 4px'}}>Ingresos por Mes</p>
                  <p style={{fontSize:'12px',color:'rgba(255,255,255,0.4)',margin:0,fontFamily:"'Inter',sans-serif"}}>Basado en fecha de cierre · Total: <span style={{color:DB_A,fontWeight:'700'}}>${totalChartRev.toLocaleString('es-CO')}</span></p>
                </div>
                {trend!==null&&<span style={{fontSize:'12px',fontWeight:'700',color:trend>=0?'#4ade80':'#f87171',background:trend>=0?'rgba(74,222,128,0.1)':'rgba(248,113,113,0.1)',border:`1px solid ${trend>=0?'rgba(74,222,128,0.2)':'rgba(248,113,113,0.2)'}`,borderRadius:'100px',padding:'4px 12px',fontFamily:"'Inter',sans-serif"}}>{trend>=0?'↑':'↓'} {Math.abs(trend)}% vs 4 meses ant.</span>}
              </div>
              <div style={{display:'flex',gap:'8px',alignItems:'flex-end',height:'120px'}}>
                {months.map((m,i)=>{
                  const pct=maxRev>0?Math.max(4,(m.rev/maxRev)*100):4;
                  const isCurrent=i===months.length-1;
                  return(
                    <div key={m.key} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:'5px',height:'100%',justifyContent:'flex-end'}}>
                      {m.rev>0&&<span style={{fontSize:'9px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif",writingMode:'unset',whiteSpace:'nowrap'}}>${(m.rev/1000).toFixed(0)}k</span>}
                      <div style={{width:'100%',height:`${pct}%`,background:isCurrent?`linear-gradient(180deg,${DB_A},rgba(245,158,11,0.4))`:`linear-gradient(180deg,rgba(245,158,11,0.5),rgba(245,158,11,0.2))`,borderRadius:'4px 4px 2px 2px',transition:'height .4s ease',minHeight:'4px',position:'relative'}}>
                        {m.count>0&&<div style={{position:'absolute',top:'-14px',left:'50%',transform:'translateX(-50%)',fontSize:'8px',color:isCurrent?DB_A:'rgba(255,255,255,0.2)',fontWeight:'700',whiteSpace:'nowrap'}}>{m.count}</div>}
                      </div>
                      <span style={{fontSize:'8.5px',color:isCurrent?DB_A:'rgba(255,255,255,0.2)',fontFamily:"'Inter',sans-serif",fontWeight:isCurrent?'700':'400',textAlign:'center',lineHeight:'1.2'}}>{m.label}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}
        {/* Revenue Forecast */}
        {(()=>{
          const mrr=clients.filter(c=>c.estado==='Activo').reduce((s,c)=>s+(c.montoContrato||0),0);
          const arr=mrr*12;
          const pipeline=clients.filter(c=>['Propuesta enviada','Propuesta aceptada'].includes(c.estado)).reduce((s,c)=>s+(c.montoContrato||0),0);
          const pipelineHigh=clients.filter(c=>c.estado==='Propuesta aceptada').reduce((s,c)=>s+(c.montoContrato||0),0);
          const totalActive=clients.filter(c=>c.estado==='Activo').length;
          const totalPipeline=clients.filter(c=>['Propuesta enviada','Propuesta aceptada'].includes(c.estado)).length;
          const mrrTarget=emps.reduce((s,e)=>s+(e.metaMensual||0),0);
          const mrrPct=mrrTarget>0?Math.min(100,Math.round((mrr/mrrTarget)*100)):0;
          return(
            <div className="glass" style={{padding:'24px',marginBottom:'24px',borderTop:'2px solid rgba(251,191,36,0.2)'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}}>
                <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.1em',textTransform:'uppercase',margin:0}}>Proyección de Ingresos</p>
                <span style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',background:'rgba(255,255,255,0.04)',padding:'3px 10px',borderRadius:'100px'}}>Datos en tiempo real</span>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'20px',marginBottom:'20px'}}>
                {[
                  {l:'MRR',v:`$${mrr.toLocaleString('es-CO')}`,sub:`${totalActive} clientes activos`,c:'#34d399'},
                  {l:'ARR Proyectado',v:`$${arr.toLocaleString('es-CO')}`,sub:'MRR × 12 meses',c:'#f59e0b'},

              {/* Agency goal */}
              {(()=>{
                const goalBase=agencyGoal>0?agencyGoal:mrrTarget;

                const remaining=goalBase>0?Math.max(0,goalBase-mrr):0;

              </div>
              <div style={{display:'flex',gap:'12px',marginBottom:'20px',flexWrap:'wrap'}}>
                {[{l:'Tasa de éxito',v:`${winRate}%`,c:winRate>=60?'#4ade80':winRate>=40?'#fbbf24':'#f87171',sub:`${won.length} ganados de ${finalized.length}`},{l:'Ganados',v:won.length,c:'#4ade80',sub:wonRev>0?`$${wonRev.toLocaleString('es-CO')}`:'Sin monto'},{l:'Perdidos',v:lost.length,c:'#f87171',sub:lostRev>0?`$${lostRev.toLocaleString('es-CO')}`:'Sin monto'}].map(k=>(
                  <div key={k.l} style={{flex:1,minWidth:'90px',background:'rgba(255,255,255,0.02)',border:`1px solid ${k.c}22`,borderRadius:'10px',padding:'14px 16px'}}>
                    <p style={{fontSize:'10px',fontWeight:'600',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',margin:'0 0 5px',fontFamily:"'Inter',sans-serif"}}>{k.l}</p>

              {topReasons.length>0&&(
                <div>
                  <p style={{fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.2)',letterSpacing:'.1em',textTransform:'uppercase',margin:'0 0 10px',fontFamily:"'Inter',sans-serif"}}>Razones de pérdida frecuentes</p>
                  <div style={{display:'flex',flexDirection:'column',gap:'7px'}}>
                    {topReasons.map(([reason,count])=>(
                      <div key={reason} style={{display:'flex',alignItems:'center',gap:'10px'}}>
                        <span style={{fontSize:'12px',color:'rgba(255,255,255,0.6)',fontFamily:"'Inter',sans-serif",flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{reason}</span>
                        <span style={{fontSize:'11px',fontWeight:'700',color:'#f87171',background:'rgba(248,113,113,0.1)',borderRadius:'100px',padding:'1px 8px',fontFamily:"'Inter',sans-serif",flexShrink:0}}>{count}×</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          );
        })()}

        {/* Revenue by service breakdown */}
        {(()=>{
          const SVC_CFG={marketing:{l:'Marketing Digital',c:WARM,icon:'📣'},ia:{l:'Inteligencia Artificial',c:AI_A,icon:'🤖'},web:{l:'Página Web',c:WEB_A,icon:'🌐'}};
          const activos=clients.filter(c=>c.estado==='Activo'&&(c.montoContrato||0)>0);
          if(activos.length===0) return null;
          const rows=Object.entries(SVC_CFG).map(([k,cfg])=>{
            const svcClients=activos.filter(c=>(c.servicios||[]).includes(k));
            const rev=svcClients.reduce((s,c)=>s+(c.montoContrato||0),0);
            return{k,...cfg,rev,count:svcClients.length};
          }).filter(r=>r.count>0).sort((a,b)=>b.rev-a.rev);
          if(!rows.length) return null;
          const maxRev=rows[0].rev;

                <span style={{fontSize:'12px',fontWeight:'700',color:'rgba(255,255,255,0.5)',fontFamily:"'Inter',sans-serif"}}>Total activo: <span style={{color:'#fbbf24'}}>${totalRev.toLocaleString('es-CO')}</span></span>

}

function GlobalTasksModule({onHome,currentUser}){
  const {useState,useEffect,useMemo}=React;
  const isAdmin=currentUser&&currentUser.role==='admin';
  const [clients,setClients]=useState(()=>clients_storage.load());
  const [filter,setFilter]=useState('pendientes'); // 'pendientes'|'vencidas'|'hoy'|'todas'|'recurrentes'
  const [searchQ,setSearchQ]=useState('');
  const [sortBy,setSortBy]=useState('fecha'); // 'fecha'|'prioridad'|'cliente'
  const PRIO_ORDER={alta:0,media:1,baja:2};
  const PRIO_C={alta:'#f87171',media:'#fbbf24',baja:'#34d399'};
  const today=new Date();today.setHours(0,0,0,0);

  const allTasks=useMemo(()=>{
    const myClients=isAdmin?clients:clients.filter(c=>c.asignadoA===currentUser?.id);
    const tasks=[];
    myClients.forEach(c=>{
      (c.tareas||[]).forEach(t=>{
        tasks.push({...t,clientId:c.id,clientName:c.empresa,clientEstado:c.estado});
      });
    });
    return tasks;
  },[clients,isAdmin,currentUser]);

  const filtered=useMemo(()=>{
    let list=allTasks;
    if(filter==='pendientes') list=list.filter(t=>!t.completada);
    else if(filter==='vencidas') list=list.filter(t=>!t.completada&&t.fechaLimite&&new Date(t.fechaLimite)<today);
    else if(filter==='hoy'){const ts=today.toISOString().split('T')[0];list=list.filter(t=>!t.completada&&t.fechaLimite===ts);}
    else if(filter==='recurrentes') list=list.filter(t=>!t.completada&&t.recurrencia);
    if(searchQ.trim()){const q=searchQ.toLowerCase();list=list.filter(t=>t.titulo.toLowerCase().includes(q)||t.clientName.toLowerCase().includes(q)||(t.responsable||'').toLowerCase().includes(q));}
    if(sortBy==='fecha') list=[...list].sort((a,b)=>{if(!a.fechaLimite&&!b.fechaLimite)return 0;if(!a.fechaLimite)return 1;if(!b.fechaLimite)return -1;return new Date(a.fechaLimite)-new Date(b.fechaLimite);});
    else if(sortBy==='prioridad') list=[...list].sort((a,b)=>(PRIO_ORDER[a.prioridad]||1)-(PRIO_ORDER[b.prioridad]||1));
    else if(sortBy==='cliente') list=[...list].sort((a,b)=>a.clientName.localeCompare(b.clientName));
    return list;
  },[allTasks,filter,searchQ,sortBy,today]);

  const toggleTask=(clientId,taskId)=>{
    const updClients=clients.map(c=>{
      if(c.id!==clientId) return c;
      const t=c.tareas.find(x=>x.id===taskId);if(!t)return c;
      const now=new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'});
      const newCompletada=!t.completada;
      const nextDate=(dateStr,rec)=>{if(!dateStr||!rec)return '';const d=new Date(dateStr);if(rec==='semanal')d.setDate(d.getDate()+7);else if(rec==='mensual')d.setMonth(d.getMonth()+1);return d.toISOString().split('T')[0];};
      let newTareas=c.tareas.map(x=>x.id===taskId?{...x,completada:newCompletada}:x);
      let extraHist=[];
      if(newCompletada&&t.recurrencia){
        const sig={id:Date.now().toString(),titulo:t.titulo,prioridad:t.prioridad,fechaLimite:nextDate(t.fechaLimite,t.recurrencia),responsable:t.responsable||'',recurrencia:t.recurrencia,completada:false,createdAt:now};
        newTareas=[sig,...newTareas];
        extraHist=[{fecha:now,tipo:'tarea',descripcion:`🔁 Tarea recurrente regenerada: "${t.titulo}"`}];
      }
      const entry=newCompletada?{fecha:now,tipo:'tarea',descripcion:`✅ Tarea completada: "${t.titulo}"`}:null;
      const newHist=[...(c.historial||[]),...(entry?[entry]:[]),...extraHist];
      return {...c,tareas:newTareas,historial:newHist};
    });
    clients_storage.save(updClients);
    setClients(updClients);
  };

  const counts={pendientes:allTasks.filter(t=>!t.completada).length,vencidas:allTasks.filter(t=>!t.completada&&t.fechaLimite&&new Date(t.fechaLimite)<today).length,hoy:(()=>{const ts=today.toISOString().split('T')[0];return allTasks.filter(t=>!t.completada&&t.fechaLimite===ts).length;})(),recurrentes:allTasks.filter(t=>!t.completada&&t.recurrencia).length,todas:allTasks.length};

  const TABS=[{k:'pendientes',l:'Pendientes',c:'rgba(255,255,255,0.5)'},{k:'vencidas',l:'⚠️ Vencidas',c:'#f87171'},{k:'hoy',l:'🗓 Hoy',c:'#38bdf8'},{k:'recurrentes',l:'🔁 Recurrentes',c:GL_P3},{k:'todas',l:'Todas',c:'rgba(255,255,255,0.35)'}];

  return(
    <div style={{minHeight:'100vh',background:GL_BG,color:'#fff',fontFamily:"'Inter',sans-serif"}}>
      {/* Header */}
      <div style={{borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'20px 32px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'16px',flexWrap:'wrap',background:'rgba(255,255,255,0.01)'}}>
        <div style={{display:'flex',alignItems:'center',gap:'16px'}}>
          <button onClick={onHome} style={{padding:'7px 14px',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'8px',color:'rgba(255,255,255,0.45)',fontSize:'12px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>← Inicio</button>
          <div>
            <h1 style={{fontSize:'18px',fontWeight:'700',color:'#fff',letterSpacing:'-.02em',margin:0}}>Tareas Globales</h1>
            <p style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',margin:'2px 0 0'}}>Vista unificada de todas las tareas de clientes</p>
          </div>
        </div>
        <div style={{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}}>
          <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Buscar tarea o cliente…"
            style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'8px',padding:'7px 12px',color:'#fff',fontSize:'13px',outline:'none',fontFamily:"'Inter',sans-serif",width:'200px'}}/>
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)}
            style={{background:'#111',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',padding:'7px 10px',color:'rgba(255,255,255,0.5)',fontSize:'12px',outline:'none',fontFamily:"'Inter',sans-serif"}}>
            <option value="fecha">Ordenar: Fecha</option>
            <option value="prioridad">Ordenar: Prioridad</option>
            <option value="cliente">Ordenar: Cliente</option>
          </select>
        </div>
      </div>

      <div style={{padding:'28px 32px'}}>
        {/* Summary KPIs */}
        <div style={{display:'flex',gap:'10px',marginBottom:'24px',flexWrap:'wrap'}}>
          {TABS.map(tab=>(
            <button key={tab.k} onClick={()=>setFilter(tab.k)}
              style={{padding:'8px 16px',background:filter===tab.k?`${tab.c}18`:'rgba(255,255,255,0.03)',border:`1px solid ${filter===tab.k?tab.c+'55':'rgba(255,255,255,0.08)'}`,borderRadius:'100px',color:filter===tab.k?tab.c:'rgba(255,255,255,0.4)',fontSize:'12px',fontWeight:'700',cursor:'pointer',fontFamily:"'Inter',sans-serif",display:'flex',alignItems:'center',gap:'6px',transition:'all .15s'}}>
              {tab.l}
              <span style={{fontSize:'11px',padding:'1px 6px',background:filter===tab.k?`${tab.c}22`:'rgba(255,255,255,0.06)',borderRadius:'100px',color:filter===tab.k?tab.c:'rgba(255,255,255,0.3)'}}>{counts[tab.k]}</span>
            </button>
          ))}
        </div>

        {/* Task list */}
        {filtered.length===0&&(
          <div style={{padding:'60px',textAlign:'center',color:'rgba(255,255,255,0.2)',fontSize:'14px'}}>
            {filter==='vencidas'?'✅ Sin tareas vencidas':filter==='hoy'?'Sin tareas para hoy':'Sin tareas en esta vista'}
          </div>
        )}
        <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
          {filtered.map(t=>{
            const overdue=!t.completada&&t.fechaLimite&&new Date(t.fechaLimite)<today;
            const pc=PRIO_C[t.prioridad]||PRIO_C.media;
            return(
              <div key={t.id+t.clientId} style={{display:'flex',alignItems:'flex-start',gap:'12px',padding:'13px 16px',background:t.completada?'rgba(255,255,255,0.01)':'rgba(255,255,255,0.03)',border:`1px solid ${overdue?'rgba(248,113,113,0.25)':t.completada?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.07)'}`,borderLeft:`3px solid ${t.completada?'rgba(255,255,255,0.08)':overdue?'#f87171':pc}`,borderRadius:'8px',transition:'all .15s',opacity:t.completada?0.45:1}}>
                <button onClick={()=>toggleTask(t.clientId,t.id)}
                  style={{width:'18px',height:'18px',borderRadius:'50%',border:`2px solid ${t.completada?'#34d399':pc}`,background:t.completada?'#34d39922':'transparent',cursor:'pointer',flexShrink:0,marginTop:'2px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {t.completada&&<svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5L8.5 2" stroke="#34d399" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                </button>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap',marginBottom:'4px'}}>
                    <span style={{fontSize:'13.5px',color:t.completada?'rgba(255,255,255,0.4)':'rgba(255,255,255,0.85)',textDecoration:t.completada?'line-through':'none',fontWeight:'500'}}>{t.titulo}</span>
                  </div>
                  <div style={{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}}>
                    <span style={{fontSize:'11.5px',fontWeight:'700',color:'rgba(255,255,255,0.5)',padding:'1px 8px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'100px',whiteSpace:'nowrap'}}>{t.clientName}</span>
                    <span style={{fontSize:'11px',padding:'1px 6px',background:`${pc}18`,border:`1px solid ${pc}33`,borderRadius:'4px',color:pc,fontWeight:'600'}}>{t.prioridad}</span>
                    {t.fechaLimite&&<span style={{fontSize:'11px',color:overdue?'#f87171':'rgba(255,255,255,0.3)'}}>{overdue?'⚠️ ':''}{t.fechaLimite}</span>}
                    {t.responsable&&<span style={{fontSize:'11px',color:'rgba(255,255,255,0.25)'}}>👤 {t.responsable}</span>}
                    {t.recurrencia&&<span style={{fontSize:'11px',padding:'1px 6px',background:'rgba(168,85,247,0.12)',border:'1px solid rgba(168,85,247,0.25)',borderRadius:'4px',color:GL_P3,fontWeight:'600'}}>🔁 {t.recurrencia}</span>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ── PRICING MODULE ── */
function PricingModule({onHome}){
  const mkPlanState=()=>({
    Essential:{...PLAN_DATA.Essential,features:[...PLAN_DATA.Essential.features]},
    Growth:{...PLAN_DATA.Growth,features:[...PLAN_DATA.Growth.features]},
    Authority:{...PLAN_DATA.Authority,features:[...PLAN_DATA.Authority.features]},
  });
  const mkAiState=()=>AI_PKGS.map(p=>({...p,services:[...p.services]}));
  const mkComboState=()=>({...AI_COMBO});

  const [tab,setTab]=React.useState('marketing');
  const [plans,setPlans]=React.useState(mkPlanState);
  const [aiPkgs,setAiPkgs]=React.useState(mkAiState);
  const [combos,setCombos]=React.useState(mkComboState);
  const [saved,setSaved]=React.useState(false);

  const savePricing=()=>{
    // build clean PLAN_DATA shape
    const planData={};
    Object.keys(plans).forEach(k=>{planData[k]={...plans[k],features:[...plans[k].features]};});
    // build AI_PKGS array
    const aiArr=aiPkgs.map(p=>({...p,services:[...p.services]}));
    // update globals immediately so proposals use new prices
    PLAN_DATA=planData;
    AI_PKGS=aiArr;
    AI_COMBO={...combos};
    try{localStorage.setItem(PKG_SETTINGS_KEY,JSON.stringify({planData,aiPkgs:aiArr,aiCombo:{...combos}}));}catch{}
    setSaved(true);
    setTimeout(()=>setSaved(false),2500);
  };

  const IN={background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.12)',borderRadius:'7px',padding:'8px 11px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",width:'100%',boxSizing:'border-box'};
  const LABEL={fontSize:'11px',color:'rgba(255,255,255,0.4)',fontFamily:"'Inter',sans-serif",marginBottom:'4px',textTransform:'uppercase',letterSpacing:'.06em'};
  const PLAN_COLORS={Essential:GL_P,Growth:'#38bdf8',Authority:'#4ade80'};

  /* Marketing tab */
  const updatePlan=(plan,field,val)=>setPlans(p=>({...p,[plan]:{...p[plan],[field]:val}}));
  const updateFeature=(plan,i,val)=>setPlans(p=>{const f=[...p[plan].features];f[i]=val;return{...p,[plan]:{...p[plan],features:f}};});
  const addFeature=(plan)=>setPlans(p=>({...p,[plan]:{...p[plan],features:[...p[plan].features,'']}}));
  const removeFeature=(plan,i)=>setPlans(p=>{const f=p[plan].features.filter((_,j)=>j!==i);return{...p,[plan]:{...p[plan],features:f}};});

  /* AI tab */
  const updateAi=(idx,field,val)=>setAiPkgs(a=>{const n=[...a];n[idx]={...n[idx],[field]:val};return n;});
  const updateService=(idx,si,val)=>setAiPkgs(a=>{const n=[...a];const s=[...n[idx].services];s[si]=val;n[idx]={...n[idx],services:s};return n;});
  const addService=(idx)=>setAiPkgs(a=>{const n=[...a];n[idx]={...n[idx],services:[...n[idx].services,'']};return n;});
  const removeService=(idx,si)=>setAiPkgs(a=>{const n=[...a];n[idx]={...n[idx],services:n[idx].services.filter((_,j)=>j!==si)};return n;});

  const MKT=tab==='marketing';

  return(
    <div style={{minHeight:'100vh',background:GL_BG,color:'#fff',fontFamily:"'Inter',sans-serif"}}>
      {/* header */}
      <div style={{borderBottom:'1px solid rgba(255,255,255,0.07)',padding:'18px 28px',display:'flex',alignItems:'center',gap:'16px',position:'sticky',top:0,background:GL_BG,zIndex:10}}>
        <button onClick={onHome} style={{background:'none',border:'none',color:'rgba(255,255,255,0.5)',cursor:'pointer',fontSize:'13px',display:'flex',alignItems:'center',gap:'6px',padding:'6px 10px',borderRadius:'6px',transition:'background .15s'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.06)'} onMouseLeave={e=>e.currentTarget.style.background='none'}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Inicio
        </button>
        <div style={{width:'1px',height:'20px',background:'rgba(255,255,255,0.1)'}}/>
        <div style={{width:'32px',height:'32px',borderRadius:'8px',background:`${GL_P}18`,border:`1px solid ${GL_P}33`,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={GL_P} strokeWidth="1.8"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        </div>
        <div>
          <h1 style={{fontSize:'15px',fontWeight:'700',margin:0}}>Configuración de Precios</h1>
          <p style={{fontSize:'11px',color:'rgba(255,255,255,0.35)',margin:0}}>Marketing & IA — los cambios se aplican a nuevas propuestas</p>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:'10px',alignItems:'center'}}>
          {saved&&<span style={{fontSize:'12px',color:'#4ade80',display:'flex',alignItems:'center',gap:'5px'}}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 6L9 17l-5-5"/></svg>Guardado
          </span>}
          <button onClick={savePricing} style={{padding:'9px 22px',background:GL_P,border:'none',borderRadius:'8px',color:'#fff',fontSize:'13px',fontWeight:'600',cursor:'pointer'}}>
            Guardar cambios
          </button>
        </div>
      </div>

      {/* tabs */}
      <div style={{padding:'20px 28px 0'}}>
        <div style={{display:'flex',gap:'4px',background:'rgba(255,255,255,0.04)',borderRadius:'9px',padding:'4px',width:'fit-content'}}>
          {[{k:'marketing',l:'📣 Marketing'},{k:'ia',l:'🤖 IA'}].map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)} style={{padding:'8px 20px',borderRadius:'6px',border:'none',cursor:'pointer',fontSize:'13px',fontWeight:'600',fontFamily:"'Inter',sans-serif",background:tab===t.k?GL_P:'transparent',color:tab===t.k?'#fff':'rgba(255,255,255,0.45)',transition:'all .15s'}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:'24px 28px',maxWidth:'960px'}}>
        {/* ── MARKETING TAB ── */}
        {MKT&&(
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'18px'}}>
            {Object.keys(plans).map(pname=>{
              const p=plans[pname];
              const col=PLAN_COLORS[pname]||GL_P;
              return(
                <div key={pname} style={{background:'rgba(255,255,255,0.03)',border:`1px solid ${col}33`,borderTop:`3px solid ${col}`,borderRadius:'12px',padding:'20px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'16px'}}>
                    <div style={{width:'8px',height:'8px',borderRadius:'50%',background:col}}/>
                    <span style={{fontSize:'14px',fontWeight:'700',color:col}}>{pname}</span>
                  </div>
                  <div style={{marginBottom:'14px'}}>
                    <div style={LABEL}>Precio / mes</div>
                    <input value={p.price} onChange={e=>updatePlan(pname,'price',e.target.value)} style={IN} placeholder="ej: 1.200€"/>
                  </div>
                  <div>
                    <div style={{...LABEL,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span>Características</span>
                      <button onClick={()=>addFeature(pname)} style={{background:`${col}18`,border:`1px solid ${col}44`,borderRadius:'4px',color:col,fontSize:'11px',cursor:'pointer',padding:'2px 8px',fontFamily:"'Inter',sans-serif"}}>+ Añadir</button>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:'6px',marginTop:'6px'}}>
                      {p.features.map((f,i)=>(
                        <div key={i} style={{display:'flex',gap:'6px',alignItems:'center'}}>
                          <input value={f} onChange={e=>updateFeature(pname,i,e.target.value)} style={{...IN,flex:1,padding:'6px 9px',fontSize:'12px'}}/>
                          <button onClick={()=>removeFeature(pname,i)} style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.25)',borderRadius:'5px',color:'#f87171',cursor:'pointer',padding:'5px 8px',flexShrink:0,fontSize:'13px',lineHeight:1}}>×</button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── IA TAB ── */}
        {!MKT&&(
          <div style={{display:'flex',flexDirection:'column',gap:'18px'}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:'18px'}}>
              {aiPkgs.map((pkg,idx)=>(
                <div key={pkg.id} style={{background:'rgba(255,255,255,0.03)',border:`1px solid ${pkg.color}33`,borderTop:`3px solid ${pkg.color}`,borderRadius:'12px',padding:'20px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'16px'}}>
                    <div style={{width:'8px',height:'8px',borderRadius:'50%',background:pkg.color}}/>
                    <span style={{fontSize:'14px',fontWeight:'700',color:pkg.color}}>{pkg.name}</span>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'12px'}}>
                    <div>
                      <div style={LABEL}>Implementación (€)</div>
                      <input value={pkg.impl??''} onChange={e=>updateAi(idx,'impl',e.target.value===''?null:Number(e.target.value))} type="number" style={IN} placeholder="—"/>
                    </div>
                    <div>
                      <div style={LABEL}>Mensual (€)</div>
                      <input value={pkg.monthly??''} onChange={e=>updateAi(idx,'monthly',e.target.value===''?null:Number(e.target.value))} type="number" style={IN} placeholder="—"/>
                    </div>
                  </div>
                  <div style={{marginBottom:'10px'}}>
                    <div style={LABEL}>Tag / subtítulo</div>
                    <input value={pkg.tag} onChange={e=>updateAi(idx,'tag',e.target.value)} style={IN}/>
                  </div>
                  <div style={{marginBottom:'12px'}}>
                    <div style={LABEL}>Descripción</div>
                    <textarea value={pkg.note} onChange={e=>updateAi(idx,'note',e.target.value)} rows={2} style={{...IN,resize:'vertical',lineHeight:'1.5'}}/>
                  </div>
                  <div>
                    <div style={{...LABEL,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span>Servicios incluidos</span>
                      <button onClick={()=>addService(idx)} style={{background:`${pkg.color}18`,border:`1px solid ${pkg.color}44`,borderRadius:'4px',color:pkg.color,fontSize:'11px',cursor:'pointer',padding:'2px 8px',fontFamily:"'Inter',sans-serif"}}>+ Añadir</button>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:'5px',marginTop:'6px'}}>
                      {pkg.services.map((s,si)=>(
                        <div key={si} style={{display:'flex',gap:'6px',alignItems:'center'}}>
                          <input value={s} onChange={e=>updateService(idx,si,e.target.value)} style={{...IN,flex:1,padding:'5px 9px',fontSize:'12px'}}/>
                          <button onClick={()=>removeService(idx,si)} style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.25)',borderRadius:'5px',color:'#f87171',cursor:'pointer',padding:'5px 8px',flexShrink:0,fontSize:'13px',lineHeight:1}}>×</button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Combo prices */}
            <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'12px',padding:'20px'}}>
              <h3 style={{fontSize:'13px',fontWeight:'700',color:'rgba(255,255,255,0.7)',margin:'0 0 14px',textTransform:'uppercase',letterSpacing:'.06em'}}>Descuentos Combo — Implementación (€)</h3>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:'12px'}}>
                {Object.keys(combos).map(key=>(
                  <div key={key}>
                    <div style={{...LABEL,marginBottom:'5px'}}>{key.split('+').join(' + ')}</div>
                    <input type="number" value={combos[key].impl??''} onChange={e=>setCombos(c=>({...c,[key]:{impl:Number(e.target.value)}}))} style={IN}/>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const GEN_STORAGE='activos_generados_v1';
const GEN_API_KEY='claude_api_key_generador';
const GEN_CONV_STORAGE='gen_conversations_v1';

function getToolConvs(toolId){try{const all=JSON.parse(localStorage.getItem(GEN_CONV_STORAGE)||'{}');return all[toolId]||[];}catch{return[];}}
function upsertConv(toolId,conv){const all=JSON.parse(localStorage.getItem(GEN_CONV_STORAGE)||'{}');if(!all[toolId])all[toolId]=[];const idx=all[toolId].findIndex(c=>c.id===conv.id);if(idx>=0)all[toolId][idx]=conv;else all[toolId].unshift(conv);localStorage.setItem(GEN_CONV_STORAGE,JSON.stringify(all));}

async function callClaudeAPI(messages,systemPrompt){
  const apiKey=localStorage.getItem(GEN_API_KEY)||'';
  if(!apiKey) throw new Error('NO_KEY');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body:JSON.stringify({model:'claude-haiku-4-5',max_tokens:2048,system:systemPrompt,messages:messages}),
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'API error '+res.status);}
  const data=await res.json();
  return data.content[0].text;
}

function GeneradorChat({tool,onSelectTool,convId,setConvId}){
  const [messages,setMessages]=React.useState([]);
  const [input,setInput]=React.useState('');
  const [loading,setLoading]=React.useState(false);
  const [started,setStarted]=React.useState(false);
  const [copiedIdx,setCopiedIdx]=React.useState(null);
  const [savedIdx,setSavedIdx]=React.useState(null);
  const curConvId=React.useRef(convId||null);
  const endRef=React.useRef(null);
  const G='#C9A843';

  React.useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,loading]);
  React.useEffect(()=>{
    // Load conv if convId provided, else reset
    if(convId){
      const convs=getToolConvs(tool.id);
      const c=convs.find(x=>x.id===convId);
      if(c){setMessages(c.messages||[]);setStarted(true);curConvId.current=convId;return;}
    }
    setMessages([]);setStarted(false);setCopiedIdx(null);setSavedIdx(null);setInput('');
    curConvId.current=null;
  },[tool.id,convId]);

  const persistConv=(msgs)=>{
    if(!curConvId.current){curConvId.current=Date.now().toString();if(setConvId)setConvId(curConvId.current);}
    upsertConv(tool.id,{id:curConvId.current,createdAt:Date.now(),label:new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' — '+tool.label,messages:msgs});
  };

  const start=async(initialInput)=>{
    setStarted(true);setLoading(true);
    const initMsgs=initialInput?[{role:'user',content:initialInput}]:[];
    if(initialInput)setMessages(initMsgs);
    if(initialInput)persistConv(initMsgs);
    try{
      const reply=await callClaudeAPI(initMsgs,TOOL_PROMPTS[tool.id]+(initMsgs.length?'':'\n\nComienza presentándote en 1 línea y haz tu primera pregunta.'));
      const finalMsgs=[...initMsgs,{role:'assistant',content:reply}];
      setMessages(finalMsgs);persistConv(finalMsgs);
    }catch(e){setMessages(m=>[...m,{role:'assistant',content:'❌ Error: '+e.message}]);}
    setLoading(false);
  };

  const send=async()=>{
    if(!input.trim()||loading)return;
    if(!started){start(input.trim());setInput('');return;}
    const userMsg={role:'user',content:input.trim()};
    const newMsgs=[...messages,userMsg];
    setMessages(newMsgs);persistConv(newMsgs);setInput('');setLoading(true);
    try{
      const reply=await callClaudeAPI(newMsgs,TOOL_PROMPTS[tool.id]);
      const finalMsgs=[...newMsgs,{role:'assistant',content:reply}];
      setMessages(finalMsgs);persistConv(finalMsgs);
    }catch(e){setMessages(m=>[...m,{role:'assistant',content:'❌ Error: '+e.message}]);}
    setLoading(false);
  };

  const copyMsg=(text,i)=>{navigator.clipboard.writeText(text);setCopiedIdx(i);setTimeout(()=>setCopiedIdx(null),2000);};

  const saveMsg=(text,i)=>{
    const activos=JSON.parse(localStorage.getItem(GEN_STORAGE)||'[]');
    activos.unshift({id:Date.now().toString(),toolId:tool.id,title:tool.label+' — '+new Date().toLocaleDateString('es-ES'),content:text,createdAt:Date.now()});
    localStorage.setItem(GEN_STORAGE,JSON.stringify(activos));
    setSavedIdx(i);setTimeout(()=>setSavedIdx(null),2000);
  };

  const exportMsg=(text)=>{
    const blob=new Blob([text],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=tool.label.replace(/\s+/g,'_')+'.txt';a.click();URL.revokeObjectURL(url);
  };

  return(
    <React.Fragment>
      <div style={{borderBottom:'1px solid #e5e7eb',padding:'14px 24px',display:'flex',alignItems:'center',gap:'12px'}}>
        <span style={{fontSize:'16px'}}>{tool.icon}</span>
        <span style={{fontSize:'15px',fontWeight:'700',color:'#1f2937'}}>{tool.label}</span>
        {started&&<button onClick={()=>setConvId&&setConvId(null)} style={{all:'unset',cursor:'pointer',marginLeft:'auto',display:'flex',alignItems:'center',gap:'5px',border:'1px solid #e5e7eb',borderRadius:'6px',padding:'6px 12px',fontSize:'12px',color:'#6b7280'}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nueva conversación
        </button>}
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'24px',display:'flex',flexDirection:'column',gap:'20px'}}>
        {!started&&(
          <div style={{textAlign:'center',margin:'auto',color:'#9ca3af',display:'flex',flexDirection:'column',alignItems:'center',gap:'16px'}}>
            <div style={{width:'56px',height:'56px',background:`${G}18`,borderRadius:'12px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'24px'}}>{tool.icon}</div>
            <p style={{fontSize:'15px',fontWeight:'600',color:'#374151'}}>Comienza una nueva conversación</p>
            <p style={{fontSize:'13px'}}>Escribe un mensaje para generar contenido o utiliza un activo existente.</p>
            <button onClick={()=>start(null)} style={{all:'unset',cursor:'pointer',background:G,color:'#fff',borderRadius:'8px',padding:'10px 28px',fontSize:'14px',fontWeight:'700'}}>Comenzar →</button>
          </div>
        )}
        {messages.map((msg,i)=>(
          <div key={i} style={{display:'flex',justifyContent:msg.role==='user'?'flex-end':'flex-start',gap:'10px',alignItems:'flex-start'}}>
            {msg.role==='assistant'&&(
              <div style={{width:'30px',height:'30px',background:`${G}18`,border:`1px solid ${G}33`,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:'13px'}}>{tool.icon}</div>
            )}
            <div style={{maxWidth:'75%',display:'flex',flexDirection:'column',gap:'8px'}}>
              <div style={{padding:'12px 16px',borderRadius:'10px',background:msg.role==='user'?G:'#f3f4f6',color:msg.role==='user'?'#fff':'#1f2937',fontSize:'14px',lineHeight:'1.7',whiteSpace:'pre-wrap'}}>
                {msg.content}
              </div>
              {msg.role==='assistant'&&(
                <div style={{display:'flex',gap:'12px',paddingLeft:'4px'}}>
                  <button onClick={()=>copyMsg(msg.content,i)} style={{all:'unset',cursor:'pointer',display:'flex',alignItems:'center',gap:'4px',fontSize:'12px',color:copiedIdx===i?'#16a34a':'#9ca3af',transition:'color .15s'}}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                    {copiedIdx===i?'¡Copiado!':'Copiar'}
                  </button>
                  <button onClick={()=>saveMsg(msg.content,i)} style={{all:'unset',cursor:'pointer',display:'flex',alignItems:'center',gap:'4px',fontSize:'12px',color:savedIdx===i?'#16a34a':'#9ca3af',transition:'color .15s'}}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    {savedIdx===i?'¡Guardado!':'Guardar'}
                  </button>
                  <button onClick={()=>exportMsg(msg.content)} style={{all:'unset',cursor:'pointer',display:'flex',alignItems:'center',gap:'4px',fontSize:'12px',color:'#9ca3af',transition:'color .15s'}}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Exportar
                  </button>
                </div>
              )}
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
            <div style={{width:'30px',height:'30px',background:`${G}18`,border:`1px solid ${G}33`,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px'}}>{tool.icon}</div>
            <div style={{padding:'12px 16px',borderRadius:'10px',background:'#f3f4f6',color:'#9ca3af',fontSize:'14px'}}>Pensando...</div>
          </div>
        )}
        <div ref={endRef}/>
      </div>
      <div style={{borderTop:'1px solid #e5e7eb',padding:'16px 24px',background:'#fff'}}>
        <div style={{display:'flex',gap:'12px',alignItems:'flex-end'}}>
          <textarea value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
            placeholder="Escribe un mensaje..." rows={1}
            style={{flex:1,border:'1px solid #e5e7eb',borderRadius:'8px',padding:'12px 16px',fontSize:'14px',resize:'none',outline:'none',fontFamily:"'Inter',sans-serif",lineHeight:'1.5',maxHeight:'120px'}}
          />
          <button onClick={send} disabled={loading||!input.trim()}
            style={{all:'unset',cursor:'pointer',width:'40px',height:'40px',background:(loading||!input.trim())?'#e5e7eb':G,borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'background .15s'}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

function HomeScreen({onSelect,currentUser}){
  const isAdmin=currentUser&&currentUser.role==='admin';
  // Load employee permissions if not admin
  const empPerms=React.useMemo(()=>{
    if(isAdmin) return {marketing:true,ia:true,web:true,clients:true};
    if(!currentUser||currentUser.role!=='employee') return {marketing:true,ia:true,web:true,clients:true};
    const emp=emp_storage.load().find(e=>e.id===currentUser.id);
    return emp?.permisos||{marketing:true,ia:true,web:true,clients:true};
  },[currentUser]);
  const homeStats=React.useMemo(()=>{
    const allC=clients_storage.load();
    const myC=isAdmin?allC:allC.filter(c=>c.asignadoA===currentUser?.id);
    const allP=storage.load();
    const aiP=ai_storage.load();
    const allEmp=emp_storage.load();
    const overdue=myC.flatMap(c=>(c.tareas||[]).filter(t=>!t.completado&&t.fechaLimite&&new Date(t.fechaLimite)<new Date())).length;
    const pendComm=isAdmin?allC.filter(c=>!c.comisionPagada&&c.montoContrato>0).length:0;
    const now=new Date();const soon=new Date(now.getTime()+30*24*60*60*1000);
    const expiring=isAdmin?allC.filter(c=>c.fechaVencimiento&&c.estado==='Activo'&&new Date(c.fechaVencimiento)<=soon&&new Date(c.fechaVencimiento)>=now).length:0;
    const recentActivity=(()=>{
      const entries=[];
      allC.forEach(c=>{
        (c.historial||[]).forEach(h=>{
          if(h.descripcion&&h.fecha) entries.push({empresa:c.empresa||c.nombre||'?',desc:h.descripcion,fecha:h.fecha,tipo:h.tipo||'manual',id:c.id});
        });
      });
      entries.sort((a,b)=>{try{return new Date(b.fecha)-new Date(a.fecha);}catch{return 0;}});
      return entries.slice(0,5);
    })();
    return{
      clientCount:myC.length,
      activeClients:myC.filter(c=>c.estado==='Activo').length,
      marketingProps:allP.length,
      aiProps:aiP.length,
      empCount:allEmp.length,
      overdue,pendComm,expiring,
      totalRevenue:allC.reduce((s,c)=>s+(c.montoContrato||0),0),
      recentActivity
    };
  },[currentUser,isAdmin]);
  const alerts=homeStats.overdue+homeStats.pendComm+homeStats.expiring;
  return(
    <div style={{minHeight:'100vh',background:GL_BG,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 28px',position:'relative',overflow:'hidden',fontFamily:"'Inter',sans-serif"}}>
      <div style={{position:'absolute',top:'-20%',left:'50%',transform:'translateX(-50%)',width:'800px',height:'500px',borderRadius:'50%',background:`radial-gradient(ellipse,rgba(168,85,247,0.12) 0%,transparent 65%)`,pointerEvents:'none'}}/>
      <div style={{position:'absolute',bottom:'-10%',left:'-5%',width:'400px',height:'400px',borderRadius:'50%',background:`radial-gradient(circle,rgba(124,58,237,0.1) 0%,transparent 65%)`,pointerEvents:'none'}}/>
      <div style={{position:'absolute',bottom:'-10%',right:'-5%',width:'400px',height:'400px',borderRadius:'50%',background:`radial-gradient(circle,rgba(192,132,252,0.08) 0%,transparent 65%)`,pointerEvents:'none'}}/>
      <div style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(rgba(168,85,247,.03) 1px,transparent 1px)',backgroundSize:'32px 32px',pointerEvents:'none'}}/>
      <div style={{position:'absolute',top:0,left:0,right:0,height:'1px',background:`linear-gradient(90deg,transparent,${GL_P2} 30%,${GL_P} 50%,${GL_P3} 70%,transparent)`}}/>

      {/* top bar */}
      <div style={{position:'absolute',top:'24px',right:'28px',zIndex:10,display:'flex',alignItems:'center',gap:'12px'}}>
        {alerts>0&&<div style={{display:'flex',alignItems:'center',gap:'6px',padding:'6px 14px',background:'rgba(251,191,36,0.08)',border:'1px solid rgba(251,191,36,0.25)',borderRadius:'100px',cursor:'default'}}>
          <span style={{fontSize:'14px'}}>🔔</span>
          <span style={{fontSize:'12px',fontWeight:'600',color:'#fbbf24',fontFamily:"'Inter',sans-serif"}}>{[homeStats.overdue>0&&`${homeStats.overdue} tarea${homeStats.overdue>1?'s':''} vencida${homeStats.overdue>1?'s':''}`,homeStats.pendComm>0&&`${homeStats.pendComm} comisión${homeStats.pendComm>1?'es':''} pend.`,homeStats.expiring>0&&`${homeStats.expiring} contrato${homeStats.expiring>1?'s':''} por vencer`].filter(Boolean).join(' · ')}</span>

function GlobalSearch({onClose,onNavigate}){
  const [q,setQ]=useState('');
  const [activeIdx,setActiveIdx]=useState(0);
  const inputRef=useRef(null);
  const listRef=useRef(null);
  useEffect(()=>{inputRef.current?.focus();},[]);
  useEffect(()=>{setActiveIdx(0);},[q]);

  const results=React.useMemo(()=>{
    if(!q.trim()||q.length<2) return null;
    const lq=q.toLowerCase();
    const allClients=clients_storage.load();
    // Clients matching by name/contact/email
    const clients=allClients.filter(c=>c.empresa.toLowerCase().includes(lq)||(c.contacto||'').toLowerCase().includes(lq)||(c.correo||'').toLowerCase().includes(lq)).slice(0,6);
    // Tasks matching title
    const tasks=allClients.flatMap(c=>(c.tareas||[]).filter(t=>t.titulo&&t.titulo.toLowerCase().includes(lq)&&!t.completada).map(t=>({...t,_empresa:c.empresa,_clientId:c.id}))).slice(0,4);
    // Notes matching text
    const notes=allClients.flatMap(c=>(c.notas||[]).filter(n=>n.texto&&n.texto.toLowerCase().includes(lq)).map(n=>({...n,_empresa:c.empresa,_clientId:c.id}))).slice(0,3);
    const mktProps=storage.load().filter(p=>(p.empresa||'').toLowerCase().includes(lq)||(p.clientName||'').toLowerCase().includes(lq)).slice(0,3);
    const aiProps=ai_storage.load().filter(p=>(p.empresa||'').toLowerCase().includes(lq)).slice(0,3);
    return{clients,tasks,notes,mktProps,aiProps};
  },[q]);

  // Build flat list of all items for keyboard nav
  const allItems=React.useMemo(()=>{
    if(!results) return [];
    const items=[];
    results.clients.forEach(c=>items.push({type:'client',data:c,label:c.empresa,sub:`${c.contacto||c.correo||''}${c.estado?' · '+c.estado:''}`,accent:CL_A,icon:(c.empresa[0]||'C').toUpperCase(),action:()=>onNavigate('clients',c.id)}));
    results.tasks.forEach(t=>items.push({type:'task',data:t,label:t.titulo,sub:`Tarea · ${t._empresa}${t.prioridad?' · '+t.prioridad:''}`,accent:'#38bdf8',icon:'☑',action:()=>onNavigate('clients',t._clientId)}));
    results.notes.forEach(n=>items.push({type:'note',data:n,label:n.texto.slice(0,60)+(n.texto.length>60?'…':''),sub:`Nota · ${n._empresa}`,accent:'#fbbf24',icon:'✎',action:()=>onNavigate('clients',n._clientId)}));
    results.mktProps.forEach(p=>items.push({type:'mkt',data:p,label:p.empresa||p.clientName||'Propuesta',sub:`Marketing · ${p.fecha||''}`,accent:WARM,icon:(p.empresa||'M')[0].toUpperCase(),action:()=>onNavigate('marketing')}));
    results.aiProps.forEach(p=>items.push({type:'ai',data:p,label:p.empresa||'Propuesta IA',sub:`IA · ${p.fecha||''}`,accent:AI_A,icon:(p.empresa||'I')[0].toUpperCase(),action:()=>onNavigate('ia')}));
    return items;
  },[results]);

  useEffect(()=>{
    const h=e=>{
      if(e.key==='Escape'){onClose();return;}
      if(e.key==='ArrowDown'){e.preventDefault();setActiveIdx(i=>Math.min(i+1,allItems.length-1));}
      if(e.key==='ArrowUp'){e.preventDefault();setActiveIdx(i=>Math.max(i-1,0));}
      if(e.key==='Enter'&&allItems[activeIdx]){allItems[activeIdx].action();onClose();}
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[allItems,activeIdx]);

  // Auto-scroll active item into view
  useEffect(()=>{
    const el=listRef.current?.querySelector(`[data-idx="${activeIdx}"]`);
    el?.scrollIntoView({block:'nearest'});
  },[activeIdx]);

  const total=allItems.length;
  const Section=({title})=><p style={{fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.2)',letterSpacing:'.1em',textTransform:'uppercase',padding:'14px 20px 4px',fontFamily:"'Inter',sans-serif"}}>{title}</p>;

  // Render items grouped by type
  const renderItems=(type,sectionTitle)=>{
    const group=allItems.filter(it=>it.type===type);
    if(!group.length) return null;
    const startIdx=allItems.findIndex(it=>it.type===type);
    return(<>
      <Section title={sectionTitle}/>
      {group.map((it,i)=>{
        const idx=startIdx+i;
        const isActive=idx===activeIdx;
        return(
          <div key={idx} data-idx={idx} onClick={()=>{it.action();onClose();}} onMouseEnter={()=>setActiveIdx(idx)}
            style={{display:'flex',alignItems:'center',gap:'12px',padding:'10px 20px',cursor:'pointer',background:isActive?'rgba(255,255,255,0.07)':'transparent',transition:'background .08s'}}>
            <div style={{width:'30px',height:'30px',borderRadius:'8px',background:`${it.accent}18`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontSize:'12px',fontWeight:'800',color:it.accent}}>{it.icon}</span>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <p style={{fontSize:'13px',fontWeight:'600',color:'#fff',fontFamily:"'Inter',sans-serif",overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.label}</p>
              {it.sub&&<p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif",overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.sub}</p>}
            </div>
            {isActive&&<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5h6M6 3l2 2-2 2" stroke="rgba(255,255,255,0.4)" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </div>
        );
      })}
    </>);
  };

  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.72)',zIndex:9000,display:'flex',alignItems:'flex-start',justifyContent:'center',paddingTop:'100px',backdropFilter:'blur(10px)'}}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:'540px',background:'#141414',border:'1px solid rgba(255,255,255,0.13)',borderRadius:'16px',overflow:'hidden',boxShadow:'0 24px 80px rgba(0,0,0,0.9)',fontFamily:"'Inter',sans-serif"}}>
        <div style={{display:'flex',alignItems:'center',gap:'12px',padding:'14px 20px',borderBottom:'1px solid rgba(255,255,255,0.07)'}}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="2.2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar clientes, tareas, notas, propuestas…" style={{flex:1,background:'transparent',border:'none',outline:'none',color:'#fff',fontSize:'15px',fontFamily:"'Inter',sans-serif"}}/>
          <kbd style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'4px',padding:'2px 7px',fontFamily:'monospace'}}>esc</kbd>
        </div>
        <div ref={listRef} style={{maxHeight:'460px',overflowY:'auto'}}>
          {!results&&<p style={{padding:'36px',textAlign:'center',fontSize:'13px',color:'rgba(255,255,255,0.18)'}}>Escribe al menos 2 caracteres para buscar…</p>}
          {results&&total===0&&<p style={{padding:'36px',textAlign:'center',fontSize:'13px',color:'rgba(255,255,255,0.18)'}}>Sin resultados para <em>"{q}"</em></p>}
          {results&&<>
            {renderItems('client','Clientes')}
            {renderItems('task','Tareas pendientes')}
            {renderItems('note','Notas')}
            {renderItems('mkt','Propuestas Marketing')}
            {renderItems('ai','Propuestas IA')}
          </>}
          <div style={{height:'8px'}}/>
        </div>
        <div style={{borderTop:'1px solid rgba(255,255,255,0.06)',padding:'10px 20px',display:'flex',gap:'16px'}}>
          <span style={{fontSize:'10.5px',color:'rgba(255,255,255,0.18)'}}>↑↓ navegar · ↵ abrir · esc cerrar</span>
          {results&&total>0&&<span style={{fontSize:'10.5px',color:'rgba(255,255,255,0.18)'}}>{total} resultado{total!==1?'s':''}</span>}
          <span style={{fontSize:'10.5px',color:'rgba(255,255,255,0.18)',marginLeft:'auto'}}>⌘K</span>
        </div>
      </div>
    </div>
  );
}

function ContractPreviewDoc({data,onBack,onBackList}){
  const CA=CONT_A;
  const emp=data.empresa||'Cliente';
  const plan=data.plan||'Plan Signature';
  const cuentas=data.cuentas||'1 Cuenta';
  const precio=(data.precio||0).toLocaleString('es-ES');
  const iframeRef=React.useRef(null);
  React.useEffect(()=>{
    if(!iframeRef.current) return;
    const html=generateProposalHTML(emp,plan,cuentas,precio,data);
    const doc=iframeRef.current.contentDocument||iframeRef.current.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
  },[]);
  const handlePrint=()=>{
    const w=window.open('','_blank');
    const html=generateProposalHTML(emp,plan,cuentas,precio,data);
    w.document.write(html);
    w.document.close();
    setTimeout(()=>w.print(),700);
  };
  return(
  <div style={{height:'100vh',display:'flex',flexDirection:'column',background:'#080808',fontFamily:"'Inter',sans-serif"}}>
    <div style={{borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'0 28px',height:'56px',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',background:'rgba(8,8,8,0.98)',backdropFilter:'blur(16px)',zIndex:50}}>
      <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
        <button onClick={onBack} style={{all:'unset',cursor:'pointer',color:'rgba(255,255,255,0.35)',fontSize:'12px',display:'flex',alignItems:'center',gap:'6px'}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Editar</button>
        <span style={{color:'rgba(255,255,255,0.1)'}}>|</span>
        <span style={{fontSize:'13px',fontWeight:'600',color:'#fff'}}>Vista previa</span>
        <span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'100px',background:'rgba(20,184,166,0.1)',border:'1px solid rgba(20,184,166,0.3)',color:CA}}>{data.numero}</span>
        <span style={{fontSize:'11px',color:'rgba(255,255,255,0.25)'}}>{emp} · {plan}</span>
      </div>
      <div style={{display:'flex',gap:'10px'}}>
        <button onClick={onBackList} style={{all:'unset',cursor:'pointer',padding:'7px 14px',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'6px',color:'rgba(255,255,255,0.5)',fontSize:'12px'}}>← Lista</button>
        <button onClick={handlePrint} style={{all:'unset',cursor:'pointer',padding:'7px 18px',background:CA,borderRadius:'6px',color:'#fff',fontSize:'12px',fontWeight:'600'}}>🖨 Imprimir / PDF</button>
      </div>
    </div>
    <iframe ref={iframeRef} style={{flex:1,width:'100%',border:'none',background:'#080808'}} title="propuesta"/>
  </div>
  );
}

function InvoiceView({data,onBack,onBackList}){
  const IA=INV_A;

  const subtotal=(data.items||[]).reduce((s,it)=>s+(parseFloat(it.qty||1)*parseFloat(it.unitPrice||0)),0);
  const ivaRate=parseFloat(data.ivaRate||0);
  const ivaAmt=subtotal*ivaRate/100;
  const total=subtotal+ivaAmt;
  const numFac=data.invoiceNum||`${data.tipo==='proforma'?'PROFORMA':'INVOICE'} No. ${(data.id||'').slice(-3).toUpperCase()}`;
  const printInvoice=()=>{
    const cur2=cur;
    const filename=(numFac||'invoice').replace(/[^a-zA-Z0-9_\-]/g,'_')+'.pdf';
    const gen=(jsPDF)=>{
      const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
      const W=210,ml=15,mr=195;
      let y=22;
      const tx=(s,x,yy,o)=>doc.text(String(s||''),x,yy,o||{});
      const ln=(x1,y1,x2,y2,r,g,b,w)=>{doc.setDrawColor(r||0,g||0,b||0);doc.setLineWidth(w||0.3);doc.line(x1,y1,x2,y2);};
      const col=(r,g,b)=>doc.setTextColor(r,g,b);
      // INVOICE title
      doc.setFont('helvetica','bold');doc.setFontSize(26);col(17,17,17);
      tx(data.tipo==='proforma'?'PROFORMA':'INVOICE',ml,y);
      // Agency right

        <div style={{display:'flex',gap:'10px'}}>

      <div style={{maxWidth:'820px',margin:'40px auto',padding:'0 28px 60px'}}>

            <div>
              <h1 style={{fontSize:'30px',fontWeight:'900',letterSpacing:'.04em',color:'#111'}}>{data.tipo==='proforma'?'PROFORMA':'INVOICE'}</h1>
              <p style={{fontSize:'13px',color:'#555',marginTop:'10px'}}>{numFac}</p>
              <p style={{fontSize:'13px',color:'#555',marginTop:'3px'}}>Date: {data.fecha||'—'}</p>
              <p style={{fontSize:'13px',color:'#555',marginTop:'3px'}}>Currency: {cur}</p>
            </div>
            <div style={{textAlign:'right'}}>

            </div>
          </div>
          {/* Bill To */}

            <p style={{fontSize:'10px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.1em',color:'#999',marginBottom:'8px'}}>Bill To</p>
            <p style={{fontSize:'15px',fontWeight:'700',color:'#111'}}>{data.clienteEmpresa||data.clienteNombre||'—'}</p>
            {data.clienteNIF&&<p style={{fontSize:'13px',color:'#555',marginTop:'3px'}}>NIF: {data.clienteNIF}</p>}
            {(data.clienteDireccion||'').split('\n').filter(Boolean).map((l,i)=><p key={i} style={{fontSize:'13px',color:'#555',marginTop:'2px'}}>{l}</p>)}
            {data.clienteEmail&&<p style={{fontSize:'13px',color:'#555',marginTop:'3px'}}>Email: {data.clienteEmail}</p>}
          </div>
          {/* Table */}
          <table style={{width:'100%',borderCollapse:'collapse'}}>

                <th key={h} style={{fontSize:'10px',fontWeight:'700',color:'#999',letterSpacing:'.08em',textTransform:'uppercase',padding:'10px 8px',borderTop:'1px solid #111',borderBottom:'1px solid #111',textAlign:a}}>{h}</th>

            <tbody>
              {(data.items||[]).map((it,i)=>{const lt=parseFloat(it.qty||1)*parseFloat(it.unitPrice||0);return(
                <tr key={i} style={{borderBottom:'1px solid #eee'}}>
                  <td style={{padding:'13px 8px',fontSize:'13px',color:'#111'}}>{it.desc||'—'}</td>
                  <td style={{padding:'13px 8px',fontSize:'13px',color:'#555',textAlign:'center'}}>{it.qty||1}</td>

                  <td style={{padding:'13px 8px',fontSize:'13px',fontWeight:'600',color:'#111',textAlign:'right'}}>{cur} {lt.toFixed(2)}</td>
                </tr>
              );})}
            </tbody>
          </table>
          {/* Totals */}
          <div style={{display:'flex',justifyContent:'flex-end',marginTop:'16px'}}>
            <div style={{width:'300px'}}>
              {[['Subtotal',`${cur} ${subtotal.toFixed(2)}`],['VAT',`${cur} ${ivaAmt.toFixed(2)}`]].map(([l,v])=>(
                <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'7px 8px',fontSize:'13px',color:'#555'}}><span>{l}</span><span>{v}</span></div>

              <div style={{display:'flex',justifyContent:'space-between',padding:'12px 8px',borderTop:'1px solid #111',marginTop:'4px'}}>

            </div>

          {total>0&&<p style={{fontSize:'12px',color:'#999',marginTop:'10px',paddingLeft:'8px'}}>Currency: All amounts on this invoice are stated in {cur}. Total amount due: {cur} {total.toFixed(2)} {cur}.</p>}

          {data.taxNote&&<div style={{marginTop:'24px',padding:'16px',background:'#f9fafb',borderRadius:'4px'}}>

            {data.notasPago.split('\n').map((l,i)=><p key={i} style={{fontSize:'13px',color:'#444',lineHeight:'1.7'}}>{l}</p>)}
          </div>}
          <div style={{marginTop:'40px',paddingTop:'18px',borderTop:'1px solid #eee',textAlign:'center'}}>
            <p style={{fontSize:'12px',color:'#bbb',fontStyle:'italic'}}>Thank you for your business.</p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── EXPENSES ── */
const EXPENSE_KEY='glowlabs_expenses_v1';
const expenses_storage={
  load:()=>{try{return JSON.parse(localStorage.getItem(EXPENSE_KEY)||'[]');}catch{return[];}},
  save:(d)=>localStorage.setItem(EXPENSE_KEY,JSON.stringify(d))
};
const EXP_A='#22c55e';
const EXP_CATS=['Marketing','IA & Tech','Diseño Web','Operaciones','Equipo','Software','Publicidad','Viajes','Material','Otro'];
const EXP_PMETHODS=['Tarjeta','Transferencia','Efectivo','PayPal','Otro'];

function makeExpense(o={}){
  const id='GAS-'+String(Date.now()).slice(-6);
  return {id,numero:id,fecha:new Date().toISOString().slice(0,10),descripcion:'',categoria:'Operaciones',proveedor:'',importe:0,ivaRate:21,ivaDeducible:true,metodoPago:'Tarjeta',clienteId:'',estado:'Pendiente',notas:'',...o,creadoEn:o.creadoEn||new Date().toISOString()};
}

function ExpenseModule({onHome}){
  const [gastos,setGastos]=React.useState(()=>expenses_storage.load());
  const [view,setView]=React.useState('list');
  const [editing,setEditing]=React.useState(null);
  const [filterEstado,setFilterEstado]=React.useState('Todos');
  const [filterCat,setFilterCat]=React.useState('Todas');
  const EA=EXP_A;

  const save=arr=>{expenses_storage.save(arr);setGastos(arr);};
  const del=id=>{if(window.confirm('¿Eliminar gasto?'))save(gastos.filter(g=>g.id!==id));};
  const exportCSV=()=>{
    const rows=[['Número','Fecha','Descripción','Categoría','Proveedor','Importe','IVA%','Total','IVA Deducible','Método Pago','Estado','Notas'],...gastos.map(g=>[g.numero,g.fecha,g.descripcion,g.categoria,g.proveedor,g.importe,g.ivaRate,(g.importe*(1+g.ivaRate/100)).toFixed(2),g.ivaDeducible?'Sí':'No',g.metodoPago,g.estado,g.notas])];
    const csv=rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('﻿'+csv);a.download='gastos.csv';a.click();
  };

  if(view==='form') return <ExpenseForm initial={editing} onSave={g=>{const arr=editing?gastos.map(x=>x.id===g.id?g:x):[g,...gastos];save(arr);setEditing(null);setView('list');}} onCancel={()=>{setEditing(null);setView('list');}}/>;

  const filtered=gastos.filter(g=>(filterEstado==='Todos'||g.estado===filterEstado)&&(filterCat==='Todas'||g.categoria===filterCat));

  const totalIVA=gastos.filter(g=>g.ivaDeducible).reduce((s,g)=>s+parseFloat(g.importe||0)*parseFloat(g.ivaRate||0)/100,0);
  const totalPend=gastos.filter(g=>g.estado==='Pendiente').reduce((s,g)=>s+parseFloat(g.importe||0)*(1+parseFloat(g.ivaRate||0)/100),0);

      <div style={{display:'flex',alignItems:'center',gap:'16px'}}>
        <button onClick={onHome} style={{all:'unset',cursor:'pointer',color:'rgba(255,255,255,0.35)',fontSize:'12px',display:'flex',alignItems:'center',gap:'5px'}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Inicio

        <span style={{color:'rgba(255,255,255,0.1)'}}>|</span>
        <span style={{fontSize:'13px',fontWeight:'600',color:'#fff'}}>Gastos & Pagos</span>
      </div>
      <div style={{display:'flex',gap:'10px'}}>
        <button onClick={exportCSV} style={{all:'unset',cursor:'pointer',padding:'7px 14px',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'5px',fontSize:'12px',color:'rgba(255,255,255,0.5)',display:'flex',alignItems:'center',gap:'6px'}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>CSV
        </button>
        <button onClick={()=>{setEditing(null);setView('form');}} style={{all:'unset',cursor:'pointer',padding:'7px 16px',background:EA,borderRadius:'5px',fontSize:'12px',fontWeight:'600',color:'#fff'}}>+ Nuevo gasto</button>
      </div>
    </div>

    <div style={{padding:'32px',maxWidth:'1200px',margin:'0 auto'}}>
      {/* STATS */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'16px',marginBottom:'28px'}}>
        {[{label:'Total gastado',val:`${totalBase.toLocaleString('es-ES',{minimumFractionDigits:2})} €`,sub:`${gastos.length} gasto${gastos.length!==1?'s':''}`,color:EA},{label:'IVA deducible',val:`${totalIVA.toLocaleString('es-ES',{minimumFractionDigits:2})} €`,sub:'IVA recuperable',color:'#818cf8'},{label:'Pendiente de pago',val:`${totalPend.toLocaleString('es-ES',{minimumFractionDigits:2})} €`,sub:'Con IVA incluido',color:'#fbbf24'}].map((s,i)=>(

const REP_A='#818cf8';
function ReportesModule({onHome}){
  const RA=REP_A;
  const [periodo,setPeriodo]=React.useState('año');
  const [año,setAño]=React.useState(new Date().getFullYear());

  const invoices=invoices_storage.load();
  const gastos=expenses_storage.load();
  const clients=clients_storage.load();

  // Helpers
  const parseFecha=s=>s?new Date(s):null;
  const inPeriodo=fecha=>{
    if(!fecha)return false;
    const d=parseFecha(fecha);
    if(!d)return false;
    if(periodo==='año')return d.getFullYear()===año;
    const now=new Date();
    if(periodo==='mes')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
    if(periodo==='trim'){const m=now.getMonth();const q=Math.floor(m/3);return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/3)===q;}
    return true;
  };

  const filtInv=invoices.filter(i=>inPeriodo(i.fechaEmision));
  const filtGas=gastos.filter(g=>inPeriodo(g.fecha));

  const calcInvTotal=i=>{const sub=(i.items||[]).reduce((s,it)=>s+(parseFloat(it.qty||1)*parseFloat(it.unitPrice||0)),0);return sub*(1+parseFloat(i.ivaRate||21)/100);};
  const calcGasTotal=g=>parseFloat(g.importe||0)*(1+parseFloat(g.ivaRate||0)/100);
  const calcInvBase=i=>(i.items||[]).reduce((s,it)=>s+(parseFloat(it.qty||1)*parseFloat(it.unitPrice||0)),0);
  const calcInvIVA=i=>calcInvBase(i)*parseFloat(i.ivaRate||21)/100;
  const calcGasBase=g=>parseFloat(g.importe||0);
  const calcGasIVA=g=>parseFloat(g.importe||0)*parseFloat(g.ivaRate||0)/100;

  const totalIngresos=filtInv.filter(i=>i.estado==='Pagada').reduce((s,i)=>s+calcInvTotal(i),0);
  const totalGastos=filtGas.filter(g=>g.estado==='Pagado').reduce((s,g)=>s+calcGasTotal(g),0);
  const beneficio=totalIngresos-totalGastos;
  const ivaRepercutido=filtInv.filter(i=>i.estado==='Pagada').reduce((s,i)=>s+calcInvIVA(i),0);
  const ivaSoportado=filtGas.filter(g=>g.ivaDeducible).reduce((s,g)=>s+calcGasIVA(g),0);
  const ivaLiquidar=ivaRepercutido-ivaSoportado;

  const pendienteCobro=filtInv.filter(i=>i.estado!=='Pagada'&&i.estado!=='Cancelada').reduce((s,i)=>s+calcInvTotal(i),0);
  const pendientePago=filtGas.filter(g=>g.estado==='Pendiente').reduce((s,g)=>s+calcGasTotal(g),0);

  // Monthly data for año
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const monthlyData=months.map((m,mi)=>({
    m,
    ingresos:invoices.filter(i=>i.estado==='Pagada'&&parseFecha(i.fechaEmision)?.getFullYear()===año&&parseFecha(i.fechaEmision)?.getMonth()===mi).reduce((s,i)=>s+calcInvTotal(i),0),
    gastos:gastos.filter(g=>g.estado==='Pagado'&&parseFecha(g.fecha)?.getFullYear()===año&&parseFecha(g.fecha)?.getMonth()===mi).reduce((s,g)=>s+calcGasTotal(g),0)
  }));
  const maxVal=Math.max(...monthlyData.flatMap(d=>[d.ingresos,d.gastos]),1);

  // Top clients by invoiced
  const clientRevMap={};
  filtInv.forEach(i=>{if(i.clienteId){clientRevMap[i.clienteId]=(clientRevMap[i.clienteId]||0)+calcInvTotal(i);}});
  const topClients=Object.entries(clientRevMap).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,val])=>({
    name:clients.find(c=>c.id===id)?.empresa||clients.find(c=>c.id===id)?.nombre||'Desconocido',val
  }));

  // Expenses by category
  const catMap={};
  filtGas.forEach(g=>{catMap[g.categoria]=(catMap[g.categoria]||0)+calcGasBase(g);});
  const topCats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const totalCatBase=topCats.reduce((s,[,v])=>s+v,0)||1;

  const catColors=['#818cf8','#34d399','#fbbf24','#f87171','#60a5fa','#c084fc'];

  const exportPL=()=>{
    const rows=[['Concepto','Importe'],['',''],['INGRESOS',''],['Total facturado (cobrado)',totalIngresos.toFixed(2)],['Pendiente de cobro',pendienteCobro.toFixed(2)],['',''],['GASTOS',''],['Total gastos (pagados)',totalGastos.toFixed(2)],['Pendiente de pago',pendientePago.toFixed(2)],['',''],['RESULTADO',''],['Beneficio neto',beneficio.toFixed(2)],['',''],['IVA',''],['IVA repercutido',ivaRepercutido.toFixed(2)],['IVA soportado deducible',ivaSoportado.toFixed(2)],['IVA a liquidar',ivaLiquidar.toFixed(2)]];
    const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('﻿'+csv);a.download=`pl-${año}.csv`;a.click();
  };

  const fmt=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

  return(
  <div style={{minHeight:'100vh',background:'#0a0a0f',color:'#fff',fontFamily:"'Inter',sans-serif"}}>
    {/* NAV */}
    <div style={{borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'0 32px',display:'flex',alignItems:'center',justifyContent:'space-between',height:'56px',position:'sticky',top:0,background:'rgba(10,10,15,0.95)',backdropFilter:'blur(12px)',zIndex:50}}>
      <div style={{display:'flex',alignItems:'center',gap:'16px'}}>
        <button onClick={onHome} style={{all:'unset',cursor:'pointer',color:'rgba(255,255,255,0.35)',fontSize:'12px',display:'flex',alignItems:'center',gap:'5px'}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Inicio
        </button>
        <span style={{color:'rgba(255,255,255,0.1)'}}>|</span>
        <span style={{fontSize:'13px',fontWeight:'600',color:'#fff'}}>Reportes & Contabilidad</span>
      </div>
      <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
        <div style={{display:'flex',gap:'6px'}}>
          {['mes','trim','año','todo'].map(p=>(
            <button key={p} onClick={()=>setPeriodo(p)} style={{all:'unset',cursor:'pointer',padding:'6px 12px',borderRadius:'16px',fontSize:'12px',fontWeight:'600',background:periodo===p?RA:'rgba(255,255,255,0.05)',color:periodo===p?'#fff':'rgba(255,255,255,0.4)',transition:'all .15s'}}>{{mes:'Este mes',trim:'Trimestre',año:'Año',todo:'Todo'}[p]}</button>
          ))}
        </div>
        {periodo==='año'&&<select value={año} onChange={e=>setAño(parseInt(e.target.value))} style={{all:'unset',padding:'6px 10px',borderRadius:'6px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',fontSize:'12px',color:'rgba(255,255,255,0.6)',cursor:'pointer'}}>
          {[2023,2024,2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}
        </select>}
        <button onClick={exportPL} style={{all:'unset',cursor:'pointer',padding:'7px 14px',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'5px',fontSize:'12px',color:'rgba(255,255,255,0.5)',display:'flex',alignItems:'center',gap:'6px'}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>CSV P&L

          {label:'Beneficio neto',val:fmt(beneficio),sub:totalIngresos>0?`Margen ${Math.round(beneficio/totalIngresos*100)}%`:'Sin datos',color:beneficio>=0?RA:'#f87171',icon:'M3 3l18 18M3 21l18-18'},
          {label:'IVA a liquidar',val:fmt(ivaLiquidar),sub:`Repercutido ${fmt(ivaRepercutido)} — Deducible ${fmt(ivaSoportado)}`,color:'#fbbf24',icon:'M9 14l6-6m-4-2h.01M13 14h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'}

                    <span style={{fontSize:'12px',color:'rgba(255,255,255,0.6)'}}>{cat}</span>

      {/* TOP CLIENTS */}
      {topClients.length>0&&(
