<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080808;color:#e5e5e5;font-family:'Inter',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}

/* ── FORM STYLES ── */
.input-f{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:8px;padding:10px 14px;color:#e5e5e5;font-size:13.5px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s,background .2s}
.input-f:focus{border-color:rgba(255,255,255,0.28);background:rgba(255,255,255,0.07)}
.input-f::placeholder{color:#444}
textarea.input-f{resize:vertical;min-height:88px;line-height:1.6}
select.input-f option{background:#141414}
.glass{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.07);cursor:pointer;transition:all .15s;background:rgba(255,255,255,0.02);user-select:none;font-size:13px;color:#888}
.chk:hover{border-color:rgba(255,255,255,0.18);color:#ccc;background:rgba(255,255,255,0.04)}
.chk.on{border-color:rgba(255,255,255,0.28);color:#fff;background:rgba(255,255,255,0.07)}
.chk-box{width:16px;height:16px;border-radius:4px;flex-shrink:0;border:1px solid #444;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chk.on .chk-box{background:#fff;border-color:#fff}
.btn-main{background:#fff;color:#000;border:none;border-radius:8px;padding:13px 32px;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:.01em;transition:all .2s}
.btn-main:hover{background:#e8e8e8;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#888;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:9px 18px;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-ghost:hover{color:#fff;border-color:rgba(255,255,255,0.28);background:rgba(255,255,255,0.04)}
.btn-icon{background:rgba(255,255,255,0.04);color:#888;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-icon:hover{color:#fff;background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2)}
.btn-danger{background:transparent;color:#666;border:1px solid rgba(255,255,255,0.07);border-radius:7px;padding:7px 12px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s}
.btn-danger:hover{color:#f87171;border-color:#f8717160;background:rgba(248,113,113,0.05)}
.lbl{display:block;font-size:12.5px;font-weight:500;color:#666;margin-bottom:5px}
.s-head{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#444;margin-bottom:18px}
.logo-sq{width:26px;height:26px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:4px;font-size:11.5px;font-weight:500;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#aaa}
.lib-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:20px 22px;transition:border-color .2s}
.lib-card:hover{border-color:rgba(255,255,255,0.14)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 20px;font-size:13px;color:#ddd;z-index:9999;white-space:nowrap;backdrop-filter:blur(16px);animation:fadeup .3s ease}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── DECK ── */
.deck{position:fixed;inset:0;background:#000;overflow:hidden}
.slide-wrap{position:absolute;inset:0;transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1)}
.slide-wrap.active{opacity:1;transform:translateX(0);z-index:10;pointer-events:all}
.slide-wrap.before{opacity:0;transform:translateX(-70px);z-index:1;pointer-events:none}
.slide-wrap.after{opacity:0;transform:translateX(70px);z-index:1;pointer-events:none}
.prog{position:fixed;bottom:0;left:0;height:2px;background:rgba(255,255,255,0.2);z-index:200;transition:width .4s ease}
.nav-bar{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:300;background:rgba(8,8,8,0.92);border:1px solid rgba(255,255,255,0.1);border-radius:100px;padding:7px 16px;backdrop-filter:blur(20px)}
.nav-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);background:transparent;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.nav-btn:hover:not(:disabled){background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.3)}
.nav-btn:disabled{opacity:.2;cursor:not-allowed}
.s-ctr{font-size:11.5px;font-weight:500;color:#444;letter-spacing:.05em;min-width:44px;text-align:center;font-family:'Inter',sans-serif}
.dots-v{position:fixed;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;z-index:300}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.15);cursor:pointer;transition:all .3s}
.dot.on{background:#fff;transform:scale(1.4)}
.dot:hover{background:rgba(255,255,255,0.5)}

/* ── SLIDE DESIGN TOKENS ── */
/* BG */
--bg: #0a0a0a;
--card-dk: #1a1a1a;
--card-warm: #b8956a;
--card-warm2: #c8a87a;
--accent: #b8956a;

/* ── TEXTURE PANEL ── */
.tex{position:relative;overflow:hidden;flex-shrink:0;background:#1d1c19}

/* ── SLIDE LABEL ── */
.s-lbl{display:inline-block;padding:4px 12px;border:1px solid rgba(255,255,255,0.28);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,0.6);font-family:'Inter',sans-serif;margin-bottom:18px}

/* ── SLIDE TITLE ── */
.s-title{font-family:'Playfair Display',serif;color:#fff;line-height:1.1;letter-spacing:-.01em}

/* ── CONTENT CARD ── */
.c-card{background:#1e1e1e;padding:24px;border-radius:0}
.c-card-warm{background:#b8956a;padding:24px;border-radius:0}
.c-card-warm2{background:#d4b88a;padding:24px;border-radius:0}
.c-card h3{font-family:'Playfair Display',serif;font-size:20px;color:#fff;margin-bottom:8px;font-weight:500}
.c-card-warm h3{font-family:'Playfair Display',serif;font-size:20px;color:#0a0a0a;margin-bottom:8px;font-weight:500}
.c-card-warm2 h3{font-family:'Playfair Display',serif;font-size:20px;color:#0a0a0a;margin-bottom:8px;font-weight:500}
.c-card p,.c-card-warm p,.c-card-warm2 p{font-size:13.5px;line-height:1.7}
.c-card p{color:rgba(255,255,255,0.55)}
.c-card-warm p{color:rgba(0,0,0,0.7)}
.c-card-warm2 p{color:rgba(0,0,0,0.65)}

/* Exporting overlay */
.exp-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.exp-spinner{width:40px;height:40px;border:2px solid rgba(255,255,255,0.1);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* hidden render container for PDF */
#pdf-container{position:fixed;left:-9999px;top:0;pointer-events:none;z-index:-1}

/* ══ TECH ANIMATIONS ══ */
@keyframes drawLine{0%{stroke-dashoffset:var(--l,500)}100%{stroke-dashoffset:0}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(184,149,106,.25))}50%{filter:drop-shadow(0 0 18px rgba(184,149,106,.75))}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes scanY{0%{top:-1px}100%{top:102%}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes countIn{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes lineGrow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes borderPulse{0%,100%{opacity:.3}50%{opacity:.85}}
@keyframes nodeAppear{0%{opacity:0;r:8}60%{r:20}100%{opacity:1;r:16}}
@keyframes rotateSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes arrowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

/* Tech dot-grid background */
.tech-grid{background-image:radial-gradient(rgba(184,149,106,.07) 1px,transparent 1px);background-size:30px 30px}
.tech-grid-sm{background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:20px 20px}
/* Thin horizontal scan line */
.scan-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(184,149,106,.35) 40%,rgba(184,149,106,.6) 50%,rgba(184,149,106,.35) 60%,transparent);animation:scanY 5s linear infinite;pointer-events:none;z-index:8}
/* Glow border on cards */
.glow-card{border:1px solid rgba(184,149,106,.22)!important;box-shadow:0 0 18px rgba(184,149,106,.08),inset 0 0 12px rgba(184,149,106,.04)}

/* ── SLIDE ENTRY (triggered when parent .slide-wrap gets class .active) ── */
.slide-wrap.active .se  {opacity:0;animation:fadeInUp .55s ease forwards}
.slide-wrap.active .se1 {opacity:0;animation:fadeInUp .55s .08s ease forwards}
.slide-wrap.active .se2 {opacity:0;animation:fadeInUp .55s .16s ease forwards}
.slide-wrap.active .se3 {opacity:0;animation:fadeInUp .55s .24s ease forwards}
.slide-wrap.active .se4 {opacity:0;animation:fadeInUp .55s .32s ease forwards}
.slide-wrap.active .se5 {opacity:0;animation:fadeInUp .55s .40s ease forwards}
.slide-wrap.active .se6 {opacity:0;animation:fadeInUp .55s .48s ease forwards}
/* SVG line draw — default: invisible (animated in on .active) */
.dl,.dl1,.dl2,.dl3,.dl4,.dl5 {stroke-dashoffset:500}
.slide-wrap.active .dl  {animation:drawLine .9s ease-out forwards}
.slide-wrap.active .dl1 {animation:drawLine .9s .08s ease-out forwards}
.slide-wrap.active .dl2 {animation:drawLine .9s .16s ease-out forwards}
.slide-wrap.active .dl3 {animation:drawLine .9s .24s ease-out forwards}
.slide-wrap.active .dl4 {animation:drawLine .9s .32s ease-out forwards}
.slide-wrap.active .dl5 {animation:drawLine .9s .40s ease-out forwards}
/* Glow nodes */
.slide-wrap.active .gnd {animation:glowPulse 2.8s .6s ease-in-out infinite}
/* Float */
.slide-wrap.active .fnd {animation:floatY 3.5s ease-in-out infinite}
/* Counter */
.slide-wrap.active .ci0 {opacity:0;animation:countIn .6s .05s cubic-bezier(.34,1.56,.64,1) forwards}
.slide-wrap.active .ci1 {opacity:0;animation:countIn .6s .2s  cubic-bezier(.34,1.56,.64,1) forwards}
.slide-wrap.active .ci2 {opacity:0;animation:countIn .6s .35s cubic-bezier(.34,1.56,.64,1) forwards}
.slide-wrap.active .ci3 {opacity:0;animation:countIn .6s .5s  cubic-bezier(.34,1.56,.64,1) forwards}
/* Flow line grow — default: invisible */
.fl,.fl1,.fl2,.fl3 {transform-origin:left center;transform:scaleX(0);opacity:0}
.slide-wrap.active .fl  {animation:lineGrow .5s ease forwards}
.slide-wrap.active .fl1 {animation:lineGrow .5s .18s ease forwards}
.slide-wrap.active .fl2 {animation:lineGrow .5s .36s ease forwards}
.slide-wrap.active .fl3 {animation:lineGrow .5s .54s ease forwards}
/* Arrow appear — default: invisible */
.ai,.ai1,.ai2 {opacity:0}
.slide-wrap.active .ai  {animation:arrowIn .35s .45s ease forwards}
.slide-wrap.active .ai1 {animation:arrowIn .35s .63s ease forwards}
.slide-wrap.active .ai2 {animation:arrowIn .35s .81s ease forwards}

/* ══ PDF EXPORT MODE — freeze all to final state ══ */
.pdf-mode .scan-line{display:none!important}
.pdf-mode *{animation:none!important;transition:none!important}
/* SVG lines — show fully drawn */
.pdf-mode .dl,.pdf-mode .dl1,.pdf-mode .dl2,.pdf-mode .dl3,.pdf-mode .dl4,.pdf-mode .dl5{stroke-dashoffset:0!important}
/* Flow lines — show fully grown */
.pdf-mode .fl,.pdf-mode .fl1,.pdf-mode .fl2,.pdf-mode .fl3{transform:scaleX(1)!important;opacity:1!important}
/* Arrows — show */
.pdf-mode .ai,.pdf-mode .ai1,.pdf-mode .ai2{opacity:1!important;transform:translateX(0)!important}
/* Glow nodes — no filter pulse */
.pdf-mode .gnd{filter:drop-shadow(0 0 8px rgba(184,149,106,.4))!important}
/* Float — reset */
.pdf-mode .fnd{transform:translateY(0)!important}
/* Metric counters */
.pdf-mode .ci0,.pdf-mode .ci1,.pdf-mode .ci2,.pdf-mode .ci3{opacity:1!important;transform:none!important}
</style>
</head>
<body>
<div id="root"></div>
<div id="pdf-container"></div>

<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;

/* ── CONSTANTS ── */
const REDES=['Instagram','TikTok','LinkedIn','YouTube'];
const EXTRAS=['Automatización Instagram','Automatización WhatsApp','Email Marketing','CRM','Diseño Web con IA','Optimización Web con IA','Sesión Fotográfica con IA'];
const PLAN_OPTS=['Essential','Growth','Authority'];
const RESPONSABLES=['Angélica Triana','Yenifer Germano'];
const STORAGE_KEY='propuestas_v2';
const BG='#000000';
const DK='#141414';
const WARM='#b8956a';
const WARM2='#d4b88a';
/* ── GlowLabs Brand ── */
const GL_P='#a855f7';
const GL_P2='#7c3aed';
const GL_P3='#c084fc';
const GL_BG='#09090b';

const PLAN_DATA={
  Essential:{price:'1.200€',freq:'mes',features:['Estrategia de marketing digital','Parrilla de contenidos semanal','Edición y diseño de contenido','3 publicaciones semanales','Informe mensual de resultados']},
  Growth:{price:'1.700€',freq:'mes',features:['Todo lo incluido en Essential','4 publicaciones semanales','Automatización de mensajes Instagram','Diseño web / Optimización web / Sesión fotográfica con IA (una incluida)']},
  Authority:{price:'2.200€',freq:'mes',features:['Todo lo incluido en Growth','Publicaciones de lunes a sábado','Plataforma de Inteligencia Artificial','Bots automatizados avanzados','Email Marketing integrado','Gestión de bases de datos y CRM']},
};

const EMPTY_FORM={clientName:'',empresa:'',sector:'',web:'',instagram:'',tiktok:'',situacion:'',problemas:'',oportunidades:'',objetivo:'',redes:[],publico:'',competidores:[{name:'',social:''}],observaciones:'',responsable:'',planes:[],extras:[]};

/* ── SLIDE PHOTOS (Unsplash, B&N via CSS grayscale) ── */
const U='https://images.unsplash.com/photo-';
const PHOTOS=[
  U+'1521791136064-7986c2920216?auto=format&fit=crop&w=1280&q=92', // 0: handshake close-up (portada)
  U+'1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1280&q=92', // 1: analyzing charts
  U+'1560472354-b33ff0c44a43?auto=format&fit=crop&w=1280&q=92',    // 2: B&W handshake deal
  U+'1488190211105-8b0e65b80b4e?auto=format&fit=crop&w=1280&q=92', // 3: laptop working
  U+'1542744173-8e7e53415bb0?auto=format&fit=crop&w=1280&q=92',    // 4: business meeting
  U+'1497366216548-37526070297c?auto=format&fit=crop&w=1280&q=92', // 5: conference room
  U+'1551434678-e076c223a692?auto=format&fit=crop&w=1280&q=92',    // 6: professional desk
  U+'1517842645767-c639042777db?auto=format&fit=crop&w=1280&q=92', // 7: notebook & pen
  U+'1522071820081-009f0129c71c?auto=format&fit=crop&w=1280&q=92', // 8: team collaboration
];

/* ── STORAGE ── */
const storage={
  load:()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}},
  save:(list)=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(list))}catch{}},
};

/* ── ANALYSIS ── */
function buildAnalysis(d){
  const co=d.empresa||'la empresa';
  const sec=d.sector?`en el sector de ${d.sector}`:'en su sector';
  const redesList=d.redes.length?d.redes.join(', '):'sus canales digitales';
  const cn=d.competidores.filter(c=>c.name.trim()).map(c=>c.name.trim()).join(', ');
  return {
    p1:`${co} opera hoy ${sec} con una presencia digital que, si bien existe, no está siendo gestionada como un activo estratégico. ${d.situacion?d.situacion.trim().replace(/\.$/,'')+'.':`La comunicación actual responde a la inmediatez táctica, no a una arquitectura de marca planificada.`} Esto genera una percepción inconsistente en ${redesList} que no refleja el nivel real del negocio.`,
    p2:d.problemas?`Al analizar el ecosistema digital actual, identificamos brechas estructurales: ${d.problemas.toLowerCase().trim().replace(/\.$/,'')}. Estas no son problemas de ejecución aislados; son síntomas de la ausencia de una estrategia de posicionamiento definida.`:`La ausencia de una hoja de ruta estratégica provoca que cada acción de comunicación opere de forma aislada, sin construir autoridad ni una narrativa de marca reconocible en el tiempo.`,
    p3:cn?`La presencia de ${cn} en el mercado ejerce una presión competitiva creciente que hace urgente construir diferenciación estratégica antes de que la ventana de oportunidad se cierre.`:`La presión competitiva en el entorno digital hace urgente que ${co} construya diferenciación real a través de su comunicación.`,
    p4:d.oportunidades?`${co} cuenta con ventajas diferenciales concretas y subexplotadas: ${d.oportunidades.toLowerCase().trim().replace(/\.$/,'')}. La oportunidad no está en inventar algo nuevo, sino en comunicar con estrategia lo que ya existe.`:`Existe una oportunidad real de transformar la presencia digital de ${co} en un canal generador de autoridad, confianza y oportunidades comerciales medibles.`,
    cn,
  };
}

function buildProposal(form){
  const planes=form.planes;
  const resolvedPlan=planes.length===1?planes[0]:planes.includes('Authority')?'Authority':planes.includes('Growth')?'Growth':'Essential';
  return{...form,resolvedPlan,fecha:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'long',day:'numeric'})};
}

/* ── FORM COMPONENTS ── */
function Logo(){return(<div style={{display:'flex',alignItems:'center',gap:'9px'}}><div className="logo-sq"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1.2" fill="#000"/><rect x="8" y="1" width="5" height="5" rx="1.2" fill="#000"/><rect x="1" y="8" width="5" height="5" rx="1.2" fill="#000"/><rect x="8" y="8" width="5" height="5" rx="1.2" fill="#000"/></svg></div><span style={{fontSize:'13px',fontWeight:'700',color:'#fff',letterSpacing:'-.01em'}}>Propuestas Comerciales</span></div>);}

function ChkGroup({items,selected,onChange}){
  const toggle=it=>onChange(selected.includes(it)?selected.filter(x=>x!==it):[...selected,it]);
  return(<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(188px,1fr))',gap:'8px'}}>{items.map(it=>(<div key={it} className={`chk ${selected.includes(it)?'on':''}`} onClick={()=>toggle(it)}><div className="chk-box">{selected.includes(it)&&<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 4.5L3.5 7L8 2" stroke="#000" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}</div>{it}</div>))}</div>);
}

function CompetitorFields({value,onChange}){
  const add=()=>onChange([...value,{name:'',social:''}]);
  const remove=i=>onChange(value.filter((_,idx)=>idx!==i));
  const upd=(i,f,v)=>onChange(value.map((c,idx)=>idx===i?{...c,[f]:v}:c));
  const btnStyle={background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'8px',color:'#555',cursor:'pointer',fontSize:'16px',fontFamily:'Inter',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s',width:'36px',height:'38px'};

}

function Toast({msg,onDone}){useEffect(()=>{const t=setTimeout(onDone,2600);return()=>clearTimeout(t)},[]);return <div className="toast">✓ {msg}</div>;}

/* ── LIBRARY VIEW ── */
function LibraryView({saved:savedProp,onView,onEdit,onDelete,onNew,onBack,onHome}){
  const [saved,setSaved]=useState(savedProp);
  const duplicateProp=(s)=>{
    const copy={...s,id:Date.now().toString()+Math.random().toString(36).slice(2,5),empresa:s.empresa+' (Copia)',fechaGuardado:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),status:''};
    if(copy.formData) copy.formData={...copy.formData,empresa:copy.empresa};
    const updated=[...saved,copy];
    setSaved(updated);
    storage.save(updated);
  };
  const PROP_STATUS=[{k:'',l:'Sin estado',c:'rgba(255,255,255,0.2)'},{k:'enviada',l:'Enviada',c:'#fb923c'},{k:'vista',l:'Vista',c:'#38bdf8'},{k:'aceptada',l:'Aceptada ✓',c:'#4ade80'},{k:'rechazada',l:'Rechazada',c:'#f87171'}];
  const updateStatus=(id,status)=>{
    const updated=saved.map(s=>s.id===id?{...s,status}:s);
    setSaved(updated);
    storage.save(updated);
  };
  const [openStatusId,setOpenStatusId]=useState(null);
  useEffect(()=>{
    if(!openStatusId) return;
    const h=()=>setOpenStatusId(null);
    document.addEventListener('click',h);
    return()=>document.removeEventListener('click',h);
  },[openStatusId]);
  return(
    <div style={{minHeight:'100vh',background:'#080808',paddingBottom:'60px'}}>
      <div style={{maxWidth:'800px',margin:'0 auto',padding:'44px 28px 28px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'32px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
            {onHome&&<button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={onHome}>← Inicio</button>}
            <Logo/>
          </div>
          <div style={{display:'flex',gap:'10px'}}><button className="btn-ghost" onClick={onBack}>← Volver</button><button className="btn-main" onClick={onNew} style={{padding:'10px 22px',fontSize:'13px'}}>+ Nueva propuesta</button></div>
        </div>
        <h1 style={{fontSize:'26px',fontWeight:'800',letterSpacing:'-.03em',color:'#fff',marginBottom:'6px'}}>Propuestas guardadas</h1>
        <p style={{fontSize:'13.5px',color:'#444',marginBottom:'32px'}}>{saved.length===0?'No hay propuestas guardadas aún.':saved.length+' propuesta'+(saved.length>1?'s':'')}</p>
        {saved.length===0?(<div style={{textAlign:'center',padding:'60px 20px',color:'#333',fontSize:'14px'}}><p style={{fontSize:'32px',marginBottom:'12px'}}>📂</p><p>Genera tu primera propuesta y guárdala aquí.</p></div>):(
          <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
            {[...saved].reverse().map(s=>{
              const st=PROP_STATUS.find(x=>x.k===(s.status||''))||PROP_STATUS[0];
              return(<div key={s.id} className="lib-card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'16px'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'6px',flexWrap:'wrap'}}>
                      <p style={{fontSize:'16px',fontWeight:'700',color:'#fff'}}>{s.empresa}</p>
                      <span className="tag">{s.clientName}</span>
                      {s.planes&&s.planes.map(p=><span key={p} className="tag" style={{background:'rgba(255,255,255,0.06)',color:'#999'}}>Plan {p}</span>)}
                      {/* STATUS BADGE */}
                      <div style={{position:'relative'}} onClick={e=>e.stopPropagation()}>
                        <div onClick={()=>setOpenStatusId(openStatusId===s.id?null:s.id)} style={{display:'flex',alignItems:'center',gap:'5px',padding:'3px 10px',borderRadius:'100px',border:`1px solid ${st.c}44`,background:`${st.c}12`,cursor:'pointer',userSelect:'none'}}>
                          <span style={{fontSize:'11px',fontWeight:'600',color:st.c,fontFamily:"'Inter',sans-serif"}}>{st.l||'Estado'}</span>
                          <svg width="8" height="8" viewBox="0 0 10 10" fill="none"><path d="M2 3.5l3 3 3-3" stroke={st.c} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </div>
                        {openStatusId===s.id&&(
                          <div style={{position:'absolute',left:0,top:'calc(100% + 4px)',zIndex:200,background:'#1c1c1c',border:'1px solid rgba(255,255,255,0.12)',borderRadius:'10px',padding:'6px',minWidth:'150px',boxShadow:'0 12px 40px rgba(0,0,0,0.7)'}}>
                            {PROP_STATUS.map(opt=>(
                              <div key={opt.k} onClick={()=>{updateStatus(s.id,opt.k);setOpenStatusId(null);}}
                                style={{padding:'8px 12px',borderRadius:'7px',cursor:'pointer',fontSize:'12.5px',fontFamily:"'Inter',sans-serif",color:opt.k===(s.status||'')?'#fff':'rgba(255,255,255,0.45)',background:opt.k===(s.status||'')?'rgba(255,255,255,0.07)':'transparent',display:'flex',alignItems:'center',gap:'8px'}}
                                onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.05)'}
                                onMouseLeave={e=>e.currentTarget.style.background=opt.k===(s.status||'')?'rgba(255,255,255,0.07)':'transparent'}>
                                <span style={{width:'8px',height:'8px',borderRadius:'50%',background:opt.c,flexShrink:0,display:'inline-block'}}/>
                                {opt.l}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                    <div style={{display:'flex',gap:'16px',flexWrap:'wrap'}}>
                      {s.sector&&<span style={{fontSize:'12px',color:'#444'}}>{s.sector}</span>}
                      <span style={{fontSize:'12px',color:'#333'}}>{s.fechaGuardado||s.fecha}</span>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:'8px',flexShrink:0}}>
                    <button className="btn-icon" onClick={()=>onView(s)}>Ver</button>
                    <button className="btn-icon" onClick={()=>onEdit(s)}>Editar</button>
                    <button className="btn-icon" onClick={()=>duplicateProp(s)} title="Duplicar propuesta">⎘</button>
                    <button className="btn-danger" onClick={()=>onDelete(s.id)}>Eliminar</button>
                  </div>
                </div>
              </div>);
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── PHOTO / TEXTURE PANEL ── */
function Tex({w,h,variant=0,label='',photo='',objPos='center',overlay=0.32}){
  const v=variant%PHOTOS.length;
  const src=photo||PHOTOS[v];
  // CSS fallback base (when image not loaded)
  const bases=['#1d1c19','#161e1e','#1c1916','#131619'];

  return(
    <div className="tex" style={{width:w||'100%',height:h||'100%',flexShrink:0,background:bases[v%4],position:'relative',overflow:'hidden'}}>
      {/* PHOTO LAYER — background-image approach: html2canvas handles cover + filter reliably */}
      <div style={{
        position:'absolute',top:0,left:0,width:'100%',height:'100%',
        backgroundImage:`url("${src}")`,
        backgroundSize:'cover',
        backgroundPosition:objPos,
        backgroundRepeat:'no-repeat',
        filter:'grayscale(100%) contrast(1.08) brightness(0.78)',
      }}/>
      {/* Dark overlay — improves text contrast over photo */}
      <div style={{position:'absolute',inset:0,background:`rgba(0,0,0,${overlay})`}}/>
      {/* Edge vignette for depth */}
      <div style={{position:'absolute',inset:0,background:'linear-gradient(to right,rgba(0,0,0,0.38) 0%,transparent 22%,transparent 78%,rgba(0,0,0,0.32) 100%)'}}/>
      <div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom,rgba(0,0,0,0.25) 0%,transparent 18%,transparent 82%,rgba(0,0,0,0.42) 100%)'}}/>
      {label&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}><span style={{fontFamily:"'Playfair Display',serif",fontSize:'130px',fontWeight:800,color:'rgba(255,255,255,0.06)',letterSpacing:'-.02em',userSelect:'none',transform:'rotate(-6deg)',whiteSpace:'nowrap'}}>{label}</span></div>}
    </div>
  );
}

/* ── STRATEGY HEX DIAGRAM ── */
function StrategyDiagram(){
  const W=480,H=440,cx=240,cy=218,nr=140,lr=180;
  const items=[
    {t:'Posicionamiento',s:'Narrativa de marca'},
    {t:'Comunidad',s:'Engagement real'},
    {t:'Conversión',s:'Embudo digital'},
    {t:'Automatización',s:'IA + Bots'},
    {t:'Datos',s:'Métricas reales'},
    {t:'Consistencia',s:'Presencia continua'},
  ];
  const pts=items.map((_,i)=>{const a=(-Math.PI/2)+(i*Math.PI/3);return{x:cx+nr*Math.cos(a),y:cy+nr*Math.sin(a)};});
  const lbs=items.map((_,i)=>{const a=(-Math.PI/2)+(i*Math.PI/3);return{x:cx+lr*Math.cos(a),y:cy+lr*Math.sin(a)};});
  const polyPts=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  return(
    <div style={{width:'100%',height:'100%',background:'#030303',position:'relative',overflow:'hidden'}} className="tech-grid">
      <div className="scan-line"/>
      <svg width="100%" height="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" style={{position:'absolute',inset:0}}>
        {/* decorative outer ring */}
        <circle cx={cx} cy={cy} r="192" fill="none" stroke="rgba(184,149,106,0.04)" strokeWidth="1" strokeDasharray="3 9"/>
        <circle cx={cx} cy={cy} r="170" fill="none" stroke="rgba(184,149,106,0.06)" strokeWidth="0.5"/>
        {/* hexagonal outer polygon */}
        <polygon points={polyPts} fill="none" stroke="rgba(184,149,106,0.14)" strokeWidth="0.8"/>
        {/* spoke lines */}
        {pts.map((p,i)=>(
          <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y}
            stroke="rgba(184,149,106,0.28)" strokeWidth="0.8"
            strokeDasharray="160" strokeDashoffset="160" className={`dl dl${i}`}
          />
        ))}
        {/* node outer glow rings */}
        {pts.map((p,i)=>(
          <circle key={`gr${i}`} cx={p.x} cy={p.y} r="30" fill="rgba(184,149,106,0.04)" stroke="rgba(184,149,106,0.12)" strokeWidth="0.5"/>
        ))}
        {/* node circles */}
        {pts.map((p,i)=>(
          <g key={`n${i}`} className="gnd">
            <circle cx={p.x} cy={p.y} r="22" fill="rgba(18,16,12,0.95)" stroke={i===0?'rgba(184,149,106,0.75)':'rgba(184,149,106,0.32)'} strokeWidth={i===0?'1.5':'1'}/>
            <text x={p.x} y={p.y+5} textAnchor="middle" fill={i===0?'#b8956a':'rgba(184,149,106,0.7)'} fontSize="13" fontWeight="700" fontFamily="Playfair Display,serif">{`0${i+1}`}</text>
          </g>
        ))}
        {/* label text */}
        {lbs.map((l,i)=>{
          const anchor=l.x>cx+15?'start':l.x<cx-15?'end':'middle';
          return(
            <g key={`lb${i}`} className={`se${i>0?i:''}`}>
              <text x={l.x} y={l.y-3} textAnchor={anchor} fill="rgba(255,255,255,0.75)" fontSize="10.5" fontWeight="600" fontFamily="Inter,sans-serif">{items[i].t}</text>
              <text x={l.x} y={l.y+11} textAnchor={anchor} fill="rgba(255,255,255,0.3)" fontSize="8.5" fontFamily="Inter,sans-serif">{items[i].s}</text>
            </g>
          );
        })}
        {/* center glow + circle */}
        <circle cx={cx} cy={cy} r="52" fill="rgba(184,149,106,0.05)" stroke="rgba(184,149,106,0.2)" strokeWidth="0.5" strokeDasharray="2 5"/>
        <circle cx={cx} cy={cy} r="42" fill="rgba(184,149,106,0.07)" stroke="rgba(184,149,106,0.5)" strokeWidth="1.5" className="gnd"/>
        <circle cx={cx} cy={cy} r="33" fill="rgba(6,5,4,0.97)"/>
        <text x={cx} y={cy-3} textAnchor="middle" fill="#b8956a" fontSize="14" fontWeight="700" fontFamily="Playfair Display,serif">360°</text>
        <text x={cx} y={cy+12} textAnchor="middle" fill="rgba(255,255,255,0.4)" fontSize="8.5" fontFamily="Inter,sans-serif">Digital</text>
      </svg>
      {/* corner tech tag */}
      <div style={{position:'absolute',bottom:'14px',right:'18px',display:'flex',alignItems:'center',gap:'6px'}}>
        <div style={{width:'5px',height:'5px',borderRadius:'50%',background:'rgba(184,149,106,0.45)'}}/>
        <span style={{fontSize:'9px',fontWeight:'700',letterSpacing:'.12em',textTransform:'uppercase',color:'rgba(184,149,106,0.38)',fontFamily:"'Inter',sans-serif"}}>Strategy Map</span>
      </div>
    </div>
  );
}

/* ── TECH FLOW DIAGRAM ── */
function TechFlowDiagram(){
  const nodes=[
    {label:'Marca',sub:'Brand Identity',hot:false},
    {label:'Contenido',sub:'Estrategia Editorial',hot:false},
    {label:'IA / Bot',sub:'Automatización',hot:true},
    {label:'CRM',sub:'Base de Datos',hot:false},
    {label:'Resultados',sub:'ROI Medible',hot:false},
  ];
  const W=680,H=120,nw=96,nh=58,gap=44;
  const total=nodes.length*nw+(nodes.length-1)*gap;
  const ox=(W-total)/2;
  const XS=nodes.map((_,i)=>ox+i*(nw+gap));
  const MY=H/2;
  return(
    <div style={{width:'100%',height:'120px',flexShrink:0,position:'relative',overflow:'hidden'}}>
      <svg width="100%" height="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
        {/* connecting lines + arrows */}
        {XS.slice(0,-1).map((x,i)=>(
          <g key={i}>
            <line x1={x+nw} y1={MY} x2={x+nw+gap} y2={MY}
              stroke="rgba(184,149,106,0.45)" strokeWidth="1.2"
              style={{transformOrigin:`${x+nw}px ${MY}px`}}
              className={`fl fl${i}`}
            />
            <polygon
              points={`${x+nw+gap-2},${MY-5} ${x+nw+gap+7},${MY} ${x+nw+gap-2},${MY+5}`}
              fill="rgba(184,149,106,0.55)"
              className={`ai ai${i}`}
            />
          </g>
        ))}
        {/* node boxes */}
        {XS.map((x,i)=>(
          <g key={i} className={`se${i>0?i:''}`}>
            <rect x={x} y={MY-nh/2} width={nw} height={nh} rx="3"
              fill={nodes[i].hot?'rgba(184,149,106,0.1)':'rgba(22,20,16,0.92)'}
              stroke={nodes[i].hot?'rgba(184,149,106,0.6)':'rgba(184,149,106,0.18)'}
              strokeWidth={nodes[i].hot?'1.4':'1'}
            />
            {nodes[i].hot&&<rect x={x} y={MY-nh/2} width={nw} height="2" rx="1" fill="rgba(184,149,106,0.55)"/>}
            <text x={x+nw/2} y={MY-4} textAnchor="middle"

function ProposalDeck({data,savedId,onBack,onEdit,onSave,isSaved,onAccept}){
  const [cur,setCur]=useState(0);
  const [toast,setToast]=useState(null);
  const [acceptOpen,setAcceptOpen]=useState(false);
  const [exporting,setExporting]=useState(false);
  const [expProgress,setExpProgress]=useState(0);
  const an=buildAnalysis(data);
  const planes=data.planes;
  const mainPlan=data.resolvedPlan;

  const go=n=>{if(n>=0&&n<SLIDES.length)setCur(n);};
  useEffect(()=>{const h=e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1)};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[cur]);

  const handleSave=()=>{onSave(data);setToast('Propuesta guardada correctamente');};

  /* ── PDF EXPORT via html2canvas — ALTA CALIDAD ── */
  const handlePDF=async()=>{
    setExporting(true);setExpProgress(0);
    try{
      await document.fonts.ready;
      const {jsPDF}=window.jspdf;
      const W=1280,H=720,SCALE=1.5;
      const pdf=new jsPDF({orientation:'landscape',unit:'px',format:[W,H]});
      const container=document.getElementById('pdf-container');
      container.innerHTML='';
      container.style.width=W+'px';
      // ── PDF-MODE: freeze all animations, show all elements at final state ──
      container.classList.add('pdf-mode');

      const slideEls=[];
      for(let i=0;i<SLIDES.length;i++){
        const div=document.createElement('div');
        div.style.cssText=`width:${W}px;height:${H}px;background:#000;overflow:hidden;position:relative;margin-bottom:4px;font-family:'Inter',sans-serif`;
        container.appendChild(div);
        slideEls.push(div);
      }
      const roots=slideEls.map(el=>ReactDOM.createRoot(el));
      SLIDES.forEach((slide,i)=>{
        roots[i].render(
          <React.Fragment>
            <DeckMeta empresa={data.empresa} n={i+1} total={SLIDES.length}/>
            {slide}
          </React.Fragment>
        );
      });

      // Esperar render completo + fuentes + imágenes de fondo
      await new Promise(r=>setTimeout(r,800));

      // Precargar imágenes de fondo via Image() para que html2canvas las tenga en caché
      const bgUrls=new Set();
      container.querySelectorAll('[style*="background-image"]').forEach(el=>{
        const m=el.style.backgroundImage.match(/url\("?([^")]+)"?\)/);
        if(m)bgUrls.add(m[1]);
      });
      await Promise.allSettled([...bgUrls].map(url=>new Promise(res=>{
        const im=new Image();
        im.crossOrigin='anonymous';
        im.onload=res; im.onerror=res;
        im.src=url;
      })));
      await new Promise(r=>setTimeout(r,300));

      for(let i=0;i<slideEls.length;i++){
        setExpProgress(Math.round((i/slideEls.length)*100));
        const canvas=await html2canvas(slideEls[i],{
          scale:SCALE,
          useCORS:true,
          allowTaint:false,
          backgroundColor:'#000000',
          width:W,
          height:H,
          logging:false,
          imageTimeout:15000,
          onclone:(doc)=>{
            // Ensure pdf-mode is active in the cloned document
            doc.getElementById('pdf-container')?.classList.add('pdf-mode');
          }
        });
        const imgData=canvas.toDataURL('image/jpeg',0.97);
        if(i>0)pdf.addPage([W,H],'landscape');
        pdf.addImage(imgData,'JPEG',0,0,W,H,undefined,'FAST');
      }
      roots.forEach(r=>r.unmount());
      container.classList.remove('pdf-mode');
      container.innerHTML='';
      const fname=`Propuesta_${data.empresa.replace(/\s+/g,'_')}_${data.fecha.replace(/\s+de\s+/g,'-')}.pdf`;
      pdf.save(fname);
    }catch(err){console.error(err);alert('Error al generar el PDF. Inténtalo de nuevo.');}
    setExporting(false);setExpProgress(0);
  };

/* ── CLIPBOARD HELPER (works on file://, http, https) ── */
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>_copyFallback(text));
  }
  return Promise.resolve(_copyFallback(text));
}
function _copyFallback(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
  document.body.appendChild(ta);
  ta.focus();ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}

  'conector+web3d':{impl:750},

  'conector+fidelizacion+web3d':{impl:950},
};

function calcAIPrice(pkgs=[],appImpl='',fidelClientes='<=500'){
  const nonApp=[...pkgs].filter(id=>id!=='app').sort();
  const comboKey=nonApp.join('+');
  const combo=AI_COMBO[comboKey];
  let impl=combo?combo.impl:nonApp.reduce((s,id)=>{const p=AI_PKGS.find(x=>x.id===id);return s+(p?.impl||0);},0);
  if(pkgs.includes('app'))impl+=(parseInt(appImpl)||0);
  const monthly=pkgs.reduce((s,id)=>{
    if(id==='app')return s;
    if(id==='fidelizacion')return s+(fidelClientes==='>500'?250:150);
    const p=AI_PKGS.find(x=>x.id===id);return s+(p?.monthly||0);
  },0);
  return{impl,monthly};
}

        <div style={{padding:'18px 28px',background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.08)',borderRight:totalMonthly>0?'none':''}}>
          <p style={{fontSize:'10px',color:'rgba(255,255,255,0.3)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:'4px',fontFamily:"'Inter',sans-serif",fontWeight:'600'}}>Implementación</p>
          <p style={{fontSize:'18px',fontWeight:'700',color:AI_A,fontFamily:"'Playfair Display',serif"}}>{totalImpl>0?totalImpl.toLocaleString('es-ES')+'€':'A medida'}</p>
        </div>
        {totalMonthly>0&&<div style={{padding:'18px 28px',background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.08)'}}>
          <p style={{fontSize:'10px',color:'rgba(255,255,255,0.3)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:'4px',fontFamily:"'Inter',sans-serif",fontWeight:'600'}}>Mantenimiento</p>
          <p style={{fontSize:'18px',fontWeight:'700',color:'rgba(255,255,255,0.6)',fontFamily:"'Playfair Display',serif"}}>{totalMonthly.toLocaleString('es-ES')}€<span style={{fontSize:'11px',fontWeight:'400',fontFamily:"'Inter',sans-serif"}}>/mes</span></p>
        </div>}
      </div>
      <div className="se4" style={{borderTop:'1px solid rgba(255,255,255,0.06)',paddingTop:'20px'}}>
        <p style={{fontSize:'12px',fontWeight:'600',color:'rgba(255,255,255,0.2)',fontFamily:"'Inter',sans-serif"}}>Mafe Montilla · Directora de IA y Automatización</p>
      </div>
    </div>
  </div>,
  ];

  const total=AI_SLIDES.length;
  const pct=((cur+1)/total*100).toFixed(1);

  return(
    <>
    <div className="deck">
      {AI_SLIDES.map((_,i)=>{
        let cls='slide-wrap ';
        if(i===cur)cls+='active';
        else if(i<cur)cls+='before';
        else cls+='after';
        return(
          <div key={i} className={cls}>
            <AIDeckMeta empresa={data.empresa} n={i+1} total={total}/>
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
              <div style={{width:'100%',height:'100%'}}>{AI_SLIDES[i]}</div>
            </div>
          </div>
        );
      })}
      <div className="prog" style={{width:`${pct}%`,background:AI_A}}/>
      <div className="dots-v">{AI_SLIDES.map((_,i)=><div key={i} className={`dot ${i===cur?'on':''}`} onClick={()=>setCur(i)}/>)}</div>
      <div className="nav-bar">
        <button className="nav-btn" onClick={()=>go(cur-1)} disabled={cur===0}><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M7 8.5L4 5.5L7 2.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
        <span className="s-ctr">{String(cur+1).padStart(2,'0')} / {String(total).padStart(2,'0')}</span>
        <button className="nav-btn" onClick={()=>go(cur+1)} disabled={cur===total-1}><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M4 2.5L7 5.5L4 8.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
        <div style={{width:'1px',height:'16px',background:'rgba(255,255,255,0.07)',margin:'0 2px'}}/>
        <button className="btn-ghost" style={{padding:'6px 12px',fontSize:'12px'}} onClick={()=>onEdit(data)}>Editar</button>
        <button className="btn-ghost" style={{padding:'6px 12px',fontSize:'12px',color:isSaved?'rgba(255,255,255,0.3)':'#888'}} onClick={handleSave}>{isSaved?'✓ Guardada':'Guardar'}</button>
        <button className="btn-ghost" style={{padding:'6px 12px',fontSize:'12px'}} onClick={handlePDF}>↓ PDF</button>
        {onAccept&&<button onClick={()=>setAcceptOpen(true)} style={{padding:'6px 14px',fontSize:'12px',background:`linear-gradient(135deg,${AI_A},${AI_A2})`,border:'none',borderRadius:'6px',color:'#000',fontWeight:'700',cursor:'pointer',fontFamily:"'Inter',sans-serif",letterSpacing:'-.01em'}}>✓ Aceptar propuesta</button>}
        <button className="btn-ghost" style={{padding:'6px 12px',fontSize:'12px'}} onClick={onBack}>← Biblioteca</button>
      </div>
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
    {exporting&&(<div className="exp-overlay"><div className="exp-spinner"/><p style={{color:'#fff',fontWeight:'600',fontSize:'15px',fontFamily:"'Inter',sans-serif",marginBottom:'8px'}}>Generando PDF de propuesta IA...</p><p style={{color:'rgba(255,255,255,0.4)',fontSize:'13px',fontFamily:"'Inter',sans-serif"}}>{expProgress}% completado · {total} diapositivas</p></div>)}
    {acceptOpen&&<AcceptModal empresa={data.empresa} defaultServicios={['ia']} onConfirm={f=>{onAccept({...f,proposalType:'ia',proposalData:data});setAcceptOpen(false);setToast('¡Cliente creado correctamente!');}} onClose={()=>setAcceptOpen(false)}/>}
    </>
  );
}

/* ── AI FORM VIEW ── */
function AIFormView({initial,editingId,onGenerate,onLibrary,savedCount,onHome}){
  const EMPTY={empresa:'',desafio:'',objetivo:'',pkgs:[],appPrecioImpl:'',fidelizacionClientes:'<=500'};
  const [f,setF]=useState(initial||EMPTY);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const togglePkg=id=>setF(p=>({...p,pkgs:p.pkgs.includes(id)?p.pkgs.filter(x=>x!==id):[...p.pkgs,id]}));
  const hasApp=(f.pkgs||[]).includes('app');
  const hasFidel=(f.pkgs||[]).includes('fidelizacion');
  const pricing=calcAIPrice(f.pkgs||[],f.appPrecioImpl||'',f.fidelizacionClientes||'<=500');
  const submit=()=>{
    if(!f.empresa||!f.desafio||!f.objetivo){alert('Los campos empresa, desafío y objetivo son obligatorios.');return;}
    if(!f.pkgs||f.pkgs.length===0){alert('Selecciona al menos un paquete.');return;}
    onGenerate(buildAIProposal(f),editingId);
  };

    <div style={{minHeight:'100vh',background:'#080808',paddingBottom:'60px'}}>

            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
              <div style={{width:'22px',height:'22px',background:AI_A,borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="2.5" fill="#000"/><path d="M6 1v2M6 9v2M1 6h2M9 6h2" stroke="#000" strokeWidth="1.2" strokeLinecap="round"/></svg>
              </div>
              <span style={{fontSize:'13px',fontWeight:'700',color:'#fff',letterSpacing:'-.01em'}}>Propuestas IA</span>
            </div>
          </div>
          <button className="btn-icon" onClick={onLibrary}><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M1 3h12M1 7h12M1 11h8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>Propuestas guardadas{savedCount>0&&<span style={{background:'rgba(255,255,255,0.1)',borderRadius:'100px',padding:'1px 7px',fontSize:'11px'}}>{savedCount}</span>}</button>
        </div>

        {/* Empresa */}
        <div className="glass" style={{padding:'28px'}}>
          <p className="s-head">Información de la Empresa</p>
          <div>
            <label className="lbl">Nombre de la empresa *</label>
            <input className="input-f" value={f.empresa} onChange={set('empresa')} placeholder="Ej. Clínica DentaMax, Restaurante El Patio..."/>
          </div>
        </div>
        {/* Paquetes */}
        <div className="glass" style={{padding:'28px'}}>
          <p className="s-head">Paquetes a contratar *</p>

                  <button key={v} onClick={()=>setF(p=>({...p,fidelizacionClientes:v}))}
                    style={{padding:'8px 20px',background:f.fidelizacionClientes===v?'rgba(74,222,128,0.15)':'rgba(255,255,255,0.03)',border:`1px solid ${f.fidelizacionClientes===v?'rgba(74,222,128,0.5)':'rgba(255,255,255,0.1)'}`,borderRadius:'4px',cursor:'pointer',fontSize:'12.5px',color:f.fidelizacionClientes===v?'#4ade80':'rgba(255,255,255,0.4)',fontFamily:"'Inter',sans-serif",fontWeight:'600'}}>
                    {v==='<=500'?'≤ 500 clientes':'> 500 clientes'} — {v==='<=500'?'150':'250'}€/mes

          <div>

          </div>
        </div>
        {/* Price summary */}
        {(f.pkgs||[]).length>0&&(

            <p style={{fontSize:'10.5px',fontWeight:'700',color:AI_A,letterSpacing:'.1em',textTransform:'uppercase',fontFamily:"'Inter',sans-serif",marginBottom:'8px'}}>Resumen de inversión</p>
            <div style={{display:'flex',gap:'24px',flexWrap:'wrap',alignItems:'baseline'}}>
              <div>
                <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif",marginBottom:'2px'}}>Implementación</p>
                <p style={{fontSize:'22px',fontWeight:'800',color:AI_A,fontFamily:"'Playfair Display',serif",lineHeight:'1'}}>{pricing.impl>0?pricing.impl.toLocaleString('es-ES')+'€':'A medida'}</p>
              </div>
              {pricing.monthly>0&&<div>
                <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif",marginBottom:'2px'}}>Mantenimiento mensual</p>
                <p style={{fontSize:'18px',fontWeight:'700',color:'rgba(255,255,255,0.6)',fontFamily:"'Playfair Display',serif",lineHeight:'1'}}>{pricing.monthly.toLocaleString('es-ES')}€/mes</p>

        </div>
      </div>
    </div>
  );
}

/* ── AI LIBRARY VIEW ── */
function AILibraryView({saved:savedProp,onView,onEdit,onDelete,onNew,onHome}){
  const [saved,setSaved]=useState(savedProp);
  const duplicateProp=(s)=>{
    const copy={...s,id:Date.now().toString()+Math.random().toString(36).slice(2,5),empresa:s.empresa+' (Copia)',fechaGuardado:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),status:''};
    if(copy.formData) copy.formData={...copy.formData,empresa:copy.empresa};
    const updated=[...saved,copy];
    setSaved(updated);
    ai_storage.save(updated);
  };
  const PROP_STATUS=[{k:'',l:'Sin estado',c:'rgba(255,255,255,0.2)'},{k:'enviada',l:'Enviada',c:'#fb923c'},{k:'vista',l:'Vista',c:'#38bdf8'},{k:'aceptada',l:'Aceptada ✓',c:'#4ade80'},{k:'rechazada',l:'Rechazada',c:'#f87171'}];
  const updateStatus=(id,status)=>{
    const updated=saved.map(s=>s.id===id?{...s,status}:s);
    setSaved(updated);
    ai_storage.save(updated);
  };
  const [openStatusId,setOpenStatusId]=useState(null);
  useEffect(()=>{
    if(!openStatusId) return;
    const h=()=>setOpenStatusId(null);
    document.addEventListener('click',h);
    return()=>document.removeEventListener('click',h);
  },[openStatusId]);
  return(
    <div style={{minHeight:'100vh',background:'#080808',paddingBottom:'60px'}}>
      <div style={{maxWidth:'800px',margin:'0 auto',padding:'44px 28px 28px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'32px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
            <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={onHome}>← Inicio</button>
            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
              <div style={{width:'22px',height:'22px',background:AI_A,borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="2.5" fill="#000"/><path d="M6 1v2M6 9v2M1 6h2M9 6h2" stroke="#000" strokeWidth="1.2" strokeLinecap="round"/></svg>
              </div>
              <span style={{fontSize:'13px',fontWeight:'700',color:'#fff',letterSpacing:'-.01em'}}>Propuestas IA</span>
            </div>
          </div>
          <button className="btn-main" onClick={onNew} style={{padding:'10px 22px',fontSize:'13px'}}>+ Nueva propuesta IA</button>
        </div>
        <h1 style={{fontSize:'26px',fontWeight:'800',letterSpacing:'-.03em',color:'#fff',marginBottom:'6px'}}>Propuestas de IA guardadas</h1>
        <p style={{fontSize:'13.5px',color:'#444',marginBottom:'32px'}}>{saved.length===0?'No hay propuestas guardadas aún.':saved.length+' propuesta'+(saved.length>1?'s':'')}</p>
        {saved.length===0?(
          <div style={{textAlign:'center',padding:'60px 20px',color:'#333',fontSize:'14px'}}>
            <div style={{width:'40px',height:'40px',background:`rgba(56,189,248,0.08)`,border:`1px solid rgba(56,189,248,0.2)`,borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}><svg width="18" height="18" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="2.5" stroke={AI_A} strokeWidth="1.2"/><path d="M6 1v2M6 9v2M1 6h2M9 6h2" stroke={AI_A} strokeWidth="1" strokeLinecap="round"/></svg></div>
            <p>Genera tu primera propuesta de IA y guárdala aquí.</p>
          </div>
        ):(
          <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
            {[...saved].reverse().map(s=>{
              const st=PROP_STATUS.find(x=>x.k===(s.status||''))||PROP_STATUS[0];
              return(
              <div key={s.id} className="lib-card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'16px'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'6px',flexWrap:'wrap'}}>
                      <p style={{fontSize:'16px',fontWeight:'700',color:'#fff'}}>{s.empresa}</p>
                      <span className="tag" style={{color:AI_A,borderColor:`rgba(56,189,248,0.25)`,background:'rgba(56,189,248,0.06)'}}>IA</span>
                      {(s.pkgs||[s.pkg]).filter(Boolean).map(id=>{const p=AI_PKGS.find(x=>x.id===id);return p?<span key={id} className="tag" style={{color:p.color,borderColor:p.color+'33',background:p.color+'0d'}}>{p.name}</span>:null;})}
                      <div style={{position:'relative'}} onClick={e=>e.stopPropagation()}>
                        <div onClick={()=>setOpenStatusId(openStatusId===s.id?null:s.id)} style={{display:'flex',alignItems:'center',gap:'5px',padding:'3px 10px',borderRadius:'100px',border:`1px solid ${st.c}44`,background:`${st.c}12`,cursor:'pointer',userSelect:'none'}}>
                          <span style={{fontSize:'11px',fontWeight:'600',color:st.c,fontFamily:"'Inter',sans-serif"}}>{st.l||'Estado'}</span>
                          <svg width="8" height="8" viewBox="0 0 10 10" fill="none"><path d="M2 3.5l3 3 3-3" stroke={st.c} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </div>
                        {openStatusId===s.id&&(
                          <div style={{position:'absolute',left:0,top:'calc(100% + 4px)',zIndex:200,background:'#1c1c1c',border:'1px solid rgba(255,255,255,0.12)',borderRadius:'10px',padding:'6px',minWidth:'150px',boxShadow:'0 12px 40px rgba(0,0,0,0.7)'}}>
                            {PROP_STATUS.map(opt=>(
                              <div key={opt.k} onClick={()=>{updateStatus(s.id,opt.k);setOpenStatusId(null);}}
                                style={{padding:'8px 12px',borderRadius:'7px',cursor:'pointer',fontSize:'12.5px',fontFamily:"'Inter',sans-serif",color:opt.k===(s.status||'')?'#fff':'rgba(255,255,255,0.45)',background:opt.k===(s.status||'')?'rgba(255,255,255,0.07)':'transparent',display:'flex',alignItems:'center',gap:'8px'}}
                                onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.05)'}
                                onMouseLeave={e=>e.currentTarget.style.background=opt.k===(s.status||'')?'rgba(255,255,255,0.07)':'transparent'}>
                                <span style={{width:'8px',height:'8px',borderRadius:'50%',background:opt.c,flexShrink:0,display:'inline-block'}}/>
                                {opt.l}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                    <span style={{fontSize:'12px',color:'#333'}}>{s.fechaGuardado||s.fecha}</span>
                  </div>
                  <div style={{display:'flex',gap:'8px',flexShrink:0}}>
                    <button className="btn-icon" onClick={()=>onView(s)}>Ver</button>
                    <button className="btn-icon" onClick={()=>onEdit(s)}>Editar</button>
                    <button className="btn-icon" onClick={()=>duplicateProp(s)} title="Duplicar propuesta">⎘</button>
                    <button className="btn-danger" onClick={()=>onDelete(s.id)}>Eliminar</button>
                  </div>
                </div>
              </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function clientHealth(c){
  // Returns {score:0-100, label, color, signals:[]}
  let score=0;
  const signals=[];
  const now=new Date();
  // Status weight (40 pts)
  const statusPts={Lead:5,'Propuesta enviada':15,'Propuesta aceptada':25,Activo:40,Finalizado:30};
  score+=statusPts[c.estado]||0;
  // Contract value (10 pts)
  if((c.montoContrato||0)>0){score+=10;signals.push('Contrato con valor');}
  // Contract expiry (-15 if expired, -5 if <30d)
  if(c.fechaVencimiento){
    const days=Math.round((new Date(c.fechaVencimiento)-now)/(1000*60*60*24));
    if(days<0){score-=15;signals.push('Contrato vencido');}
    else if(days<30){score-=5;signals.push(`Vence en ${days}d`);}
  }
  // Has contact info (5 pts)
  if(c.correo||c.telefono){score+=5;signals.push('Datos de contacto');}
  // Recent notes (10 pts if note in last 30d)
  const recentNote=(c.notas||[]).some(n=>{try{const d=new Date(n.fecha);return(now-d)<30*24*60*60*1000;}catch{return false;}});
  if(recentNote){score+=10;signals.push('Nota reciente');}
  // Completed tasks (5 pts if any)
  if((c.tareas||[]).some(t=>t.completada)){score+=5;signals.push('Tareas completadas');}
  // Overdue tasks (-10 each, max -20)
  const overdueTasks=(c.tareas||[]).filter(t=>!t.completada&&t.fechaLimite&&new Date(t.fechaLimite)<now);
  if(overdueTasks.length>0){const penalty=Math.min(20,overdueTasks.length*10);score-=penalty;signals.push(`${overdueTasks.length} tarea${overdueTasks.length>1?'s':''} vencida${overdueTasks.length>1?'s':''}`);}
  // Follow-up set (5 pts)
  if(c.followUpDate&&new Date(c.followUpDate)>=now){score+=5;signals.push('Follow-up agendado');}
  // Clamp 0-100
  score=Math.max(0,Math.min(100,score));
  const label=score>=80?'Excelente':score>=60?'Bueno':score>=40?'Regular':score>=20?'Bajo':'Crítico';
  const color=score>=80?'#4ade80':score>=60?'#a3e635':score>=40?'#fbbf24':score>=20?'#fb923c':'#f87171';
  return{score,label,color,signals};
}

function lastInteraction(c){
  const now=new Date();
  const dates=[];
  (c.notas||[]).forEach(n=>{try{dates.push(new Date(n.fecha));}catch{}});
  (c.historial||[]).forEach(h=>{try{dates.push(new Date(h.fecha));}catch{}});
  (c.tareas||[]).filter(t=>t.completada&&t.createdAt).forEach(t=>{try{dates.push(new Date(t.createdAt));}catch{}});
  if(!dates.length) return null;
  const latest=new Date(Math.max(...dates.map(d=>d.getTime())));
  const days=Math.round((now-latest)/(1000*60*60*24));
  const label=days===0?'Hoy':days===1?'Ayer':`${days}d`;
  const color=days<=7?'#4ade80':days<=30?'#fbbf24':'#f87171';
  const bg=days<=7?'rgba(74,222,128,0.08)':days<=30?'rgba(251,191,36,0.08)':'rgba(248,113,113,0.08)';
  const border=days<=7?'rgba(74,222,128,0.2)':days<=30?'rgba(251,191,36,0.2)':'rgba(248,113,113,0.2)';
  return{days,label,color,bg,border};
}

/* ── Project Checklist ── */
function ProjectChecklist({project,onUpdate}){
  const ITEMS=[
    {key:'brief',label:'Brief recibido'},
    {key:'prompt',label:'Prompt generado'},
    {key:'diseño',label:'Diseño iniciado'},
    {key:'diseñoAprobado',label:'Diseño aprobado'},
    {key:'desarrollo',label:'Desarrollo iniciado'},
    {key:'desarrolloFinalizado',label:'Desarrollo finalizado'},
    {key:'entregado',label:'Entregado'},
  ];
  const done=ITEMS.filter(i=>project.checklist[i.key]).length;
  const pct=Math.round((done/ITEMS.length)*100);
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
        <p style={{fontSize:'11.5px',fontWeight:'700',color:'rgba(255,255,255,0.4)',letterSpacing:'.08em',textTransform:'uppercase',fontFamily:"'Inter',sans-serif"}}>Checklist del Proyecto</p>
        <span style={{fontSize:'11px',color:CL_A,fontWeight:'700',fontFamily:"'Inter',sans-serif"}}>{done}/{ITEMS.length} · {pct}%</span>
      </div>
      <div style={{height:'3px',background:'rgba(255,255,255,0.06)',borderRadius:'2px',marginBottom:'14px'}}>
        <div style={{height:'3px',background:`linear-gradient(90deg,${CL_A},#a3e635)`,borderRadius:'2px',width:`${pct}%`,transition:'width .4s'}}/>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
        {ITEMS.map((item,idx)=>{
          const checked=project.checklist[item.key];
          const prevDone=idx===0||project.checklist[ITEMS[idx-1].key];
          return(
            <div key={item.key} onClick={()=>prevDone&&onUpdate(item.key,!checked)}
              style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 10px',background:checked?'rgba(74,222,128,0.06)':'rgba(255,255,255,0.02)',border:`1px solid ${checked?'rgba(74,222,128,0.2)':'rgba(255,255,255,0.05)'}`,borderRadius:'7px',cursor:prevDone?'pointer':'not-allowed',opacity:!prevDone&&!checked?0.4:1,transition:'all .15s'}}>
              <div style={{width:'16px',height:'16px',borderRadius:'4px',border:`1.5px solid ${checked?CL_A:'rgba(255,255,255,0.2)'}`,background:checked?CL_A:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                {checked&&<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="#000" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </div>
              <span style={{fontSize:'12.5px',color:checked?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.45)',fontFamily:"'Inter',sans-serif",textDecoration:checked?'none':'none'}}>{item.label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

                  <div key={r.l} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 14px',background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'8px'}}>

                    {r.copy&&<button onClick={(e)=>{copyText(r.v);const b=e.currentTarget;const prev=b.textContent;b.textContent='✓';setTimeout(()=>{b.textContent=prev;},1500);}} style={{padding:'5px 12px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'6px',color:'rgba(255,255,255,0.4)',fontSize:'11px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>Copiar</button>}
                  </div>
                ))}
              </div>
              <div style={{padding:'14px',background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'8px'}}>
                <p style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif",lineHeight:'1.6'}}>El cliente verá únicamente los módulos correspondientes a sus servicios contratados: <strong style={{color:'rgba(255,255,255,0.6)'}}>{client.servicios.map(s=>SVC_LABELS[s]||s).join(', ')||'ninguno'}</strong></p>
              </div>
            </div>
          </div>
        )}

        {/* NOTAS TAB */}
        {tab==='notas'&&(()=>{
          const notas=client.notas||[];
          const TIPOS={nota:{l:'Nota',c:'#a78bfa',emoji:'📝'},llamada:{l:'Llamada',c:'#34d399',emoji:'📞'},reunion:{l:'Reunión',c:'#38bdf8',emoji:'🤝'},email:{l:'Email',c:'#fb923c',emoji:'📧'}};
          const addNota=()=>{
            if(!notaText.trim()) return;
            const now=new Date();
            const fechaStr=now.toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
            const fechaHistStr=now.toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'});
            const nuevaNota={id:Date.now().toString(),texto:notaText.trim(),tipo:notaTipo,autor:currentUser?.nombre||'Admin',fecha:fechaStr};
            const tipoLabel=TIPOS[notaTipo]?.l||notaTipo;
            const entry={fecha:fechaHistStr,tipo:'nota',descripcion:`✎ ${tipoLabel}: "${notaText.trim().slice(0,60)}${notaText.trim().length>60?'…':''}"`};
            const updated={...client,notas:[nuevaNota,...notas],historial:[...(client.historial||[]),entry]};
            onUpdate(updated);
            setNotaText('');
          };
          const deleteNota=id=>{if(!confirm('¿Eliminar esta nota?'))return;onUpdate({...client,notas:notas.filter(n=>n.id!==id)});};
          return(
            <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
              <div className="glass" style={{padding:'24px'}}>
                <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'16px',fontFamily:"'Inter',sans-serif"}}>Nueva Nota</p>
                <div style={{display:'flex',gap:'8px',marginBottom:'12px'}}>
                  {Object.entries(TIPOS).map(([k,v])=>(
                    <button key={k} onClick={()=>setNotaTipo(k)} style={{padding:'6px 12px',background:notaTipo===k?`${v.c}22`:'rgba(255,255,255,0.04)',border:`1px solid ${notaTipo===k?v.c:'rgba(255,255,255,0.1)'}`,borderRadius:'8px',color:notaTipo===k?v.c:'rgba(255,255,255,0.4)',fontSize:'12px',cursor:'pointer',fontFamily:"'Inter',sans-serif",transition:'all .15s'}}>
                      {v.emoji} {v.l}
                    </button>
                  ))}
                </div>
                <textarea value={notaText} onChange={e=>setNotaText(e.target.value)} placeholder="Escribe una nota, resumen de llamada, acuerdo de reunión..." rows={3}

                  onKeyDown={e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();addNota();}}}/>
                <div style={{display:'flex',justifyContent:'flex-end'}}>
                  <button onClick={addNota} style={{padding:'8px 20px',background:`linear-gradient(135deg,${GL_P2},${GL_P})`,border:'none',borderRadius:'8px',color:'#fff',fontSize:'13px',fontWeight:'700',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>+ Guardar nota</button>
                </div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
                {notas.length===0?<p style={{fontSize:'13px',color:'rgba(255,255,255,0.25)',padding:'20px',textAlign:'center',fontFamily:"'Inter',sans-serif"}}>Sin notas aún. Agrega la primera.</p>:
                notas.map(n=>{
                  const t=TIPOS[n.tipo]||TIPOS.nota;
                  return(
                    <div key={n.id} className="glass" style={{padding:'18px 20px',borderLeft:`3px solid ${t.c}`}}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                          <span style={{fontSize:'11px',padding:'2px 8px',background:`${t.c}22`,border:`1px solid ${t.c}55`,borderRadius:'4px',color:t.c,fontFamily:"'Inter',sans-serif",fontWeight:'600'}}>{t.emoji} {t.l}</span>
                          <span style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif"}}>{n.autor}</span>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                          <span style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',fontFamily:"'Inter',sans-serif"}}>{n.fecha}</span>
                          {isAdmin&&<button onClick={()=>deleteNota(n.id)} style={{background:'none',border:'none',color:'rgba(255,255,255,0.2)',cursor:'pointer',fontSize:'14px',padding:'0',lineHeight:1}} title="Eliminar">×</button>}
                        </div>
                      </div>
                      <p style={{fontSize:'13.5px',color:'rgba(255,255,255,0.75)',lineHeight:'1.65',fontFamily:"'Inter',sans-serif",whiteSpace:'pre-wrap'}}>{n.texto}</p>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* TAREAS TAB */}
        {tab==='tareas'&&(()=>{
          const tareas=client.tareas||[];
          const PRIO={alta:{l:'Alta',c:'#f87171'},media:{l:'Media',c:'#fbbf24'},baja:{l:'Baja',c:'#34d399'}};
          const addTarea=()=>{
            if(!tareaForm.titulo.trim()) return;
            const nueva={id:Date.now().toString(),...tareaForm,completada:false,createdAt:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'})};
            const now=new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'});
            const entry={fecha:now,tipo:'tarea',descripcion:`📋 Nueva tarea creada: "${tareaForm.titulo}"`};
            onUpdate({...client,tareas:[nueva,...tareas],historial:[...(client.historial||[]),entry]});
            setTareaForm({titulo:'',prioridad:'media',fechaLimite:'',responsable:''});
            setAddingTarea(false);
          };
          const toggleTarea=id=>{
            const t=tareas.find(x=>x.id===id);if(!t)return;
            const now=new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'});
            const newCompletada=!t.completada;
            const newTareas=tareas.map(x=>x.id===id?{...x,completada:newCompletada}:x);
            const entry=newCompletada?{fecha:now,tipo:'tarea',descripcion:`✅ Tarea completada: "${t.titulo}"`}:null;
            const newHist=entry?[...(client.historial||[]),entry]:(client.historial||[]);
            onUpdate({...client,tareas:newTareas,historial:newHist});
          };
          const deleteTarea=id=>{if(!confirm('¿Eliminar tarea?'))return;onUpdate({...client,tareas:tareas.filter(t=>t.id!==id)});};
          const pendientes=tareas.filter(t=>!t.completada);
          const completadas=tareas.filter(t=>t.completada);
          return(
            <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{display:'flex',gap:'12px'}}>
                  <span style={{fontSize:'13px',color:'rgba(255,255,255,0.5)',fontFamily:"'Inter',sans-serif"}}><span style={{color:'#fbbf24',fontWeight:'700'}}>{pendientes.length}</span> pendientes</span>
                  <span style={{fontSize:'13px',color:'rgba(255,255,255,0.5)',fontFamily:"'Inter',sans-serif"}}><span style={{color:'#34d399',fontWeight:'700'}}>{completadas.length}</span> completadas</span>
                </div>
                <button onClick={()=>setAddingTarea(!addingTarea)} style={{padding:'8px 16px',background:`linear-gradient(135deg,${GL_P2},${GL_P})`,border:'none',borderRadius:'8px',color:'#fff',fontSize:'12px',fontWeight:'700',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>+ Nueva tarea</button>
              </div>
              {addingTarea&&(
                <div className="glass" style={{padding:'20px'}}>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'12px'}}>
                    <div style={{gridColumn:'1/-1'}}>
                      <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',display:'block',marginBottom:'5px',fontFamily:"'Inter',sans-serif"}}>Título de la tarea *</label>
                      <input value={tareaForm.titulo} onChange={e=>setTareaForm(p=>({...p,titulo:e.target.value}))} placeholder="Ej: Enviar propuesta de renovación"
                        style={{width:'100%',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',padding:'9px 12px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none',boxSizing:'border-box'}}/>
                    </div>
                    <div>
                      <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',display:'block',marginBottom:'5px',fontFamily:"'Inter',sans-serif"}}>Prioridad</label>
                      <select value={tareaForm.prioridad} onChange={e=>setTareaForm(p=>({...p,prioridad:e.target.value}))}
                        style={{width:'100%',background:'#1a1a1a',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',padding:'9px 12px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none'}}>
                        <option value="alta">🔴 Alta</option><option value="media">🟡 Media</option><option value="baja">🟢 Baja</option>
                      </select>
                    </div>
                    <div>
                      <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',display:'block',marginBottom:'5px',fontFamily:"'Inter',sans-serif"}}>Fecha límite</label>
                      <input type="date" value={tareaForm.fechaLimite} onChange={e=>setTareaForm(p=>({...p,fechaLimite:e.target.value}))}
                        style={{width:'100%',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',padding:'9px 12px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none',boxSizing:'border-box'}}/>
                    </div>
                    <div style={{gridColumn:'1/-1'}}>
                      <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',display:'block',marginBottom:'5px',fontFamily:"'Inter',sans-serif"}}>Responsable</label>
                      <input value={tareaForm.responsable} onChange={e=>setTareaForm(p=>({...p,responsable:e.target.value}))} placeholder="Nombre del responsable"
                        style={{width:'100%',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',padding:'9px 12px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none',boxSizing:'border-box'}}/>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:'8px',justifyContent:'flex-end'}}>
                    <button onClick={()=>setAddingTarea(false)} style={{padding:'8px 14px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.4)',fontSize:'12px',cursor:'pointer'}}>Cancelar</button>
                    <button onClick={addTarea} style={{padding:'8px 18px',background:`linear-gradient(135deg,${GL_P2},${GL_P})`,border:'none',borderRadius:'8px',color:'#fff',fontSize:'12px',fontWeight:'700',cursor:'pointer'}}>Crear tarea</button>
                  </div>
                </div>
              )}
              {pendientes.length>0&&(
                <div>
                  <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'10px',fontFamily:"'Inter',sans-serif"}}>Pendientes</p>

                    {pendientes.map(t=>{
                      const p=PRIO[t.prioridad]||PRIO.media;
