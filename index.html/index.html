/* ── GLOBAL SEARCH ── */
function GlobalSearch({onClose,onNavigate}){
  const [q,setQ]=useState('');
  const [activeIdx,setActiveIdx]=useState(0);
  const inputRef=useRef(null);
  const listRef=useRef(null);
  useEffect(()=>{inputRef.current?.focus();},[]);
  useEffect(()=>{setActiveIdx(0);},[q]);

  const results=React.useMemo(()=>{
    if(!q.trim()||q.length<2) return null;
    const lq=q.toLowerCase();
    const allClients=clients_storage.load();
    // Clients matching by name/contact/email
    const clients=allClients.filter(c=>c.empresa.toLowerCase().includes(lq)||(c.contacto||'').toLowerCase().includes(lq)||(c.correo||'').toLowerCase().includes(lq)).slice(0,6);
    // Tasks matching title
    const tasks=allClients.flatMap(c=>(c.tareas||[]).filter(t=>t.titulo&&t.titulo.toLowerCase().includes(lq)&&!t.completada).map(t=>({...t,_empresa:c.empresa,_clientId:c.id}))).slice(0,4);
    // Notes matching text
    const notes=allClients.flatMap(c=>(c.notas||[]).filter(n=>n.texto&&n.texto.toLowerCase().includes(lq)).map(n=>({...n,_empresa:c.empresa,_clientId:c.id}))).slice(0,3);
    const mktProps=storage.load().filter(p=>(p.empresa||'').toLowerCase().includes(lq)||(p.clientName||'').toLowerCase().includes(lq)).slice(0,3);
    const aiProps=ai_storage.load().filter(p=>(p.empresa||'').toLowerCase().includes(lq)).slice(0,3);
    return{clients,tasks,notes,mktProps,aiProps};
  },[q]);

  // Build flat list of all items for keyboard nav
  const allItems=React.useMemo(()=>{
    if(!results) return [];
    const items=[];
    results.clients.forEach(c=>items.push({type:'client',data:c,label:c.empresa,sub:`${c.contacto||c.correo||''}${c.estado?' · '+c.estado:''}`,accent:CL_A,icon:(c.empresa[0]||'C').toUpperCase(),action:()=>onNavigate('clients',c.id)}));
    results.tasks.forEach(t=>items.push({type:'task',data:t,label:t.titulo,sub:`Tarea · ${t._empresa}${t.prioridad?' · '+t.prioridad:''}`,accent:'#38bdf8',icon:'☑',action:()=>onNavigate('clients',t._clientId)}));
    results.notes.forEach(n=>items.push({type:'note',data:n,label:n.texto.slice(0,60)+(n.texto.length>60?'…':''),sub:`Nota · ${n._empresa}`,accent:'#fbbf24',icon:'✎',action:()=>onNavigate('clients',n._clientId)}));
    results.mktProps.forEach(p=>items.push({type:'mkt',data:p,label:p.empresa||p.clientName||'Propuesta',sub:`Marketing · ${p.fecha||''}`,accent:WARM,icon:(p.empresa||'M')[0].toUpperCase(),action:()=>onNavigate('marketing')}));
    results.aiProps.forEach(p=>items.push({type:'ai',data:p,label:p.empresa||'Propuesta IA',sub:`IA · ${p.fecha||''}`,accent:AI_A,icon:(p.empresa||'I')[0].toUpperCase(),action:()=>onNavigate('ia')}));
    return items;
  },[results]);

  useEffect(()=>{
    const h=e=>{
      if(e.key==='Escape'){onClose();return;}
      if(e.key==='ArrowDown'){e.preventDefault();setActiveIdx(i=>Math.min(i+1,allItems.length-1));}
      if(e.key==='ArrowUp'){e.preventDefault();setActiveIdx(i=>Math.max(i-1,0));}
      if(e.key==='Enter'&&allItems[activeIdx]){allItems[activeIdx].action();onClose();}
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[allItems,activeIdx]);

  // Auto-scroll active item into view
  useEffect(()=>{
    const el=listRef.current?.querySelector(`[data-idx="${activeIdx}"]`);
    el?.scrollIntoView({block:'nearest'});
  },[activeIdx]);

  const total=allItems.length;
  const Section=({title})=><p style={{fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.2)',letterSpacing:'.1em',textTransform:'uppercase',padding:'14px 20px 4px',fontFamily:"'Inter',sans-serif"}}>{title}</p>;

  // Render items grouped by type
  const renderItems=(type,sectionTitle)=>{
    const group=allItems.filter(it=>it.type===type);
    if(!group.length) return null;
    const startIdx=allItems.findIndex(it=>it.type===type);
    return(<>
      <Section title={sectionTitle}/>
      {group.map((it,i)=>{
        const idx=startIdx+i;
        const isActive=idx===activeIdx;
        return(
          <div key={idx} data-idx={idx} onClick={()=>{it.action();onClose();}} onMouseEnter={()=>setActiveIdx(idx)}
            style={{display:'flex',alignItems:'center',gap:'12px',padding:'10px 20px',cursor:'pointer',background:isActive?'rgba(255,255,255,0.07)':'transparent',transition:'background .08s'}}>
            <div style={{width:'30px',height:'30px',borderRadius:'8px',background:`${it.accent}18`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontSize:'12px',fontWeight:'800',color:it.accent}}>{it.icon}</span>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <p style={{fontSize:'13px',fontWeight:'600',color:'#fff',fontFamily:"'Inter',sans-serif",overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.label}</p>
              {it.sub&&<p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif",overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.sub}</p>}
            </div>
            {isActive&&<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5h6M6 3l2 2-2 2" stroke="rgba(255,255,255,0.4)" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </div>
        );
      })}
    </>);
  };

  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.72)',zIndex:9000,display:'flex',alignItems:'flex-start',justifyContent:'center',paddingTop:'100px',backdropFilter:'blur(10px)'}}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:'540px',background:'#141414',border:'1px solid rgba(255,255,255,0.13)',borderRadius:'16px',overflow:'hidden',boxShadow:'0 24px 80px rgba(0,0,0,0.9)',fontFamily:"'Inter',sans-serif"}}>
        <div style={{display:'flex',alignItems:'center',gap:'12px',padding:'14px 20px',borderBottom:'1px solid rgba(255,255,255,0.07)'}}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="2.2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar clientes, tareas, notas, propuestas…" style={{flex:1,background:'transparent',border:'none',outline:'none',color:'#fff',fontSize:'15px',fontFamily:"'Inter',sans-serif"}}/>
          <kbd style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'4px',padding:'2px 7px',fontFamily:'monospace'}}>esc</kbd>
        </div>
        <div ref={listRef} style={{maxHeight:'460px',overflowY:'auto'}}>
          {!results&&<p style={{padding:'36px',textAlign:'center',fontSize:'13px',color:'rgba(255,255,255,0.18)'}}>Escribe al menos 2 caracteres para buscar…</p>}
          {results&&total===0&&<p style={{padding:'36px',textAlign:'center',fontSize:'13px',color:'rgba(255,255,255,0.18)'}}>Sin resultados para <em>"{q}"</em></p>}
          {results&&<>
            {renderItems('client','Clientes')}
            {renderItems('task','Tareas pendientes')}
            {renderItems('note','Notas')}
            {renderItems('mkt','Propuestas Marketing')}
            {renderItems('ai','Propuestas IA')}
          </>}
          <div style={{height:'8px'}}/>
        </div>
        <div style={{borderTop:'1px solid rgba(255,255,255,0.06)',padding:'10px 20px',display:'flex',gap:'16px'}}>
          <span style={{fontSize:'10.5px',color:'rgba(255,255,255,0.18)'}}>↑↓ navegar · ↵ abrir · esc cerrar</span>
          {results&&total>0&&<span style={{fontSize:'10.5px',color:'rgba(255,255,255,0.18)'}}>{total} resultado{total!==1?'s':''}</span>}
          <span style={{fontSize:'10.5px',color:'rgba(255,255,255,0.18)',marginLeft:'auto'}}>⌘K</span>
        </div>
      </div>
    </div>
  );
}

  /* ── CLIENT MODE: public web briefing form ── */
  if(clientMode){
    if(clientView==='result'&&clientForm) return <ClientBriefingView form={clientForm} onNew={()=>{setClientForm(null);setClientView('form');}}/>;
    return <ClientWebForm onSubmit={f=>{setClientForm(f);setClientView('result');}}/>;
  }

  /* ── INTERNAL: require auth ── */
  if(!currentUser) return <LoginScreen onLogin={doLogin}/>;
  const isAdmin=currentUser.role==='admin';

  /* ── Shared: create client from accepted proposal ── */
  const handleAcceptProposal=({contacto,correo,servicios,proposalType,proposalData})=>{
    const cliente=makeClient({empresa:proposalData?.empresa||'Cliente',contacto,correo,servicios,proposalType,proposalData,asignadoA:isAdmin?null:currentUser.id});
    const all=clients_storage.load();
    clients_storage.save([...all,cliente]);
  };

  /* ── MARKETING handlers ── */
  const persist=list=>{setSaved(list);storage.save(list);};
  const handleGenerate=(data,eid)=>{setProposal(data);setSavedId(eid||null);setView('deck');};
  const handleSave=(data)=>{
    const id=editingId||savedId||Date.now().toString();
    const rec={id,empresa:data.empresa,clientName:data.clientName,sector:data.sector,fecha:data.fecha,fechaGuardado:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),planes:data.planes,resolvedPlan:data.resolvedPlan,formData:{...data},creadoPor:currentUser?.id||'admin'};
    const ex=saved.find(s=>s.id===id);
    persist(ex?saved.map(s=>s.id===id?rec:s):[...saved,rec]);
    setSavedId(id);
  };
  const handleEdit=data=>{setFormData({...data});setEditingId(savedId);setView('form');};
  const handleLibEdit=s=>{setFormData({...s.formData});setEditingId(s.id);setProposal(null);setSavedId(s.id);setView('form');};
  const handleLibView=s=>{setProposal({...s.formData});setSavedId(s.id);setEditingId(s.id);setView('deck');};
  const handleDelete=id=>{if(!isAdmin){alert('No tienes permiso para eliminar propuestas.');return;}if(!confirm('¿Eliminar esta propuesta?'))return;persist(saved.filter(s=>s.id!==id));};

  /* ── IA handlers ── */
  const iaPersist=list=>{setIaSaved(list);ai_storage.save(list);};
  const iaHandleGenerate=(data,eid)=>{setIaProposal(data);setIaSavedId(eid||null);setIaView('deck');};
  const iaHandleSave=(data)=>{
    const id=iaEditingId||iaSavedId||Date.now().toString();
    const rec={id,empresa:data.empresa,pkgs:data.pkgs||[],fecha:data.fecha,fechaGuardado:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),formData:{...data},creadoPor:currentUser?.id||'admin'};
    const ex=iaSaved.find(s=>s.id===id);
    iaPersist(ex?iaSaved.map(s=>s.id===id?rec:s):[...iaSaved,rec]);
    setIaSavedId(id);
  };
  const iaHandleEdit=data=>{setIaFormData({...data});setIaEditingId(iaSavedId);setIaView('form');};
  const iaHandleLibEdit=s=>{setIaFormData({...s.formData});setIaEditingId(s.id);setIaProposal(null);setIaSavedId(s.id);setIaView('form');};
  const iaHandleLibView=s=>{setIaProposal({...s.formData});setIaSavedId(s.id);setIaEditingId(s.id);setIaView('deck');};
  const iaHandleDelete=id=>{if(!isAdmin){alert('No tienes permiso para eliminar propuestas.');return;}if(!confirm('¿Eliminar esta propuesta?'))return;iaPersist(iaSaved.filter(s=>s.id!==id));};

  /* ── BACKUP helpers ── */
  const BACKUP_KEYS=['propuestas_v2','propuestas_ia_v1',CLIENTS_KEY,EMP_KEY,AUTH_KEY];
  const doExportBackup=()=>{
    const data={version:'glowlabs_backup_v1',fecha:new Date().toISOString(),datos:{}};
    BACKUP_KEYS.forEach(k=>{try{data.datos[k]=JSON.parse(localStorage.getItem(k)||'null');}catch{data.datos[k]=null;}});
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`glowlabs-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const doImportBackup=(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.version||!data.datos) throw new Error('Formato inválido');
        if(!confirm(`¿Restaurar backup del ${new Date(data.fecha).toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}?\n\nEsto reemplazará todos los datos actuales.`)) return;
        Object.entries(data.datos).forEach(([k,v])=>{
          if(v!==null) localStorage.setItem(k,JSON.stringify(v));
        });
        alert('✓ Backup restaurado. La página se va a recargar.');
        window.location.reload();
      }catch(err){alert('Error al leer el backup: '+err.message);}
    };
    reader.readAsText(file);
    e.target.value='';
  };

  /* ── HOME ── */
  if(!module) return(
    <div style={{position:'relative'}}>
      {showSearch&&<GlobalSearch onClose={()=>setShowSearch(false)} onNavigate={(mod,clientId)=>{setModule(mod);if(clientId)setSearchClientId(clientId);setShowSearch(false);}}/>}
      <HomeScreen onSelect={setModule} currentUser={currentUser}/>
      <div style={{position:'fixed',bottom:'18px',right:'18px',display:'flex',gap:'8px',alignItems:'center',zIndex:50}}>
        <span style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',fontFamily:"'Inter',sans-serif"}}>{currentUser.nombre}</span>
        {isAdmin&&(
          <>
            <button onClick={doExportBackup} title="Exportar backup" style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.3)',fontSize:'11px',padding:'7px 12px',cursor:'pointer',fontFamily:"'Inter',sans-serif",display:'flex',alignItems:'center',gap:'5px'}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Backup
            </button>
            <label title="Restaurar backup" style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.3)',fontSize:'11px',padding:'7px 12px',cursor:'pointer',fontFamily:"'Inter',sans-serif",display:'flex',alignItems:'center',gap:'5px'}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Restaurar
              <input type="file" accept=".json" onChange={doImportBackup} style={{display:'none'}}/>
            </label>
          </>
        )}
        <button onClick={doLogout} title="Cerrar sesión" style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.3)',fontSize:'11px',padding:'7px 12px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>
          Salir
        </button>
      </div>
    </div>
  );

  /* ── EMPLOYEES module ── */
  if(module==='equipo'&&isAdmin) return <EmployeeModule onHome={goHome}/>;

  /* ── DASHBOARD module ── */
  if(module==='dashboard'&&isAdmin) return <DashboardModule onHome={goHome}/>;

  /* ── Permission helper for employees ── */
  const empPerms=isAdmin?{marketing:true,ia:true,web:true,clients:true}:(()=>{
    const emp=emp_storage.load().find(e=>e.id===currentUser.id);
    return emp?.permisos||{marketing:true,ia:true,web:true,clients:true};
  })();
  const noAccess=(mod)=>(
    <div style={{minHeight:'100vh',background:GL_BG,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'16px'}}>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" strokeWidth="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <p style={{color:'rgba(255,255,255,0.3)',fontSize:'14px',fontFamily:"'Inter',sans-serif"}}>No tienes permiso para acceder a este módulo.</p>
      <button onClick={goHome} style={{padding:'9px 20px',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.5)',fontSize:'13px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>Volver al inicio</button>
    </div>
  );

  /* ── CLIENTS module ── */
  if(module==='clients'){
    const cid=searchClientId;
    if(cid) setTimeout(()=>setSearchClientId(null),100);
    return empPerms.clients?<ClientsModule key={cid||'cl'} onHome={goHome} currentUser={currentUser} initialClientId={cid}/>:noAccess('clients');
  }

  /* ── MARKETING module ── */
  if(module==='marketing'){
    if(!empPerms.marketing) return noAccess('marketing');
    if(view==='deck'&&proposal) return <ProposalDeck data={proposal} savedId={savedId} onBack={()=>setView('library')} onEdit={handleEdit} onSave={handleSave} isSaved={!!savedId&&saved.some(s=>s.id===savedId)} onAccept={handleAcceptProposal}/>;
    if(view==='library') return <LibraryView saved={saved} onView={handleLibView} onEdit={handleLibEdit} onDelete={handleDelete} onNew={()=>{setFormData(null);setEditingId(null);setProposal(null);setSavedId(null);setView('form');}} onBack={()=>setView('form')} onHome={goHome}/>;
    return <FormView initial={formData} editingId={editingId} onGenerate={handleGenerate} onLibrary={()=>setView('library')} savedCount={saved.length} onHome={goHome}/>;
  }

  /* ── IA module ── */
  if(module==='ia'){
    if(!empPerms.ia) return noAccess('ia');
    if(iaView==='deck'&&iaProposal) return <AIProposalDeck data={iaProposal} savedId={iaSavedId} onBack={()=>setIaView('library')} onEdit={iaHandleEdit} onSave={iaHandleSave} isSaved={!!iaSavedId&&iaSaved.some(s=>s.id===iaSavedId)} onAccept={handleAcceptProposal}/>;
    if(iaView==='library') return <AILibraryView saved={iaSaved} onView={iaHandleLibView} onEdit={iaHandleLibEdit} onDelete={iaHandleDelete} onNew={()=>{setIaFormData(null);setIaEditingId(null);setIaProposal(null);setIaSavedId(null);setIaView('form');}} onHome={goHome}/>;
    return <AIFormView initial={iaFormData} editingId={iaEditingId} onGenerate={iaHandleGenerate} onLibrary={()=>setIaView('library')} savedCount={iaSaved.length} onHome={goHome}/>;
  }

  /* ── WEB module ── */
  if(module==='web'){
    if(!empPerms.web) return noAccess('web');
    if(webView==='prompt'&&webForm) return <WebPromptView form={webForm} onBack={()=>setWebView('form')} onNew={()=>{setWebForm(null);setWebView('form');}}/>;
    return <WebFormView onGenerate={f=>{setWebForm(f);setWebView('prompt');}} onHome={goHome}/>;
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
