                      {entry.proyecto&&<span style={{fontSize:'10px',color:'rgba(255,255,255,0.3)',flexShrink:0}}>· {entry.proyecto}</span>}
                    </div>
                    {entry.descripcion&&<p style={{fontSize:'12px',color:'rgba(255,255,255,0.4)',lineHeight:'1.4',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{entry.descripcion}</p>}
                    <div style={{display:'flex',alignItems:'center',gap:'8px',marginTop:'6px'}}>
                      <span style={{fontSize:'10px',padding:'2px 7px',borderRadius:'100px',background:`${CAT_C[entry.categoria]||'#9ca3af'}18`,color:CAT_C[entry.categoria]||'#9ca3af',fontWeight:'600'}}>{entry.categoria}</span>
                      {isAdmin&&<span style={{fontSize:'10px',color:'rgba(255,255,255,0.25)'}}>{entry.userName}</span>}
                      <span style={{fontSize:'10px',color:'rgba(255,255,255,0.2)'}}>{new Date(entry.fecha+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</span>
                    </div>
                  </div>
                  <button onClick={()=>deleteEntry(entry.id)} style={{all:'unset',cursor:'pointer',padding:'4px',color:'rgba(255,255,255,0.15)',transition:'color .15s'}}
                    onMouseOver={e=>e.currentTarget.style.color='#f87171'} onMouseOut={e=>e.currentTarget.style.color='rgba(255,255,255,0.15)'}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* form modal */}
      {showForm&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300}}>
          <div style={{background:'#111',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'16px',padding:'28px',width:'440px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
              <h3 style={{fontSize:'16px',fontWeight:'700',color:'#fff',margin:0}}>Registrar horas</h3>
              <button className="btn-ghost" style={{padding:'4px 8px',fontSize:'11px'}} onClick={()=>setShowForm(false)}>✕</button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
              <div style={{display:'flex',gap:'12px'}}>
                <div style={{flex:1}}><label className="lbl">Cliente *</label>
                  <select className="input-f" value={form.clienteId} onChange={e=>setForm({...form,clienteId:e.target.value})}>
                    <option value="">Selecciona cliente</option>
                    {allClients.map(c=><option key={c.id} value={c.id}>{c.empresa||c.nombre}</option>)}
                  </select></div>
                <div style={{flex:1}}><label className="lbl">Horas *</label>
                  <input className="input-f" type="number" step="0.25" min="0.25" max="24" placeholder="ej: 2.5" value={form.horas} onChange={e=>setForm({...form,horas:e.target.value})}/></div>
              </div>
              <div><label className="lbl">Proyecto / tarea</label>
                <input className="input-f" placeholder="ej: Contenido Instagram" value={form.proyecto} onChange={e=>setForm({...form,proyecto:e.target.value})}/></div>
              <div><label className="lbl">Descripción</label>
                <textarea className="input-f" placeholder="¿Qué hiciste?" value={form.descripcion} onChange={e=>setForm({...form,descripcion:e.target.value})} rows={2} style={{resize:'none'}}/></div>
              <div style={{display:'flex',gap:'12px'}}>
                <div style={{flex:1}}><label className="lbl">Categoría</label>
                  <select className="input-f" value={form.categoria} onChange={e=>setForm({...form,categoria:e.target.value})}>
                    {CATS.map(c=><option key={c}>{c}</option>)}
                  </select></div>
                <div style={{flex:1}}><label className="lbl">Fecha</label>
                  <input className="input-f" type="date" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})}/></div>
              </div>
              <div style={{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'4px'}}>
                <button className="btn-ghost" onClick={()=>setShowForm(false)}>Cancelar</button>
                <button className="btn-primary" onClick={saveEntry}>Guardar</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const comm_storage={load:()=>{try{return JSON.parse(localStorage.getItem(COMM_KEY)||'[]');}catch{return[];}},save:(d)=>localStorage.setItem(COMM_KEY,JSON.stringify(d))};
const DEFAULT_TEMPLATES=[
  {id:'t1',cat:'Captación',titulo:'Primer contacto — Lead',canal:'WhatsApp',cuerpo:'Hola {nombre}! 👋 Te escribo de GlowLabs, agencia de marketing con IA. Vi que {empresa} podría estar buscando crecer en redes sociales. ¿Te gustaría que charlemos 15 minutos esta semana para contarte cómo lo estamos haciendo para nuestros clientes? Sin compromiso 🙂'},

  {id:'t4',cat:'Propuesta',titulo:'Follow-up propuesta enviada',canal:'WhatsApp',cuerpo:'Hola {nombre}! 👋 Solo para confirmar que recibiste la propuesta para {empresa}. ¿Tuviste oportunidad de revisarla? Puedo resolver cualquier duda o ajustarla si necesitas algo. 😊'},
  {id:'t5',cat:'Onboarding',titulo:'Bienvenida nuevo cliente',canal:'WhatsApp',cuerpo:'¡Bienvenido a GlowLabs, {nombre}! 🎉 Estamos emocionados de trabajar con {empresa}. En los próximos días recibirás:\n1️⃣ Acceso al panel de cliente\n2️⃣ Formulario de briefing de marca\n3️⃣ Calendario editorial del primer mes\nCualquier pregunta, aquí estamos. ¡Vamos a hacer cosas increíbles juntos! 🚀'},
  {id:'t6',cat:'Onboarding',titulo:'Solicitud de accesos',canal:'Email',cuerpo:'Hola {nombre},\n\nPara comenzar con el trabajo de {empresa}, necesitamos los siguientes accesos:\n\n• Instagram: usuario y contraseña (o invitation como editor)\n• Facebook Business Manager: agregar como admin al correo agencia@glowlabs.com\n• TikTok: usuario y contraseña\n• Google Drive: compartir carpeta de materiales con agencia@glowlabs.com\n\nEn cuanto los tengamos, empezamos de inmediato.\n\nGracias,\nMafe'},

  {id:'t8',cat:'Seguimiento',titulo:'Check-in mensual',canal:'WhatsApp',cuerpo:'Hola {nombre}! 👋 Pasando a saludar y ver cómo va todo con {empresa}. ¿Hay algo nuevo de tu parte que debamos incorporar en el contenido? ¿Lanzamientos, cambios, noticias? Aquí estamos para adaptar la estrategia cuando necesites. 🙌'},
  {id:'t9',cat:'Facturación',titulo:'Recordatorio de pago',canal:'WhatsApp',cuerpo:'Hola {nombre}, espero que todo vaya excelente con {empresa}! 🌟 Te comento que tenemos la factura del mes pendiente por ${{monto}}. Si ya lo realizaste, ¡genial, ignora este mensaje! Si no, con gusto te paso los datos de pago. 😊'},
  {id:'t10',cat:'Facturación',titulo:'Factura enviada',canal:'Email',cuerpo:'Hola {nombre},\n\nAdjunto encontrarás la factura correspondiente al servicio de marketing digital de {empresa} por el período {mes}.\n\nMonto: ${monto}\nFecha límite de pago: {fecha_limite}\n\nPor favor confírmame cuando hayas realizado el pago.\n\nGracias y que tengas una excelente semana!\n\nMafe Montilla\nGlowLabs IA'},

  {id:'t12',cat:'Cierre',titulo:'Oferta de renovación',canal:'WhatsApp',cuerpo:'Hola {nombre}! Se acerca el fin de nuestro contrato con {empresa} y antes de hacer un cierre formal, quería saber si les gustaría renovar. Tenemos nuevas opciones y beneficios para clientes continuos 🎁 ¿Hablamos esta semana?'},
];
function ComunicacionesModule({onHome}){
  const CM_A='#f472b6';
  const [templates,setTemplates]=React.useState(()=>{
    const saved=comm_storage.load();
    return saved.length>0?saved:[...DEFAULT_TEMPLATES];
  });
  const [catFilter,setCatFilter]=React.useState('Todos');
  const [canalFilter,setCanalFilter]=React.useState('Todos');
  const [selected,setSelected]=React.useState(null);
  const [editMode,setEditMode]=React.useState(false);
  const [copied,setCopied]=React.useState(false);
  const [showNew,setShowNew]=React.useState(false);
  const [newT,setNewT]=React.useState({cat:'Captación',titulo:'',canal:'WhatsApp',cuerpo:''});
  const [clientSearch,setClientSearch]=React.useState('');
  const [selectedClient,setSelectedClient]=React.useState(null);
  const [showClientSearch,setShowClientSearch]=React.useState(false);
  const allClients=clients_storage.load();
  const cats=['Todos','Captación','Propuesta','Onboarding','Seguimiento','Facturación','Cierre'];
  const canales=['Todos','WhatsApp','Email'];

  const fillTemplate=(tpl,client)=>{
    if(!client) return tpl;
    return tpl
      .replace(/\{nombre\}/g, client.nombre||'')
      .replace(/\{empresa\}/g, client.empresa||client.nombre||'')
      .replace(/\{monto\}/g, (client.montoMensual||client.montoContrato||0).toLocaleString('es-CO'))
      .replace(/\{mes\}/g, new Date().toLocaleString('es-ES',{month:'long',year:'numeric'}))
      .replace(/\{fecha_limite\}/g, new Date(Date.now()+15*86400000).toLocaleDateString('es-ES'));
  };

  const copyTemplate=()=>{
    if(!selected) return;
    const text=fillTemplate(selected.cuerpo,selectedClient);
    navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };

  const saveTemplate=(t)=>{
    const updated=templates.map(x=>x.id===t.id?t:x);
    setTemplates(updated);comm_storage.save(updated);setEditMode(false);
  };

  const addTemplate=()=>{
    if(!newT.titulo.trim()||!newT.cuerpo.trim()) return;
    const t={...newT,id:'custom_'+Date.now()};
    const updated=[...templates,t];
    setTemplates(updated);comm_storage.save(updated);setShowNew(false);setNewT({cat:'Captación',titulo:'',canal:'WhatsApp',cuerpo:''});
  };

  const deleteTemplate=(id)=>{
    const updated=templates.filter(x=>x.id!==id);
    setTemplates(updated);comm_storage.save(updated);if(selected?.id===id)setSelected(null);
  };

  const filtered=templates.filter(t=>(catFilter==='Todos'||t.cat===catFilter)&&(canalFilter==='Todos'||t.canal===canalFilter));
  const filteredClients=allClients.filter(c=>(c.nombre||'').toLowerCase().includes(clientSearch.toLowerCase())||(c.empresa||'').toLowerCase().includes(clientSearch.toLowerCase()));

  const CAT_COLORS={Captación:'#4ade80',Propuesta:'#38bdf8','Onboarding':'#a78bfa',Seguimiento:'#fbbf24',Facturación:'#fb923c',Cierre:'#f87171'};

  return(
    <div style={{minHeight:'100vh',background:'#FAF6EF',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",display:'flex',flexDirection:'column'}}>
      {/* header */}
      <div style={{background:'#FFFFFF',borderBottom:'1px solid rgba(49,49,49,0.08)',padding:'16px 32px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={onHome}>← Inicio</button>
          <div style={{width:'1px',height:'18px',background:'rgba(255,255,255,0.08)'}}/>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{width:'22px',height:'22px',background:CM_A,borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <span style={{fontSize:'14px',fontWeight:'700',color:'#313131',letterSpacing:'-.01em'}}>Comunicaciones</span>
          </div>
        </div>
        <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
          {/* client selector */}
          <div style={{position:'relative'}}>
            <button className="btn-ghost" style={{padding:'6px 12px',fontSize:'12px',color:selectedClient?CM_A:'rgba(255,255,255,0.4)'}}
              onClick={()=>setShowClientSearch(!showClientSearch)}>
              {selectedClient?`👤 ${selectedClient.empresa||selectedClient.nombre}`:'👤 Sin cliente'}
            </button>
            {showClientSearch&&(
              <div style={{position:'absolute',top:'calc(100% + 4px)',right:0,width:'260px',background:'#111',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'10px',zIndex:50,overflow:'hidden'}}>
                <div style={{padding:'8px'}}>
                  <input className="input-f" placeholder="Buscar cliente…" value={clientSearch} onChange={e=>setClientSearch(e.target.value)} style={{fontSize:'12px',padding:'7px 10px',width:'100%',boxSizing:'border-box'}} autoFocus/>
                </div>
                <div style={{maxHeight:'200px',overflowY:'auto'}}>
                  <div style={{padding:'8px 12px',cursor:'pointer',fontSize:'12px',color:'rgba(255,255,255,0.4)'}} onClick={()=>{setSelectedClient(null);setShowClientSearch(false);setClientSearch('');}}>Sin cliente (plantilla genérica)</div>
                  {filteredClients.map(c=>(
                    <div key={c.id} style={{padding:'8px 12px',cursor:'pointer',fontSize:'12px',color:'rgba(255,255,255,0.7)',transition:'background .1s'}}
                      onMouseOver={e=>e.currentTarget.style.background='rgba(255,255,255,0.05)'}
                      onMouseOut={e=>e.currentTarget.style.background='transparent'}
                      onClick={()=>{setSelectedClient(c);setShowClientSearch(false);setClientSearch('');}}>
                      <span style={{fontWeight:'600'}}>{c.empresa||c.nombre}</span>{c.empresa&&c.nombre&&<span style={{color:'rgba(255,255,255,0.3)'}}> · {c.nombre}</span>}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
          <button className="btn-primary" style={{padding:'7px 14px',fontSize:'12px'}} onClick={()=>setShowNew(true)}>+ Nueva plantilla</button>
        </div>
      </div>

      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* left panel: list */}
        <div style={{width:'320px',flexShrink:0,borderRight:'1px solid rgba(255,255,255,0.06)',display:'flex',flexDirection:'column'}}>
          {/* filters */}
          <div style={{padding:'12px 16px',borderBottom:'1px solid rgba(255,255,255,0.05)'}}>
            <div style={{display:'flex',flexWrap:'wrap',gap:'4px',marginBottom:'8px'}}>
              {cats.map(c=>(
                <button key={c} onClick={()=>setCatFilter(c)}
                  style={{all:'unset',cursor:'pointer',padding:'3px 9px',borderRadius:'100px',fontSize:'10px',fontWeight:'700',
                    background:catFilter===c?(CAT_COLORS[c]||CM_A):'rgba(255,255,255,0.05)',
                    color:catFilter===c?'#000':'rgba(255,255,255,0.4)',transition:'all .15s'}}>
                  {c}
                </button>
              ))}
            </div>
            <div style={{display:'flex',gap:'4px'}}>
              {canales.map(c=>(
                <button key={c} onClick={()=>setCanalFilter(c)}
                  style={{all:'unset',cursor:'pointer',padding:'3px 9px',borderRadius:'100px',fontSize:'10px',fontWeight:'600',
                    background:canalFilter===c?CM_A:'rgba(255,255,255,0.05)',
                    color:canalFilter===c?'#000':'rgba(255,255,255,0.4)',transition:'all .15s'}}>
                  {c==='WhatsApp'?'💬':c==='Email'?'✉️':'📋'} {c}
                </button>
              ))}
            </div>
          </div>
          {/* template list */}
          <div style={{overflowY:'auto',flex:1}}>
            {filtered.length===0&&<p style={{fontSize:'12px',color:'rgba(255,255,255,0.2)',padding:'24px 16px',textAlign:'center'}}>Sin plantillas</p>}
            {filtered.map(t=>(
              <div key={t.id} onClick={()=>{setSelected(t);setEditMode(false);}}
                style={{padding:'12px 16px',borderBottom:'1px solid rgba(255,255,255,0.04)',cursor:'pointer',
                  background:selected?.id===t.id?'rgba(255,255,255,0.04)':'transparent',transition:'background .1s'}}
                onMouseOver={e=>e.currentTarget.style.background='rgba(255,255,255,0.03)'}
                onMouseOut={e=>e.currentTarget.style.background=selected?.id===t.id?'rgba(255,255,255,0.04)':'transparent'}>
                <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'4px'}}>
                  <span style={{fontSize:'9px',fontWeight:'700',padding:'2px 7px',borderRadius:'100px',background:`${CAT_COLORS[t.cat]||CM_A}20`,color:CAT_COLORS[t.cat]||CM_A,textTransform:'uppercase'}}>{t.cat}</span>
                  <span style={{fontSize:'10px',color:'rgba(255,255,255,0.3)'}}>{t.canal==='WhatsApp'?'💬':'✉️'}</span>
                </div>
                <p style={{fontSize:'12.5px',fontWeight:'600',color:'rgba(255,255,255,0.8)',lineHeight:'1.3',margin:0}}>{t.titulo}</p>
              </div>
            ))}
          </div>
        </div>

        {/* right panel: preview */}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          {!selected?(
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,flexDirection:'column',gap:'12px'}}>
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <p style={{fontSize:'13px',color:'rgba(255,255,255,0.2)'}}>Selecciona una plantilla</p>
            </div>
          ):(
            <div style={{flex:1,overflowY:'auto',padding:'28px 32px'}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'20px'}}>
                <div>
                  <div style={{display:'flex',gap:'6px',marginBottom:'8px'}}>
                    <span style={{fontSize:'10px',fontWeight:'700',padding:'2px 8px',borderRadius:'100px',background:`${CAT_COLORS[selected.cat]||CM_A}20`,color:CAT_COLORS[selected.cat]||CM_A}}>{selected.cat}</span>
                    <span style={{fontSize:'10px',fontWeight:'700',padding:'2px 8px',borderRadius:'100px',background:'rgba(255,255,255,0.05)',color:'rgba(255,255,255,0.4)'}}>{selected.canal==='WhatsApp'?'💬 WhatsApp':'✉️ Email'}</span>
                  </div>
                  <h2 style={{fontSize:'20px',fontWeight:'700',color:'#fff',margin:0}}>{selected.titulo}</h2>
                  {selectedClient&&<p style={{fontSize:'12px',color:`${CM_A}99`,marginTop:'4px'}}>Personalizado para: {selectedClient.empresa||selectedClient.nombre}</p>}
                </div>
                <div style={{display:'flex',gap:'8px'}}>
                  <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>setEditMode(!editMode)}>{editMode?'Cancelar':'Editar'}</button>
                  <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px',color:'#f87171'}} onClick={()=>deleteTemplate(selected.id)}>Eliminar</button>
                  <button onClick={copyTemplate}
                    style={{all:'unset',cursor:'pointer',padding:'7px 16px',borderRadius:'100px',fontSize:'12px',fontWeight:'700',
                      background:copied?'#4ade80':CM_A,color:'#000',transition:'all .2s'}}>
                    {copied?'✓ Copiado!':'📋 Copiar'}
                  </button>
                </div>
              </div>

              {editMode?(
                <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
                  <div><label className="lbl">Título</label>
                    <input className="input-f" value={selected.titulo} onChange={e=>setSelected({...selected,titulo:e.target.value})} style={{maxWidth:'400px'}}/></div>
                  <div style={{display:'flex',gap:'12px'}}>
                    <div><label className="lbl">Categoría</label>
                      <select className="input-f" value={selected.cat} onChange={e=>setSelected({...selected,cat:e.target.value})} style={{maxWidth:'160px'}}>
                        {cats.filter(c=>c!=='Todos').map(c=><option key={c}>{c}</option>)}
                      </select></div>
                    <div><label className="lbl">Canal</label>
                      <select className="input-f" value={selected.canal} onChange={e=>setSelected({...selected,canal:e.target.value})} style={{maxWidth:'140px'}}>
                        {['WhatsApp','Email'].map(c=><option key={c}>{c}</option>)}
                      </select></div>
                  </div>
                  <div><label className="lbl">Cuerpo del mensaje</label>
                    <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',marginBottom:'6px'}}>Variables: {'{nombre}'} {'{empresa}'} {'{monto}'} {'{mes}'} {'{fecha_limite}'}</p>
                    <textarea className="input-f" value={selected.cuerpo} onChange={e=>setSelected({...selected,cuerpo:e.target.value})} rows={12} style={{width:'100%',boxSizing:'border-box',fontFamily:'monospace',fontSize:'12px',resize:'vertical'}}/></div>
                  <button className="btn-primary" style={{alignSelf:'flex-start'}} onClick={()=>saveTemplate(selected)}>Guardar cambios</button>
                </div>
              ):(
                <div>
                  <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'10px',padding:'20px 24px',fontSize:'13.5px',color:'rgba(255,255,255,0.75)',lineHeight:'1.75',whiteSpace:'pre-wrap',fontFamily:selected.canal==='WhatsApp'?"'Inter',sans-serif":'monospace'}}>
                    {fillTemplate(selected.cuerpo,selectedClient)}
                  </div>
                  {!selectedClient&&(selected.cuerpo.includes('{nombre}')||selected.cuerpo.includes('{empresa}'))&&(
                    <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',marginTop:'10px'}}>💡 Selecciona un cliente arriba para personalizar las variables automáticamente.</p>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {/* new template modal */}
      {showNew&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300}}>
          <div style={{background:'#111',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'16px',padding:'28px',width:'520px',maxHeight:'85vh',overflowY:'auto'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
              <h3 style={{fontSize:'16px',fontWeight:'700',color:'#fff',margin:0}}>Nueva plantilla</h3>
              <button className="btn-ghost" style={{padding:'4px 8px',fontSize:'11px'}} onClick={()=>setShowNew(false)}>✕</button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
              <div><label className="lbl">Título</label><input className="input-f" placeholder="Nombre de la plantilla" value={newT.titulo} onChange={e=>setNewT({...newT,titulo:e.target.value})}/></div>
              <div style={{display:'flex',gap:'12px'}}>
                <div style={{flex:1}}><label className="lbl">Categoría</label>
                  <select className="input-f" value={newT.cat} onChange={e=>setNewT({...newT,cat:e.target.value})}>
                    {cats.filter(c=>c!=='Todos').map(c=><option key={c}>{c}</option>)}
                  </select></div>
                <div style={{flex:1}}><label className="lbl">Canal</label>
                  <select className="input-f" value={newT.canal} onChange={e=>setNewT({...newT,canal:e.target.value})}>
                    {['WhatsApp','Email'].map(c=><option key={c}>{c}</option>)}
                  </select></div>
              </div>
              <div><label className="lbl">Mensaje</label>
                <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',marginBottom:'6px'}}>Variables: {'{nombre}'} {'{empresa}'} {'{monto}'} {'{mes}'} {'{fecha_limite}'}</p>
                <textarea className="input-f" placeholder="Escribe el mensaje…" value={newT.cuerpo} onChange={e=>setNewT({...newT,cuerpo:e.target.value})} rows={8} style={{width:'100%',boxSizing:'border-box',resize:'vertical'}}/></div>
              <div style={{display:'flex',gap:'8px',justifyContent:'flex-end'}}>
                <button className="btn-ghost" onClick={()=>setShowNew(false)}>Cancelar</button>
                <button className="btn-primary" onClick={addTemplate}>Guardar plantilla</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── PIPELINE MODULE ── */
function PipelineModule({onHome}){
  const PL_A='#06b6d4';
  const clients=clients_storage.load();
  const STAGES=[
    {id:'Lead',label:'Lead',color:'#9ca3af',bg:'rgba(156,163,175,0.06)'},
    {id:'Propuesta enviada',label:'Propuesta\nenviada',color:'#fb923c',bg:'rgba(251,146,60,0.06)'},
    {id:'Propuesta aceptada',label:'Propuesta\naceptada',color:'#38bdf8',bg:'rgba(56,189,248,0.06)'},
    {id:'Activo',label:'Activo',color:CL_A,bg:'rgba(168,85,247,0.06)'},
    {id:'Finalizado',label:'Finalizado',color:'#a78bfa',bg:'rgba(167,139,250,0.06)'},
  ];
  const PIPELINE_ESTADOS=new Set(['Lead','Propuesta enviada','Propuesta aceptada','Activo','Finalizado']);
  const [selected,setSelected]=React.useState(null);
  const [clients2,setClients2]=React.useState(clients);
  const [noteText,setNoteText]=React.useState('');
  const refresh=()=>setClients2(clients_storage.load());
  // clients with proposals but not yet in pipeline → auto-show in Lead
  const propList=(()=>{try{return JSON.parse(localStorage.getItem('propuestas_v2')||'[]');}catch{return[];}})();
  const propEmpresas=new Set(propList.map(p=>(p.empresa||'').trim().toLowerCase()));
  const getColClients=(stageId)=>{
    if(stageId!=='Lead') return clients2.filter(c=>c.estado===stageId);
    const inPipeline=clients2.filter(c=>c.estado==='Lead');
    const withProp=clients2.filter(c=>!PIPELINE_ESTADOS.has(c.estado)&&propEmpresas.has((c.empresa||c.nombre||'').trim().toLowerCase()));
    const ids=new Set(inPipeline.map(c=>c.id));
    return [...inPipeline,...withProp.filter(c=>!ids.has(c.id))];
  };

  const moveClient=(id,newStage)=>{
    const all=clients_storage.load();
    const updated=all.map(c=>c.id===id?{...c,estado:newStage,updatedAt:new Date().toISOString()}:c);
    clients_storage.save(updated);
    refresh();
    if(selected?.id===id) setSelected(updated.find(c=>c.id===id));
  };

  const addNote=()=>{
    if(!noteText.trim()||!selected) return;
    const all=clients_storage.load();
    const updated=all.map(c=>c.id===selected.id?{...c,notas:(c.notas||'')+'\n['+new Date().toLocaleDateString('es-ES')+']: '+noteText.trim()}:c);
    clients_storage.save(updated);
    setNoteText('');
    refresh();
    setSelected(updated.find(c=>c.id===selected.id));
  };

  const totalPipeline=clients2.filter(c=>['Lead','Propuesta enviada','Propuesta aceptada'].includes(c.estado)).reduce((s,c)=>s+(c.montoContrato||0),0);
  const probWin=clients2.filter(c=>c.estado==='Propuesta aceptada').reduce((s,c)=>s+(c.montoContrato||0),0);

  return(
    <div style={{minHeight:'100vh',background:'#080808',fontFamily:"'Inter',sans-serif"}}>
      {/* header */}
      <div style={{background:'#FFFFFF',borderBottom:'1px solid rgba(49,49,49,0.08)',padding:'16px 32px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={onHome}>← Inicio</button>
          <div style={{width:'1px',height:'18px',background:'rgba(255,255,255,0.08)'}}/>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{width:'22px',height:'22px',background:PL_A,borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.5"><rect x="2" y="3" width="6" height="18" rx="1"/><rect x="9" y="7" width="6" height="14" rx="1"/><rect x="16" y="1" width="6" height="22" rx="1"/></svg>
            </div>
            <span style={{fontSize:'14px',fontWeight:'700',color:'#313131',letterSpacing:'-.01em'}}>Pipeline de Ventas</span>
          </div>
        </div>
        <div style={{display:'flex',gap:'24px'}}>
          <div style={{textAlign:'right'}}>
            <p style={{fontSize:'10px',color:'rgba(255,255,255,0.3)',marginBottom:'2px'}}>PIPELINE TOTAL</p>
            <p style={{fontSize:'16px',fontWeight:'700',color:PL_A}}>${totalPipeline.toLocaleString('es-CO')}</p>
          </div>
          <div style={{textAlign:'right'}}>
            <p style={{fontSize:'10px',color:'rgba(255,255,255,0.3)',marginBottom:'2px'}}>CIERRE PROBABLE</p>
            <p style={{fontSize:'16px',fontWeight:'700',color:'#38bdf8'}}>${probWin.toLocaleString('es-CO')}</p>
          </div>
        </div>
      </div>

      <div style={{display:'flex',gap:'0',overflowX:'auto',padding:'24px',minHeight:'calc(100vh - 73px)'}}>
        {STAGES.map(stage=>{
          const cols=getColClients(stage.id);
          const colTotal=cols.reduce((s,c)=>s+(c.montoContrato||0),0);
          return(
            <div key={stage.id} style={{minWidth:'220px',flex:'1',marginRight:'12px',background:stage.bg,border:`1px solid ${stage.color}22`,borderRadius:'10px',display:'flex',flexDirection:'column',overflow:'hidden'}}>
              {/* column header */}
              <div style={{padding:'14px 16px',borderBottom:`1px solid ${stage.color}22`,background:`${stage.color}0a`}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'4px'}}>
                  <span style={{fontSize:'11px',fontWeight:'700',color:stage.color,textTransform:'uppercase',letterSpacing:'.1em',whiteSpace:'pre-wrap'}}>{stage.label.replace('\n',' ')}</span>
                  <span style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',background:'rgba(255,255,255,0.06)',padding:'1px 7px',borderRadius:'100px'}}>{cols.length}</span>
                </div>
                {colTotal>0&&<p style={{fontSize:'11px',color:`${stage.color}99`,margin:0}}>${colTotal.toLocaleString('es-CO')}</p>}
              </div>
              {/* cards */}
              <div style={{padding:'10px',display:'flex',flexDirection:'column',gap:'8px',overflowY:'auto',flex:1}}>
                {cols.length===0&&<p style={{fontSize:'11px',color:'rgba(255,255,255,0.15)',textAlign:'center',padding:'20px 0'}}>Sin clientes</p>}
                {cols.map(c=>(
                  <div key={c.id} onClick={()=>setSelected(c)}
                    style={{background:'rgba(255,255,255,0.03)',border:`1px solid ${selected?.id===c.id?stage.color+'66':'rgba(255,255,255,0.07)'}`,borderRadius:'8px',padding:'12px',cursor:'pointer',transition:'all .15s'}}
                    onMouseOver={e=>e.currentTarget.style.borderColor=stage.color+'44'}
                    onMouseOut={e=>e.currentTarget.style.borderColor=selected?.id===c.id?stage.color+'66':'rgba(255,255,255,0.07)'}>
                    <p style={{fontSize:'12.5px',fontWeight:'700',color:'#fff',marginBottom:'4px',lineHeight:'1.2'}}>{c.empresa||c.nombre}</p>
                    {c.nombre&&c.empresa&&<p style={{fontSize:'11px',color:'rgba(255,255,255,0.4)',marginBottom:'4px'}}>{c.nombre}</p>}
                    <div style={{display:'flex',flexWrap:'wrap',gap:'4px',marginBottom:'6px'}}>
                      {(c.servicios||[]).map(s=>(
                        <span key={s} style={{fontSize:'9px',fontWeight:'700',color:s==='marketing'?WARM:s==='ia'?AI_A:WEB_A,background:s==='marketing'?'rgba(249,115,22,0.1)':s==='ia'?'rgba(234,179,8,0.1)':'rgba(99,102,241,0.1)',padding:'2px 6px',borderRadius:'100px',textTransform:'uppercase'}}>{s==='marketing'?'MKT':s==='ia'?'IA':'WEB'}</span>
                      ))}
                    </div>
                    {(c.montoContrato||0)>0&&<p style={{fontSize:'12px',fontWeight:'700',color:stage.color,margin:0}}>${(c.montoContrato||0).toLocaleString('es-CO')}</p>}
                    {c.asignadoNombre&&<p style={{fontSize:'10px',color:'rgba(255,255,255,0.25)',margin:'4px 0 0'}}>👤 {c.asignadoNombre}</p>}
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      {/* side panel */}
      {selected&&(
        <div style={{position:'fixed',top:0,right:0,width:'340px',height:'100vh',background:'#101010',borderLeft:'1px solid rgba(255,255,255,0.08)',overflowY:'auto',zIndex:200,padding:'24px',boxSizing:'border-box'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}}>
            <span style={{fontSize:'13px',fontWeight:'700',color:'#fff'}}>Detalle</span>
            <button className="btn-ghost" style={{padding:'4px 8px',fontSize:'11px'}} onClick={()=>setSelected(null)}>✕</button>
          </div>
          <h3 style={{fontSize:'18px',fontWeight:'700',color:'#fff',marginBottom:'4px'}}>{selected.empresa||selected.nombre}</h3>
          {selected.nombre&&selected.empresa&&<p style={{fontSize:'13px',color:'rgba(255,255,255,0.4)',marginBottom:'16px'}}>{selected.nombre}</p>}

          {/* move stage */}
          <div style={{marginBottom:'16px'}}>
            <p style={{fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'8px'}}>Mover a etapa</p>
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
              {STAGES.map(s=>(
                <button key={s.id} onClick={()=>moveClient(selected.id,s.id)}
                  style={{all:'unset',cursor:'pointer',padding:'5px 10px',borderRadius:'100px',fontSize:'11px',fontWeight:'600',border:`1px solid ${s.color}44`,color:selected.estado===s.id?'#000':s.color,background:selected.estado===s.id?s.color:'transparent',transition:'all .15s'}}>{s.label.replace('\n',' ')}</button>
              ))}
            </div>
          </div>

          {/* stats */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'16px'}}>
            {[
              {l:'Contrato',v:selected.montoContrato?`$${selected.montoContrato.toLocaleString('es-CO')}`:'—'},
              {l:'Mensual',v:selected.montoMensual?`$${selected.montoMensual.toLocaleString('es-CO')}/mes`:'—'},
              {l:'Email',v:selected.email||'—'},
              {l:'Teléfono',v:selected.telefono||'—'},
            ].map(x=>(
              <div key={x.l} style={{padding:'10px',background:'rgba(255,255,255,0.03)',borderRadius:'6px'}}>
                <p style={{fontSize:'9px',color:'rgba(255,255,255,0.3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:'3px'}}>{x.l}</p>
                <p style={{fontSize:'12px',fontWeight:'600',color:'rgba(255,255,255,0.7)',wordBreak:'break-all'}}>{x.v}</p>
              </div>
            ))}
          </div>

          {/* notes */}
          <div>
            <p style={{fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'8px'}}>Notas</p>
            {selected.notas&&<div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'6px',padding:'10px',marginBottom:'8px',fontSize:'12px',color:'rgba(255,255,255,0.5)',lineHeight:'1.6',whiteSpace:'pre-wrap',maxHeight:'140px',overflowY:'auto'}}>{selected.notas}</div>}
            <div style={{display:'flex',gap:'6px'}}>
              <input className="input-f" placeholder="Añadir nota…" value={noteText} onChange={e=>setNoteText(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addNote();}}}
                style={{fontSize:'12px',padding:'8px 10px',flex:1}}/>
              <button className="btn-primary" style={{padding:'8px 12px',fontSize:'12px',flexShrink:0}} onClick={addNote}>+</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CalendarModule({onHome}){
  const CA='#a78bfa';
  const [posts,setPosts]=React.useState(()=>cal_storage.load());

    <div style={{padding:'20px 28px'}}>

      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px',marginBottom:'4px'}}>

      {/* Day cells */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px'}}>
        {cells.map((d,i)=>{
          if(!d) return <div key={`e${i}`}/>;
          const dayStr=`${monthStr}-${String(d).padStart(2,'0')}`;
          const dayPosts=postsForDay(d);
          const isToday=dayStr===today;

          <div key={d} style={{minHeight:'100px',padding:'8px',background:isToday?'rgba(167,139,250,0.06)':'rgba(255,255,255,0.02)',border:`1px solid ${isToday?`${CA}44`:'rgba(255,255,255,0.05)'}`,borderRadius:'8px',cursor:'pointer',transition:'all .15s',position:'relative'}}
            onClick={()=>openForm(makePost({fecha:dayStr}))}
            onMouseOver={e=>{e.currentTarget.style.background=isToday?'rgba(167,139,250,0.1)':'rgba(255,255,255,0.04)';}}
            onMouseOut={e=>{e.currentTarget.style.background=isToday?'rgba(167,139,250,0.06)':'rgba(255,255,255,0.02)';}}>
            <span style={{fontSize:'12px',fontWeight:isToday?'800':'500',color:isToday?CA:'rgba(255,255,255,0.5)',display:'block',marginBottom:'6px'}}>{d}</span>

            </div>
          </div>
          );
        })}
      </div>
    </div>
  </div>
  );
}

/* ── APP ── */
function App(){
  /* ── PROPOSAL VIEW LINK HANDLER ── */
  const _propHash=window.location.hash;
  if(_propHash.startsWith('#ver-propuesta/')){
    try{
      const token=_propHash.slice('#ver-propuesta/'.length);
      let json;
      // Handle LZ-compressed format (starts with 'z/')
      if(token.startsWith('z/')&&typeof LZString!=='undefined'){
        json=LZString.decompressFromEncodedURIComponent(token.slice(2));
      }
      // Fallback: legacy base64 format
      if(!json){json=decodeURIComponent(escape(atob(token)));}
      const {type,data:pData}=JSON.parse(json);
      if(type==='ia'){
        return <div style={{minHeight:'100vh',background:'#0a0a0f'}}><AIProposalDeck data={pData} onBack={()=>{window.location.hash='';window.location.reload();}} isSaved={false}/></div>;
      }
      return <div style={{minHeight:'100vh',background:'#0a0a0f'}}><ProposalDeck data={pData} onBack={()=>{window.location.hash='';window.location.reload();}} isSaved={false}/></div>;
    }catch(e){}
  }

  /* ── EMPLOYEE SETUP LINK HANDLER ── */
  (()=>{
    try{
      const h=window.location.hash;
      if(h.startsWith('#empsetup/')){
        const empData=JSON.parse(atob(h.slice('#empsetup/'.length)));
        if(empData&&empData.id&&empData.username&&empData.password){
          const existing=emp_storage.load();
          if(!existing.find(e=>e.id===empData.id)){
            emp_storage.save([...existing,{...empData,activo:true,ultimaActividad:null}]);
          }
        }
        window.location.hash='';
      }
    }catch(e){}
  })();

  /* ── AUTH / CLIENT MODE ── */
  const hash=window.location.hash;
  const clientMode=hash==='#cliente';
  const portalMode=hash==='#portal';
  const [currentUser,setCurrentUser]=useState(()=>{
    try{
      const s=localStorage.getItem(AUTH_KEY);
      if(!s) return null;
      if(s==='1') return {role:'admin',id:'admin',nombre:'Mafe Montilla'};
      return JSON.parse(s);
    }catch{return null;}
  });
  const [clientView,setClientView]=useState('form'); // 'form' | 'result'
  const [clientForm,setClientForm]=useState(null);

  /* ── INTERNAL module routing ── */
  const [module,setModule]=useState(null);

  /* ── MARKETING state ── */
  const [view,setView]=useState('form');
  const [formData,setFormData]=useState(null);
  const [editingId,setEditingId]=useState(null);
  const [proposal,setProposal]=useState(null);
  const [savedId,setSavedId]=useState(null);
  const [saved,setSaved]=useState(()=>storage.load());

  /* ── IA state ── */
  const [iaView,setIaView]=useState('form');
  /* ── WEB state ── */
  const [webView,setWebView]=useState('form');
  const [webForm,setWebForm]=useState(null);

  const [iaFormData,setIaFormData]=useState(null);
  const [iaEditingId,setIaEditingId]=useState(null);
  const [iaProposal,setIaProposal]=useState(null);
  const [iaSavedId,setIaSavedId]=useState(null);
  const [iaSaved,setIaSaved]=useState(()=>ai_storage.load());

  const [showSearch,setShowSearch]=useState(false);
  const [searchClientId,setSearchClientId]=useState(null);
  useEffect(()=>{
    const h=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setShowSearch(s=>!s);}};
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[]);
  const goHome=()=>setModule(null);
  const doLogin=(user)=>{localStorage.setItem(AUTH_KEY,JSON.stringify(user));setCurrentUser(user);};
  const doLogout=()=>{localStorage.removeItem(AUTH_KEY);setCurrentUser(null);};

  /* ── PORTAL MODE: client portal ── */
  if(portalMode) return <ClientPortal/>;

  /* ── CLIENT MODE: public web briefing form ── */
  if(clientMode){
    if(clientView==='result'&&clientForm) return <ClientBriefingView form={clientForm} onNew={()=>{setClientForm(null);setClientView('form');}}/>;
    return <ClientWebForm onSubmit={f=>{setClientForm(f);setClientView('result');}}/>;
  }

  /* ── INTERNAL: require auth ── */
  if(!currentUser) return <LoginScreen onLogin={doLogin}/>;
  const isAdmin=currentUser.role==='admin';

  /* ── Shared: create client from accepted proposal ── */
  const handleAcceptProposal=({contacto,correo,servicios,proposalType,proposalData})=>{
    const cliente=makeClient({empresa:proposalData?.empresa||'Cliente',contacto,correo,servicios,proposalType,proposalData,asignadoA:isAdmin?null:currentUser.id});
    const all=clients_storage.load();
    clients_storage.save([...all,cliente]);
  };

  /* ── MARKETING handlers ── */
  const persist=list=>{setSaved(list);storage.save(list);};
  const handleGenerate=(data,eid)=>{setProposal(data);setSavedId(eid||null);setView('deck');};
  const handleSave=(data)=>{
    const id=editingId||savedId||Date.now().toString();
    const rec={id,empresa:data.empresa,clientName:data.clientName,sector:data.sector,fecha:data.fecha,fechaGuardado:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),planes:data.planes,resolvedPlan:data.resolvedPlan,formData:{...data},creadoPor:currentUser?.id||'admin'};
    const ex=saved.find(s=>s.id===id);
    persist(ex?saved.map(s=>s.id===id?rec:s):[...saved,rec]);
    setSavedId(id);
  };
  const handleEdit=data=>{setFormData({...data});setEditingId(savedId);setView('form');};
  const handleLibEdit=s=>{setFormData({...s.formData});setEditingId(s.id);setProposal(null);setSavedId(s.id);setView('form');};
  const handleLibView=s=>{setProposal({...s.formData});setSavedId(s.id);setEditingId(s.id);setView('deck');};
  const handleDelete=id=>{if(!isAdmin){alert('No tienes permiso para eliminar propuestas.');return;}if(!confirm('¿Eliminar esta propuesta?'))return;persist(saved.filter(s=>s.id!==id));};

  /* ── IA handlers ── */
  const iaPersist=list=>{setIaSaved(list);ai_storage.save(list);};
  const iaHandleGenerate=(data,eid)=>{setIaProposal(data);setIaSavedId(eid||null);setIaView('deck');};
  const iaHandleSave=(data)=>{
    const id=iaEditingId||iaSavedId||Date.now().toString();
    const rec={id,empresa:data.empresa,pkgs:data.pkgs||[],fecha:data.fecha,fechaGuardado:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),formData:{...data},creadoPor:currentUser?.id||'admin'};
    const ex=iaSaved.find(s=>s.id===id);
    iaPersist(ex?iaSaved.map(s=>s.id===id?rec:s):[...iaSaved,rec]);
    setIaSavedId(id);
  };
  const iaHandleEdit=data=>{setIaFormData({...data});setIaEditingId(iaSavedId);setIaView('form');};
  const iaHandleLibEdit=s=>{setIaFormData({...s.formData});setIaEditingId(s.id);setIaProposal(null);setIaSavedId(s.id);setIaView('form');};
  const iaHandleLibView=s=>{setIaProposal({...s.formData});setIaSavedId(s.id);setIaEditingId(s.id);setIaView('deck');};
  const iaHandleDelete=id=>{if(!isAdmin){alert('No tienes permiso para eliminar propuestas.');return;}if(!confirm('¿Eliminar esta propuesta?'))return;iaPersist(iaSaved.filter(s=>s.id!==id));};

  /* ── BACKUP helpers ── */
  const BACKUP_KEYS=['propuestas_v2','propuestas_ia_v1',CLIENTS_KEY,EMP_KEY,AUTH_KEY,CONTRACT_KEY,INVOICE_KEY,EXPENSE_KEY,PROJ_KEY,CAL_KEY];
  const doExportBackup=()=>{
    const data={version:'glowlabs_backup_v1',fecha:new Date().toISOString(),datos:{}};
    BACKUP_KEYS.forEach(k=>{try{data.datos[k]=JSON.parse(localStorage.getItem(k)||'null');}catch{data.datos[k]=null;}});
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`glowlabs-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const doImportBackup=(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.version||!data.datos) throw new Error('Formato inválido');
        if(!confirm(`¿Restaurar backup del ${new Date(data.fecha).toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}?\n\nEsto reemplazará todos los datos actuales.`)) return;
        Object.entries(data.datos).forEach(([k,v])=>{
          if(v!==null) localStorage.setItem(k,JSON.stringify(v));
        });
        alert('✓ Backup restaurado. La página se va a recargar.');
        window.location.reload();
      }catch(err){alert('Error al leer el backup: '+err.message);}
    };
    reader.readAsText(file);
    e.target.value='';
  };

  /* ── HOME ── */
  if(!module) return(
    <div style={{position:'relative'}}>
      {showSearch&&<GlobalSearch onClose={()=>setShowSearch(false)} onNavigate={(mod,clientId)=>{setModule(mod);if(clientId)setSearchClientId(clientId);setShowSearch(false);}}/>}
      <HomeScreen onSelect={setModule} currentUser={currentUser}/>
      <div style={{position:'fixed',bottom:'18px',right:'18px',display:'flex',gap:'8px',alignItems:'center',zIndex:50}}>
        <span style={{fontSize:'11px',color:'#96908C',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",fontWeight:500}}>{currentUser.nombre}</span>
        {isAdmin&&(
          <>
            <button onClick={doExportBackup} title="Exportar backup" style={{background:'#FFFFFF',border:'1px solid rgba(49,49,49,0.1)',borderRadius:'100px',color:'#96908C',fontSize:'11px',padding:'7px 12px',cursor:'pointer',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",display:'flex',alignItems:'center',gap:'5px'}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Backup
            </button>
            <label title="Restaurar backup" style={{background:'#FFFFFF',border:'1px solid rgba(49,49,49,0.1)',borderRadius:'100px',color:'#96908C',fontSize:'11px',padding:'7px 12px',cursor:'pointer',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",display:'flex',alignItems:'center',gap:'5px'}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Restaurar
              <input type="file" accept=".json" onChange={doImportBackup} style={{display:'none'}}/>
            </label>
          </>
        )}
        <button onClick={doLogout} title="Cerrar sesión" style={{background:'#FFFFFF',border:'1px solid rgba(49,49,49,0.1)',borderRadius:'100px',color:'#96908C',fontSize:'11px',padding:'7px 12px',cursor:'pointer',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif"}}>
          Salir
        </button>
      </div>
    </div>
  );

  /* ── EMPLOYEES module ── */
  if(module==='equipo'&&isAdmin) return <EmployeeModule onHome={goHome}/>;

  /* ── DASHBOARD module ── */
  if(module==='dashboard'&&isAdmin) return <DashboardModule onHome={goHome}/>;

  /* ── GLOBAL TASKS module ── */
  if(module==='tasks') return <GlobalTasksModule onHome={goHome} currentUser={currentUser}/>;

  /* ── PRICING module ── */
  if(module==='pricing'&&isAdmin) return <PricingModule onHome={goHome}/>;

  /* ── Permission helper for employees ── */
  const empPerms=isAdmin?{marketing:true,ia:true,web:true,clients:true}:(()=>{
    const emp=emp_storage.load().find(e=>e.id===currentUser.id);
    return emp?.permisos||{marketing:true,ia:true,web:true,clients:true};
  })();
  const noAccess=(mod)=>(
    <div style={{minHeight:'100vh',background:GL_BG,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'16px'}}>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" strokeWidth="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <p style={{color:'rgba(255,255,255,0.3)',fontSize:'14px',fontFamily:"'Inter',sans-serif"}}>No tienes permiso para acceder a este módulo.</p>
      <button onClick={goHome} style={{padding:'9px 20px',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.5)',fontSize:'13px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>Volver al inicio</button>
    </div>
  );

  /* ── CLIENTS module ── */
  if(module==='clients'){
    const cid=searchClientId;
    if(cid) setTimeout(()=>setSearchClientId(null),100);
    return empPerms.clients?<ClientsModule key={cid||'cl'} onHome={goHome} currentUser={currentUser} initialClientId={cid}/>:noAccess('clients');
  }

  /* ── MARKETING module ── */
  if(module==='marketing'){
    if(!empPerms.marketing) return noAccess('marketing');
    if(view==='deck'&&proposal) return <ProposalDeck data={proposal} savedId={savedId} onBack={()=>setView('library')} onEdit={handleEdit} onSave={handleSave} isSaved={!!savedId&&saved.some(s=>s.id===savedId)} onAccept={handleAcceptProposal}/>;
    if(view==='library') return <LibraryView saved={saved} onView={handleLibView} onEdit={handleLibEdit} onDelete={handleDelete} onNew={()=>{setFormData(null);setEditingId(null);setProposal(null);setSavedId(null);setView('form');}} onBack={()=>setView('form')} onHome={goHome}/>;
    return <FormView initial={formData} editingId={editingId} onGenerate={handleGenerate} onLibrary={()=>setView('library')} savedCount={saved.length} onHome={goHome}/>;
  }

  /* ── IA module ── */
  if(module==='ia'){
    if(!empPerms.ia) return noAccess('ia');
    if(iaView==='deck'&&iaProposal) return <AIProposalDeck data={iaProposal} savedId={iaSavedId} onBack={()=>setIaView('library')} onEdit={iaHandleEdit} onSave={iaHandleSave} isSaved={!!iaSavedId&&iaSaved.some(s=>s.id===iaSavedId)} onAccept={handleAcceptProposal}/>;
    if(iaView==='library') return <AILibraryView saved={iaSaved} onView={iaHandleLibView} onEdit={iaHandleLibEdit} onDelete={iaHandleDelete} onNew={()=>{setIaFormData(null);setIaEditingId(null);setIaProposal(null);setIaSavedId(null);setIaView('form');}} onHome={goHome}/>;
    return <AIFormView initial={iaFormData} editingId={iaEditingId} onGenerate={iaHandleGenerate} onLibrary={()=>setIaView('library')} savedCount={iaSaved.length} onHome={goHome}/>;
  }

  /* ── WEB module ── */
  if(module==='web'){
    if(!empPerms.web) return noAccess('web');
    if(webView==='prompt'&&webForm) return <WebPromptView form={webForm} onBack={()=>setWebView('form')} onNew={()=>{setWebForm(null);setWebView('form');}}/>;
    return <WebFormView onGenerate={f=>{setWebForm(f);setWebView('prompt');}} onHome={goHome}/>;
  }

  /* ── CONTRACTS module ── */
  if(module==='contracts'&&isAdmin) return <ContractModule onHome={goHome} onInvoice={()=>{setModule('invoices');}}/>;

  /* ── INVOICES module ── */
  if(module==='invoices'&&isAdmin) return <InvoiceModule onHome={goHome}/>;

  /* ── EXPENSES module ── */
  if(module==='expenses'&&isAdmin) return <ExpenseModule onHome={goHome}/>;

  /* ── REPORTES module ── */
  if(module==='reportes'&&isAdmin) return <ReportesModule onHome={goHome}/>;

  /* ── PROYECTOS module ── */
  if(module==='proyectos'&&isAdmin) return <ProyectosModule onHome={goHome}/>;

  /* ── BRIEFING module ── */
  if(module==='briefing'&&isAdmin) return <BriefingModule onHome={goHome}/>;

  /* ── PROPUESTAS module ── */
  if(module==='propuestas'&&isAdmin) return <PropuestasModule onHome={goHome}/>;

  /* ── OBJETIVOS module ── */
  if(module==='objetivos'&&isAdmin) return <ObjetivosModule onHome={goHome}/>;

  /* ── HORAS module ── */
  if(module==='horas') return <HorasModule onHome={goHome} currentUser={currentUser} isAdmin={isAdmin}/>;

  /* ── COMUNICACIONES module ── */
  if(module==='comunicaciones'&&isAdmin) return <ComunicacionesModule onHome={goHome}/>;

  /* ── PIPELINE module ── */
  if(module==='pipeline'&&isAdmin) return <PipelineModule onHome={goHome}/>;

  /* ── CALENDARIO module ── */
  if(module==='calendario'&&isAdmin) return <CalendarModule onHome={goHome}/>;

  /* ── HUB: AGENCIA ── */
  if(module==='agencia') return <AgenciaHub onHome={goHome} onSelect={setModule} isAdmin={isAdmin}/>;

  /* ── HUB: ACADEMIA ── */
  if(module==='academia') return <AcademiaModule onHome={goHome}/>;

  /* ── GENERADOR DE ACTIVOS ── */
  if(module==='generador') return <GeneradorModule onHome={goHome}/>;

  /* ── HUB: COTIZACIONES ── */
  if(module==='cotizaciones') return <CotizacionesHub onHome={()=>setModule('agencia')} onSelect={setModule}/>;

  /* ── HUB: GESTIÓN ADMINISTRATIVA ── */
  if(module==='gestion_admin'&&isAdmin) return <GestionAdminHub onHome={()=>setModule('agencia')} onSelect={setModule}/>;

  /* ── HUB: VENTAS ── */
  if(module==='ventas'&&isAdmin) return <PipelineModule onHome={()=>setModule('agencia')}/>;

  /* ── PRICING module ── */
  if(module==='pricing'&&isAdmin) return <PricingModule onHome={()=>setModule('agencia')}/>;

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
