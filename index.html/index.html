        <p style={{fontSize:'12px',fontWeight:'700',color:'rgba(255,255,255,0.5)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:'16px'}}>Top clientes por facturación</p>
        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'12px'}}>
          {topClients.map((c,i)=>(
            <div key={i} style={{padding:'14px',background:'rgba(129,140,248,0.04)',border:'1px solid rgba(129,140,248,0.1)',borderRadius:'6px'}}>
              <div style={{width:'28px',height:'28px',borderRadius:'50%',background:`rgba(129,140,248,${0.15+i*0.03})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:'700',color:RA,marginBottom:'8px'}}>{i+1}</div>
              <p style={{fontSize:'12px',fontWeight:'600',color:'rgba(255,255,255,0.7)',marginBottom:'4px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name}</p>
              <p style={{fontSize:'14px',fontWeight:'700',color:RA}}>{fmt(c.val)} €</p>
            </div>
          ))}
        </div>
      </div>
      )}

      {/* P&L TABLE */}
      <div style={{padding:'24px',background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'8px'}}>
        <p style={{fontSize:'12px',fontWeight:'700',color:'rgba(255,255,255,0.5)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:'16px'}}>Resumen P&L</p>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'13px'}}>
          <tbody>
            {[
              {label:'Ingresos cobrados',val:totalIngresos,color:'#34d399',bold:false},
              {label:'Ingresos pendientes de cobro',val:pendienteCobro,color:'rgba(255,255,255,0.3)',bold:false,italic:true},
              {label:'',val:null},{label:'Gastos pagados',val:-totalGastos,color:'#f87171',bold:false},
              {label:'Gastos pendientes de pago',val:-pendientePago,color:'rgba(255,255,255,0.3)',bold:false,italic:true},
              {label:'',val:null},{label:'BENEFICIO NETO',val:beneficio,color:beneficio>=0?RA:'#f87171',bold:true},
              {label:'',val:null},{label:'IVA repercutido (cobrado)',val:ivaRepercutido,color:'#fbbf24',bold:false},
              {label:'IVA soportado (deducible)',val:-ivaSoportado,color:'rgba(255,255,255,0.4)',bold:false},
              {label:'IVA A LIQUIDAR',val:ivaLiquidar,color:'#fbbf24',bold:true}
            ].map((row,i)=>row.val===null?(
              <tr key={i}><td colSpan={2} style={{padding:'6px 0',borderBottom:'1px solid rgba(255,255,255,0.04)'}}></td></tr>
            ):(
              <tr key={i} style={{borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
                <td style={{padding:'10px 0',color:row.italic?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.6)',fontStyle:row.italic?'italic':'normal',fontWeight:row.bold?'700':'400',fontSize:row.bold?'14px':'13px'}}>{row.label}</td>
                <td style={{padding:'10px 0',textAlign:'right',color:row.color,fontWeight:row.bold?'700':'600',fontSize:row.bold?'15px':'13px'}}>{(row.val<0?'- ':'')+fmt(Math.abs(row.val))} €</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  </div>
  );
}

/* ── PROYECTOS ── */
const PROJ_KEY='glowlabs_proyectos_v1';
const proyectos_storage={
  load:()=>{try{return JSON.parse(localStorage.getItem(PROJ_KEY)||'[]');}catch{return[];}},
  save:(d)=>localStorage.setItem(PROJ_KEY,JSON.stringify(d))
};
const PROJ_A='#06b6d4';
const PROJ_ESTADOS=['En planificación','En progreso','En revisión','Completado','Pausado','Cancelado'];
const PROJ_TIPOS=['Diseño Web','Marketing Digital','IA & Automatización','Branding','Redes Sociales','SEO/SEM','Consultoría','Otro'];

function makeProyecto(o={}){
  const id='PRO-'+String(Date.now()).slice(-6);
  return {id,nombre:'',tipo:'Diseño Web',clienteId:'',descripcion:'',estado:'En planificación',prioridad:'Media',fechaInicio:new Date().toISOString().slice(0,10),fechaFin:'',horasEstimadas:0,horasReales:0,presupuesto:0,fases:[],notas:'',...o,creadoEn:o.creadoEn||new Date().toISOString()};
}
function makeFase(o={}){return {id:Date.now()+Math.random(),nombre:'',completada:false,horas:0,...o};}

function ProyectosModule({onHome}){
  const PA=PROJ_A;
  const [proyectos,setProyectos]=React.useState(()=>proyectos_storage.load());
  const [view,setView]=React.useState('list');
  const [editing,setEditing]=React.useState(null);
  const [filterEstado,setFilterEstado]=React.useState('Todos');
  const clients=clients_storage.load();

  const save=arr=>{proyectos_storage.save(arr);setProyectos(arr);};
  const del=id=>{if(window.confirm('¿Eliminar proyecto?'))save(proyectos.filter(p=>p.id!==id));};

  if(view==='form') return <ProyectoForm initial={editing} onSave={p=>{const arr=editing?proyectos.map(x=>x.id===p.id?p:x):[p,...proyectos];save(arr);setEditing(null);setView('list');}} onCancel={()=>{setEditing(null);setView('list');}}/>;

  const filtered=proyectos.filter(p=>filterEstado==='Todos'||p.estado===filterEstado);
  const activos=proyectos.filter(p=>p.estado==='En progreso').length;
  const completados=proyectos.filter(p=>p.estado==='Completado').length;
  const totalHoras=proyectos.reduce((s,p)=>s+parseFloat(p.horasReales||0),0);
  const totalPresup=proyectos.reduce((s,p)=>s+parseFloat(p.presupuesto||0),0);

  const estadoColor=e=>({
    'En planificación':'#fbbf24','En progreso':PA,'En revisión':'#818cf8',
    Completado:'#34d399',Pausado:'rgba(255,255,255,0.3)',Cancelado:'#f87171'
  }[e]||'#aaa');

  const prioColor=p=>({Alta:'#f87171',Media:'#fbbf24',Baja:'#34d399'}[p]||'#aaa');

  const getClientName=id=>{const c=clients.find(x=>x.id===id);return c?.empresa||c?.nombre||'';};
  const getFasesPct=p=>{if(!p.fases||!p.fases.length)return null;const done=p.fases.filter(f=>f.completada).length;return Math.round(done/p.fases.length*100);};

  return(
  <div style={{minHeight:'100vh',background:'#0a0a0f',color:'#fff',fontFamily:"'Inter',sans-serif"}}>
    <div style={{borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'0 32px',display:'flex',alignItems:'center',justifyContent:'space-between',height:'56px',position:'sticky',top:0,background:'rgba(10,10,15,0.95)',backdropFilter:'blur(12px)',zIndex:50}}>
      <div style={{display:'flex',alignItems:'center',gap:'16px'}}>
        <button onClick={onHome} style={{all:'unset',cursor:'pointer',color:'rgba(255,255,255,0.35)',fontSize:'12px',display:'flex',alignItems:'center',gap:'5px'}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Inicio
        </button>
        <span style={{color:'rgba(255,255,255,0.1)'}}>|</span>
        <span style={{fontSize:'13px',fontWeight:'600',color:'#fff'}}>Proyectos & Tiempo</span>
      </div>
      <button onClick={()=>{setEditing(null);setView('form');}} style={{all:'unset',cursor:'pointer',padding:'7px 16px',background:PA,borderRadius:'5px',fontSize:'12px',fontWeight:'600',color:'#fff'}}>+ Nuevo proyecto</button>
    </div>

    <div style={{padding:'32px',maxWidth:'1200px',margin:'0 auto'}}>
      {/* STATS */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'14px',marginBottom:'28px'}}>
        {[{label:'Total proyectos',val:proyectos.length,color:PA},{label:'En progreso',val:activos,color:'#fbbf24'},{label:'Completados',val:completados,color:'#34d399'},{label:'Horas registradas',val:`${totalHoras}h`,color:'#818cf8'}].map((s,i)=>(
          <div key={i} style={{padding:'18px 20px',background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'8px'}}>
            <p style={{fontSize:'10px',color:'rgba(255,255,255,0.3)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:'8px'}}>{s.label}</p>
            <p style={{fontSize:'24px',fontWeight:'700',color:s.color,fontFamily:"'Playfair Display',serif"}}>{s.val}</p>
          </div>
        ))}
      </div>

      {/* FILTERS */}
      <div style={{display:'flex',gap:'6px',marginBottom:'20px',flexWrap:'wrap'}}>
        {['Todos',...PROJ_ESTADOS].map(s=>(
          <button key={s} onClick={()=>setFilterEstado(s)} style={{all:'unset',cursor:'pointer',padding:'6px 14px',borderRadius:'20px',fontSize:'12px',fontWeight:'600',background:filterEstado===s?PA:'rgba(255,255,255,0.05)',color:filterEstado===s?'#fff':'rgba(255,255,255,0.4)',transition:'all .15s'}}>{s}</button>
        ))}
      </div>

      {/* LIST */}
      {filtered.length===0?(
        <div style={{textAlign:'center',padding:'80px 20px',color:'rgba(255,255,255,0.2)',fontSize:'14px'}}>
          No hay proyectos{filterEstado!=='Todos'?' con este estado':''}.
          <br/><button onClick={()=>{setEditing(null);setView('form');}} style={{all:'unset',cursor:'pointer',color:PA,fontSize:'13px',marginTop:'12px',display:'block'}}>+ Crear primer proyecto →</button>
        </div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:'16px'}}>
          {filtered.map(p=>{
            const pct=getFasesPct(p);
            const clientName=getClientName(p.clienteId);
            const diasRestantes=p.fechaFin?Math.ceil((new Date(p.fechaFin)-new Date())/(1000*60*60*24)):null;
            return(
            <div key={p.id} style={{padding:'20px',background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'8px',display:'flex',flexDirection:'column',gap:'12px',transition:'border .15s',cursor:'pointer'}}
              onMouseOver={e=>e.currentTarget.style.border=`1px solid rgba(6,182,212,0.2)`}
              onMouseOut={e=>e.currentTarget.style.border='1px solid rgba(255,255,255,0.06)'}
              onClick={()=>{setEditing(p);setView('form');}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div>
                  <p style={{fontSize:'10px',color:'rgba(255,255,255,0.2)',marginBottom:'4px'}}>{p.id} · {p.tipo}</p>
                  <h3 style={{fontSize:'15px',fontWeight:'700',color:'#fff',margin:0}}>{p.nombre||'Sin nombre'}</h3>
                  {clientName&&<p style={{fontSize:'12px',color:'rgba(255,255,255,0.35)',marginTop:'2px'}}>{clientName}</p>}
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'4px'}}>
                  <span style={{padding:'3px 9px',borderRadius:'10px',fontSize:'11px',fontWeight:'600',background:`${estadoColor(p.estado)}18`,color:estadoColor(p.estado)}}>{p.estado}</span>
                  <span style={{fontSize:'10px',color:prioColor(p.prioridad)}}>● {p.prioridad}</span>
                </div>
              </div>
              {p.descripcion&&<p style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',lineHeight:'1.5',margin:0,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{p.descripcion}</p>}
              {pct!==null&&(
                <div>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:'5px'}}>
                    <span style={{fontSize:'11px',color:'rgba(255,255,255,0.3)'}}>Fases: {p.fases.filter(f=>f.completada).length}/{p.fases.length}</span>
                    <span style={{fontSize:'11px',fontWeight:'600',color:PA}}>{pct}%</span>
                  </div>
                  <div style={{height:'3px',background:'rgba(255,255,255,0.06)',borderRadius:'2px'}}>
                    <div style={{height:'100%',borderRadius:'2px',background:PA,width:`${pct}%`,transition:'width .3s'}}/>
                  </div>
                </div>
              )}
              <div style={{display:'flex',gap:'16px',borderTop:'1px solid rgba(255,255,255,0.05)',paddingTop:'10px',marginTop:'auto'}}>
                <span style={{fontSize:'11px',color:'rgba(255,255,255,0.25)'}}>{p.horasReales}h real{p.horasEstimadas>0?` / ${p.horasEstimadas}h est.`:''}</span>
                {p.presupuesto>0&&<span style={{fontSize:'11px',color:'rgba(255,255,255,0.25)'}}>{parseFloat(p.presupuesto).toLocaleString('es-ES')}€</span>}
                {diasRestantes!==null&&<span style={{fontSize:'11px',color:diasRestantes<0?'#f87171':diasRestantes<7?'#fbbf24':'rgba(255,255,255,0.25)',marginLeft:'auto'}}>{diasRestantes<0?`${Math.abs(diasRestantes)}d vencido`:diasRestantes===0?'Hoy':`${diasRestantes}d restantes`}</span>}
              </div>
              <button onClick={e=>{e.stopPropagation();del(p.id);}} style={{all:'unset',position:'absolute',display:'none'}}>✕</button>
            </div>
            );
          })}
        </div>
      )}
    </div>
  </div>
  );
}

function ProyectoForm({initial,onSave,onCancel}){
  const PA=PROJ_A;
  const [p,setP]=React.useState(()=>initial?{...initial,fases:(initial.fases||[]).map(f=>({...f}))}:makeProyecto());
  const up=d=>setP(prev=>({...prev,...d}));
  const clients=clients_storage.load();

  const addFase=()=>up({fases:[...(p.fases||[]),makeFase({nombre:'Nueva fase'})]});
  const updFase=(idx,d)=>{const f=[...(p.fases||[])];f[idx]={...f[idx],...d};up({fases:f});};
  const delFase=idx=>{const f=[...(p.fases||[])];f.splice(idx,1);up({fases:f});};

  const completadas=(p.fases||[]).filter(f=>f.completada).length;
  const pct=p.fases&&p.fases.length>0?Math.round(completadas/p.fases.length*100):0;
  const totalHorasFases=(p.fases||[]).reduce((s,f)=>s+parseFloat(f.horas||0),0);

  const inp={all:'unset',display:'block',width:'100%',padding:'9px 12px',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'6px',fontSize:'13px',color:'#fff',boxSizing:'border-box'};
  const sel={...inp,cursor:'pointer'};
  const Sec=({t,ch})=>(<div style={{marginBottom:'28px'}}><p style={{fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.25)',letterSpacing:'.12em',textTransform:'uppercase',marginBottom:'14px',paddingBottom:'8px',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>{t}</p>{ch}</div>);
  const Field=({label,ch,half})=>(<div style={{marginBottom:'14px',width:half?'calc(50% - 7px)':'100%'}}><label style={{display:'block',fontSize:'11px',color:'rgba(255,255,255,0.35)',marginBottom:'5px'}}>{label}</label>{ch}</div>);

  return(
  <div style={{minHeight:'100vh',background:'#0a0a0f',color:'#fff',fontFamily:"'Inter',sans-serif"}}>
    <div style={{borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'0 32px',display:'flex',alignItems:'center',justifyContent:'space-between',height:'56px',position:'sticky',top:0,background:'rgba(10,10,15,0.95)',backdropFilter:'blur(12px)',zIndex:50}}>
      <div style={{display:'flex',alignItems:'center',gap:'16px'}}>
        <button onClick={onCancel} style={{all:'unset',cursor:'pointer',color:'rgba(255,255,255,0.35)',fontSize:'12px',display:'flex',alignItems:'center',gap:'5px'}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Proyectos
        </button>
        <span style={{color:'rgba(255,255,255,0.1)'}}>|</span>
        <span style={{fontSize:'13px',fontWeight:'600',color:'#fff'}}>{initial?p.id:'Nuevo proyecto'}</span>
      </div>
      <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
        {p.fases&&p.fases.length>0&&<div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <div style={{width:'80px',height:'4px',background:'rgba(255,255,255,0.06)',borderRadius:'2px'}}>
            <div style={{height:'100%',borderRadius:'2px',background:PA,width:`${pct}%`}}/>
          </div>
          <span style={{fontSize:'12px',color:PA,fontWeight:'600'}}>{pct}%</span>
        </div>}
        <select value={p.estado} onChange={e=>up({estado:e.target.value})} style={{...sel,width:'auto',fontSize:'12px',padding:'7px 12px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)'}}>
          {PROJ_ESTADOS.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <button onClick={()=>onSave(p)} style={{all:'unset',cursor:'pointer',padding:'8px 20px',background:PA,borderRadius:'6px',fontSize:'13px',fontWeight:'600',color:'#fff'}}>Guardar</button>
      </div>
    </div>

    <div style={{padding:'36px 32px',maxWidth:'800px',margin:'0 auto'}}>
      <Sec t="Información general" ch={<>
        <Field label="Nombre del proyecto" ch={<input style={inp} value={p.nombre} onChange={e=>up({nombre:e.target.value})} placeholder="Ej: Rediseño web corporativa"/>}/>
        <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
          <Field label="Tipo" half ch={<select style={sel} value={p.tipo} onChange={e=>up({tipo:e.target.value})}>{PROJ_TIPOS.map(t=><option key={t} value={t}>{t}</option>)}</select>}/>
          <Field label="Prioridad" half ch={<select style={sel} value={p.prioridad} onChange={e=>up({prioridad:e.target.value})}>{['Alta','Media','Baja'].map(v=><option key={v} value={v}>{v}</option>)}</select>}/>
          <Field label="Cliente" half ch={<select style={sel} value={p.clienteId} onChange={e=>up({clienteId:e.target.value})}><option value="">— Sin cliente —</option>{clients.map(c=><option key={c.id} value={c.id}>{c.empresa||c.nombre}</option>)}</select>}/>
          <Field label="Presupuesto (€)" half ch={<input type="number" style={inp} value={p.presupuesto} onChange={e=>up({presupuesto:parseFloat(e.target.value)||0})} placeholder="0" min="0"/>}/>
          <Field label="Fecha inicio" half ch={<input type="date" style={inp} value={p.fechaInicio} onChange={e=>up({fechaInicio:e.target.value})}/>}/>
          <Field label="Fecha entrega" half ch={<input type="date" style={inp} value={p.fechaFin} onChange={e=>up({fechaFin:e.target.value})}/>}/>
        </div>
        <Field label="Descripción" ch={<textarea style={{...inp,minHeight:'70px',resize:'vertical',lineHeight:'1.5'}} value={p.descripcion} onChange={e=>up({descripcion:e.target.value})} placeholder="Descripción breve del proyecto..."/>}/>
      </>}/>

      <Sec t="Horas" ch={<>
        <div style={{display:'flex',gap:'14px'}}>
          <Field label="Horas estimadas" half ch={<input type="number" style={inp} value={p.horasEstimadas} onChange={e=>up({horasEstimadas:parseFloat(e.target.value)||0})} min="0" step="0.5"/>}/>
          <Field label="Horas reales registradas" half ch={<input type="number" style={inp} value={p.horasReales} onChange={e=>up({horasReales:parseFloat(e.target.value)||0})} min="0" step="0.5"/>}/>
        </div>
        {p.horasEstimadas>0&&<div style={{padding:'12px',background:'rgba(6,182,212,0.04)',border:'1px solid rgba(6,182,212,0.1)',borderRadius:'6px',fontSize:'12px',color:'rgba(255,255,255,0.4)'}}>
          Desviación: <span style={{color:p.horasReales>p.horasEstimadas?'#f87171':PA,fontWeight:'600'}}>{(p.horasReales-p.horasEstimadas>0?'+':'')+((p.horasReales||0)-(p.horasEstimadas||0)).toFixed(1)}h</span>
          {p.presupuesto>0&&p.horasReales>0&&<span style={{marginLeft:'16px'}}>Coste/hora estimado: <span style={{color:PA,fontWeight:'600'}}>{(p.presupuesto/p.horasEstimadas).toFixed(0)}€/h</span></span>}
        </div>}
      </>}/>

      <Sec t={`Fases del proyecto (${completadas}/${(p.fases||[]).length} completadas)`} ch={<>
        <div style={{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'12px'}}>
          {(p.fases||[]).map((f,i)=>(
            <div key={f.id} style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 12px',background:'rgba(255,255,255,0.02)',border:`1px solid ${f.completada?'rgba(6,182,212,0.2)':'rgba(255,255,255,0.06)'}`,borderRadius:'6px'}}>
              <div onClick={()=>updFase(i,{completada:!f.completada})} style={{width:'18px',height:'18px',borderRadius:'4px',border:`1.5px solid ${f.completada?PA:'rgba(255,255,255,0.2)'}`,background:f.completada?PA:'transparent',cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                {f.completada&&<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </div>
              <input style={{...inp,flex:1,padding:'4px 0',background:'transparent',border:'none',textDecoration:f.completada?'line-through':'none',color:f.completada?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.8)'}} value={f.nombre} onChange={e=>updFase(i,{nombre:e.target.value})} placeholder="Nombre de la fase"/>
              <input type="number" style={{...inp,width:'70px',padding:'4px 8px',fontSize:'12px',textAlign:'center'}} value={f.horas} onChange={e=>updFase(i,{horas:parseFloat(e.target.value)||0})} placeholder="h" title="Horas" min="0" step="0.5"/>
              <span style={{fontSize:'10px',color:'rgba(255,255,255,0.2)',flexShrink:0}}>h</span>
              <button onClick={()=>delFase(i)} style={{all:'unset',cursor:'pointer',color:'rgba(255,59,48,0.4)',fontSize:'14px',flexShrink:0}}>✕</button>
            </div>
          ))}
        </div>
        {totalHorasFases>0&&<p style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',marginBottom:'10px'}}>Total horas en fases: {totalHorasFases}h</p>}
        <button onClick={addFase} style={{all:'unset',cursor:'pointer',padding:'8px 16px',border:`1px dashed rgba(6,182,212,0.3)`,borderRadius:'6px',fontSize:'12px',color:PA,width:'100%',textAlign:'center',boxSizing:'border-box'}}>+ Añadir fase</button>
      </>}/>

      <Sec t="Notas" ch={<textarea style={{...inp,minHeight:'80px',resize:'vertical',lineHeight:'1.5'}} value={p.notas} onChange={e=>up({notas:e.target.value})} placeholder="Notas, links, referencias del proyecto..."/>}/>
    </div>
  </div>
  );
}

/* ── BRIEFING MODULE ── */
const BRIEF_KEY='glowlabs_briefings_v1';
const brief_storage={load:()=>{try{return JSON.parse(localStorage.getItem(BRIEF_KEY)||'[]');}catch{return[];}},save:(d)=>localStorage.setItem(BRIEF_KEY,JSON.stringify(d))};
const BRIEF_STEPS=[
  {id:'marca',label:'Marca',icon:'🏢'},
  {id:'audiencia',label:'Audiencia',icon:'👥'},
  {id:'contenido',label:'Contenido',icon:'📱'},
  {id:'competencia',label:'Competencia',icon:'🎯'},
  {id:'objetivos',label:'Objetivos',icon:'🚀'},
];
const EMPTY_BRIEF={
  clienteId:'',
  marca:{nombre:'',descripcion:'',mision:'',valores:'',personalidad:'',colores:'',tipografia:'',logoUrl:''},
  audiencia:{edades:'',genero:'Mixto',ubicacion:'',intereses:'',pain_points:'',tono:''},
  contenido:{redes:[],frecuencia:'',tipos:[],hashtags:'',noPublicar:'',ejemplosRef:''},
  competencia:{comp1:'',comp2:'',comp3:'',diferenciador:''},
  objetivos:{meta1:'',meta2:'',meta3:'',kpi:'',plazo:'3 meses'},
  completado:false,
};
function BriefingModule({onHome}){
  const BF_A='#c084fc';
  const [briefings,setBriefings]=React.useState(()=>brief_storage.load());
  const [view,setView]=React.useState('list');
  const [selectedBrief,setSelectedBrief]=React.useState(null);
  const [step,setStep]=React.useState(0);
  const [form,setForm]=React.useState({...EMPTY_BRIEF});
  const allClients=clients_storage.load();
  const REDES=['Instagram','Facebook','TikTok','YouTube','LinkedIn','Twitter/X','Pinterest'];
  const TIPOS_CONTENIDO=['Posts estáticos','Reels / Videos cortos','Stories','Carruseles','Lives','Podcasts','Blogs'];
  const GENEROS=['Femenino','Masculino','Mixto','Otro'];

  const startNew=()=>{setSelectedBrief(null);setForm({...JSON.parse(JSON.stringify(EMPTY_BRIEF))});setStep(0);setView('editor');};
  const openBrief=(b)=>{setSelectedBrief(b);setForm({...JSON.parse(JSON.stringify(b))});setStep(0);setView('view');};

  const updateField=(section,field,val)=>{
    setForm(f=>({...f,[section]:{...f[section],[field]:val}}));
  };
  const toggleArray=(section,field,val)=>{
    setForm(f=>{const arr=f[section][field]||[];return{...f,[section]:{...f[section],[field]:arr.includes(val)?arr.filter(x=>x!==val):[...arr,val]}};});
  };

  const saveBrief=()=>{
    if(!form.clienteId) return;
    const cliente=allClients.find(c=>c.id===form.clienteId);
    const record={...form,id:selectedBrief?.id||'br'+Date.now(),clienteNombre:cliente?.empresa||cliente?.nombre||'',updatedAt:new Date().toISOString(),completado:true};
    let updated;
    if(selectedBrief){updated=briefings.map(b=>b.id===selectedBrief.id?record:b);}
    else{updated=[record,...briefings];}
    setBriefings(updated);brief_storage.save(updated);setView('list');
  };

  const deleteBrief=(id)=>{const u=briefings.filter(b=>b.id!==id);setBriefings(u);brief_storage.save(u);};

  /* step content */
  const renderStep=(s)=>{
    if(s===0) return(
      <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
        <div><label className="lbl">Cliente *</label>
          <select className="input-f" value={form.clienteId} onChange={e=>setForm({...form,clienteId:e.target.value})}>
            <option value="">Selecciona cliente</option>
            {allClients.map(c=><option key={c.id} value={c.id}>{c.empresa||c.nombre}</option>)}
          </select></div>
        <div><label className="lbl">Nombre de la marca</label><input className="input-f" value={form.marca.nombre} onChange={e=>updateField('marca','nombre',e.target.value)} placeholder="ej: GlowLabs IA"/></div>
        <div><label className="lbl">¿A qué se dedica la empresa?</label><textarea className="input-f" value={form.marca.descripcion} onChange={e=>updateField('marca','descripcion',e.target.value)} rows={3} placeholder="Describe brevemente el negocio, sus productos o servicios..." style={{resize:'none'}}/></div>
        <div><label className="lbl">Misión de la empresa</label><textarea className="input-f" value={form.marca.mision} onChange={e=>updateField('marca','mision',e.target.value)} rows={2} placeholder="¿Cuál es el propósito de la empresa?" style={{resize:'none'}}/></div>
        <div style={{display:'flex',gap:'12px'}}>
          <div style={{flex:1}}><label className="lbl">Valores de marca</label><input className="input-f" value={form.marca.valores} onChange={e=>updateField('marca','valores',e.target.value)} placeholder="ej: Calidad, Innovación, Cercanía"/></div>
          <div style={{flex:1}}><label className="lbl">Personalidad de marca</label><input className="input-f" value={form.marca.personalidad} onChange={e=>updateField('marca','personalidad',e.target.value)} placeholder="ej: Jovial, profesional, innovadora"/></div>
        </div>
        <div style={{display:'flex',gap:'12px'}}>
          <div style={{flex:1}}><label className="lbl">Colores corporativos</label><input className="input-f" value={form.marca.colores} onChange={e=>updateField('marca','colores',e.target.value)} placeholder="ej: Azul #1D4ED8, Blanco, Negro"/></div>
          <div style={{flex:1}}><label className="lbl">Tipografía</label><input className="input-f" value={form.marca.tipografia} onChange={e=>updateField('marca','tipografia',e.target.value)} placeholder="ej: Inter, Playfair Display"/></div>
        </div>
      </div>
    );
    if(s===1) return(
      <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
        <div style={{display:'flex',gap:'12px'}}>
          <div style={{flex:1}}><label className="lbl">Rango de edad del cliente ideal</label><input className="input-f" value={form.audiencia.edades} onChange={e=>updateField('audiencia','edades',e.target.value)} placeholder="ej: 25-45 años"/></div>
          <div style={{flex:1}}><label className="lbl">Género predominante</label>
            <select className="input-f" value={form.audiencia.genero} onChange={e=>updateField('audiencia','genero',e.target.value)}>
              {GENEROS.map(g=><option key={g}>{g}</option>)}
            </select></div>
        </div>
        <div><label className="lbl">Ubicación geográfica</label><input className="input-f" value={form.audiencia.ubicacion} onChange={e=>updateField('audiencia','ubicacion',e.target.value)} placeholder="ej: Colombia, Bogotá principalmente"/></div>
        <div><label className="lbl">Intereses y estilo de vida</label><textarea className="input-f" value={form.audiencia.intereses} onChange={e=>updateField('audiencia','intereses',e.target.value)} rows={2} placeholder="¿Qué le gusta hacer? ¿Qué consume?" style={{resize:'none'}}/></div>
        <div><label className="lbl">Problemas o necesidades que resuelve la marca</label><textarea className="input-f" value={form.audiencia.pain_points} onChange={e=>updateField('audiencia','pain_points',e.target.value)} rows={3} placeholder="¿Qué dolores o necesidades tiene el cliente ideal?" style={{resize:'none'}}/></div>
        <div><label className="lbl">Tono de comunicación preferido</label><input className="input-f" value={form.audiencia.tono} onChange={e=>updateField('audiencia','tono',e.target.value)} placeholder="ej: Cercano y educativo, formal con humor, inspiracional"/></div>
      </div>
    );
    if(s===2) return(
      <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
        <div>
          <label className="lbl">Redes sociales activas</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginTop:'6px'}}>
            {REDES.map(r=>(
              <button key={r} onClick={()=>toggleArray('contenido','redes',r)}
                style={{all:'unset',cursor:'pointer',padding:'5px 12px',borderRadius:'100px',fontSize:'12px',fontWeight:'600',
                  background:(form.contenido.redes||[]).includes(r)?`${BF_A}20`:'rgba(255,255,255,0.05)',
                  color:(form.contenido.redes||[]).includes(r)?BF_A:'rgba(255,255,255,0.4)',
                  border:`1px solid ${(form.contenido.redes||[]).includes(r)?BF_A:'transparent'}`,transition:'all .15s'}}>
                {r}
              </button>
            ))}
          </div>
        </div>
        <div>
          <label className="lbl">Tipos de contenido</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginTop:'6px'}}>
            {TIPOS_CONTENIDO.map(t=>(
              <button key={t} onClick={()=>toggleArray('contenido','tipos',t)}
                style={{all:'unset',cursor:'pointer',padding:'5px 12px',borderRadius:'100px',fontSize:'12px',fontWeight:'600',
                  background:(form.contenido.tipos||[]).includes(t)?`${BF_A}20`:'rgba(255,255,255,0.05)',
                  color:(form.contenido.tipos||[]).includes(t)?BF_A:'rgba(255,255,255,0.4)',
                  border:`1px solid ${(form.contenido.tipos||[]).includes(t)?BF_A:'transparent'}`,transition:'all .15s'}}>
                {t}
              </button>
            ))}
          </div>
        </div>
        <div><label className="lbl">Frecuencia de publicación esperada</label><input className="input-f" value={form.contenido.frecuencia} onChange={e=>updateField('contenido','frecuencia',e.target.value)} placeholder="ej: 5 veces por semana en Instagram, 3 en TikTok"/></div>
        <div><label className="lbl">Hashtags importantes de la marca</label><input className="input-f" value={form.contenido.hashtags} onChange={e=>updateField('contenido','hashtags',e.target.value)} placeholder="ej: #GlowLabs #MarketingIA #AgenciaDigital"/></div>
        <div><label className="lbl">¿Qué NO debe publicarse?</label><textarea className="input-f" value={form.contenido.noPublicar} onChange={e=>updateField('contenido','noPublicar',e.target.value)} rows={2} placeholder="Temas sensibles, competidores directos, restricciones..." style={{resize:'none'}}/></div>
        <div><label className="lbl">Referencias de contenido que les guste</label><textarea className="input-f" value={form.contenido.ejemplosRef} onChange={e=>updateField('contenido','ejemplosRef',e.target.value)} rows={2} placeholder="Cuentas, estilos o tipos de contenido de inspiración..." style={{resize:'none'}}/></div>
      </div>
    );
    if(s===3) return(
      <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
        <div><label className="lbl">Competidor 1</label><input className="input-f" value={form.competencia.comp1} onChange={e=>updateField('competencia','comp1',e.target.value)} placeholder="Nombre, redes sociales, link..."/></div>
        <div><label className="lbl">Competidor 2</label><input className="input-f" value={form.competencia.comp2} onChange={e=>updateField('competencia','comp2',e.target.value)} placeholder="Nombre, redes sociales, link..."/></div>
        <div><label className="lbl">Competidor 3</label><input className="input-f" value={form.competencia.comp3} onChange={e=>updateField('competencia','comp3',e.target.value)} placeholder="Nombre, redes sociales, link..."/></div>
        <div><label className="lbl">¿En qué se diferencia tu marca de la competencia?</label><textarea className="input-f" value={form.competencia.diferenciador} onChange={e=>updateField('competencia','diferenciador',e.target.value)} rows={4} placeholder="Propuesta de valor única, ventajas competitivas..." style={{resize:'none'}}/></div>
      </div>
    );
    if(s===4) return(
      <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
        <div><label className="lbl">Objetivo principal 1</label><input className="input-f" value={form.objetivos.meta1} onChange={e=>updateField('objetivos','meta1',e.target.value)} placeholder="ej: Aumentar seguidores en Instagram a 10,000"/></div>
        <div><label className="lbl">Objetivo principal 2</label><input className="input-f" value={form.objetivos.meta2} onChange={e=>updateField('objetivos','meta2',e.target.value)} placeholder="ej: Generar 5 leads por semana desde redes sociales"/></div>
        <div><label className="lbl">Objetivo principal 3</label><input className="input-f" value={form.objetivos.meta3} onChange={e=>updateField('objetivos','meta3',e.target.value)} placeholder="ej: Mejorar la percepción de marca como expertos"/></div>
        <div><label className="lbl">KPIs de éxito</label><textarea className="input-f" value={form.objetivos.kpi} onChange={e=>updateField('objetivos','kpi',e.target.value)} rows={2} placeholder="¿Cómo mediremos el éxito? Alcance, conversiones, ventas..." style={{resize:'none'}}/></div>
        <div><label className="lbl">Plazo para ver resultados</label>
          <select className="input-f" value={form.objetivos.plazo} onChange={e=>updateField('objetivos','plazo',e.target.value)}>
            {['1 mes','2 meses','3 meses','6 meses','1 año'].map(p=><option key={p}>{p}</option>)}
          </select></div>
      </div>
    );
  };

  /* ── EDITOR VIEW ── */
  if(view==='editor') return(
    <div style={{minHeight:'100vh',background:'#FAF6EF',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",display:'flex',flexDirection:'column'}}>
      <div style={{background:'#FFFFFF',borderBottom:'1px solid rgba(49,49,49,0.08)',padding:'16px 32px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>setView('list')}>← Volver</button>
          <span style={{fontSize:'14px',fontWeight:'700',color:'#fff'}}>Briefing de Cliente</span>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          {step>0&&<button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>setStep(s=>s-1)}>← Anterior</button>}
          {step<BRIEF_STEPS.length-1
            ?<button className="btn-primary" style={{padding:'7px 14px',fontSize:'12px'}} onClick={()=>setStep(s=>s+1)}>Siguiente →</button>
            :<button className="btn-primary" style={{padding:'7px 14px',fontSize:'12px'}} onClick={saveBrief}>Guardar briefing ✓</button>}
        </div>
      </div>
      {/* step nav */}
      <div style={{padding:'0 32px',borderBottom:'1px solid rgba(255,255,255,0.05)',display:'flex',gap:'0'}}>
        {BRIEF_STEPS.map((s,i)=>(
          <button key={s.id} onClick={()=>setStep(i)}
            style={{all:'unset',cursor:'pointer',padding:'12px 20px',fontSize:'12px',fontWeight:'600',borderBottom:`2px solid ${step===i?BF_A:'transparent'}`,
              color:step===i?BF_A:'rgba(255,255,255,0.3)',transition:'all .15s'}}>
            {s.icon} {s.label}
          </button>
        ))}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'6px',padding:'0 16px'}}>
          {BRIEF_STEPS.map((_,i)=>(
            <div key={i} style={{width:'6px',height:'6px',borderRadius:'50%',background:i<=step?BF_A:'rgba(255,255,255,0.1)',transition:'background .2s'}}/>
          ))}
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'28px 32px',maxWidth:'700px'}}>
        <h2 style={{fontSize:'18px',fontWeight:'700',color:'#fff',marginBottom:'4px'}}>{BRIEF_STEPS[step].icon} {BRIEF_STEPS[step].label}</h2>
        <p style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',marginBottom:'20px'}}>Paso {step+1} de {BRIEF_STEPS.length}</p>
        {renderStep(step)}
      </div>
    </div>
  );

  /* ── VIEW (read-only) ── */
  if(view==='view'&&selectedBrief) return(
    <div style={{minHeight:'100vh',background:'#FAF6EF',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",display:'flex',flexDirection:'column'}}>
      <div style={{background:'#FFFFFF',borderBottom:'1px solid rgba(49,49,49,0.08)',padding:'16px 32px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>setView('list')}>← Briefings</button>
          <span style={{fontSize:'14px',fontWeight:'700',color:'#fff'}}>{selectedBrief.clienteNombre}</span>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>{setView('editor');}}>Editar</button>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px',color:'#f87171'}} onClick={()=>{deleteBrief(selectedBrief.id);setView('list');}}>Eliminar</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'28px 32px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',alignContent:'start'}}>
        {[
          {title:'🏢 Marca',data:form.marca,fields:[['Nombre',form.marca.nombre],['Descripción',form.marca.descripcion],['Misión',form.marca.mision],['Valores',form.marca.valores],['Personalidad',form.marca.personalidad],['Colores',form.marca.colores],['Tipografía',form.marca.tipografia]]},
          {title:'👥 Audiencia',data:form.audiencia,fields:[['Edades',form.audiencia.edades],['Género',form.audiencia.genero],['Ubicación',form.audiencia.ubicacion],['Intereses',form.audiencia.intereses],['Necesidades',form.audiencia.pain_points],['Tono',form.audiencia.tono]]},
          {title:'📱 Contenido',data:form.contenido,fields:[['Redes',(form.contenido.redes||[]).join(', ')],['Tipos',(form.contenido.tipos||[]).join(', ')],['Frecuencia',form.contenido.frecuencia],['Hashtags',form.contenido.hashtags],['No publicar',form.contenido.noPublicar],['Referencias',form.contenido.ejemplosRef]]},
          {title:'🎯 Competencia',data:form.competencia,fields:[['Competidor 1',form.competencia.comp1],['Competidor 2',form.competencia.comp2],['Competidor 3',form.competencia.comp3],['Diferenciador',form.competencia.diferenciador]]},
          {title:'🚀 Objetivos',data:form.objetivos,fields:[['Meta 1',form.objetivos.meta1],['Meta 2',form.objetivos.meta2],['Meta 3',form.objetivos.meta3],['KPIs',form.objetivos.kpi],['Plazo',form.objetivos.plazo]]},
        ].map(section=>(
          <div key={section.title} style={{background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'12px',padding:'18px'}}>
            <h3 style={{fontSize:'13px',fontWeight:'700',color:BF_A,marginBottom:'12px'}}>{section.title}</h3>
            {section.fields.filter(([,v])=>v).map(([label,val])=>(
              <div key={label} style={{marginBottom:'10px'}}>
                <p style={{fontSize:'10px',fontWeight:'600',color:'rgba(255,255,255,0.3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'2px'}}>{label}</p>
                <p style={{fontSize:'13px',color:'rgba(255,255,255,0.75)',lineHeight:'1.5',margin:0}}>{val}</p>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );

  /* ── LIST VIEW ── */
  return(
    <div style={{minHeight:'100vh',background:'#FAF6EF',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",display:'flex',flexDirection:'column'}}>
      <div style={{background:'#FFFFFF',borderBottom:'1px solid rgba(49,49,49,0.08)',padding:'16px 32px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={onHome}>← Inicio</button>
          <div style={{width:'1px',height:'18px',background:'rgba(255,255,255,0.08)'}}/>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{width:'22px',height:'22px',background:BF_A,borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <span style={{fontSize:'14px',fontWeight:'700',color:'#313131',letterSpacing:'-.01em'}}>Briefing de Clientes</span>
          </div>
        </div>
        <button className="btn-primary" style={{padding:'7px 14px',fontSize:'12px'}} onClick={startNew}>+ Nuevo briefing</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'24px 32px'}}>
        {briefings.length===0?(
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',paddingTop:'60px',gap:'12px'}}>
            <p style={{fontSize:'13px',color:'rgba(255,255,255,0.2)'}}>Sin briefings todavía</p>
            <button className="btn-primary" style={{fontSize:'12px'}} onClick={startNew}>Crear primer briefing</button>
          </div>
        ):(
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'14px'}}>
            {briefings.map(b=>(
              <div key={b.id} onClick={()=>openBrief(b)}
                style={{background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'12px',padding:'20px',cursor:'pointer',transition:'all .15s'}}
                onMouseOver={e=>{e.currentTarget.style.border=`1px solid ${BF_A}40`;e.currentTarget.style.background='rgba(192,132,252,0.03)';}}
                onMouseOut={e=>{e.currentTarget.style.border='1px solid rgba(255,255,255,0.07)';e.currentTarget.style.background='rgba(255,255,255,0.02)';}}>
                <div style={{width:'32px',height:'32px',background:`${BF_A}15`,borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:'12px',fontSize:'16px'}}>📋</div>
                <h3 style={{fontSize:'14px',fontWeight:'700',color:'#fff',margin:'0 0 4px'}}>{b.clienteNombre}</h3>
                <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',margin:'0 0 10px'}}>{new Date(b.updatedAt).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}</p>
                <div style={{display:'flex',flexWrap:'wrap',gap:'4px'}}>
                  {(b.contenido?.redes||[]).slice(0,3).map(r=>(
                    <span key={r} style={{fontSize:'9px',fontWeight:'600',padding:'2px 7px',borderRadius:'100px',background:`${BF_A}15`,color:BF_A}}>{r}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── PROPUESTAS MODULE ── */
const PROP_KEY='glowlabs_propuestas_v1';
const prop_storage={load:()=>{try{return JSON.parse(localStorage.getItem(PROP_KEY)||'[]');}catch{return[];}},save:(d)=>localStorage.setItem(PROP_KEY,JSON.stringify(d))};
const SERVICIOS_PRESET=[
  {nombre:'Gestión de Redes Sociales',desc:'Creación y publicación de contenido para Instagram, Facebook y TikTok.',precio:1500000},
  {nombre:'Fotografía Profesional',desc:'Sesión fotográfica mensual para contenido de marca.',precio:800000},
  {nombre:'Diseño Gráfico',desc:'Diseño de piezas gráficas para redes sociales y marketing.',precio:600000},
  {nombre:'Publicidad Pagada (Ads)',desc:'Gestión de campañas en Meta Ads y Google Ads.',precio:1200000},
  {nombre:'Estrategia de Contenido',desc:'Planificación editorial mensual y análisis de competencia.',precio:500000},
  {nombre:'Reels y Video',desc:'Producción y edición de Reels mensuales para Instagram/TikTok.',precio:1000000},
  {nombre:'Community Management',desc:'Respuesta a comentarios, DMs y gestión de comunidad.',precio:700000},
  {nombre:'Reporte Mensual',desc:'Informe de resultados con métricas clave y recomendaciones.',precio:300000},
];
function PropuestasModule({onHome}){
  const PR_A='#38bdf8';
  const [props,setProps]=React.useState(()=>prop_storage.load());
  const [view,setView]=React.useState('list');
  const [editProp,setEditProp]=React.useState(null);
  const [form,setForm]=React.useState({clienteId:'',titulo:'',validez:30,intro:'',servicios:[],notas:'',estado:'Borrador'});
  const [filterEstado,setFilterEstado]=React.useState('Todos');
  const [previewProp,setPreviewProp]=React.useState(null);
  const allClients=clients_storage.load();
  const ESTADOS=['Borrador','Enviada','Aceptada','Rechazada'];
  const EST_C={Borrador:'#9ca3af',Enviada:'#38bdf8',Aceptada:'#4ade80',Rechazada:'#f87171'};

  const newProp=()=>{
    setEditProp(null);
    setForm({clienteId:'',titulo:'',validez:30,intro:'Nos complace presentarte nuestra propuesta de servicios de marketing digital. Hemos diseñado un plan personalizado para ayudarte a crecer en redes sociales y alcanzar tus objetivos de negocio.',servicios:[],notas:'Esta propuesta tiene validez de 30 días a partir de la fecha de envío.',estado:'Borrador'});
    setView('editor');
  };
  const editP=(p)=>{setEditProp(p);setForm({...p,servicios:[...(p.servicios||[])]});setView('editor');};

  const addServicio=(preset)=>{
    setForm(f=>({...f,servicios:[...f.servicios,{...preset,id:'s'+Date.now(),cantidad:1,personalizado:false}]}));
  };
  const addCustom=()=>{
    setForm(f=>({...f,servicios:[...f.servicios,{id:'s'+Date.now(),nombre:'Servicio personalizado',desc:'',precio:0,cantidad:1,personalizado:true}]}));
  };
  const updateServicio=(id,field,val)=>{
    setForm(f=>({...f,servicios:f.servicios.map(s=>s.id===id?{...s,[field]:val}:s)}));
  };
  const removeServicio=(id)=>{setForm(f=>({...f,servicios:f.servicios.filter(s=>s.id!==id)}));};

  const total=(servicios)=>servicios.reduce((s,sv)=>s+(sv.precio||0)*(sv.cantidad||1),0);

  const saveProp=()=>{
    if(!form.clienteId||!form.titulo.trim()) return;
    const cliente=allClients.find(c=>c.id===form.clienteId);
    const record={
      ...form,
      id:editProp?.id||'p'+Date.now(),
      clienteNombre:cliente?.empresa||cliente?.nombre||'',
      total:total(form.servicios),
      fecha:editProp?.fecha||new Date().toISOString().slice(0,10),
      updatedAt:new Date().toISOString(),
    };
    let updated;
    if(editProp){updated=props.map(p=>p.id===editProp.id?record:p);}
    else{updated=[record,...props];}
    setProps(updated);prop_storage.save(updated);setView('list');
  };

  const changeEstado=(id,estado)=>{
    const updated=props.map(p=>p.id===id?{...p,estado,updatedAt:new Date().toISOString()}:p);
    setProps(updated);prop_storage.save(updated);
    if(previewProp?.id===id) setPreviewProp({...previewProp,estado});
  };
  const deleteProp=(id)=>{const u=props.filter(p=>p.id!==id);setProps(u);prop_storage.save(u);if(previewProp?.id===id)setPreviewProp(null);};

  const filtered=props.filter(p=>filterEstado==='Todos'||p.estado===filterEstado);

  /* ── EDITOR VIEW ── */
  if(view==='editor') return(
    <div style={{minHeight:'100vh',background:'#FAF6EF',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",display:'flex',flexDirection:'column'}}>
      <div style={{background:'#FFFFFF',borderBottom:'1px solid rgba(49,49,49,0.08)',padding:'16px 32px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>setView('list')}>← Volver</button>
          <span style={{fontSize:'14px',fontWeight:'700',color:'#fff'}}>{editProp?'Editar propuesta':'Nueva propuesta'}</span>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={()=>setView('list')}>Cancelar</button>
          <button className="btn-primary" style={{padding:'7px 14px',fontSize:'12px'}} onClick={saveProp}>Guardar propuesta</button>
        </div>
      </div>
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* left: form */}
        <div style={{flex:1,overflowY:'auto',padding:'28px 32px',display:'flex',flexDirection:'column',gap:'18px',maxWidth:'600px'}}>
          <div style={{display:'flex',gap:'12px'}}>
            <div style={{flex:2}}><label className="lbl">Cliente *</label>
              <select className="input-f" value={form.clienteId} onChange={e=>setForm({...form,clienteId:e.target.value})}>
                <option value="">Selecciona cliente</option>
                {allClients.map(c=><option key={c.id} value={c.id}>{c.empresa||c.nombre}</option>)}
              </select></div>
            <div style={{flex:2}}><label className="lbl">Título de propuesta *</label>
              <input className="input-f" placeholder="ej: Plan Starter — 3 Redes" value={form.titulo} onChange={e=>setForm({...form,titulo:e.target.value})}/></div>
            <div style={{flex:1}}><label className="lbl">Validez (días)</label>
              <input className="input-f" type="number" value={form.validez} onChange={e=>setForm({...form,validez:parseInt(e.target.value)||30})}/></div>
          </div>
          <div><label className="lbl">Introducción</label>
            <textarea className="input-f" value={form.intro} onChange={e=>setForm({...form,intro:e.target.value})} rows={3} style={{resize:'vertical'}}/></div>

          {/* services */}
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
              <label className="lbl" style={{margin:0}}>Servicios incluidos</label>
              <button className="btn-ghost" style={{padding:'4px 10px',fontSize:'11px'}} onClick={addCustom}>+ Personalizado</button>
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'12px'}}>
              {SERVICIOS_PRESET.map(s=>(
                <button key={s.nombre} onClick={()=>addServicio(s)}
                  style={{all:'unset',cursor:'pointer',padding:'4px 10px',borderRadius:'100px',fontSize:'11px',fontWeight:'600',
                    background:form.servicios.some(sv=>sv.nombre===s.nombre)?`${PR_A}20`:'rgba(255,255,255,0.05)',
                    color:form.servicios.some(sv=>sv.nombre===s.nombre)?PR_A:'rgba(255,255,255,0.4)',
                    border:`1px solid ${form.servicios.some(sv=>sv.nombre===s.nombre)?PR_A:'transparent'}`,transition:'all .15s'}}>
                  + {s.nombre}
                </button>
              ))}
            </div>
            {form.servicios.length>0&&(
              <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                {form.servicios.map(sv=>(
                  <div key={sv.id} style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'8px',padding:'10px 14px',display:'flex',gap:'10px',alignItems:'center'}}>
                    <div style={{flex:1,minWidth:0}}>
                      {sv.personalizado?(
                        <input className="input-f" value={sv.nombre} onChange={e=>updateServicio(sv.id,'nombre',e.target.value)} placeholder="Nombre del servicio" style={{marginBottom:'4px',padding:'4px 8px',fontSize:'12px'}}/>
                      ):(
                        <p style={{fontSize:'13px',fontWeight:'600',color:'rgba(255,255,255,0.8)',margin:'0 0 2px'}}>{sv.nombre}</p>
                      )}
                      {sv.personalizado?(
                        <input className="input-f" value={sv.desc} onChange={e=>updateServicio(sv.id,'desc',e.target.value)} placeholder="Descripción…" style={{padding:'4px 8px',fontSize:'11px'}}/>
                      ):(
                        <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',margin:0}}>{sv.desc}</p>
                      )}
                    </div>
                    <div style={{display:'flex',gap:'6px',alignItems:'center',flexShrink:0}}>
                      <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'2px'}}>
                        <input type="number" value={sv.precio} onChange={e=>updateServicio(sv.id,'precio',parseFloat(e.target.value)||0)}
                          style={{width:'110px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'6px',padding:'4px 8px',color:'#fff',fontSize:'12px',textAlign:'right',fontFamily:"'Inter',sans-serif",outline:'none'}}/>
                        <span style={{fontSize:'9px',color:'rgba(255,255,255,0.2)'}}>COP / mes</span>
                      </div>
                      <button onClick={()=>removeServicio(sv.id)} style={{all:'unset',cursor:'pointer',color:'rgba(255,255,255,0.2)',padding:'4px'}}
                        onMouseOver={e=>e.currentTarget.style.color='#f87171'} onMouseOut={e=>e.currentTarget.style.color='rgba(255,255,255,0.2)'}>✕</button>
                    </div>
                  </div>
                ))}
                <div style={{display:'flex',justifyContent:'flex-end',padding:'8px 14px 0',borderTop:'1px solid rgba(255,255,255,0.06)',marginTop:'4px'}}>
                  <span style={{fontSize:'14px',fontWeight:'700',color:PR_A}}>Total: ${total(form.servicios).toLocaleString('es-CO')} / mes</span>
                </div>
              </div>
            )}
          </div>
          <div><label className="lbl">Notas y condiciones</label>
            <textarea className="input-f" value={form.notas} onChange={e=>setForm({...form,notas:e.target.value})} rows={2} style={{resize:'vertical'}}/></div>
        </div>

        {/* right: live preview */}
        <div style={{width:'380px',flexShrink:0,borderLeft:'1px solid rgba(255,255,255,0.06)',overflowY:'auto',padding:'28px 24px',background:'rgba(255,255,255,0.01)'}}>
          <p style={{fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.2)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'16px'}}>Vista previa</p>
          <div style={{background:'#fff',borderRadius:'10px',overflow:'hidden',boxShadow:'0 20px 60px rgba(0,0,0,0.6)'}}>
            <div style={{background:'linear-gradient(135deg,#0f172a,#1e1b4b)',padding:'24px',color:'#fff'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'16px'}}>
                <div>
                  <p style={{fontSize:'10px',fontWeight:'700',letterSpacing:'.1em',color:'rgba(255,255,255,0.4)',textTransform:'uppercase',marginBottom:'4px'}}>Propuesta de servicios</p>
                  <h1 style={{fontSize:'20px',fontWeight:'800',margin:0,lineHeight:'1.2'}}>{form.titulo||'Título de la propuesta'}</h1>
                </div>
                <div style={{textAlign:'right',fontSize:'11px',color:'rgba(255,255,255,0.4)'}}>
                  <p style={{margin:'0 0 2px'}}>GlowLabs IA</p>
                  <p style={{margin:0}}>{new Date().toLocaleDateString('es-ES')}</p>
                  <p style={{margin:'4px 0 0',color:'rgba(255,255,255,0.3)'}}>Válida {form.validez} días</p>
                </div>
              </div>
              {allClients.find(c=>c.id===form.clienteId)&&(
                <p style={{fontSize:'13px',color:'rgba(255,255,255,0.6)',margin:0}}>Para: <span style={{color:'#fff',fontWeight:'600'}}>{allClients.find(c=>c.id===form.clienteId)?.empresa||allClients.find(c=>c.id===form.clienteId)?.nombre}</span></p>
              )}
            </div>
            {form.intro&&<div style={{padding:'16px 20px',background:'#f8fafc',borderBottom:'1px solid #e2e8f0'}}><p style={{fontSize:'12px',color:'#475569',lineHeight:'1.6',margin:0}}>{form.intro}</p></div>}
            <div style={{padding:'16px 20px'}}>
              {form.servicios.map((sv,i)=>(
                <div key={sv.id} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'10px 0',borderBottom:i<form.servicios.length-1?'1px solid #f1f5f9':'none'}}>
                  <div>
                    <p style={{fontSize:'13px',fontWeight:'600',color:'#1e293b',margin:'0 0 2px'}}>{sv.nombre}</p>
                    {sv.desc&&<p style={{fontSize:'11px',color:'#64748b',margin:0,maxWidth:'200px'}}>{sv.desc}</p>}
                  </div>
                  <p style={{fontSize:'13px',fontWeight:'700',color:'#0f172a',flexShrink:0,margin:0}}>${(sv.precio||0).toLocaleString('es-CO')}</p>
                </div>
              ))}
              {form.servicios.length>0&&(
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'12px',paddingTop:'12px',borderTop:'2px solid #0f172a'}}>
                  <span style={{fontSize:'14px',fontWeight:'700',color:'#0f172a'}}>Total mensual</span>
                  <span style={{fontSize:'18px',fontWeight:'800',color:'#4f46e5'}}>${total(form.servicios).toLocaleString('es-CO')}</span>
                </div>
              )}
            </div>
            {form.notas&&<div style={{padding:'12px 20px',background:'#f8fafc',borderTop:'1px solid #e2e8f0'}}><p style={{fontSize:'11px',color:'#64748b',margin:0,fontStyle:'italic'}}>{form.notas}</p></div>}
          </div>
        </div>
      </div>
    </div>
  );

  /* ── LIST VIEW ── */
  return(
    <div style={{minHeight:'100vh',background:'#FAF6EF',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",display:'flex',flexDirection:'column'}}>
      <div style={{background:'#FFFFFF',borderBottom:'1px solid rgba(49,49,49,0.08)',padding:'16px 32px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={onHome}>← Inicio</button>
          <div style={{width:'1px',height:'18px',background:'rgba(255,255,255,0.08)'}}/>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{width:'22px',height:'22px',background:PR_A,borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <span style={{fontSize:'14px',fontWeight:'700',color:'#313131',letterSpacing:'-.01em'}}>Propuestas</span>
          </div>
        </div>
        <button className="btn-primary" style={{padding:'7px 14px',fontSize:'12px'}} onClick={newProp}>+ Nueva propuesta</button>
      </div>

      {/* filters */}
      <div style={{padding:'10px 32px',borderBottom:'1px solid rgba(255,255,255,0.05)',display:'flex',gap:'4px'}}>
        {['Todos',...ESTADOS].map(e=>(
          <button key={e} onClick={()=>setFilterEstado(e)}
            style={{all:'unset',cursor:'pointer',padding:'4px 12px',borderRadius:'100px',fontSize:'11px',fontWeight:'600',
              background:filterEstado===e?(EST_C[e]||PR_A):'rgba(255,255,255,0.05)',
              color:filterEstado===e?'#000':'rgba(255,255,255,0.4)',transition:'all .15s'}}>{e}</button>
        ))}
      </div>

      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* list */}
        <div style={{flex:1,overflowY:'auto',padding:'20px 32px',display:'flex',flexDirection:'column',gap:'10px'}}>
          {filtered.length===0&&(
            <div style={{textAlign:'center',paddingTop:'60px'}}>
              <p style={{fontSize:'13px',color:'rgba(255,255,255,0.2)',marginBottom:'12px'}}>Sin propuestas</p>
              <button className="btn-primary" style={{fontSize:'12px'}} onClick={newProp}>Crear primera propuesta</button>
            </div>
          )}
          {filtered.map(p=>(
            <div key={p.id} onClick={()=>setPreviewProp(p)}
              style={{background:'rgba(255,255,255,0.02)',border:`1px solid ${previewProp?.id===p.id?PR_A+'50':'rgba(255,255,255,0.07)'}`,borderRadius:'10px',padding:'16px 20px',cursor:'pointer',transition:'all .15s'}}
              onMouseOver={e=>e.currentTarget.style.border=`1px solid ${PR_A}30`}
              onMouseOut={e=>e.currentTarget.style.border=`1px solid ${previewProp?.id===p.id?PR_A+'50':'rgba(255,255,255,0.07)'}`}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div>
                  <div style={{display:'flex',gap:'6px',marginBottom:'6px'}}>
                    <span style={{fontSize:'10px',fontWeight:'700',padding:'2px 8px',borderRadius:'100px',background:`${EST_C[p.estado]||'#9ca3af'}20`,color:EST_C[p.estado]||'#9ca3af'}}>{p.estado}</span>
                  </div>
                  <h3 style={{fontSize:'15px',fontWeight:'700',color:'#fff',margin:'0 0 3px'}}>{p.titulo}</h3>
                  <p style={{fontSize:'12px',color:'rgba(255,255,255,0.4)',margin:0}}>{p.clienteNombre} · {new Date(p.fecha+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long'})}</p>
                </div>
                <div style={{textAlign:'right'}}>
                  <p style={{fontSize:'18px',fontWeight:'800',color:PR_A,letterSpacing:'-.02em',margin:'0 0 4px'}}>${(p.total||0).toLocaleString('es-CO')}</p>
                  <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',margin:0}}>{(p.servicios||[]).length} servicios</p>
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* preview panel */}
        {previewProp&&(
          <div style={{width:'420px',flexShrink:0,borderLeft:'1px solid rgba(255,255,255,0.06)',overflowY:'auto',padding:'20px',background:'rgba(255,255,255,0.005)'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'12px',flexWrap:'wrap',gap:'6px'}}>
              <div style={{display:'flex',gap:'4px',flexWrap:'wrap'}}>
                {ESTADOS.map(e=>(
                  <button key={e} onClick={()=>changeEstado(previewProp.id,e)}
                    style={{all:'unset',cursor:'pointer',padding:'3px 9px',borderRadius:'100px',fontSize:'10px',fontWeight:'700',
                      background:previewProp.estado===e?(EST_C[e]||PR_A):'rgba(255,255,255,0.05)',
                      color:previewProp.estado===e?'#000':'rgba(255,255,255,0.3)',transition:'all .15s'}}>{e}</button>
                ))}
              </div>
              <div style={{display:'flex',gap:'6px'}}>
                <button className="btn-ghost" style={{padding:'4px 10px',fontSize:'11px'}} onClick={()=>editP(previewProp)}>Editar</button>
                <button className="btn-ghost" style={{padding:'4px 10px',fontSize:'11px',color:'#f87171'}} onClick={()=>{deleteProp(previewProp.id);setPreviewProp(null);}}>Eliminar</button>
              </div>
            </div>
            {/* mini preview of the proposal */}
            <div style={{background:'#fff',borderRadius:'10px',overflow:'hidden'}}>

              {previewProp.intro&&<div style={{padding:'12px 16px',background:'#f8fafc',borderBottom:'1px solid #e2e8f0'}}><p style={{fontSize:'11px',color:'#475569',margin:0,lineHeight:'1.5'}}>{previewProp.intro}</p></div>}
              <div style={{padding:'12px 16px'}}>

                    <div>
                      <p style={{fontSize:'12px',fontWeight:'600',color:'#1e293b',margin:'0 0 1px'}}>{sv.nombre}</p>
                      {sv.desc&&<p style={{fontSize:'10px',color:'#94a3b8',margin:0}}>{sv.desc}</p>}
                    </div>
                    <p style={{fontSize:'12px',fontWeight:'700',color:'#0f172a',flexShrink:0,margin:0}}>${(sv.precio||0).toLocaleString('es-CO')}</p>
                  </div>
                ))}
                {(previewProp.servicios||[]).length>0&&(
                  <div style={{display:'flex',justifyContent:'space-between',marginTop:'10px',paddingTop:'10px',borderTop:'2px solid #0f172a'}}>
                    <span style={{fontSize:'13px',fontWeight:'700',color:'#0f172a'}}>Total mensual</span>
                    <span style={{fontSize:'16px',fontWeight:'800',color:'#4f46e5'}}>${(previewProp.total||0).toLocaleString('es-CO')}</span>
                  </div>
                )}
              </div>
              {previewProp.notas&&<div style={{padding:'10px 16px',background:'#f8fafc',borderTop:'1px solid #e2e8f0'}}><p style={{fontSize:'10px',color:'#64748b',margin:0,fontStyle:'italic'}}>{previewProp.notas}</p></div>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── OBJETIVOS MODULE ── */
const GOALS_KEY='glowlabs_objetivos_v1';

function ObjetivosModule({onHome}){

  const [filterPeriodo,setFilterPeriodo]=React.useState('Todos');

  const CAT_C={Ingresos:'#4ade80',Clientes:'#38bdf8',Contenido:'#f472b6',Horas:'#a3e635',Equipo:'#a78bfa',Marketing:'#fb923c',Otro:'#9ca3af'};

  const openNew=()=>{setEditGoal(null);setForm({titulo:'',descripcion:'',tipo:'number',unidad:'',meta:100,actual:0,periodo:'Mensual',categoria:'Ingresos',fechaFin:''});setShowForm(true);};
  const openEdit=(g)=>{setEditGoal(g);setForm({...g});setShowForm(true);};

    if(!form.titulo.trim()||!form.meta) return;

      updated=goals.map(g=>g.id===editGoal.id?{...form,id:editGoal.id,updatedAt:new Date().toISOString()}:g);
    } else {
      updated=[{...form,id:'g'+Date.now(),creadoEn:new Date().toISOString()},...goals];
    }
    setGoals(updated);goals_storage.save(updated);setShowForm(false);
  };

  const updateProgress=(id,val)=>{
    const updated=goals.map(g=>g.id===id?{...g,actual:Math.max(0,Math.min(parseFloat(val)||0,g.meta*2))}:g);

  const deleteGoal=(id)=>{const u=goals.filter(g=>g.id!==id);setGoals(u);goals_storage.save(u);};

                  onMouseOver={e=>e.currentTarget.style.border=`1px solid ${CAT_C[g.categoria]||OB_A}30`}
                  onMouseOut={e=>e.currentTarget.style.border='1px solid rgba(255,255,255,0.07)'}>

                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div>
                      <div style={{display:'flex',gap:'6px',marginBottom:'6px'}}>
                        <span style={{fontSize:'9px',fontWeight:'700',padding:'2px 7px',borderRadius:'100px',background:`${CAT_C[g.categoria]||OB_A}18`,color:CAT_C[g.categoria]||OB_A,textTransform:'uppercase'}}>{g.categoria}</span>
                        <span style={{fontSize:'9px',fontWeight:'700',padding:'2px 7px',borderRadius:'100px',background:'rgba(255,255,255,0.05)',color:'rgba(255,255,255,0.3)',textTransform:'uppercase'}}>{g.periodo}</span>
                      </div>
                      <h3 style={{fontSize:'15px',fontWeight:'700',color:'#fff',lineHeight:'1.3',margin:0}}>{g.titulo}</h3>
                      {g.descripcion&&<p style={{fontSize:'12px',color:'rgba(255,255,255,0.35)',lineHeight:'1.4',marginTop:'4px'}}>{g.descripcion}</p>}
                    </div>
                    <div style={{display:'flex',gap:'4px',flexShrink:0}}>
                      <button onClick={()=>openEdit(g)} style={{all:'unset',cursor:'pointer',padding:'4px',color:'rgba(255,255,255,0.2)',transition:'color .15s'}}
                        onMouseOver={e=>e.currentTarget.style.color=OB_A} onMouseOut={e=>e.currentTarget.style.color='rgba(255,255,255,0.2)'}>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>

                      <span style={{fontSize:'26px',fontWeight:'800',color:sc,letterSpacing:'-.02em'}}>{p}%</span>
                      <span style={{fontSize:'12px',color:'rgba(255,255,255,0.4)'}}>
                        <span style={{color:'rgba(255,255,255,0.7)',fontWeight:'600'}}>{g.actual.toLocaleString('es-CO')}</span>
                        {' / '}{g.meta.toLocaleString('es-CO')} {g.unidad}
                      </span>
                    </div>
                    <div style={{height:'6px',background:'rgba(255,255,255,0.06)',borderRadius:'3px',overflow:'hidden'}}>
                      <div style={{height:'100%',background:sc,borderRadius:'3px',width:`${p}%`,transition:'width .4s ease'}}/>
                    </div>
                  </div>

                  {/* update progress inline */}
                  <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                    <input type="number" value={g.actual} min="0" step={g.meta>=1000?100:g.meta>=100?10:1}

                      style={{width:'100px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'7px',padding:'5px 10px',color:'#fff',fontSize:'13px',fontWeight:'600',outline:'none',fontFamily:"'Inter',sans-serif"}}/>
                    <span style={{fontSize:'12px',color:'rgba(255,255,255,0.3)'}}>{g.unidad}</span>
                    {g.fechaFin&&<span style={{marginLeft:'auto',fontSize:'10px',color:'rgba(255,255,255,0.2)'}}>Hasta {new Date(g.fechaFin+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</span>}

              );
            })}
          </div>
        )}
      </div>

      {/* modal */}
      {showForm&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300}}>
          <div style={{background:'#111',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'16px',padding:'28px',width:'440px',maxHeight:'85vh',overflowY:'auto'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>

              <div style={{display:'flex',gap:'12px'}}>
                <div style={{flex:1}}><label className="lbl">Categoría</label>
                  <select className="input-f" value={form.categoria} onChange={e=>setForm({...form,categoria:e.target.value})}>
                    {CATS.map(c=><option key={c}>{c}</option>)}
                  </select></div>
                <div style={{flex:1}}><label className="lbl">Período</label>
                  <select className="input-f" value={form.periodo} onChange={e=>setForm({...form,periodo:e.target.value})}>
                    {PERIODOS.map(p=><option key={p}>{p}</option>)}
                  </select></div>
              </div>
              <div style={{display:'flex',gap:'12px'}}>
                <div style={{flex:1}}><label className="lbl">Meta *</label><input className="input-f" type="number" placeholder="100" value={form.meta} onChange={e=>setForm({...form,meta:parseFloat(e.target.value)||0})}/></div>
                <div style={{flex:1}}><label className="lbl">Unidad</label><input className="input-f" placeholder="ej: clientes, $, h" value={form.unidad} onChange={e=>setForm({...form,unidad:e.target.value})}/></div>
              </div>
              <div style={{display:'flex',gap:'12px'}}>
                <div style={{flex:1}}><label className="lbl">Valor actual</label><input className="input-f" type="number" value={form.actual} onChange={e=>setForm({...form,actual:parseFloat(e.target.value)||0})}/></div>
                <div style={{flex:1}}><label className="lbl">Fecha límite</label><input className="input-f" type="date" value={form.fechaFin} onChange={e=>setForm({...form,fechaFin:e.target.value})}/></div>
              </div>
              <div style={{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'4px'}}>
                <button className="btn-ghost" onClick={()=>setShowForm(false)}>Cancelar</button>
                <button className="btn-primary" onClick={saveGoal}>{editGoal?'Guardar cambios':'Crear objetivo'}</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── CONTROL DE HORAS MODULE ── */
const HOURS_KEY='glowlabs_horas_v1';
const hours_storage={load:()=>{try{return JSON.parse(localStorage.getItem(HOURS_KEY)||'[]');}catch{return[];}},save:(d)=>localStorage.setItem(HOURS_KEY,JSON.stringify(d))};
function HorasModule({onHome,currentUser,isAdmin}){
  const HR_A='#a3e635';
  const [entries,setEntries]=React.useState(()=>hours_storage.load());
  const [showForm,setShowForm]=React.useState(false);
  const [form,setForm]=React.useState({clienteId:'',proyecto:'',descripcion:'',horas:'',fecha:new Date().toISOString().slice(0,10),categoria:'Gestión'});
  const [filterUser,setFilterUser]=React.useState('todos');
  const [filterClient,setFilterClient]=React.useState('todos');
  const [filterWeek,setFilterWeek]=React.useState('esta');
  const [timerActive,setTimerActive]=React.useState(false);
  const [timerStart,setTimerStart]=React.useState(null);
  const [timerElapsed,setTimerElapsed]=React.useState(0);
  const timerRef=React.useRef(null);
  const allClients=clients_storage.load();
  const allUsers=users_storage.load();
  const CATS=['Gestión','Contenido','Diseño','Estrategia','Reunión','Reportes','Administración','Otro'];

  React.useEffect(()=>{
    if(timerActive){
      timerRef.current=setInterval(()=>setTimerElapsed(Math.floor((Date.now()-timerStart)/1000)),1000);
    } else {
      clearInterval(timerRef.current);
    }
    return()=>clearInterval(timerRef.current);
  },[timerActive,timerStart]);

  const startTimer=()=>{setTimerStart(Date.now());setTimerActive(true);setTimerElapsed(0);};
  const stopTimer=()=>{
    setTimerActive(false);
    const hrs=(timerElapsed/3600).toFixed(2);
    setForm(f=>({...f,horas:hrs}));
    setShowForm(true);
  };
  const fmtTimer=s=>`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  const saveEntry=()=>{
    if(!form.clienteId||!form.horas||parseFloat(form.horas)<=0) return;
    const entry={
      id:'h'+Date.now(),
      userId:currentUser?.id||'admin',
      userName:currentUser?.nombre||'Admin',
      clienteId:form.clienteId,
      clienteNombre:allClients.find(c=>c.id===form.clienteId)?.empresa||allClients.find(c=>c.id===form.clienteId)?.nombre||'',
      proyecto:form.proyecto,
      descripcion:form.descripcion,
      horas:parseFloat(form.horas),
      fecha:form.fecha,
      categoria:form.categoria,
      creadoEn:new Date().toISOString(),
    };
    const updated=[entry,...entries];
    setEntries(updated);hours_storage.save(updated);
    setShowForm(false);setForm({clienteId:'',proyecto:'',descripcion:'',horas:'',fecha:new Date().toISOString().slice(0,10),categoria:'Gestión'});
  };

  const deleteEntry=(id)=>{const u=entries.filter(e=>e.id!==id);setEntries(u);hours_storage.save(u);};

  // Week helpers
  const getWeekRange=(offset=0)=>{
    const now=new Date();
    const day=now.getDay();
    const mon=new Date(now);mon.setDate(now.getDate()-(day===0?6:day-1)+offset*7);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return{start:mon.toISOString().slice(0,10),end:sun.toISOString().slice(0,10)};
  };
  const weekOffset=filterWeek==='esta'?0:filterWeek==='pasada'?-1:null;
  const weekRange=weekOffset!==null?getWeekRange(weekOffset):null;

  const filtered=entries.filter(e=>{
    if(!isAdmin&&e.userId!==currentUser?.id) return false;
    if(isAdmin&&filterUser!=='todos'&&e.userId!==filterUser) return false;
    if(filterClient!=='todos'&&e.clienteId!==filterClient) return false;
    if(weekRange&&(e.fecha<weekRange.start||e.fecha>weekRange.end)) return false;
    return true;
  });

  const totalHoras=filtered.reduce((s,e)=>s+e.horas,0);
  const byClient=filtered.reduce((acc,e)=>{acc[e.clienteNombre]=(acc[e.clienteNombre]||0)+e.horas;return acc;},{});
  const byUser=filtered.reduce((acc,e)=>{acc[e.userName]=(acc[e.userName]||0)+e.horas;return acc;},{});
  const byCat=filtered.reduce((acc,e)=>{acc[e.categoria]=(acc[e.categoria]||0)+e.horas;return acc;},{});

  const CAT_C={'Gestión':'#9ca3af',Contenido:'#38bdf8',Diseño:'#f472b6',Estrategia:'#a78bfa',Reunión:'#fb923c',Reportes:'#fbbf24',Administración:'#4ade80',Otro:'#f87171'};

  return(
    <div style={{minHeight:'100vh',background:'#FAF6EF',fontFamily:"'Plus Jakarta Sans','Inter',sans-serif",display:'flex',flexDirection:'column'}}>
      {/* header */}
      <div style={{background:'#FFFFFF',borderBottom:'1px solid rgba(49,49,49,0.08)',padding:'16px 32px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={onHome}>← Inicio</button>

          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>

            </div>

          </div>
        </div>
        <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
          {/* timer */}

            <span style={{fontFamily:'monospace',fontSize:'14px',color:timerActive?HR_A:'rgba(255,255,255,0.3)',fontWeight:'700',minWidth:'70px'}}>{fmtTimer(timerElapsed)}</span>
            {!timerActive?(
              <button onClick={startTimer} style={{all:'unset',cursor:'pointer',width:'24px',height:'24px',background:HR_A,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center'}}>

              <button onClick={stopTimer} style={{all:'unset',cursor:'pointer',width:'24px',height:'24px',background:'#f87171',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center'}}>

                    color:filterWeek===v?HR_A:'rgba(255,255,255,0.4)',fontWeight:filterWeek===v?'700':'400',transition:'all .15s'}}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          {isAdmin&&(
            <div>
              <p style={{fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.2)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'8px'}}>Equipo</p>

          {Object.keys(byCat).length>0&&(

              <p style={{fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.2)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'8px'}}>Por categoría</p>

              {filtered.map(entry=>(
                <div key={entry.id} style={{background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'10px',padding:'14px 18px',display:'flex',alignItems:'center',gap:'16px',transition:'border .15s'}}
                  onMouseOver={e=>e.currentTarget.style.border='1px solid rgba(163,230,53,0.2)'}
                  onMouseOut={e=>e.currentTarget.style.border='1px solid rgba(255,255,255,0.06)'}>
                  <div style={{textAlign:'center',minWidth:'40px'}}>
                    <p style={{fontSize:'18px',fontWeight:'800',color:HR_A,lineHeight:1}}>{entry.horas.toFixed(1)}</p>

                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}}>
