                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Color picker */}
        <div className="glass" style={{padding:'28px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'14px'}}>
            <div>
              <p className="s-head" style={{marginBottom:'3px'}}>Paleta de Colores</p>
              <p style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif"}}>Selecciona hasta 4 colores exactos para la identidad visual de la web</p>
            </div>
            <span style={{fontSize:'11px',fontWeight:'700',color:f.coloresSeleccionados.length>=4?WEB_A:'rgba(255,255,255,0.2)',background:f.coloresSeleccionados.length>=4?'rgba(167,139,250,0.1)':'rgba(255,255,255,0.04)',border:`1px solid ${f.coloresSeleccionados.length>=4?'rgba(167,139,250,0.3)':'rgba(255,255,255,0.07)'}`,borderRadius:'100px',padding:'3px 10px',fontFamily:"'Inter',sans-serif",flexShrink:0,marginTop:'2px'}}>{f.coloresSeleccionados.length}/4</span>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(10,1fr)',gap:'4px',marginBottom:'12px'}}>
            {CP.map(c=>{
              const isSel=!!f.coloresSeleccionados.find(x=>x.h===c.h);
              const isDisabled=!isSel&&f.coloresSeleccionados.length>=4;
              return(
                <button key={c.h} title={`${c.n} — ${c.h}`} onClick={()=>!isDisabled&&togColor(c)}
                  style={{width:'100%',aspectRatio:'1',background:c.h,borderRadius:'4px',border:isSel?'2.5px solid #fff':'2px solid transparent',cursor:isDisabled?'not-allowed':'pointer',opacity:isDisabled?0.3:1,position:'relative',transition:'transform .1s,border .1s',boxSizing:'border-box',transform:isSel?'scale(1.08)':'scale(1)'}}>
                  {isSel&&(
                    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.3)',borderRadius:'2px'}}>
                      <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    </div>
                  )}
                </button>
              );
            })}
          </div>
          {/* Custom hex input */}
          {(()=>{
            const isValidHex=/^#[0-9a-fA-F]{6}$/.test(hexVal);
            const addCustomHex=()=>{if(!isValidHex)return;togColor({n:hexVal.toUpperCase(),h:hexVal.toLowerCase()});setHexVal('');};
            return(
              <div style={{display:'flex',gap:'8px',alignItems:'center',marginBottom:'14px',flexWrap:'wrap'}}>
                <div style={{width:'36px',height:'36px',borderRadius:'7px',background:isValidHex?hexVal:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.12)',flexShrink:0,transition:'background .1s'}}/>
                <input value={hexVal} onChange={e=>{let v=e.target.value.replace(/^#+/,'');v=v?('#'+v):'';setHexVal(v.slice(0,7));}} placeholder="#000000" maxLength={7}
                  style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.12)',borderRadius:'7px',padding:'8px 11px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none',width:'110px',letterSpacing:'.04em'}}/>
                <input type="color" value={isValidHex?hexVal:'#ffffff'} onChange={e=>setHexVal(e.target.value)}
                  style={{width:'36px',height:'36px',border:'1px solid rgba(255,255,255,0.12)',borderRadius:'7px',cursor:'pointer',padding:'2px',background:'rgba(255,255,255,0.04)'}} title="Abrir selector de color"/>
                <button onClick={addCustomHex} disabled={!isValidHex||f.coloresSeleccionados.length>=4}
                  style={{padding:'8px 14px',background:isValidHex&&f.coloresSeleccionados.length<4?WEB_A+'22':'rgba(255,255,255,0.04)',border:`1px solid ${isValidHex&&f.coloresSeleccionados.length<4?WEB_A+'55':'rgba(255,255,255,0.1)'}`,borderRadius:'7px',color:isValidHex&&f.coloresSeleccionados.length<4?WEB_A:'rgba(255,255,255,0.25)',fontSize:'12px',fontWeight:'600',cursor:isValidHex&&f.coloresSeleccionados.length<4?'pointer':'not-allowed',fontFamily:"'Inter',sans-serif",transition:'all .15s'}}>
                  + Añadir color
                </button>
                <span style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',fontFamily:"'Inter',sans-serif"}}>escribe cualquier HEX o usa el selector 🎨</span>
              </div>
            );
          })()}
          {f.coloresSeleccionados.length>0&&(
            <div style={{display:'flex',flexWrap:'wrap',gap:'8px'}}>
              {f.coloresSeleccionados.map(c=>(
                <div key={c.h} style={{display:'flex',alignItems:'center',gap:'8px',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.09)',borderRadius:'8px',padding:'7px 10px'}}>
                  <div style={{width:'20px',height:'20px',borderRadius:'4px',background:c.h,border:'1px solid rgba(255,255,255,0.18)',flexShrink:0}}/>
                  <div>
                    <p style={{fontSize:'11.5px',color:'rgba(255,255,255,0.75)',fontWeight:'600',marginBottom:'1px'}}>{c.n}</p>
                    <p style={{fontSize:'10px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif",letterSpacing:'.02em'}}>{c.h} · rgb({h2rgb(c.h)})</p>
                  </div>
                  <button onClick={()=>togColor(c)} style={{background:'transparent',border:'none',color:'rgba(255,255,255,0.25)',cursor:'pointer',fontSize:'15px',lineHeight:1,padding:'0 2px',marginLeft:'2px'}}>×</button>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Estilo visual */}
        <div className="glass" style={{padding:'28px'}}>
          <p className="s-head">Estilo Visual</p>
          <label className="lbl">Estilo deseado</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:'8px',marginTop:'6px',marginBottom:'14px'}}>
            {WEB_ESTILOS.map(e=>(
              <button key={e} onClick={()=>setF(p=>({...p,estilo:e}))}
                style={{padding:'7px 14px',border:`1px solid ${f.estilo===e?'rgba(167,139,250,0.5)':'rgba(255,255,255,0.1)'}`,background:f.estilo===e?'rgba(167,139,250,0.08)':'transparent',color:f.estilo===e?WEB_A:'rgba(255,255,255,0.4)',fontSize:'12.5px',fontFamily:"'Inter',sans-serif",borderRadius:'100px',cursor:'pointer',fontWeight:f.estilo===e?'600':'400',transition:'all .15s'}}>
                {e}
              </button>
            ))}
          </div>
          <div><label className="lbl">Referencias visuales (opcional)</label><input className="input-f" value={f.referencias} onChange={set('referencias')} placeholder="URLs o nombres de webs de referencia: apple.com, stripe.com, linear.app..."/></div>
        </div>

        {/* Público objetivo */}
        <div className="glass" style={{padding:'28px'}}>
          <p className="s-head">Público Objetivo</p>
          <div><label className="lbl">Descripción del cliente ideal</label><textarea className="input-f" value={f.publicoObjetivo} onChange={set('publicoObjetivo')} placeholder="Ej. Empresarios 35-55 años del sector salud con 5-20 empleados que buscan digitalizar su clínica..." style={{minHeight:'80px'}}/></div>
        </div>

        {/* Info adicional */}
        <div className="glass" style={{padding:'28px'}}>
          <p className="s-head">Información Adicional</p>
          <div style={{marginBottom:'12px'}}><label className="lbl">Competidores principales</label><input className="input-f" value={f.competidores} onChange={set('competidores')} placeholder="Ej. Empresa A, Empresa B, web de referencia del sector..."/></div>
          <div><label className="lbl">Mensajes clave de la marca</label><textarea className="input-f" value={f.mensajesClave} onChange={set('mensajesClave')} placeholder="Ej. '15 años de experiencia', 'Atención 24/7', 'Resultados garantizados'..." style={{minHeight:'80px'}}/></div>
        </div>

        <div style={{display:'flex',justifyContent:'flex-end',paddingTop:'8px'}}>
          <button className="btn-main" onClick={submit} style={{padding:'14px 40px',fontSize:'15px',background:WEB_A,color:'#000',border:'none'}}>Generar Prompt Web →</button>
        </div>
      </div>
    </div>
  );
}

/* ── WEB PROMPT VIEW ── */
function WebPromptView({form,onBack,onNew}){
  const prompt=buildWebPrompt(form);
  const [copied,setCopied]=useState(false);
  const copy=()=>{navigator.clipboard.writeText(prompt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);}).catch(()=>{});};
  return(
    <div style={{minHeight:'100vh',background:'#FAF6EF',paddingBottom:'60px'}}>
      <div style={{maxWidth:'940px',margin:'0 auto',padding:'44px 28px 28px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'22px',flexWrap:'wrap',gap:'10px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
            <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={onBack}>← Editar briefing</button>
            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
              <div style={{width:'22px',height:'22px',background:WEB_A,borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="#000" strokeWidth="1.2"/><path d="M1 5h10M4 5v5" stroke="#000" strokeWidth="1"/></svg>
              </div>
              <span style={{fontSize:'13px',fontWeight:'700',color:'#fff'}}>Web Generator</span>
            </div>
          </div>
          <div style={{display:'flex',gap:'8px'}}>
            <button className="btn-ghost" style={{padding:'8px 14px',fontSize:'12.5px'}} onClick={onNew}>+ Nuevo briefing</button>
            <button onClick={copy} style={{padding:'10px 22px',background:copied?'rgba(167,139,250,0.12)':WEB_A,border:`1px solid ${copied?WEB_A:'transparent'}`,color:copied?WEB_A:'#000',fontSize:'13px',fontWeight:'700',fontFamily:"'Inter',sans-serif",borderRadius:'6px',cursor:'pointer',display:'flex',alignItems:'center',gap:'7px',flexShrink:0,transition:'all .2s'}}>
              {copied
                ?<><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6L4.5 8.5L10 3" stroke={WEB_A} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>¡Copiado!</>
                :<><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2" stroke="#000" strokeWidth="1.2"/><path d="M3.5 3.5V2a1 1 0 011-1h4a1 1 0 011 1v1.5" stroke="#000" strokeWidth="1.2" strokeLinecap="round"/></svg>Copiar Prompt</>}
            </button>
          </div>
        </div>

        {/* Info bar */}
        <div style={{padding:'16px 22px',background:'rgba(167,139,250,0.04)',border:'1px solid rgba(167,139,250,0.15)',borderTop:`2px solid ${WEB_A}`,borderRadius:'4px',marginBottom:'14px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'10px'}}>
          <div>
            <p style={{fontSize:'10px',fontWeight:'700',color:WEB_A,letterSpacing:'.1em',textTransform:'uppercase',fontFamily:"'Inter',sans-serif",marginBottom:'3px'}}>Prompt generado para</p>
            <p style={{fontSize:'19px',fontWeight:'700',color:'#fff',fontFamily:"'Playfair Display',serif"}}>{form.empresa}<span style={{fontSize:'13px',color:'rgba(255,255,255,0.3)',fontWeight:'400',fontFamily:"'Inter',sans-serif"}}> · {form.sector}</span></p>
          </div>
          <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
            {form.objetivo&&<span style={{padding:'3px 10px',background:'rgba(167,139,250,0.07)',border:'1px solid rgba(167,139,250,0.2)',color:WEB_A,fontSize:'11px',fontFamily:"'Inter',sans-serif",borderRadius:'2px'}}>{form.objetivo}</span>}
            {(form.secciones||[]).slice(0,3).map(s=><span key={s} style={{padding:'3px 10px',border:'1px solid rgba(255,255,255,0.07)',color:'rgba(255,255,255,0.28)',fontSize:'11px',fontFamily:"'Inter',sans-serif",borderRadius:'2px'}}>{s}</span>)}
            {(form.secciones||[]).length>3&&<span style={{padding:'3px 10px',border:'1px solid rgba(255,255,255,0.07)',color:'rgba(255,255,255,0.28)',fontSize:'11px',fontFamily:"'Inter',sans-serif",borderRadius:'2px'}}>+{form.secciones.length-3} más</span>}
          </div>
        </div>

        {/* Prompt textarea */}
        <div style={{position:'relative'}}>
          <button onClick={copy} style={{position:'absolute',top:'12px',right:'12px',padding:'5px 11px',background:copied?'rgba(167,139,250,0.1)':'rgba(255,255,255,0.05)',border:`1px solid ${copied?'rgba(167,139,250,0.3)':'rgba(255,255,255,0.08)'}`,color:copied?WEB_A:'rgba(255,255,255,0.35)',fontSize:'11px',fontFamily:"'Inter',sans-serif",borderRadius:'4px',cursor:'pointer',zIndex:2,transition:'all .2s'}}>{copied?'✓ Copiado':'Copiar'}</button>
          <textarea readOnly value={prompt} style={{width:'100%',minHeight:'560px',background:'rgba(255,255,255,0.018)',border:'1px solid rgba(255,255,255,0.07)',color:'rgba(255,255,255,0.68)',fontSize:'12px',lineHeight:'1.82',fontFamily:"'JetBrains Mono','Fira Code','Courier New',monospace",padding:'20px',borderRadius:'4px',resize:'vertical',outline:'none',boxSizing:'border-box',whiteSpace:'pre'}}/>
        </div>

        {/* Bottom CTA */}
        <div style={{marginTop:'14px',padding:'18px 22px',background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'4px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'10px'}}>
          <div>
            <p style={{fontSize:'13px',fontWeight:'600',color:'rgba(255,255,255,0.55)',fontFamily:"'Inter',sans-serif",marginBottom:'3px'}}>¿Listo para generar la web?</p>
            <p style={{fontSize:'12px',color:'rgba(255,255,255,0.22)',fontFamily:"'Inter',sans-serif"}}>Copia el prompt y pégalo directamente en Claude, ChatGPT u otra IA para obtener la web completa.</p>
          </div>
          <button onClick={copy} style={{padding:'12px 26px',background:copied?'rgba(167,139,250,0.12)':WEB_A,border:`1px solid ${copied?WEB_A:'transparent'}`,color:copied?WEB_A:'#000',fontSize:'13.5px',fontWeight:'700',fontFamily:"'Inter',sans-serif",borderRadius:'6px',cursor:'pointer',display:'flex',alignItems:'center',gap:'8px',flexShrink:0,transition:'all .2s'}}>
            {copied?'✓ ¡Prompt copiado!':'👉 Copiar Prompt'}
          </button>
        </div>
      </div>
    </div>
  );
}

const CL_A='#4ade80'; // accent for clients module

/* ── Mini status badge ── */
function EstadoBadge({estado}){
  const col=CLIENT_ESTADO_COLORS[estado]||'#9e9e9e';

/* ── Project Checklist ── */
function ProjectChecklist({project,onUpdate}){
  const ITEMS=[
    {key:'brief',label:'Brief recibido'},
    {key:'prompt',label:'Prompt generado'},
    {key:'diseño',label:'Diseño iniciado'},
    {key:'diseñoAprobado',label:'Diseño aprobado'},
    {key:'desarrollo',label:'Desarrollo iniciado'},
    {key:'desarrolloFinalizado',label:'Desarrollo finalizado'},
    {key:'entregado',label:'Entregado'},
  ];
  const done=ITEMS.filter(i=>project.checklist[i.key]).length;
  const pct=Math.round((done/ITEMS.length)*100);
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
        <p style={{fontSize:'11.5px',fontWeight:'700',color:'rgba(255,255,255,0.4)',letterSpacing:'.08em',textTransform:'uppercase',fontFamily:"'Inter',sans-serif"}}>Checklist del Proyecto</p>
        <span style={{fontSize:'11px',color:CL_A,fontWeight:'700',fontFamily:"'Inter',sans-serif"}}>{done}/{ITEMS.length} · {pct}%</span>
      </div>
      <div style={{height:'3px',background:'rgba(255,255,255,0.06)',borderRadius:'2px',marginBottom:'14px'}}>
        <div style={{height:'3px',background:`linear-gradient(90deg,${CL_A},#a3e635)`,borderRadius:'2px',width:`${pct}%`,transition:'width .4s'}}/>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
        {ITEMS.map((item,idx)=>{
          const checked=project.checklist[item.key];
          const prevDone=idx===0||project.checklist[ITEMS[idx-1].key];
          return(
            <div key={item.key} onClick={()=>prevDone&&onUpdate(item.key,!checked)}
              style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 10px',background:checked?'rgba(74,222,128,0.06)':'rgba(255,255,255,0.02)',border:`1px solid ${checked?'rgba(74,222,128,0.2)':'rgba(255,255,255,0.05)'}`,borderRadius:'7px',cursor:prevDone?'pointer':'not-allowed',opacity:!prevDone&&!checked?0.4:1,transition:'all .15s'}}>
              <div style={{width:'16px',height:'16px',borderRadius:'4px',border:`1.5px solid ${checked?CL_A:'rgba(255,255,255,0.2)'}`,background:checked?CL_A:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                {checked&&<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="#000" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </div>
              <span style={{fontSize:'12.5px',color:checked?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.45)',fontFamily:"'Inter',sans-serif",textDecoration:checked?'none':'none'}}>{item.label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── Error Boundary for ClientDetailView ── */
class ErrBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,info){alert('ERROR: '+String(e?.message||e));}
  render(){
    if(this.state.err){
      return(
        <div style={{minHeight:'100vh',background:'#080808',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px',gap:'16px'}}>
          <p style={{color:'#f87171',fontSize:'13px',fontWeight:'700',fontFamily:"'Inter',sans-serif"}}>⚠ Error al cargar el cliente</p>
          <pre style={{color:'rgba(255,255,255,0.4)',fontSize:'11px',fontFamily:'monospace',background:'rgba(255,255,255,0.04)',padding:'16px',borderRadius:'8px',maxWidth:'600px',overflow:'auto',whiteSpace:'pre-wrap'}}>{String(this.state.err?.message||this.state.err)}</pre>
          <button onClick={()=>{this.setState({err:null});this.props.onBack&&this.props.onBack();}} style={{padding:'8px 20px',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.6)',fontSize:'13px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>← Volver a clientes</button>
        </div>
      );
    }
    return this.props.children;
  }
}

          const contrato=client.montoContrato||0;
          // Duration: from createdAt to fechaVencimiento or today
          const createdDate=client.createdAt?new Date(client.createdAt):null;
          const endDate=client.fechaVencimiento?new Date(client.fechaVencimiento):new Date();
          const monthsActive=createdDate&&!isNaN(createdDate)?Math.max(1,Math.round((endDate-createdDate)/(1000*60*60*24*30.44))):1;
          const monthlyValue=contrato>0?Math.round(contrato/monthsActive):0;
          // Renewals: count historial entries with "renovación" keyword
          const renewals=(client.historial||[]).filter(h=>h.descripcion&&/renov/i.test(h.descripcion)).length;
          // Churn probability: simple heuristic
          const overdueTasks=(client.tareas||[]).filter(t=>!t.completada&&t.fechaLimite&&new Date(t.fechaLimite)<new Date()).length;
          const hasRecentNote=(client.notas||[]).some(n=>{try{return(new Date()-new Date(n.fecha))<60*24*60*60*1000;}catch{return false;}});
          const churnRisk=overdueTasks>=2?'Alto':!hasRecentNote&&client.estado==='Activo'?'Medio':'Bajo';
          const churnColor={Alto:'#f87171',Medio:'#fbbf24',Bajo:'#4ade80'}[churnRisk];
          // LTV scenarios (1yr / 2yr / 3yr)
          const retention={Bajo:0.85,Medio:0.65,Alto:0.40}[churnRisk];
          const ltv1=Math.round(monthlyValue*12*retention);
          const ltv2=Math.round(monthlyValue*24*retention*0.9);
          const ltv3=Math.round(monthlyValue*36*retention*0.82);
          // Upsell potential
          const svcCount=(client.servicios||[]).length;
          const upsellMsg=svcCount===1?'Alta — solo tiene 1 servicio activo':svcCount===2?'Media — tiene 2 servicios':'Baja — ya tiene todos los servicios';
          const fmt=(n)=>n.toLocaleString('es-CO');
          return(
            <div style={{display:'flex',flexDirection:'column',gap:'20px'}}>
              {/* KPI row */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:'12px'}}>
                {[
                  {l:'Valor mensual',v:`$${fmt(monthlyValue)}`,sub:`${monthsActive} mes${monthsActive!==1?'es':''} activo`,c:'#4ade80'},
                  {l:'Total facturado',v:`$${fmt(contrato)}`,sub:'Monto de contrato',c:'#fbbf24'},
                  {l:'Total pagado',v:`$${fmt(totalPagado)}`,sub:contrato>0?`${Math.round((totalPagado/contrato)*100)}% del contrato`:'Sin contrato',c:'#38bdf8'},
                  {l:'Renovaciones',v:renewals,sub:'Detectadas en historial',c:GL_P3},
                  {l:'Riesgo churn',v:churnRisk,sub:'Basado en actividad',c:churnColor},
                ].map((k,i)=>(
                  <div key={i} className="glass" style={{padding:'16px 18px',border:`1px solid ${k.c}22`}}>
                    <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',fontFamily:"'Inter',sans-serif",marginBottom:'6px'}}>{k.l}</p>
                    <p style={{fontSize:'22px',fontWeight:'800',color:k.c,fontFamily:"'Inter',sans-serif",letterSpacing:'-.02em',margin:'0 0 3px'}}>{k.v}</p>
                    <p style={{fontSize:'11px',color:'rgba(255,255,255,0.25)',fontFamily:"'Inter',sans-serif",margin:0}}>{k.sub}</p>
                  </div>
                ))}
              </div>

              {/* LTV Scenarios */}
              <div className="glass" style={{padding:'24px'}}>

                    <div key={i} style={{padding:'20px',background:s.highlight?`linear-gradient(135deg,rgba(168,85,247,0.12),rgba(124,58,237,0.08))`:'rgba(255,255,255,0.02)',border:`1px solid ${s.highlight?'rgba(168,85,247,0.35)':'rgba(255,255,255,0.07)'}`,borderRadius:'12px',textAlign:'center'}}>

                  {[
                    {l:'Comisión acumulada (50%)',v:`$${fmt(Math.round(totalPagado*0.5))}`},

            {

            },

              id:'renovacion',

              asunto:`Renovación de contrato — ${empresa}`,

              cuerpo:`Hola ${contacto},\n\n¡Espero que estés muy bien! Hace un tiempo no tenemos noticias tuyas y quería contactarme.\n\nEn GlowLabs hemos lanzado nuevas soluciones de ${svcList} con resultados increíbles para negocios como el de ${empresa}. Creo que te podría interesar mucho lo que tenemos ahora.\n\n¿Podríamos tener una conversación de 20 minutos para contarte las novedades?\n\n¡Sería genial reconectar!\n${asesor}\nGlowLabs Agencia IA`

                      <div style={{width:'32px',height:'32px',borderRadius:'8px',background:'rgba(74,222,128,0.1)',border:'1px solid rgba(74,222,128,0.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>

                        <p style={{fontSize:'11px',color:'rgba(255,255,255,0.25)',margin:0,fontFamily:"'Inter',sans-serif"}}>{p.fecha}</p>

                      {isAdmin&&<button onClick={()=>deletePago(p.id)} style={{background:'transparent',border:'none',color:'rgba(255,255,255,0.2)',fontSize:'14px',cursor:'pointer',padding:'4px',lineHeight:1}}>✕</button>}
                    </div>
                  ))}
                </div>
              )}
              {saldo<0&&<p style={{fontSize:'12px',color:'#4ade80',fontFamily:"'Inter',sans-serif",textAlign:'center',margin:'16px 0 0',fontWeight:'700'}}>✓ Contrato pagado completamente {saldo<0?`(+$${Math.abs(saldo).toLocaleString('es-CO')} extra)`:''}</p>}

        {tab==='history'&&(()=>{

            nota:{color:'#fbbf24',icon:'✎',label:'Nota'},
            sistema:{color:'rgba(255,255,255,0.3)',icon:'◉',label:'Sistema'},
            manual:{color:CL_A,icon:'✦',label:'Manual'},
          };
          const gettipo=(h)=>{
            if(h.tipo) return h.tipo;
            const d=h.descripcion||'';
            if(d.includes('Estado cambiado')||d.includes('estado')) return 'estado';
            if(d.includes('tarea')||d.includes('Tarea')||d.includes('✅')||d.includes('📋')) return 'tarea';
            if(d.includes('nota')||d.includes('Nota')) return 'nota';
            return 'sistema';

            if(!newEntry.trim())return;

/* ── Notes / Activity global search panel ── */
function NotesSearchPanel({onOpenClient}){
  const [nsq,setNsq]=useState('');
  const typeColor={nota:GL_P,historial:'rgba(255,255,255,0.3)',tarea:'#fbbf24'};
  const typeLabel={nota:'Nota',historial:'Actividad',tarea:'Tarea'};
  const allClients=React.useMemo(()=>clients_storage.load(),[]);
  const results=React.useMemo(()=>{
    if(nsq.trim().length<2) return [];
    const q=nsq.toLowerCase();
    const hits=[];
    allClients.forEach(c=>{
      (c.notas||[]).forEach(n=>{const t=n.texto||n.text||'';if(t.toLowerCase().includes(q))hits.push({empresa:c.empresa,cid:c.id,tipo:'nota',fecha:n.fecha||'',text:t});});
      (c.historial||[]).forEach(h=>{if((h.descripcion||'').toLowerCase().includes(q))hits.push({empresa:c.empresa,cid:c.id,tipo:'historial',fecha:h.fecha||'',text:h.descripcion||''});});
      (c.tareas||[]).forEach(t=>{if((t.titulo||'').toLowerCase().includes(q))hits.push({empresa:c.empresa,cid:c.id,tipo:'tarea',fecha:t.fechaLimite||t.createdAt||'',text:t.titulo||''});});
    });
    return hits.sort((a,b)=>{try{return new Date(b.fecha)-new Date(a.fecha);}catch{return 0;}}).slice(0,50);
  },[nsq,allClients]);
  return(
    <div>
      <div style={{marginBottom:'18px'}}>
        <input autoFocus value={nsq} onChange={e=>setNsq(e.target.value)} placeholder="Buscar en todas las notas, actividad y tareas de todos los clientes…"
          style={{width:'100%',background:'rgba(168,85,247,0.06)',border:'1px solid rgba(168,85,247,0.3)',borderRadius:'10px',padding:'12px 16px',color:'#fff',fontSize:'14px',fontFamily:"'Inter',sans-serif",outline:'none',boxSizing:'border-box'}}/>
      </div>
      {nsq.trim().length>0&&nsq.trim().length<2&&<p style={{fontSize:'12.5px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif"}}>Escribe al menos 2 caracteres…</p>}
      {results.length===0&&nsq.trim().length>=2&&<p style={{fontSize:'12.5px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif"}}>Sin resultados para "{nsq}"</p>}
      {results.length>0&&<p style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',fontFamily:"'Inter',sans-serif",marginBottom:'12px'}}>{results.length} resultado{results.length!==1?'s':''}</p>}
      <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
        {results.map((r,i)=>(
          <div key={i} onClick={()=>{const c=allClients.find(x=>x.id===r.cid);if(c)onOpenClient(c);}} style={{padding:'12px 16px',background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'10px',cursor:'pointer',transition:'border .15s'}}
            onMouseOver={e=>e.currentTarget.style.border='1px solid rgba(168,85,247,0.3)'} onMouseOut={e=>e.currentTarget.style.border='1px solid rgba(255,255,255,0.06)'}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'5px'}}>
              <span style={{fontSize:'10px',fontWeight:'700',padding:'2px 7px',background:`${typeColor[r.tipo]}15`,border:`1px solid ${typeColor[r.tipo]}35`,borderRadius:'100px',color:typeColor[r.tipo],fontFamily:"'Inter',sans-serif"}}>{typeLabel[r.tipo]}</span>
              <span style={{fontSize:'12.5px',fontWeight:'700',color:'rgba(255,255,255,0.7)',fontFamily:"'Inter',sans-serif"}}>{r.empresa}</span>
              {r.fecha&&<span style={{fontSize:'10.5px',color:'rgba(255,255,255,0.2)',fontFamily:"'Inter',sans-serif",marginLeft:'auto'}}>{r.fecha}</span>}
            </div>
            <p style={{fontSize:'12.5px',color:'rgba(255,255,255,0.5)',fontFamily:"'Inter',sans-serif",lineHeight:'1.5',margin:0,wordBreak:'break-word'}}>{r.text.length>200?r.text.slice(0,200)+'…':r.text}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Clients Module (list + dashboard) ── */
function ClientsModule({onHome,onClientAccepted,currentUser,initialClientId}){
  const isAdmin=!currentUser||currentUser.role==='admin';
  const [clients,setClients]=useState(()=>{
    const all=clients_storage.load();
    return isAdmin?all:all.filter(c=>c.asignadoA===currentUser.id);
  });
  const [selectedClient,setSelectedClient]=useState(()=>{
    if(!initialClientId) return null;
    const all=clients_storage.load();
    return all.find(c=>c.id===initialClientId)||null;
  });
  const [filter,setFilter]=useState('Todos');
  const [search,setSearch]=useState('');
  const [showArchived,setShowArchived]=useState(false);
  const [lastRefresh,setLastRefresh]=useState(null);
  const [viewMode,setViewMode]=useState('list'); // 'list' | 'kanban'
  const [svcFilter,setSvcFilter]=useState(''); // '' | 'marketing' | 'ia' | 'web'
  const [tierFilter,setTierFilter]=useState(''); // '' | 'VIP' | 'Estándar' | 'Básico'
  const [empFilter,setEmpFilter]=useState(''); // '' | empId
  const [sortBy,setSortBy]=useState('reciente'); // 'reciente' | 'monto' | 'az'
  const [statusMenuId,setStatusMenuId]=useState(null);
  const [quickTaskId,setQuickTaskId]=useState(null);
  const [quickTaskTitle,setQuickTaskTitle]=useState('');
  const [quickTaskPrio,setQuickTaskPrio]=useState('media');
  const [showAddClient,setShowAddClient]=useState(false);
  const [addForm,setAddForm]=useState({empresa:'',contacto:'',correo:'',telefono:'',sector:'',servicios:[],estado:'Lead',montoContrato:0});
  const [showImportCSV,setShowImportCSV]=useState(false);
  const [csvText,setCsvText]=useState('');
  const [csvPreview,setCsvPreview]=useState(null);
  const [csvImporting,setCsvImporting]=useState(false);
  const [selectedIds,setSelectedIds]=useState(new Set());
  const [bulkAction,setBulkAction]=useState('');
  const [tagFilter,setTagFilter]=useState(''); // '' | tag string
  const [sectorFilter,setSectorFilter]=useState(''); // '' | sector string
  const [showReasonModal,setShowReasonModal]=useState(null); // null | {id, estado, prevEstado}
  const [reasonType,setReasonType]=useState('won'); // 'won' | 'lost'
  const [reasonText,setReasonText]=useState('');
  const [filterPresets,setFilterPresets]=useState(()=>filter_presets_storage.load());
  const [showSavePreset,setShowSavePreset]=useState(false);
  const [presetName,setPresetName]=useState('');
  const searchInputRef=useRef(null);
  // Keyboard shortcuts
  useEffect(()=>{
    const h=e=>{
      const tag=document.activeElement?.tagName;
      const inInput=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
      if(e.key==='Escape'){setShowAddClient(false);setShowImportCSV(false);setCsvText('');setCsvPreview(null);return;}
      if(inInput) return;
      if(e.key==='n'||e.key==='N'){e.preventDefault();setShowAddClient(true);return;}
      if(e.key==='/'||e.key==='f'||e.key==='F'){e.preventDefault();searchInputRef.current?.focus();return;}
    };
    document.addEventListener('keydown',h);
    return()=>document.removeEventListener('keydown',h);
  },[]);
  useEffect(()=>{
    if(!statusMenuId) return;
    const h=()=>setStatusMenuId(null);
    document.addEventListener('click',h);
    return()=>document.removeEventListener('click',h);
  },[statusMenuId]);

  // Refresh clients from localStorage when another tab updates it (portal brief submit)
  // or when the window regains focus (user switches back from portal tab)
  useEffect(()=>{
    const refresh=()=>{
      const all=clients_storage.load();
      const fresh=isAdmin?all:all.filter(c=>c.asignadoA===(currentUser&&currentUser.id));
      setClients(fresh);
      // If a client is selected, update it too so the brief shows immediately
      setSelectedClient(sel=>sel?fresh.find(c=>c.id===sel.id)||sel:null);
      setLastRefresh(new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
    };
    window.addEventListener('storage',refresh);
    window.addEventListener('focus',refresh);
    return()=>{window.removeEventListener('storage',refresh);window.removeEventListener('focus',refresh);};
  },[]);

  const persist=list=>{setClients(list);clients_storage.save(list);};

  const ONBOARDING_TASKS=[
    {titulo:'Enviar email de bienvenida',prioridad:'alta'},
    {titulo:'Agendar llamada de kickoff',prioridad:'alta'},
    {titulo:'Configurar acceso al portal del cliente',prioridad:'media'},
    {titulo:'Crear carpeta de trabajo en Drive',prioridad:'media'},
    {titulo:'Definir entregables y fechas clave',prioridad:'media'},
  ];
  const updateClient=updated=>{
    const now=new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'});
    const prev=clients.find(c=>c.id===updated.id)||{};
    const dateFields={};
    if(updated.estado==='Propuesta enviada'&&!updated.fechaPropuesta&&!prev.fechaPropuesta) dateFields.fechaPropuesta=now;
    if(updated.estado==='Propuesta aceptada'&&!updated.fechaAceptacion&&!prev.fechaAceptacion) dateFields.fechaAceptacion=now;
    if(updated.estado==='Activo'&&!updated.fechaCierre&&!prev.fechaCierre) dateFields.fechaCierre=now;
    // Auto-create onboarding tasks when first moving to Activo
    let extraTareas=[];
    let onboardingEntry=null;
    if(updated.estado==='Activo'&&prev.estado!=='Activo'&&prev.estado!=='Finalizado'){
      const existing=(updated.tareas||[]).map(t=>t.titulo.toLowerCase());
      const toAdd=ONBOARDING_TASKS.filter(t=>!existing.includes(t.titulo.toLowerCase()));
      if(toAdd.length>0){
        extraTareas=toAdd.map(t=>({id:Date.now().toString()+Math.random().toString(36).slice(2),titulo:t.titulo,prioridad:t.prioridad,fechaLimite:'',responsable:'',completada:false,createdAt:now}));
        onboardingEntry={fecha:now,tipo:'sistema',descripcion:`🚀 Onboarding iniciado — ${toAdd.length} tarea${toAdd.length!==1?'s':''} de bienvenida creadas automáticamente.`};
      }
    }
    const newTareas=extraTareas.length>0?[...extraTareas,...(updated.tareas||[])]:(updated.tareas||[]);
    const newHist=onboardingEntry?[...(updated.historial||[]),onboardingEntry]:(updated.historial||[]);
    const withHistory={...updated,...dateFields,tareas:newTareas,historial:[...newHist,{fecha:now,descripcion:`Datos actualizados.`}]};
    persist(clients.map(c=>c.id===updated.id?withHistory:c));
    setSelectedClient(withHistory);
  };

  const deleteClient=id=>{if(!confirm('¿Eliminar este cliente?'))return;persist(clients.filter(c=>c.id!==id));setSelectedClient(null);};
  const submitAddClient=()=>{
    if(!addForm.empresa.trim()){alert('Ingresa el nombre de la empresa.');return;}
    const allNow=clients_storage.load();
    const dupName=addForm.empresa.trim().toLowerCase();
    const dup=allNow.find(c=>!c.archivado&&(c.empresa||'').toLowerCase().trim()===dupName);
    if(dup){
      const go=confirm(`Ya existe un cliente con el nombre "${dup.empresa}" (estado: ${dup.estado}).\n\n¿Crear de todas formas?`);
      if(!go) return;
    }
    const newC=makeClient({empresa:addForm.empresa.trim(),contacto:addForm.contacto.trim(),correo:addForm.correo.trim(),servicios:addForm.servicios,asignadoA:isAdmin?null:currentUser?.id});
    newC.telefono=addForm.telefono.trim();
    newC.sector=addForm.sector.trim();
    newC.estado=addForm.estado;
    newC.montoContrato=Number(addForm.montoContrato)||0;
    const all=clients_storage.load();
    clients_storage.save([...all,newC]);
    const fresh=clients_storage.load();
    setClients(isAdmin?fresh:fresh.filter(c=>c.asignadoA===(currentUser&&currentUser.id)));
    setShowAddClient(false);
    setAddForm({empresa:'',contacto:'',correo:'',telefono:'',sector:'',servicios:[],estado:'Lead',montoContrato:0});
    setSelectedClient(newC);
  };
  const applyQuickStatus=(id,estado,reason)=>{
    const all=clients_storage.load();
    const now=new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'});
    const updated=all.map(c=>{
      if(c.id!==id) return c;
      const dateFields={};
      if(estado==='Propuesta enviada'&&!c.fechaPropuesta) dateFields.fechaPropuesta=now;
      if(estado==='Propuesta aceptada'&&!c.fechaAceptacion) dateFields.fechaAceptacion=now;
      if(estado==='Activo'&&!c.fechaCierre) dateFields.fechaCierre=now;
      if(estado==='Finalizado'&&!c.fechaFin) dateFields.fechaFin=now;
      let extraTareas=[];let onboardingEntry=null;
      if(estado==='Activo'&&c.estado!=='Activo'&&c.estado!=='Finalizado'){
        const existing=(c.tareas||[]).map(t=>t.titulo.toLowerCase());
        const toAdd=ONBOARDING_TASKS.filter(t=>!existing.includes(t.titulo.toLowerCase()));
        if(toAdd.length>0){extraTareas=toAdd.map(t=>({id:Date.now().toString()+Math.random().toString(36).slice(2),titulo:t.titulo,prioridad:t.prioridad,fechaLimite:'',responsable:'',completada:false,createdAt:now}));onboardingEntry={fecha:now,tipo:'sistema',descripcion:`🚀 Onboarding iniciado — ${toAdd.length} tarea${toAdd.length!==1?'s':''} de bienvenida creadas automáticamente.`};}
      }
      const newTareas=extraTareas.length>0?[...extraTareas,...(c.tareas||[])]:(c.tareas||[]);
      const newHist=onboardingEntry?[...(c.historial||[]),onboardingEntry]:(c.historial||[]);
      const histEntry={fecha:now,descripcion:`Estado cambiado a ${estado}.`};
      const reasonEntry=reason?{fecha:now,tipo:'cierre',descripcion:reason}:null;
      const finalHist=reasonEntry?[...newHist,histEntry,reasonEntry]:[...newHist,histEntry];
      const closeFields=reason?{closeReason:reason}:{};
      return{...c,estado,...dateFields,...closeFields,tareas:newTareas,historial:finalHist};
    });
    clients_storage.save(updated);
    setClients(isAdmin?updated:updated.filter(c=>c.asignadoA===(currentUser&&currentUser.id)));
  };
  const quickStatus=(id,estado)=>{
    const cur=clients.find(c=>c.id===id);
    if(estado==='Finalizado'&&cur&&cur.estado!=='Finalizado'){
      setReasonType('won');setReasonText('');
      setShowReasonModal({id,estado,prevEstado:cur.estado});
    } else {
      applyQuickStatus(id,estado,null);
    }
  };

  // Contract expiry alerts — must be before any early return (hooks rule)

  const filtered=clients.filter(c=>{
    const matchFilter=filter==='Todos'||c.estado===filter;
    const matchSearch=!search||c.empresa.toLowerCase().includes(search.toLowerCase())||c.correo?.toLowerCase().includes(search.toLowerCase())||(c.contacto||'').toLowerCase().includes(search.toLowerCase());

    if(sortBy==='lastActivityAsc'){const la=lastInteraction(a),lb=lastInteraction(b);if(!la&&!lb)return 0;if(!la)return -1;if(!lb)return 1;return lb.days-la.days;}
    if(sortBy==='rating') return (b.rating||0)-(a.rating||0);
    return 0; // 'reciente' preserves natural order (insert order)
  });

  const exportCSV=()=>{

    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');

  const parseCSVText=(text)=>{
    const lines=text.trim().replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    if(lines.length<2) return{error:'El CSV debe tener al menos una fila de datos.'};
    const parseRow=(line)=>{
      const cells=[];let cur='';let inQ=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
        else if(ch===','&&!inQ){cells.push(cur.trim());cur='';}
        else cur+=ch;
      }
      cells.push(cur.trim());
      return cells;
    };
    const header=parseRow(lines[0]).map(h=>h.toLowerCase().replace(/[^a-záéíóúñ]/gi,''));
    const rows=lines.slice(1).filter(l=>l.trim()).map(l=>parseRow(l));
    const idx={empresa:header.findIndex(h=>h.includes('empresa')||h.includes('company')),contacto:header.findIndex(h=>h.includes('contacto')||h.includes('contact')||h.includes('nombre')),correo:header.findIndex(h=>h.includes('correo')||h.includes('email')||h.includes('mail')),estado:header.findIndex(h=>h.includes('estado')||h.includes('status')),servicios:header.findIndex(h=>h.includes('servicio')||h.includes('service')),monto:header.findIndex(h=>h.includes('monto')||h.includes('valor')||h.includes('amount'))};
    if(idx.empresa<0) return{error:'No se encontró columna "Empresa" en el CSV.'};
    const parsed=rows.map((r,i)=>{
      const empresa=(r[idx.empresa]||'').trim();
      const contacto=idx.contacto>=0?(r[idx.contacto]||'').trim():'';
      const correo=idx.correo>=0?(r[idx.correo]||'').trim():'';
      const estado=idx.estado>=0&&CLIENT_ESTADOS.includes((r[idx.estado]||'').trim())?(r[idx.estado]||'').trim():'Lead';
      const rawSvc=idx.servicios>=0?(r[idx.servicios]||''):'';
      const servicios=rawSvc.split(/[+,;\/]/).map(s=>s.trim().toLowerCase()).filter(s=>['marketing','ia','web'].includes(s));
      const monto=idx.monto>=0?parseFloat((r[idx.monto]||'0').replace(/[^0-9.]/g,''))||0:0;
      return{_row:i+2,empresa,contacto,correo,estado,servicios,monto,valid:empresa.length>0};
    });
    return{rows:parsed};
  };

          <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:'620px',background:'#141414',border:'1px solid rgba(255,255,255,0.12)',borderRadius:'16px',overflow:'hidden',boxShadow:'0 24px 80px rgba(0,0,0,0.9)',maxHeight:'90vh',display:'flex',flexDirection:'column'}}>
            <div style={{padding:'20px 24px',borderBottom:'1px solid rgba(255,255,255,0.07)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>

                      {quickTaskId===c.id&&(
                        <div style={{position:'absolute',bottom:'calc(100% + 6px)',right:0,zIndex:300,background:'#1a1a1a',border:'1px solid rgba(56,189,248,0.3)',borderRadius:'10px',padding:'12px',minWidth:'240px',boxShadow:'0 12px 40px rgba(0,0,0,0.7)'}}>

                          <div style={{display:'flex',gap:'6px',marginBottom:'8px'}}>

                              <button key={p} onClick={()=>setQuickTaskPrio(p)} style={{flex:1,padding:'4px',background:quickTaskPrio===p?({'alta':'rgba(248,113,113,0.15)','media':'rgba(251,191,36,0.12)','baja':'rgba(74,222,128,0.1)'}[p]):'rgba(255,255,255,0.04)',border:`1px solid ${quickTaskPrio===p?({'alta':'rgba(248,113,113,0.4)','media':'rgba(251,191,36,0.35)','baja':'rgba(74,222,128,0.25)'}[p]):'rgba(255,255,255,0.1)'}`,borderRadius:'6px',color:quickTaskPrio===p?({'alta':'#f87171','media':'#fbbf24','baja':'#4ade80'}[p]):'rgba(255,255,255,0.3)',fontSize:'10.5px',fontWeight:'700',cursor:'pointer',fontFamily:"'Inter',sans-serif",textTransform:'capitalize'}}>{p}</button>
                            ))}

                    <button onClick={e=>{

                      clients_storage.save(all.map(x=>x.id===c.id?{...x,historial:[...(x.historial||[]),entry]}:x));
                      setClients(prev=>prev.map(x=>x.id===c.id?{...x,historial:[...(x.historial||[]),entry]}:x));
                    }} title="Registrar contacto hoy" style={{background:'rgba(74,222,128,0.07)',border:'1px solid rgba(74,222,128,0.18)',borderRadius:'6px',color:'rgba(74,222,128,0.7)',fontSize:'10px',padding:'4px 8px',cursor:'pointer',fontFamily:"'Inter',sans-serif",fontWeight:'600',whiteSpace:'nowrap',transition:'all .15s'}} onMouseEnter={e=>{e.currentTarget.style.background='rgba(74,222,128,0.18)';e.currentTarget.style.color='#4ade80';}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(74,222,128,0.07)';e.currentTarget.style.color='rgba(74,222,128,0.7)';}}>✓ Contactado</button>

/* ════════════════════════════════════════════════
   CLIENT PORTAL
   ════════════════════════════════════════════════ */
function ClientPortalLogin({onLogin}){
  const [correo,setCorreo]=useState('');
  const [pass,setPass]=useState('');
  const [show,setShow]=useState(false);
  const [err,setErr]=useState(false);
  const attempt=()=>{
    const all=clients_storage.load();
    const found=all.find(c=>c.correo&&c.correo.toLowerCase()===correo.trim().toLowerCase()&&c.password===pass);
    if(found){
      if(found.estado==='Propuesta aceptada'){
        const updated={...found,estado:'Activo',historial:[...(found.historial||[]),{fecha:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),descripcion:'Cliente activó su portal por primera vez.'}]};
        clients_storage.save(all.map(c=>c.id===updated.id?updated:c));
        onLogin(updated);
      } else {
        onLogin(found);
      }
    }
    else{setErr(true);setTimeout(()=>setErr(false),2200);}
  };
  return(
    <div style={{minHeight:'100vh',background:GL_BG,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px',fontFamily:"'Inter',sans-serif",position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:'-15%',right:'-10%',width:'500px',height:'500px',borderRadius:'50%',background:`radial-gradient(circle,rgba(168,85,247,0.16) 0%,transparent 65%)`,pointerEvents:'none'}}/>
      <div style={{position:'absolute',bottom:'-15%',left:'-10%',width:'500px',height:'500px',borderRadius:'50%',background:`radial-gradient(circle,rgba(124,58,237,0.12) 0%,transparent 65%)`,pointerEvents:'none'}}/>
      <div style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(rgba(168,85,247,.03) 1px,transparent 1px)',backgroundSize:'30px 30px',pointerEvents:'none'}}/>
      <div style={{position:'absolute',top:0,left:0,right:0,height:'1px',background:`linear-gradient(90deg,transparent,${GL_P} 40%,${GL_P3} 60%,transparent)`}}/>
      <div style={{width:'100%',maxWidth:'420px',position:'relative',zIndex:2}}>
        <div style={{textAlign:'center',marginBottom:'36px'}}>
          <div style={{display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:'16px'}}>
            <div style={{width:'54px',height:'54px',background:`linear-gradient(135deg,${GL_P2},${GL_P})`,borderRadius:'18px',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 0 40px rgba(168,85,247,0.4)`}}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.09 6.26L20 10l-5.91 1.74L12 18l-2.09-6.26L4 10l5.91-1.74L12 2z" fill="#fff"/><path d="M19 15l1.09 2.91L23 19l-2.91 1.09L19 23l-1.09-2.91L15 19l2.91-1.09L19 15z" fill="rgba(255,255,255,0.55)"/></svg>
            </div>
          </div>
          <h1 style={{fontSize:'26px',fontWeight:'800',color:'#fff',letterSpacing:'-.03em',marginBottom:'4px',fontFamily:"'Playfair Display',serif"}}>GlowLabs</h1>
          <p style={{fontSize:'12px',color:GL_P3,letterSpacing:'.06em',textTransform:'uppercase',fontWeight:'500',marginBottom:'6px'}}>Portal del Cliente</p>
          <p style={{fontSize:'12px',color:'rgba(255,255,255,0.25)'}}>Accede a tu espacio personalizado</p>
        </div>
        <div style={{background:'rgba(255,255,255,0.03)',border:`1px solid ${err?'rgba(239,68,68,0.5)':`rgba(168,85,247,0.25)`}`,borderRadius:'22px',padding:'34px',backdropFilter:'blur(20px)',boxShadow:'0 30px 60px rgba(0,0,0,0.5)',transition:'border-color .2s'}}>
          <div style={{marginBottom:'16px'}}>
            <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.35)',letterSpacing:'.1em',textTransform:'uppercase',display:'block',marginBottom:'8px'}}>Correo electrónico</label>
            <input value={correo} onChange={e=>setCorreo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&attempt()} type="email" placeholder="tu@empresa.com"
              style={{width:'100%',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(168,85,247,0.2)',borderRadius:'10px',padding:'12px 16px',color:'#fff',fontSize:'14px',outline:'none',boxSizing:'border-box',fontFamily:"'Inter',sans-serif",transition:'border-color .2s'}}
              onFocus={e=>e.target.style.borderColor='rgba(168,85,247,0.6)'} onBlur={e=>e.target.style.borderColor='rgba(168,85,247,0.2)'}/>
          </div>
          <div style={{marginBottom:'22px'}}>
            <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.35)',letterSpacing:'.1em',textTransform:'uppercase',display:'block',marginBottom:'8px'}}>Contraseña</label>
            <div style={{position:'relative'}}>
              <input type={show?'text':'password'} value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&attempt()} placeholder="••••••••••"
                style={{width:'100%',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(168,85,247,0.2)',borderRadius:'10px',padding:'12px 44px 12px 16px',color:'#fff',fontSize:'14px',outline:'none',boxSizing:'border-box',fontFamily:"'Inter',sans-serif",transition:'border-color .2s'}}
                onFocus={e=>e.target.style.borderColor='rgba(168,85,247,0.6)'} onBlur={e=>e.target.style.borderColor='rgba(168,85,247,0.2)'}/>
              <button onClick={()=>setShow(s=>!s)} style={{position:'absolute',right:'13px',top:'50%',transform:'translateY(-50%)',background:'transparent',border:'none',cursor:'pointer',color:'rgba(255,255,255,0.3)',padding:'2px',display:'flex'}}>
                {show?<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>}
              </button>
            </div>

function ClientPortal(){
  const PORTAL_KEY='portal_session_v1';
  const [client,setClient]=useState(()=>{
    try{const s=sessionStorage.getItem(PORTAL_KEY);return s?JSON.parse(s):null;}catch{return null;}
  });

  const login=c=>{sessionStorage.setItem(PORTAL_KEY,JSON.stringify(c));setClient(c);};
  const logout=()=>{sessionStorage.removeItem(PORTAL_KEY);setClient(null);};

  const handleBriefSubmit=(projId,brief,prompt)=>{
    const all=clients_storage.load();
    const updated=all.map(c=>{
      if(c.id!==client.id)return c;
      const proyectos=c.proyectos.map(p=>{
        if(p.id!==projId)return p;
        return{...p,brief,prompt,estado:'Brief completado',checklist:{...p.checklist,brief:true,prompt:true}};
      });
      const historial=[...(c.historial||[]),{fecha:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),descripcion:'Cliente completó el brief de la página web.'}];
      return{...c,proyectos,historial};
    });
    clients_storage.save(updated);
    // Refresh client in session
    const fresh=updated.find(c=>c.id===client.id);
    if(fresh){sessionStorage.setItem(PORTAL_KEY,JSON.stringify(fresh));setClient(fresh);}
  };

  if(!client) return <ClientPortalLogin onLogin={login}/>;
  return <ClientPortalDashboard client={client} onLogout={logout} onBriefSubmit={handleBriefSubmit}/>;
}

  const ACC='#a78bfa';
  return(
    <div style={{minHeight:'100vh',background:'#f8f7f5',paddingBottom:'80px',fontFamily:"'Inter',sans-serif"}}>
      <div style={{background:'#fff',borderBottom:'1px solid #e8e5e0',padding:'16px 28px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:10}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
          <div style={{width:'28px',height:'28px',background:'#1c1c1c',borderRadius:'7px',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="#fff" strokeWidth="1.2"/><path d="M1 5h10M4 5v5" stroke="#fff" strokeWidth="1"/></svg>
          </div>
          <span style={{fontSize:'14px',fontWeight:'700',color:'#1c1c1c'}}>Briefing enviado</span>
        </div>
        <button onClick={onNew} style={{background:'transparent',border:'1px solid #ddd',borderRadius:'8px',color:'#555',fontSize:'12px',fontWeight:'600',padding:'7px 14px',cursor:'pointer'}}>Nuevo briefing</button>
      </div>
      <div style={{maxWidth:'680px',margin:'0 auto',padding:'40px 24px 0'}}>
        <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:'12px',padding:'18px 20px',display:'flex',alignItems:'center',gap:'12px',marginBottom:'28px'}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <div><p style={{fontSize:'14px',fontWeight:'700',color:'#15803d',marginBottom:'2px'}}>¡Briefing completado!</p><p style={{fontSize:'12.5px',color:'#166534'}}>Tu información ha sido registrada. Nuestro equipo se pondrá en contacto contigo pronto.</p></div>
        </div>
        <div style={{background:'#fff',border:'1px solid #e8e5e0',borderRadius:'14px',overflow:'hidden',marginBottom:'16px'}}>
          <div style={{padding:'18px 22px',borderBottom:'1px solid #f0ede8',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <p style={{fontSize:'13px',fontWeight:'700',color:'#1c1c1c',marginBottom:'2px'}}>Resumen del briefing</p>
              <p style={{fontSize:'11.5px',color:'#999'}}>Empresa: {form.empresa} · Sector: {form.sector}</p>
            </div>
            <button onClick={copy} style={{display:'flex',alignItems:'center',gap:'7px',padding:'9px 16px',background:copied?'#f0fdf4':ACC,border:`1px solid ${copied?'#bbf7d0':'transparent'}`,borderRadius:'8px',color:copied?'#16a34a':'#fff',fontSize:'12.5px',fontWeight:'700',cursor:'pointer',transition:'all .2s'}}>
              {copied?<><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>¡Copiado!</>:<><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copiar briefing</>}
            </button>
          </div>
          <pre style={{margin:0,padding:'22px',fontSize:'11.5px',lineHeight:'1.7',color:'#333',whiteSpace:'pre-wrap',wordBreak:'break-word',fontFamily:"'Inter',monospace",maxHeight:'500px',overflowY:'auto',background:'#fafaf8'}}>{prompt}</pre>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════

/* ════════════════════════════════════════════════
   MÓDULO 5 — EMPLOYEE MANAGEMENT
   ════════════════════════════════════════════════ */
function EmployeeModule({onHome}){
  const [emps,setEmps]=useState(()=>emp_storage.load());
  const [form,setForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const DEFAULT_PERMISOS={marketing:true,ia:true,web:true,clients:true};
  const [data,setData]=useState({nombre:'',username:'',password:'',correo:'',metaMensual:'',permisos:{...DEFAULT_PERMISOS}});
  const [showPw,setShowPw]=useState(false);
  const [viewEmp,setViewEmp]=useState(null);

  const reload=()=>{setEmps(emp_storage.load());};

  const saveEmp=()=>{
    if(!data.nombre.trim()||!data.username.trim()||!data.password.trim()) return;
    const all=emp_storage.load();
    if(editId){
      emp_storage.save(all.map(e=>e.id===editId?{...e,...data,password:data.password.trim(),nombre:data.nombre.trim(),username:data.username.trim(),metaMensual:Number(data.metaMensual)||0}:e));
    } else {
      const newEmp={id:Date.now().toString(),nombre:data.nombre.trim(),username:data.username.trim(),password:data.password.trim(),correo:data.correo.trim(),metaMensual:Number(data.metaMensual)||0,permisos:data.permisos||DEFAULT_PERMISOS,activo:true,ultimaActividad:null};
      emp_storage.save([...all,newEmp]);
      // Auto-open mailto with credentials if correo is set
      if(data.correo.trim()){
        const subject=encodeURIComponent('Acceso a Agency OS — Tus credenciales');
        const body=encodeURIComponent(`Hola ${data.nombre.trim()},\n\nAquí tienes tus credenciales de acceso a Agency OS:\n\n🔐 Usuario: ${data.username.trim()}\n🔑 Contraseña: ${data.password}\n🌐 Acceso: ${window.location.origin}${window.location.pathname}\n\nGuarda esta información en un lugar seguro.\n\nSaludos,\nGlowLabs`);
        window.open(`mailto:${data.correo.trim()}?subject=${subject}&body=${body}`,'_blank');
      }
    }
    reload();setForm(false);setEditId(null);setData({nombre:'',username:'',password:'',correo:'',metaMensual:'',permisos:{...DEFAULT_PERMISOS}});
  };

  const toggleActivo=(id)=>{
    const all=emp_storage.load();
    emp_storage.save(all.map(e=>e.id===id?{...e,activo:!e.activo}:e));
    reload();
  };

  const startEdit=(emp)=>{setData({nombre:emp.nombre,username:emp.username,password:emp.password,correo:emp.correo||'',metaMensual:emp.metaMensual||'',permisos:emp.permisos||{...DEFAULT_PERMISOS}});setEditId(emp.id);setForm(true);};

  const getStats=(empId)=>{
    const allC=clients_storage.load();
    const allM=JSON.parse(localStorage.getItem('propuestas_v2')||'[]');
    const allI=JSON.parse(localStorage.getItem(AI_STORAGE_KEY)||'[]');
    const empClients=allC.filter(c=>c.asignadoA===empId);
    const propCreadas=allM.filter(p=>p.creadoPor===empId).length+allI.filter(p=>p.creadoPor===empId).length;
    const propEnv=empClients.filter(c=>c.estado==='Propuesta enviada').length;
    const cerrados=empClients.filter(c=>c.estado==='Activo'||c.estado==='Propuesta aceptada').length;
    const montoTotal=empClients.reduce((s,c)=>s+(c.montoContrato||0),0);
    const montoActivo=empClients.filter(c=>!c.comisionPagada).reduce((s,c)=>s+(c.montoContrato||0),0);
    const comisionPend=montoActivo*0.5;
    const comisionPagada=empClients.filter(c=>c.comisionPagada).reduce((s,c)=>s+(c.montoContrato||0),0)*0.5;
    return{propCreadas,propEnv,cerrados,montoTotal,comisionPend,comisionPagada,clientCount:empClients.length};
  };

  const fmtMoney=v=>{if(!v)return '$0';return '$'+Number(v).toLocaleString('es-CO');};

  // Detail view for one employee
  if(viewEmp){
    const emp=emps.find(e=>e.id===viewEmp);
    if(!emp) return setViewEmp(null);
    const stats=getStats(emp.id);
    const empClients=clients_storage.load().filter(c=>c.asignadoA===emp.id);
    const togglePaid=(clientId)=>{
      const all=clients_storage.load();
      clients_storage.save(all.map(c=>c.id===clientId?{...c,comisionPagada:!c.comisionPagada}:c));
    };
    const markAllPaid=()=>{
      const all=clients_storage.load();
      const pendIds=new Set(empClients.filter(c=>!c.comisionPagada&&(c.montoContrato||0)>0).map(c=>c.id));
      clients_storage.save(all.map(c=>pendIds.has(c.id)?{...c,comisionPagada:true}:c));
    };
    return(
      <div style={{minHeight:'100vh',background:GL_BG,fontFamily:"'Inter',sans-serif",color:'#fff'}}>
        <div style={{maxWidth:'960px',margin:'0 auto',padding:'32px 24px'}}>
          <button onClick={()=>setViewEmp(null)} style={{background:'none',border:'none',color:'rgba(255,255,255,0.4)',cursor:'pointer',fontSize:'13px',marginBottom:'24px',padding:'0',display:'flex',alignItems:'center',gap:'6px'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
            Volver al equipo
          </button>
          <div style={{display:'flex',alignItems:'center',gap:'16px',marginBottom:'32px'}}>
            <div style={{width:'52px',height:'52px',background:`linear-gradient(135deg,${EMP_A},rgba(244,114,182,0.5))`,borderRadius:'14px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',fontWeight:'700',color:'#fff'}}>
              {emp.nombre.charAt(0).toUpperCase()}
            </div>
            <div>
              <h1 style={{fontSize:'22px',fontWeight:'800',margin:'0 0 2px',letterSpacing:'-.02em'}}>{emp.nombre}</h1>
              <p style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',margin:0}}>@{emp.username} · Meta mensual: {fmtMoney(emp.metaMensual)}</p>
            </div>
          </div>
          {/* Stats cards */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'12px',marginBottom:'32px'}}>
            {[
              {l:'Propuestas creadas',v:stats.propCreadas,c:GL_P3},
              {l:'Propuestas enviadas',v:stats.propEnv,c:'#fb923c'},
              {l:'Deals cerrados',v:stats.cerrados,c:'#4ade80'},
              {l:'Clientes asignados',v:stats.clientCount,c:EMP_A},
              {l:'Comisión pendiente',v:fmtMoney(stats.comisionPend),c:'#fbbf24'},
              {l:'Comisión pagada',v:fmtMoney(stats.comisionPagada),c:'#34d399'},
            ].map(m=>(
              <div key={m.l} style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'12px',padding:'18px 20px'}}>
                <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'.07em'}}>{m.l}</p>
                <p style={{fontSize:'22px',fontWeight:'800',color:m.c,margin:0,letterSpacing:'-.02em'}}>{m.v}</p>
              </div>
            ))}
          </div>
          {/* Monthly goal progress */}
          {emp.metaMensual>0&&(()=>{
            const pct=Math.min(100,Math.round((stats.montoTotal/(emp.metaMensual))*100));
            const barColor=pct>=100?'#34d399':pct>=60?'#fbbf24':GL_P;
            return(
              <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'14px',padding:'20px 24px',marginBottom:'28px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
                  <div>
                    <p style={{fontSize:'12px',fontWeight:'700',color:'rgba(255,255,255,0.4)',textTransform:'uppercase',letterSpacing:'.07em',margin:'0 0 3px'}}>Meta mensual de ingresos</p>
                    <p style={{fontSize:'13px',color:'rgba(255,255,255,0.7)',margin:0}}>{fmtMoney(stats.montoTotal)} <span style={{color:'rgba(255,255,255,0.3)'}}>de {fmtMoney(emp.metaMensual)}</span></p>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <p style={{fontSize:'28px',fontWeight:'900',color:barColor,margin:0,letterSpacing:'-.04em'}}>{pct}%</p>
                    {pct>=100&&<p style={{fontSize:'11px',color:'#34d399',margin:0,fontWeight:'700'}}>Meta alcanzada</p>}
                  </div>
                </div>
                <div style={{height:'8px',background:'rgba(255,255,255,0.07)',borderRadius:'99px',overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${pct}%`,background:`linear-gradient(90deg,${barColor}80,${barColor})`,borderRadius:'99px',transition:'width .4s ease'}}/>
                </div>
              </div>
            );
          })()}
          {/* Clients table */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'14px'}}>
            <h2 style={{fontSize:'14px',fontWeight:'700',color:'rgba(255,255,255,0.6)',margin:0,letterSpacing:'.04em',textTransform:'uppercase'}}>Clientes asignados</h2>
            {empClients.some(c=>!c.comisionPagada&&(c.montoContrato||0)>0)&&(
              <button onClick={()=>{markAllPaid();reload();}} style={{padding:'6px 14px',background:'rgba(52,211,153,0.1)',border:'1px solid rgba(52,211,153,0.3)',borderRadius:'8px',color:'#34d399',fontSize:'11px',fontWeight:'700',cursor:'pointer',display:'flex',alignItems:'center',gap:'5px'}}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                Marcar todas pagadas
              </button>
            )}
          </div>
          {empClients.length===0&&<p style={{color:'rgba(255,255,255,0.2)',fontSize:'13px'}}>No hay clientes asignados aún.</p>}
          {empClients.map(c=>(
            <div key={c.id} style={{background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'12px',padding:'16px 20px',marginBottom:'10px',display:'flex',alignItems:'center',gap:'16px'}}>
              <div style={{flex:1}}>
                <p style={{fontWeight:'700',fontSize:'14px',margin:'0 0 2px'}}>{c.empresa}</p>
                <p style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',margin:0}}>{c.estado} · {c.correo||'—'}</p>
              </div>
              <div style={{textAlign:'right',minWidth:'120px'}}>
                <p style={{fontSize:'13px',fontWeight:'700',color:'#fbbf24',margin:'0 0 2px'}}>{fmtMoney(c.montoContrato||0)}</p>
                <p style={{fontSize:'11px',color:c.comisionPagada?'#34d399':'rgba(255,255,255,0.3)',margin:0}}>Comisión: {fmtMoney((c.montoContrato||0)*0.5)}</p>
              </div>
              <button onClick={()=>{togglePaid(c.id);reload();}} style={{padding:'6px 12px',background:c.comisionPagada?'rgba(52,211,153,0.15)':'rgba(251,191,36,0.1)',border:`1px solid ${c.comisionPagada?'rgba(52,211,153,0.4)':'rgba(251,191,36,0.3)'}`,borderRadius:'8px',color:c.comisionPagada?'#34d399':'#fbbf24',fontSize:'11px',fontWeight:'700',cursor:'pointer',whiteSpace:'nowrap'}}>
                {c.comisionPagada?'✓ Pagada':'Marcar pagada'}
              </button>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return(
    <div style={{minHeight:'100vh',background:GL_BG,fontFamily:"'Inter',sans-serif",color:'#fff'}}>
      {/* Header */}
      <div style={{borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'20px 32px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
          <button onClick={onHome} style={{background:'none',border:'none',color:'rgba(255,255,255,0.3)',cursor:'pointer',padding:0,display:'flex'}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div style={{width:'32px',height:'32px',background:`linear-gradient(135deg,rgba(244,114,182,0.5),${EMP_A})`,borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><circle cx="6" cy="5" r="2.5" stroke="#fff" strokeWidth="1.3"/><path d="M1 14c0-2.2 1.8-4 5-4s5 1.8 5 4" stroke="#fff" strokeWidth="1.3" strokeLinecap="round"/><circle cx="13" cy="6" r="2" stroke="#fff" strokeWidth="1.3"/><path d="M17 14c0-1.7-1.1-3.1-2.5-3.5" stroke="#fff" strokeWidth="1.3" strokeLinecap="round"/></svg>
          </div>
          <div>
            <h1 style={{fontSize:'18px',fontWeight:'800',margin:0,letterSpacing:'-.02em'}}>Equipo & Comisiones</h1>
            <p style={{fontSize:'11px',color:'rgba(255,255,255,0.25)',margin:0}}>{emps.filter(e=>e.activo).length} empleados activos</p>
          </div>
        </div>
        <button onClick={()=>{setForm(true);setEditId(null);setData({nombre:'',username:'',password:'',metaMensual:''}); }} style={{display:'flex',alignItems:'center',gap:'7px',padding:'10px 18px',background:`linear-gradient(135deg,${GL_P2},${GL_P})`,border:'none',borderRadius:'10px',color:'#fff',fontSize:'13px',fontWeight:'700',cursor:'pointer'}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo empleado
        </button>
      </div>

      <div style={{maxWidth:'1100px',margin:'0 auto',padding:'32px 24px'}}>
        {/* Add/Edit Form */}
        {form&&(
          <div style={{background:'rgba(255,255,255,0.03)',border:`1px solid rgba(244,114,182,0.25)`,borderRadius:'16px',padding:'28px',marginBottom:'28px'}}>
            <h3 style={{fontSize:'14px',fontWeight:'700',marginBottom:'20px',color:'#fff'}}>{editId?'Editar empleado':'Nuevo empleado'}</h3>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px',marginBottom:'14px'}}>
              {[
                {label:'Nombre completo',key:'nombre',ph:'Ej: Juan García'},
                {label:'Usuario (login)',key:'username',ph:'Ej: juangarcia'},
              ].map(f=>(
                <div key={f.key}>
                  <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',display:'block',marginBottom:'6px'}}>{f.label}</label>
                  <input value={data[f.key]} onChange={e=>setData(d=>({...d,[f.key]:e.target.value}))} placeholder={f.ph}
                    style={{width:'100%',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',padding:'10px 12px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none',boxSizing:'border-box'}}/>
                </div>
              ))}
              <div>
                <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',display:'block',marginBottom:'6px'}}>Contraseña</label>
                <div style={{position:'relative'}}>
                  <input type={showPw?'text':'password'} value={data.password} onChange={e=>setData(d=>({...d,password:e.target.value}))} placeholder="Contraseña"
                    style={{width:'100%',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',padding:'10px 38px 10px 12px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none',boxSizing:'border-box'}}/>
                  <button onClick={()=>setShowPw(s=>!s)} style={{position:'absolute',right:'10px',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'rgba(255,255,255,0.3)',padding:0}}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">{showPw?<><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></>:<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>}</svg>
                  </button>
                </div>
              </div>
              <div>
                <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',display:'block',marginBottom:'6px'}}>Meta mensual ($)</label>
                <input type="number" value={data.metaMensual} onChange={e=>setData(d=>({...d,metaMensual:e.target.value}))} placeholder="0"
                  style={{width:'100%',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',padding:'10px 12px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none',boxSizing:'border-box'}}/>
              </div>
              <div style={{gridColumn:'1/-1'}}>
                <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(56,189,248,0.7)',letterSpacing:'.08em',textTransform:'uppercase',display:'block',marginBottom:'6px'}}>Correo electrónico <span style={{fontWeight:'400',color:'rgba(255,255,255,0.2)',textTransform:'none',letterSpacing:'0'}}>— se enviará email con credenciales al crear</span></label>
                <input type="email" value={data.correo} onChange={e=>setData(d=>({...d,correo:e.target.value}))} placeholder="juan@empresa.com"
                  style={{width:'100%',background:'rgba(56,189,248,0.04)',border:'1px solid rgba(56,189,248,0.2)',borderRadius:'8px',padding:'10px 12px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none',boxSizing:'border-box'}}/>
              </div>
            </div>
            {/* Permisos de módulos */}
            <div style={{marginBottom:'18px',padding:'16px',background:'rgba(168,85,247,0.04)',border:'1px solid rgba(168,85,247,0.15)',borderRadius:'12px'}}>
              <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:'12px',fontFamily:"'Inter',sans-serif"}}>Permisos de acceso</p>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
                {[
                  {key:'marketing',label:'Marketing',color:WARM},
                  {key:'ia',label:'IA',color:AI_A},
                  {key:'web',label:'Web',color:WEB_A},
                  {key:'clients',label:'Clientes',color:CL_A},
                ].map(m=>{
                  const on=data.permisos?.[m.key]!==false;
                  return(
                    <button key={m.key} type="button" onClick={()=>setData(d=>({...d,permisos:{...(d.permisos||{}),  [m.key]:!on}}))}

                  🔗 Copiar link de acceso
                </button>
                {emp.correo&&<button onClick={()=>{
                  const subject=encodeURIComponent('Acceso a Agency OS — Tus credenciales');
                  const body=encodeURIComponent(`Hola ${emp.nombre},\n\nAquí tienes tus credenciales de acceso a Agency OS:\n\n🔐 Usuario: ${emp.username}\n🔑 Contraseña: ${emp.password}\n🌐 Acceso: ${window.location.origin}${window.location.pathname}\n\nGuarda esta información en un lugar seguro.\n\nSaludos,\nGlowLabs`);
                  window.open(`mailto:${emp.correo}?subject=${subject}&body=${body}`,'_blank');
                }} style={{marginTop:'6px',width:'100%',padding:'7px',background:'rgba(56,189,248,0.07)',border:'1px solid rgba(56,189,248,0.25)',borderRadius:'8px',color:'#38bdf8',fontSize:'11px',fontWeight:'700',cursor:'pointer',letterSpacing:'.03em'}}>
                  📧 Enviar credenciales por email

          })}

      </div>
    </div>
  );
}

  // Employee leaderboard
  const empStats=emps.map(emp=>{

    return {nombre:emp.nombre,monto,propCreadas,cerradas,comision:monto*0.5,pagada:empClients.filter(c=>c.comisionPagada).reduce((s,c)=>s+(c.montoContrato||0)*0.5,0)};

          <div style={{width:'1px',height:'18px',background:'rgba(255,255,255,0.08)'}}/>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{width:'22px',height:'22px',background:DB_A,borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><rect x="1" y="7" width="3" height="6" rx="1" fill="#000"/><rect x="5.5" y="4" width="3" height="9" rx="1" fill="#000"/><rect x="10" y="1" width="3" height="12" rx="1" fill="#000"/></svg>
            </div>
            <span style={{fontSize:'14px',fontWeight:'700',color:'#313131',letterSpacing:'-.01em'}}>Dashboard</span>
          </div>
        </div>
        <span style={{fontSize:'11px',color:'rgba(255,255,255,0.2)'}}>Actualizado en tiempo real</span>
      </div>

      <div style={{maxWidth:'1200px',margin:'0 auto',padding:'32px'}}>
        {/* KPI row */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:'14px',marginBottom:'24px'}}>
          {[
            {l:'Ingresos totales',v:`$${totalMonto.toLocaleString('es-CO')}`,c:DB_A,sub:`${clients.length} clientes`},
            {l:'MRR',v:mrr>0?`$${mrr.toLocaleString('es-CO')}/mes`:'—',c:'#34d399',sub:`${clients.filter(c=>c.esRecurrente&&c.estado==='Activo').length} recurrentes`},
            {l:'Comisiones pendientes',v:`$${comisionesPend.toLocaleString('es-CO')}`,c:'#f472b6',sub:'Por pagar al equipo'},
            {l:'Comisiones pagadas',v:`$${comisionesPagas.toLocaleString('es-CO')}`,c:'#34d399',sub:'Historial pagado'},
            {l:'Tasa de conversión',v:`${convRate}%`,c:CL_A,sub:'Lead → Activo/Finalizado'},
            (()=>{const rated=clients.filter(c=>(c.rating||0)>0);const avg=rated.length?Math.round(rated.reduce((s,c)=>s+(c.rating||0),0)/rated.length*10)/10:0;return{l:'Satisfacción media',v:avg>0?`★ ${avg}/5`:'—',c:avg>=4?'#4ade80':avg>=3?'#fbbf24':avg>0?'#f87171':'rgba(255,255,255,0.3)',sub:rated.length>0?`${rated.length} cliente${rated.length!==1?'s':''} valorados`:'Sin valoraciones'};})(),
          ].map(k=>(
            <div key={k.l} className="glass" style={{padding:'22px',borderTop:`2px solid ${k.c}44`}}>
              <p style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:'10px'}}>{k.l}</p>
              <p style={{fontSize:'26px',fontWeight:'800',color:k.c,marginBottom:'4px',letterSpacing:'-.02em'}}>{k.v}</p>

            </div>
