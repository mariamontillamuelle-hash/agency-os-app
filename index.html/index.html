                      return(
                        <div key={t.id} className="glass" style={{padding:'14px 16px',display:'flex',alignItems:'flex-start',gap:'12px',borderLeft:`3px solid ${overdue?'#f87171':p.c}`}}>
                          <button onClick={()=>toggleTarea(t.id)} style={{width:'18px',height:'18px',borderRadius:'50%',border:`2px solid ${p.c}`,background:'transparent',cursor:'pointer',flexShrink:0,marginTop:'2px'}}/>
                          <div style={{flex:1}}>
                            <p style={{fontSize:'13.5px',color:'rgba(255,255,255,0.85)',fontFamily:"'Inter',sans-serif",marginBottom:'4px'}}>{t.titulo}</p>
                            <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
                              <span style={{fontSize:'11px',padding:'1px 7px',background:`${p.c}22`,border:`1px solid ${p.c}44`,borderRadius:'4px',color:p.c,fontFamily:"'Inter',sans-serif",fontWeight:'600'}}>{p.l}</span>
                              {t.fechaLimite&&<span style={{fontSize:'11px',color:overdue?'#f87171':'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif"}}>{overdue?'⚠️ Vencida: ':''}{t.fechaLimite}</span>}
                              {t.responsable&&<span style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',fontFamily:"'Inter',sans-serif"}}>👤 {t.responsable}</span>}
                            </div>
                          </div>
                          {isAdmin&&<button onClick={()=>deleteTarea(t.id)} style={{background:'none',border:'none',color:'rgba(255,255,255,0.2)',cursor:'pointer',fontSize:'16px',padding:'0',flexShrink:0}} title="Eliminar">×</button>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              {completadas.length>0&&(
                <div>
                  <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.2)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'10px',fontFamily:"'Inter',sans-serif"}}>Completadas ({completadas.length})</p>
                  <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
                    {completadas.map(t=>(
                      <div key={t.id} className="glass" style={{padding:'12px 16px',display:'flex',alignItems:'center',gap:'12px',opacity:0.5}}>
                        <button onClick={()=>toggleTarea(t.id)} style={{width:'18px',height:'18px',borderRadius:'50%',border:'2px solid #34d399',background:'#34d39922',cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                          <svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5L8.5 2" stroke="#34d399" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </button>
                        <p style={{fontSize:'13px',color:'rgba(255,255,255,0.5)',fontFamily:"'Inter',sans-serif",textDecoration:'line-through',flex:1}}>{t.titulo}</p>
                        {isAdmin&&<button onClick={()=>deleteTarea(t.id)} style={{background:'none',border:'none',color:'rgba(255,255,255,0.15)',cursor:'pointer',fontSize:'14px',padding:'0'}} title="Eliminar">×</button>}
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {tareas.length===0&&!addingTarea&&<p style={{fontSize:'13px',color:'rgba(255,255,255,0.25)',padding:'20px',textAlign:'center',fontFamily:"'Inter',sans-serif"}}>Sin tareas para este cliente. ¡Crea la primera!</p>}
            </div>
          );
        })()}

        {/* MENSAJES TAB */}
        {tab==='mensajes'&&(()=>{
          const [selectedTpl,setSelectedTpl]=React.useState(null);
          const [copied,setCopied]=React.useState(false);
          const contacto=client.contacto||'Cliente';
          const empresa=client.empresa||'tu empresa';
          const asesor=currentUser?.nombre||'el equipo de GlowLabs';
          const svcList=(client.servicios||[]).map(s=>({marketing:'Marketing Digital',ia:'Inteligencia Artificial',web:'Diseño Web'}[s]||s)).join(', ')||'nuestros servicios';
          const daysRenewal=client.fechaVencimiento?Math.round((new Date(client.fechaVencimiento)-new Date())/(1000*60*60*24)):null;
          const TEMPLATES=[
            {
              id:'bienvenida',
              label:'👋 Bienvenida',
              desc:'Para enviar cuando un cliente firma',
              color:'#4ade80',
              asunto:`¡Bienvenido a GlowLabs, ${empresa}!`,
              cuerpo:`Hola ${contacto},\n\n¡Estamos emocionados de comenzar a trabajar contigo! 🎉\n\nDesde hoy, ${empresa} es parte de la familia GlowLabs. Trabajaremos juntos en ${svcList} para llevar tu negocio al siguiente nivel.\n\nEn los próximos días me pondré en contacto contigo para coordinar los primeros pasos. Si tienes alguna pregunta antes de eso, no dudes en escribirme.\n\nBienvenido/a,\n${asesor}\nGlowLabs Agencia IA`
            },
            {
              id:'seguimiento',
              label:'🔄 Seguimiento',
              desc:'Follow-up post-propuesta o reunión',
              color:'#38bdf8',
              asunto:`Seguimiento — ${empresa}`,
              cuerpo:`Hola ${contacto},\n\nEspero que estés bien. Quería hacer un seguimiento de nuestra conversación y ver si tienes alguna pregunta sobre la propuesta que te compartimos.\n\nEstamos listos para comenzar y queremos asegurarnos de que tengas toda la información que necesitas para tomar una decisión con confianza.\n\n¿Tienes disponibilidad esta semana para una llamada rápida de 15 minutos?\n\nQuedo atento/a,\n${asesor}\nGlowLabs Agencia IA`
            },
            {
              id:'renovacion',
              label:'🔔 Renovación',
              desc:`Recordatorio de vencimiento${daysRenewal!==null?' ('+daysRenewal+'d)':''}`,
              color:'#fbbf24',
              asunto:`Renovación de contrato — ${empresa}`,
              cuerpo:`Hola ${contacto},\n\nEspero que todo vaya muy bien. Me comunico porque${daysRenewal!==null&&daysRenewal>=0?' en '+daysRenewal+' día'+( daysRenewal===1?'':'s'):' recientemente'} vence tu contrato actual con GlowLabs.\n\nHa sido un placer trabajar con ${empresa} en ${svcList}. Los resultados han sido muy positivos y nos encantaría continuar esta alianza.\n\n¿Podemos agendar una llamada esta semana para revisar los términos de renovación y planificar la siguiente etapa?\n\nCuando gustes,\n${asesor}\nGlowLabs Agencia IA`
            },
            {
              id:'entrega',
              label:'✅ Entrega de proyecto',
              desc:'Al completar un entregable',
              color:'#a78bfa',
              asunto:`¡Tu proyecto está listo! — ${empresa}`,
              cuerpo:`Hola ${contacto},\n\n¡Tenemos excelentes noticias! Tu proyecto de ${svcList} está listo y esperando tu revisión. 🚀\n\nPuedes acceder a los entregables en el link que te compartiré por separado. Por favor, revisa todo y compártenos tu feedback.\n\nTu opinión es muy importante para nosotros. Si necesitas algún ajuste o tienes preguntas, con mucho gusto los atendemos.\n\n¡Gracias por confiar en GlowLabs!\n${asesor}`
            },
            {
              id:'inactivo',
              label:'💬 Re-activación',
              desc:'Para clientes inactivos o perdidos',
              color:'#fb923c',
              asunto:`Una novedad para ${empresa} 🚀`,
              cuerpo:`Hola ${contacto},\n\n¡Espero que estés muy bien! Hace un tiempo no tenemos noticias tuyas y quería contactarme.\n\nEn GlowLabs hemos lanzado nuevas soluciones de ${svcList} con resultados increíbles para negocios como el de ${empresa}. Creo que te podría interesar mucho lo que tenemos ahora.\n\n¿Podríamos tener una conversación de 20 minutos para contarte las novedades?\n\n¡Sería genial reconectar!\n${asesor}\nGlowLabs Agencia IA`
            },
            {
              id:'comision',
              label:'💰 Pago de comisión',
              desc:'Confirmación interna de comisión',
              color:'#34d399',
              asunto:`Confirmación comisión — ${empresa}`,
              cuerpo:`Hola,\n\nQuiero confirmar el pago de comisión correspondiente al cliente ${empresa}.\n\nMonto del contrato: $${(client.montoContrato||0).toLocaleString('es-CO')}\nComisión (50%): $${((client.montoContrato||0)*0.5).toLocaleString('es-CO')}\nEstado: ${client.comisionPagada?'✅ Pagada':'⏳ Pendiente'}\n\nPor favor, confirmar recibo.\n\nGracias,\n${asesor}`
            },
          ];
          const tpl=TEMPLATES.find(t=>t.id===selectedTpl);
          const copyText=()=>{
            if(!tpl)return;
            navigator.clipboard.writeText(`Asunto: ${tpl.asunto}\n\n${tpl.cuerpo}`).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
          };
          return(
            <div style={{display:'grid',gridTemplateColumns:'220px 1fr',gap:'16px',minHeight:'400px'}}>
              {/* Template list */}
              <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
                <p style={{fontSize:'10.5px',fontWeight:'700',color:'rgba(255,255,255,0.25)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'8px',fontFamily:"'Inter',sans-serif"}}>Plantillas</p>
                {TEMPLATES.map(t=>(

}

/* ── Clients Module (list + dashboard) ── */
function ClientsModule({onHome,onClientAccepted,currentUser,initialClientId}){
  const isAdmin=!currentUser||currentUser.role==='admin';
  const [clients,setClients]=useState(()=>{
    const all=clients_storage.load();
    return isAdmin?all:all.filter(c=>c.asignadoA===currentUser.id);
  });
  const [selectedClient,setSelectedClient]=useState(()=>{
    if(!initialClientId) return null;
    const all=clients_storage.load();
    return all.find(c=>c.id===initialClientId)||null;
  });
  const [filter,setFilter]=useState('Todos');
  const [search,setSearch]=useState('');
  const [lastRefresh,setLastRefresh]=useState(null);
  const [viewMode,setViewMode]=useState('list'); // 'list' | 'kanban'
  const [svcFilter,setSvcFilter]=useState(''); // '' | 'marketing' | 'ia' | 'web'
  const [empFilter,setEmpFilter]=useState(''); // '' | empId
  const [sortBy,setSortBy]=useState('reciente'); // 'reciente' | 'monto' | 'az'
  const [statusMenuId,setStatusMenuId]=useState(null);
  const [showAddClient,setShowAddClient]=useState(false);
  const [addForm,setAddForm]=useState({empresa:'',contacto:'',correo:'',telefono:'',servicios:[],estado:'Lead',montoContrato:0});
  const [showImportCSV,setShowImportCSV]=useState(false);
  const [csvText,setCsvText]=useState('');
  const [csvPreview,setCsvPreview]=useState(null);
  const [csvImporting,setCsvImporting]=useState(false);
  const [selectedIds,setSelectedIds]=useState(new Set());
  const [bulkAction,setBulkAction]=useState('');
  const [tagFilter,setTagFilter]=useState(''); // '' | tag string
  const searchInputRef=useRef(null);
  // Keyboard shortcuts
  useEffect(()=>{
    const h=e=>{
      const tag=document.activeElement?.tagName;
      const inInput=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
      if(e.key==='Escape'){setShowAddClient(false);setShowImportCSV(false);setCsvText('');setCsvPreview(null);return;}
      if(inInput) return;
      if(e.key==='n'||e.key==='N'){e.preventDefault();setShowAddClient(true);return;}
      if(e.key==='/'||e.key==='f'||e.key==='F'){e.preventDefault();searchInputRef.current?.focus();return;}
    };
    document.addEventListener('keydown',h);
    return()=>document.removeEventListener('keydown',h);
  },[]);
  useEffect(()=>{
    if(!statusMenuId) return;
    const h=()=>setStatusMenuId(null);
    document.addEventListener('click',h);
    return()=>document.removeEventListener('click',h);
  },[statusMenuId]);

  // Refresh clients from localStorage when another tab updates it (portal brief submit)
  // or when the window regains focus (user switches back from portal tab)
  useEffect(()=>{
    const refresh=()=>{
      const all=clients_storage.load();
      const fresh=isAdmin?all:all.filter(c=>c.asignadoA===(currentUser&&currentUser.id));
      setClients(fresh);
      // If a client is selected, update it too so the brief shows immediately
      setSelectedClient(sel=>sel?fresh.find(c=>c.id===sel.id)||sel:null);
      setLastRefresh(new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
    };
    window.addEventListener('storage',refresh);
    window.addEventListener('focus',refresh);
    return()=>{window.removeEventListener('storage',refresh);window.removeEventListener('focus',refresh);};
  },[]);

  const persist=list=>{setClients(list);clients_storage.save(list);};

  const updateClient=updated=>{
    const now=new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'});
    const prev=clients.find(c=>c.id===updated.id)||{};
    const dateFields={};
    if(updated.estado==='Propuesta enviada'&&!updated.fechaPropuesta&&!prev.fechaPropuesta) dateFields.fechaPropuesta=now;
    if(updated.estado==='Propuesta aceptada'&&!updated.fechaAceptacion&&!prev.fechaAceptacion) dateFields.fechaAceptacion=now;
    if(updated.estado==='Activo'&&!updated.fechaCierre&&!prev.fechaCierre) dateFields.fechaCierre=now;
    const withHistory={...updated,...dateFields,historial:[...(updated.historial||[]),{fecha:now,descripcion:`Datos actualizados.`}]};
    persist(clients.map(c=>c.id===updated.id?withHistory:c));
    setSelectedClient(withHistory);
  };

  const deleteClient=id=>{if(!confirm('¿Eliminar este cliente?'))return;persist(clients.filter(c=>c.id!==id));setSelectedClient(null);};
  const submitAddClient=()=>{
    if(!addForm.empresa.trim()){alert('Ingresa el nombre de la empresa.');return;}
    const newC=makeClient({empresa:addForm.empresa.trim(),contacto:addForm.contacto.trim(),correo:addForm.correo.trim(),servicios:addForm.servicios,asignadoA:isAdmin?null:currentUser?.id});
    newC.telefono=addForm.telefono.trim();
    newC.estado=addForm.estado;
    newC.montoContrato=Number(addForm.montoContrato)||0;
    const all=clients_storage.load();
    clients_storage.save([...all,newC]);
    const fresh=clients_storage.load();
    setClients(isAdmin?fresh:fresh.filter(c=>c.asignadoA===(currentUser&&currentUser.id)));
    setShowAddClient(false);
    setAddForm({empresa:'',contacto:'',correo:'',telefono:'',servicios:[],estado:'Lead',montoContrato:0});
    setSelectedClient(newC);
  };
  const quickStatus=(id,estado)=>{
    const all=clients_storage.load();
    const now=new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'});
    const updated=all.map(c=>{
      if(c.id!==id) return c;
      const dateFields={};
      if(estado==='Propuesta enviada'&&!c.fechaPropuesta) dateFields.fechaPropuesta=now;
      if(estado==='Propuesta aceptada'&&!c.fechaAceptacion) dateFields.fechaAceptacion=now;
      if(estado==='Activo'&&!c.fechaCierre) dateFields.fechaCierre=now;
      return{...c,estado,...dateFields,historial:[...(c.historial||[]),{fecha:now,descripcion:`Estado cambiado a ${estado}.`}]};
    });
    clients_storage.save(updated);
    setClients(isAdmin?updated:updated.filter(c=>c.asignadoA===(currentUser&&currentUser.id)));
  };

  if(selectedClient){
    const fresh=clients.find(c=>c.id===selectedClient.id)||selectedClient;
    return <ClientDetailView client={fresh} onUpdate={updateClient} onBack={()=>setSelectedClient(null)} currentUser={currentUser} isAdmin={isAdmin}/>;
  }

  // Dashboard metrics
  const total=clients.length;
  const leads=clients.filter(c=>c.estado==='Lead').length;
  const propEnv=clients.filter(c=>c.estado==='Propuesta enviada').length;
  const propAcep=clients.filter(c=>c.estado==='Propuesta aceptada').length;
  const activos=clients.filter(c=>c.estado==='Activo').length;
  const proyActivos=clients.flatMap(c=>c.proyectos||[]).filter(p=>p.estado!=='Entregado').length;
  const websDev=clients.flatMap(c=>c.proyectos||[]).filter(p=>p.tipo==='web'&&!p.checklist?.entregado).length;
  const proyIA=clients.flatMap(c=>c.proyectos||[]).filter(p=>p.tipo==='ia').length;
  const mkActivos=clients.filter(c=>c.servicios?.includes('marketing')&&c.estado==='Activo').length;

  const METRICS=[
    {l:'Leads',v:leads,c:'#9e9e9e'},{l:'Propuestas enviadas',v:propEnv,c:'#fb923c'},
    {l:'Propuestas aceptadas',v:propAcep,c:'#38bdf8'},{l:'Clientes activos',v:activos,c:CL_A},
    {l:'Proyectos activos',v:proyActivos,c:'#818cf8'},{l:'Webs en desarrollo',v:websDev,c:WEB_A},
    {l:'Proyectos IA activos',v:proyIA,c:AI_A},{l:'Marketing activos',v:mkActivos,c:WARM},
  ];

  const FILTERS=['Todos',...CLIENT_ESTADOS];
  const allEmps=emp_storage.load().filter(e=>e.activo);
  const allTags=[...new Set(clients.flatMap(c=>c.tags||[]))].sort();
  const filtered=clients.filter(c=>{
    const matchFilter=filter==='Todos'||c.estado===filter;
    const matchSearch=!search||c.empresa.toLowerCase().includes(search.toLowerCase())||c.correo?.toLowerCase().includes(search.toLowerCase())||(c.contacto||'').toLowerCase().includes(search.toLowerCase());
    const matchSvc=!svcFilter||(c.servicios||[]).includes(svcFilter);
    const matchEmp=!empFilter||c.asignadoA===empFilter;
    const matchTag=!tagFilter||(c.tags||[]).includes(tagFilter);
    return matchFilter&&matchSearch&&matchSvc&&matchEmp&&matchTag;
  }).sort((a,b)=>{
    if(sortBy==='monto') return (b.montoContrato||0)-(a.montoContrato||0);
    if(sortBy==='az') return a.empresa.localeCompare(b.empresa);
    if(sortBy==='health') return clientHealth(b).score-clientHealth(a).score;
    if(sortBy==='healthAsc') return clientHealth(a).score-clientHealth(b).score;
    if(sortBy==='lastActivity'){const la=lastInteraction(a),lb=lastInteraction(b);if(!la&&!lb)return 0;if(!la)return 1;if(!lb)return -1;return la.days-lb.days;}
    if(sortBy==='lastActivityAsc'){const la=lastInteraction(a),lb=lastInteraction(b);if(!la&&!lb)return 0;if(!la)return -1;if(!lb)return 1;return lb.days-la.days;}
    return 0; // 'reciente' preserves natural order (insert order)
  });

  const exportCSV=()=>{
    const rows=[['Empresa','Contacto','Correo','Estado','Servicios','Monto','Comisión','Creado'],...clients.map(c=>[c.empresa,c.contacto||'',c.correo||'',c.estado,(c.servicios||[]).join('+'),c.montoContrato||0,(c.montoContrato||0)*0.5,c.createdAt])];
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`clientes-glowlabs-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
  };

  const parseCSVText=(text)=>{
    const lines=text.trim().replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    if(lines.length<2) return{error:'El CSV debe tener al menos una fila de datos.'};
    const parseRow=(line)=>{
      const cells=[];let cur='';let inQ=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
        else if(ch===','&&!inQ){cells.push(cur.trim());cur='';}
        else cur+=ch;
      }
      cells.push(cur.trim());
      return cells;
    };
    const header=parseRow(lines[0]).map(h=>h.toLowerCase().replace(/[^a-záéíóúñ]/gi,''));
    const rows=lines.slice(1).filter(l=>l.trim()).map(l=>parseRow(l));
    const idx={empresa:header.findIndex(h=>h.includes('empresa')||h.includes('company')),contacto:header.findIndex(h=>h.includes('contacto')||h.includes('contact')||h.includes('nombre')),correo:header.findIndex(h=>h.includes('correo')||h.includes('email')||h.includes('mail')),estado:header.findIndex(h=>h.includes('estado')||h.includes('status')),servicios:header.findIndex(h=>h.includes('servicio')||h.includes('service')),monto:header.findIndex(h=>h.includes('monto')||h.includes('valor')||h.includes('amount'))};
    if(idx.empresa<0) return{error:'No se encontró columna "Empresa" en el CSV.'};
    const parsed=rows.map((r,i)=>{
      const empresa=(r[idx.empresa]||'').trim();
      const contacto=idx.contacto>=0?(r[idx.contacto]||'').trim():'';
      const correo=idx.correo>=0?(r[idx.correo]||'').trim():'';
      const estado=idx.estado>=0&&CLIENT_ESTADOS.includes((r[idx.estado]||'').trim())?(r[idx.estado]||'').trim():'Lead';

      const monto=idx.monto>=0?parseFloat((r[idx.monto]||'0').replace(/[^0-9.]/g,''))||0:0;
      return{_row:i+2,empresa,contacto,correo,estado,servicios,monto,valid:empresa.length>0};
    });
    return{rows:parsed};
  };

        {/* Search + filter */}

        </div>

        {/* Results count + select all */}
        <div style={{marginBottom:'12px',display:'flex',alignItems:'center',gap:'8px'}}>

                if(!bulkAction)return;

                  const nuevoEstado=bulkAction.split(':')[1];

                  const updated=allC.map(c=>{
                    if(!selectedIds.has(c.id))return c;
                    const dateFields={};
                    if(nuevoEstado==='Propuesta enviada')dateFields.fechaPropuesta=dateFields.fechaPropuesta||now;
                    if(nuevoEstado==='Propuesta aceptada')dateFields.fechaAceptacion=dateFields.fechaAceptacion||now;
                    if(nuevoEstado==='Finalizado')dateFields.fechaCierre=dateFields.fechaCierre||now;
                    return{...c,estado:nuevoEstado,...dateFields,historial:[...(c.historial||[]),{fecha:now,tipo:'estado',descripcion:`Estado cambiado a ${nuevoEstado}.`}]};
                  });
                  clients_storage.save(updated);
                  setClients(isAdmin?updated:updated.filter(c=>c.asignadoA===(currentUser&&currentUser.id)));

                  if(!confirm(`¿Eliminar ${selectedIds.size} cliente${selectedIds.size!==1?'s':''}? Esta acción no se puede deshacer.`))return;

                  const updated=allC.filter(c=>!selectedIds.has(c.id));
                  clients_storage.save(updated);
                  setClients(isAdmin?updated:updated.filter(c=>c.asignadoA===(currentUser&&currentUser.id)));

          </div>

            <div style={{display:'flex',gap:'12px',overflowX:'auto',paddingBottom:'16px',alignItems:'flex-start'}}>

                      <span style={{fontSize:'12px',fontWeight:'700',color:KANBAN_C[si],fontFamily:"'Inter',sans-serif"}}>{stage}</span>
                      <span style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.25)',background:'rgba(255,255,255,0.06)',borderRadius:'100px',padding:'1px 7px',fontFamily:"'Inter',sans-serif"}}>{stageClients.length}</span>
                    </div>
                    <div style={{padding:'8px',display:'flex',flexDirection:'column',gap:'6px',maxHeight:'60vh',overflowY:'auto'}}>
                      {stageClients.length===0&&<p style={{fontSize:'11px',color:'rgba(255,255,255,0.15)',fontFamily:"'Inter',sans-serif",padding:'12px 8px',textAlign:'center'}}>Sin clientes</p>}
                      {stageClients.map(c=>(
                        <div key={c.id} onClick={()=>setSelectedClient(c)} style={{padding:'12px',background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'8px',cursor:'pointer',transition:'all .15s'}}
                          onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,0.06)';e.currentTarget.style.borderColor=`${KANBAN_C[si]}44`;}}
                          onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,0.03)';e.currentTarget.style.borderColor='rgba(255,255,255,0.07)';}}>

                            <div style={{width:'26px',height:'26px',borderRadius:'6px',background:`${KANBAN_C[si]}22`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                              <span style={{fontSize:'11px',fontWeight:'800',color:KANBAN_C[si]}}>{c.empresa[0]?.toUpperCase()}</span>

                            {(c.servicios||[]).map(s=>{const sc={marketing:WARM,ia:AI_A,web:WEB_A};return<span key={s} style={{fontSize:'9.5px',padding:'1px 6px',borderRadius:'3px',background:`${sc[s]||'#888'}22`,color:sc[s]||'#888',fontFamily:"'Inter',sans-serif",fontWeight:'600'}}>{s}</span>;})}

                  {(()=>{
                    const pendTasks=(c.tareas||[]).filter(t=>!t.completado);
                    const overdueTasks=pendTasks.filter(t=>t.fechaLimite&&new Date(t.fechaLimite)<new Date());

                    const showRenewal=renewalDays!==null&&renewalDays<=45;

                    const showFollowUp=followUpDays!==null&&followUpDays<=1;
                    const hasBadge=pendTasks.length>0||showRenewal||showFollowUp||(!c.comisionPagada&&(c.montoContrato||0)>0&&isAdmin&&c.estado==='Activo');

                        {overdueTasks.length>0&&<span style={{fontSize:'10px',fontWeight:'700',background:'rgba(248,113,113,0.15)',border:'1px solid rgba(248,113,113,0.3)',color:'#f87171',borderRadius:'100px',padding:'2px 8px',fontFamily:"'Inter',sans-serif"}}>⚠ {overdueTasks.length}</span>}

                        {showFollowUp&&<span title={`Follow-up: ${new Date(c.followUpDate).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}`} style={{fontSize:'10px',fontWeight:'700',background:'rgba(168,85,247,0.12)',border:'1px solid rgba(168,85,247,0.3)',color:'#c084fc',borderRadius:'100px',padding:'2px 8px',fontFamily:"'Inter',sans-serif",cursor:'default'}}>{followUpDays<=0?'🔔 Follow-up':'🔔 mañana'}</span>}
                        {!c.comisionPagada&&(c.montoContrato||0)>0&&isAdmin&&c.estado==='Activo'&&<span style={{fontSize:'10px',fontWeight:'600',background:'rgba(52,211,153,0.08)',border:'1px solid rgba(52,211,153,0.2)',color:'#34d399',borderRadius:'100px',padding:'2px 8px',fontFamily:"'Inter',sans-serif",cursor:'default'}}>$ comisión</span>}
                      </div>

function ClientPortalLogin({onLogin}){
  const [correo,setCorreo]=useState('');
  const [pass,setPass]=useState('');
  const [show,setShow]=useState(false);
  const [err,setErr]=useState(false);
  const attempt=()=>{
    const all=clients_storage.load();
    const found=all.find(c=>c.correo&&c.correo.toLowerCase()===correo.trim().toLowerCase()&&c.password===pass);
    if(found){
      if(found.estado==='Propuesta aceptada'){
        const updated={...found,estado:'Activo',historial:[...(found.historial||[]),{fecha:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),descripcion:'Cliente activó su portal por primera vez.'}]};
        clients_storage.save(all.map(c=>c.id===updated.id?updated:c));
        onLogin(updated);
      } else {
        onLogin(found);
      }
    }
    else{setErr(true);setTimeout(()=>setErr(false),2200);}
  };
  return(
    <div style={{minHeight:'100vh',background:GL_BG,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px',fontFamily:"'Inter',sans-serif",position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:'-15%',right:'-10%',width:'500px',height:'500px',borderRadius:'50%',background:`radial-gradient(circle,rgba(168,85,247,0.16) 0%,transparent 65%)`,pointerEvents:'none'}}/>
      <div style={{position:'absolute',bottom:'-15%',left:'-10%',width:'500px',height:'500px',borderRadius:'50%',background:`radial-gradient(circle,rgba(124,58,237,0.12) 0%,transparent 65%)`,pointerEvents:'none'}}/>
      <div style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(rgba(168,85,247,.03) 1px,transparent 1px)',backgroundSize:'30px 30px',pointerEvents:'none'}}/>
      <div style={{position:'absolute',top:0,left:0,right:0,height:'1px',background:`linear-gradient(90deg,transparent,${GL_P} 40%,${GL_P3} 60%,transparent)`}}/>
      <div style={{width:'100%',maxWidth:'420px',position:'relative',zIndex:2}}>
        <div style={{textAlign:'center',marginBottom:'36px'}}>
          <div style={{display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:'16px'}}>
            <div style={{width:'54px',height:'54px',background:`linear-gradient(135deg,${GL_P2},${GL_P})`,borderRadius:'18px',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 0 40px rgba(168,85,247,0.4)`}}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.09 6.26L20 10l-5.91 1.74L12 18l-2.09-6.26L4 10l5.91-1.74L12 2z" fill="#fff"/><path d="M19 15l1.09 2.91L23 19l-2.91 1.09L19 23l-1.09-2.91L15 19l2.91-1.09L19 15z" fill="rgba(255,255,255,0.55)"/></svg>
            </div>
          </div>
          <h1 style={{fontSize:'26px',fontWeight:'800',color:'#fff',letterSpacing:'-.03em',marginBottom:'4px',fontFamily:"'Playfair Display',serif"}}>GlowLabs</h1>
          <p style={{fontSize:'12px',color:GL_P3,letterSpacing:'.06em',textTransform:'uppercase',fontWeight:'500',marginBottom:'6px'}}>Portal del Cliente</p>
          <p style={{fontSize:'12px',color:'rgba(255,255,255,0.25)'}}>Accede a tu espacio personalizado</p>
        </div>
        <div style={{background:'rgba(255,255,255,0.03)',border:`1px solid ${err?'rgba(239,68,68,0.5)':`rgba(168,85,247,0.25)`}`,borderRadius:'22px',padding:'34px',backdropFilter:'blur(20px)',boxShadow:'0 30px 60px rgba(0,0,0,0.5)',transition:'border-color .2s'}}>
          <div style={{marginBottom:'16px'}}>
            <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.35)',letterSpacing:'.1em',textTransform:'uppercase',display:'block',marginBottom:'8px'}}>Correo electrónico</label>
            <input value={correo} onChange={e=>setCorreo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&attempt()} type="email" placeholder="tu@empresa.com"
              style={{width:'100%',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(168,85,247,0.2)',borderRadius:'10px',padding:'12px 16px',color:'#fff',fontSize:'14px',outline:'none',boxSizing:'border-box',fontFamily:"'Inter',sans-serif",transition:'border-color .2s'}}
              onFocus={e=>e.target.style.borderColor='rgba(168,85,247,0.6)'} onBlur={e=>e.target.style.borderColor='rgba(168,85,247,0.2)'}/>
          </div>
          <div style={{marginBottom:'22px'}}>
            <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.35)',letterSpacing:'.1em',textTransform:'uppercase',display:'block',marginBottom:'8px'}}>Contraseña</label>
            <div style={{position:'relative'}}>
              <input type={show?'text':'password'} value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&attempt()} placeholder="••••••••••"
                style={{width:'100%',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(168,85,247,0.2)',borderRadius:'10px',padding:'12px 44px 12px 16px',color:'#fff',fontSize:'14px',outline:'none',boxSizing:'border-box',fontFamily:"'Inter',sans-serif",transition:'border-color .2s'}}
                onFocus={e=>e.target.style.borderColor='rgba(168,85,247,0.6)'} onBlur={e=>e.target.style.borderColor='rgba(168,85,247,0.2)'}/>
              <button onClick={()=>setShow(s=>!s)} style={{position:'absolute',right:'13px',top:'50%',transform:'translateY(-50%)',background:'transparent',border:'none',cursor:'pointer',color:'rgba(255,255,255,0.3)',padding:'2px',display:'flex'}}>
                {show?<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>}
              </button>
            </div>
          </div>
          {err&&<p style={{fontSize:'12px',color:'#f87171',marginBottom:'14px',textAlign:'center',fontFamily:"'Inter',sans-serif"}}>Credenciales incorrectas. Contacta con tu agencia.</p>}
          <button onClick={attempt} style={{width:'100%',padding:'14px',background:`linear-gradient(135deg,${GL_P2},${GL_P})`,border:'none',borderRadius:'12px',color:'#fff',fontSize:'15px',fontWeight:'700',cursor:'pointer',letterSpacing:'-.01em',boxShadow:`0 8px 24px rgba(168,85,247,0.4)`,transition:'transform .15s,box-shadow .15s',fontFamily:"'Inter',sans-serif"}}
            onMouseOver={e=>{e.currentTarget.style.transform='translateY(-1px)';e.currentTarget.style.boxShadow=`0 12px 32px rgba(168,85,247,0.55)`;}}
            onMouseOut={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow=`0 8px 24px rgba(168,85,247,0.4)`;}}>
            Acceder →
          </button>
        </div>
        <p style={{textAlign:'center',fontSize:'11px',color:'rgba(255,255,255,0.12)',marginTop:'24px',letterSpacing:'.04em',fontFamily:"'Inter',sans-serif"}}>GlowLabs Agencia IA · Portal de Cliente</p>
      </div>
    </div>
  );
}

function ClientPortal(){
  const PORTAL_KEY='portal_session_v1';
  const [client,setClient]=useState(()=>{
    try{const s=sessionStorage.getItem(PORTAL_KEY);return s?JSON.parse(s):null;}catch{return null;}
  });

  const login=c=>{sessionStorage.setItem(PORTAL_KEY,JSON.stringify(c));setClient(c);};
  const logout=()=>{sessionStorage.removeItem(PORTAL_KEY);setClient(null);};

  const handleBriefSubmit=(projId,brief,prompt)=>{
    const all=clients_storage.load();
    const updated=all.map(c=>{
      if(c.id!==client.id)return c;
      const proyectos=c.proyectos.map(p=>{
        if(p.id!==projId)return p;
        return{...p,brief,prompt,estado:'Brief completado',checklist:{...p.checklist,brief:true,prompt:true}};
      });
      const historial=[...(c.historial||[]),{fecha:new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}),descripcion:'Cliente completó el brief de la página web.'}];
      return{...c,proyectos,historial};
    });
    clients_storage.save(updated);
    // Refresh client in session
    const fresh=updated.find(c=>c.id===client.id);
    if(fresh){sessionStorage.setItem(PORTAL_KEY,JSON.stringify(fresh));setClient(fresh);}
  };

  if(!client) return <ClientPortalLogin onLogin={login}/>;
  return <ClientPortalDashboard client={client} onLogout={logout} onBriefSubmit={handleBriefSubmit}/>;
}

            {f.otraSeccion&&(
              <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'14px',padding:'8px 12px',background:'#f0edfb',border:'1px solid rgba(167,139,250,0.2)',borderRadius:'8px'}}>
                <span style={{fontSize:'12.5px',color:'#666',flex:1}}>Sección: <strong style={{color:ACC}}>{f.otraSeccion}</strong></span>
                <button onClick={()=>setF(p=>({...p,otraSeccion:'',otraSeccionInput:''}))} style={{background:'transparent',border:'none',color:'#aaa',cursor:'pointer',fontSize:'16px',lineHeight:1}}>×</button>
              </div>
            )}
            {allSels.length>0&&(
              <div style={{borderTop:'1px solid #f0ede8',paddingTop:'18px',marginTop:'4px'}}>
                <p style={{fontSize:'11.5px',fontWeight:'700',color:'#999',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:'14px'}}>¿Qué debe ir en cada sección?</p>
                <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
                  {allSels.map(s=>(
                    <div key={s}>
                      <label style={{fontSize:'12.5px',fontWeight:'600',color:ACC,display:'block',marginBottom:'6px'}}>{s}</label>
                      <textarea value={f.seccionesSpec[s]||''} onChange={e=>setSpec(s,e.target.value)}
                        placeholder={`¿Qué debe incluir la sección ${s}? Texto específico, imágenes, elementos especiales...`}
                        style={{width:'100%',border:'1.5px solid #e5e2dc',borderRadius:'8px',padding:'10px 13px',fontSize:'13px',color:'#1c1c1c',outline:'none',minHeight:'70px',resize:'vertical',boxSizing:'border-box',fontFamily:"'Inter',sans-serif"}}/>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Colores */}
          <div style={{background:'#fff',border:'1px solid #e8e5e0',borderRadius:'14px',padding:'28px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}}>
              <p style={{fontSize:'12px',fontWeight:'700',color:ACC,letterSpacing:'.1em',textTransform:'uppercase'}}>Colores de la Marca</p>
              <span style={{fontSize:'11px',fontWeight:'600',color:f.coloresSeleccionados.length>=4?ACC:'#aaa',background:f.coloresSeleccionados.length>=4?'#f0edfb':'#f5f4f2',borderRadius:'100px',padding:'2px 9px'}}>{f.coloresSeleccionados.length}/4</span>
            </div>
            <p style={{fontSize:'12.5px',color:'#888',marginBottom:'16px'}}>Selecciona hasta 4 colores que representen mejor tu marca</p>
            <div style={{display:'grid',gridTemplateColumns:'repeat(8,1fr)',gap:'5px',marginBottom:'16px'}}>
              {CP.map(c=>{
                const isSel=!!f.coloresSeleccionados.find(x=>x.h===c.h);
                const isDisabled=!isSel&&f.coloresSeleccionados.length>=4;
                return(<button key={c.h} title={`${c.n} — ${c.h}`} onClick={()=>!isDisabled&&togColor(c)}
                  style={{width:'100%',aspectRatio:'1',background:c.h,borderRadius:'5px',border:isSel?'2.5px solid #555':'1.5px solid rgba(0,0,0,0.08)',cursor:isDisabled?'not-allowed':'pointer',opacity:isDisabled?0.3:1,position:'relative',transition:'transform .1s',boxSizing:'border-box',transform:isSel?'scale(1.1)':'scale(1)'}}>
                  {isSel&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.25)',borderRadius:'2px'}}><svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg></div>}
                </button>);
              })}
            </div>
            {f.coloresSeleccionados.length>0&&(
              <div style={{display:'flex',flexWrap:'wrap',gap:'8px'}}>
                {f.coloresSeleccionados.map(c=>(
                  <div key={c.h} style={{display:'flex',alignItems:'center',gap:'8px',background:'#f9f8f6',border:'1px solid #e8e5e0',borderRadius:'8px',padding:'7px 10px'}}>
                    <div style={{width:'18px',height:'18px',borderRadius:'4px',background:c.h,border:'1px solid rgba(0,0,0,0.1)',flexShrink:0}}/>
                    <div><p style={{fontSize:'12px',color:'#333',fontWeight:'600',marginBottom:'1px'}}>{c.n}</p><p style={{fontSize:'10px',color:'#999'}}>{c.h} · rgb({h2rgb(c.h)})</p></div>
                    <button onClick={()=>togColor(c)} style={{background:'transparent',border:'none',color:'#bbb',cursor:'pointer',fontSize:'14px',lineHeight:1,padding:'0 2px',marginLeft:'4px'}}>×</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Estilo */}
          <div style={{background:'#fff',border:'1px solid #e8e5e0',borderRadius:'14px',padding:'28px'}}>
            <p style={{fontSize:'12px',fontWeight:'700',color:ACC,letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'14px'}}>Estilo Visual</p>
            <div style={{display:'flex',flexWrap:'wrap',gap:'8px',marginBottom:'16px'}}>
              {WEB_ESTILOS.map(e=>(
                <button key={e} onClick={()=>setF(p=>({...p,estilo:e}))}
                  style={{padding:'8px 15px',border:`1.5px solid ${f.estilo===e?ACC:'#ddd'}`,background:f.estilo===e?'#f0edfb':'transparent',color:f.estilo===e?ACC:'#555',fontSize:'13px',borderRadius:'100px',cursor:'pointer',fontWeight:f.estilo===e?'600':'400',transition:'all .15s'}}>
                  {e}
                </button>
              ))}
            </div>
            <div>
              <label style={{fontSize:'12px',fontWeight:'600',color:'#444',display:'block',marginBottom:'6px'}}>Webs de referencia que te gustan (opcional)</label>
              <input value={f.referencias} onChange={set('referencias')} placeholder="Ej. apple.com, stripe.com, una marca que admiras..."
                style={{width:'100%',border:'1.5px solid #e5e2dc',borderRadius:'8px',padding:'10px 13px',fontSize:'13.5px',color:'#1c1c1c',outline:'none',boxSizing:'border-box',fontFamily:"'Inter',sans-serif"}}/>
            </div>
          </div>

          {/* Público y adicional */}
          <div style={{background:'#fff',border:'1px solid #e8e5e0',borderRadius:'14px',padding:'28px'}}>
            <p style={{fontSize:'12px',fontWeight:'700',color:ACC,letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'18px'}}>Sobre tu Cliente Ideal</p>
            <div style={{marginBottom:'14px'}}>
              <label style={{fontSize:'12px',fontWeight:'600',color:'#444',display:'block',marginBottom:'6px'}}>¿A quién le vendes?</label>
              <textarea value={f.publicoObjetivo} onChange={set('publicoObjetivo')} placeholder="Ej. Empresarios entre 35-55 años del sector salud que quieren digitalizar su consulta..."
                style={{width:'100%',border:'1.5px solid #e5e2dc',borderRadius:'8px',padding:'10px 13px',fontSize:'13.5px',color:'#1c1c1c',outline:'none',minHeight:'80px',resize:'vertical',boxSizing:'border-box',fontFamily:"'Inter',sans-serif"}}/>
            </div>
            <div style={{marginBottom:'14px'}}>
              <label style={{fontSize:'12px',fontWeight:'600',color:'#444',display:'block',marginBottom:'6px'}}>¿Quiénes son tus competidores? (opcional)</label>
              <input value={f.competidores} onChange={set('competidores')} placeholder="Ej. Empresa X, Empresa Y..."
                style={{width:'100%',border:'1.5px solid #e5e2dc',borderRadius:'8px',padding:'10px 13px',fontSize:'13.5px',color:'#1c1c1c',outline:'none',boxSizing:'border-box',fontFamily:"'Inter',sans-serif"}}/>
            </div>
            <div>
              <label style={{fontSize:'12px',fontWeight:'600',color:'#444',display:'block',marginBottom:'6px'}}>¿Cuáles son los mensajes clave de tu marca? (opcional)</label>
              <textarea value={f.mensajesClave} onChange={set('mensajesClave')} placeholder="Ej. '15 años de experiencia', 'Más de 500 clientes', 'Garantía de satisfacción'..."
                style={{width:'100%',border:'1.5px solid #e5e2dc',borderRadius:'8px',padding:'10px 13px',fontSize:'13.5px',color:'#1c1c1c',outline:'none',minHeight:'80px',resize:'vertical',boxSizing:'border-box',fontFamily:"'Inter',sans-serif"}}/>
            </div>
          </div>

          <button onClick={submit} style={{width:'100%',padding:'16px',background:'#1c1c1c',border:'none',borderRadius:'12px',color:'#fff',fontSize:'15px',fontWeight:'700',cursor:'pointer',letterSpacing:'-.01em',marginTop:'8px'}}>
            Enviar Briefing →
          </button>
          <p style={{textAlign:'center',fontSize:'11.5px',color:'#bbb',marginTop:'12px',paddingBottom:'20px'}}>Una vez enviado, nuestro equipo revisará tu briefing y estará en contacto contigo.</p>
        </div>
      </div>
    </div>
  );
}

        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>

            </div>
            <button onClick={copy} style={{display:'flex',alignItems:'center',gap:'7px',padding:'9px 16px',background:copied?'#f0fdf4':ACC,border:`1px solid ${copied?'#bbf7d0':'transparent'}`,borderRadius:'8px',color:copied?'#16a34a':'#fff',fontSize:'12.5px',fontWeight:'700',cursor:'pointer',transition:'all .2s'}}>
              {copied?<><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>¡Copiado!</>:<><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copiar briefing</>}
            </button>
          </div>
          <pre style={{margin:0,padding:'22px',fontSize:'11.5px',lineHeight:'1.7',color:'#333',whiteSpace:'pre-wrap',wordBreak:'break-word',fontFamily:"'Inter',monospace",maxHeight:'500px',overflowY:'auto',background:'#fafaf8'}}>{prompt}</pre>

/* ════════════════════════════════════════════════
   MÓDULO 5 — EMPLOYEE MANAGEMENT
   ════════════════════════════════════════════════ */
function EmployeeModule({onHome}){
  const [emps,setEmps]=useState(()=>emp_storage.load());
  const [form,setForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const DEFAULT_PERMISOS={marketing:true,ia:true,web:true,clients:true};
  const [data,setData]=useState({nombre:'',username:'',password:'',metaMensual:'',permisos:{...DEFAULT_PERMISOS}});
  const [showPw,setShowPw]=useState(false);
  const [viewEmp,setViewEmp]=useState(null);

  const reload=()=>{setEmps(emp_storage.load());};

  const saveEmp=()=>{
    if(!data.nombre.trim()||!data.username.trim()||!data.password.trim()) return;
    const all=emp_storage.load();
    if(editId){
      emp_storage.save(all.map(e=>e.id===editId?{...e,...data,metaMensual:Number(data.metaMensual)||0}:e));
    } else {
      emp_storage.save([...all,{id:Date.now().toString(),nombre:data.nombre.trim(),username:data.username.trim(),password:data.password,metaMensual:Number(data.metaMensual)||0,permisos:data.permisos||DEFAULT_PERMISOS,activo:true,ultimaActividad:null}]);
    }
    reload();setForm(false);setEditId(null);setData({nombre:'',username:'',password:'',metaMensual:'',permisos:{...DEFAULT_PERMISOS}});
  };

  const toggleActivo=(id)=>{
    const all=emp_storage.load();
    emp_storage.save(all.map(e=>e.id===id?{...e,activo:!e.activo}:e));
    reload();
  };

  const startEdit=(emp)=>{setData({nombre:emp.nombre,username:emp.username,password:emp.password,metaMensual:emp.metaMensual||'',permisos:emp.permisos||{...DEFAULT_PERMISOS}});setEditId(emp.id);setForm(true);};

  const getStats=(empId)=>{
    const allC=clients_storage.load();
    const allM=JSON.parse(localStorage.getItem('propuestas_v2')||'[]');
    const allI=JSON.parse(localStorage.getItem(AI_STORAGE_KEY)||'[]');
    const empClients=allC.filter(c=>c.asignadoA===empId);
    const propCreadas=allM.filter(p=>p.creadoPor===empId).length+allI.filter(p=>p.creadoPor===empId).length;
    const propEnv=empClients.filter(c=>c.estado==='Propuesta enviada').length;
    const cerrados=empClients.filter(c=>c.estado==='Activo'||c.estado==='Propuesta aceptada').length;
    const montoTotal=empClients.reduce((s,c)=>s+(c.montoContrato||0),0);
    const montoActivo=empClients.filter(c=>!c.comisionPagada).reduce((s,c)=>s+(c.montoContrato||0),0);
    const comisionPend=montoActivo*0.5;
    const comisionPagada=empClients.filter(c=>c.comisionPagada).reduce((s,c)=>s+(c.montoContrato||0),0)*0.5;
    return{propCreadas,propEnv,cerrados,montoTotal,comisionPend,comisionPagada,clientCount:empClients.length};
  };

  const fmtMoney=v=>{if(!v)return '$0';return '$'+Number(v).toLocaleString('es-CO');};

  // Detail view for one employee
  if(viewEmp){
    const emp=emps.find(e=>e.id===viewEmp);
    if(!emp) return setViewEmp(null);
    const stats=getStats(emp.id);
    const empClients=clients_storage.load().filter(c=>c.asignadoA===emp.id);
    const togglePaid=(clientId)=>{
      const all=clients_storage.load();
      clients_storage.save(all.map(c=>c.id===clientId?{...c,comisionPagada:!c.comisionPagada}:c));
    };
    const markAllPaid=()=>{
      const all=clients_storage.load();
      const pendIds=new Set(empClients.filter(c=>!c.comisionPagada&&(c.montoContrato||0)>0).map(c=>c.id));
      clients_storage.save(all.map(c=>pendIds.has(c.id)?{...c,comisionPagada:true}:c));
    };
    return(
      <div style={{minHeight:'100vh',background:GL_BG,fontFamily:"'Inter',sans-serif",color:'#fff'}}>
        <div style={{maxWidth:'960px',margin:'0 auto',padding:'32px 24px'}}>
          <button onClick={()=>setViewEmp(null)} style={{background:'none',border:'none',color:'rgba(255,255,255,0.4)',cursor:'pointer',fontSize:'13px',marginBottom:'24px',padding:'0',display:'flex',alignItems:'center',gap:'6px'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
            Volver al equipo
          </button>
          <div style={{display:'flex',alignItems:'center',gap:'16px',marginBottom:'32px'}}>
            <div style={{width:'52px',height:'52px',background:`linear-gradient(135deg,${EMP_A},rgba(244,114,182,0.5))`,borderRadius:'14px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',fontWeight:'700',color:'#fff'}}>
              {emp.nombre.charAt(0).toUpperCase()}
            </div>
            <div>
              <h1 style={{fontSize:'22px',fontWeight:'800',margin:'0 0 2px',letterSpacing:'-.02em'}}>{emp.nombre}</h1>
              <p style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',margin:0}}>@{emp.username} · Meta mensual: {fmtMoney(emp.metaMensual)}</p>
            </div>
          </div>
          {/* Stats cards */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'12px',marginBottom:'32px'}}>
            {[
              {l:'Propuestas creadas',v:stats.propCreadas,c:GL_P3},
              {l:'Propuestas enviadas',v:stats.propEnv,c:'#fb923c'},
              {l:'Deals cerrados',v:stats.cerrados,c:'#4ade80'},
              {l:'Clientes asignados',v:stats.clientCount,c:EMP_A},
              {l:'Comisión pendiente',v:fmtMoney(stats.comisionPend),c:'#fbbf24'},
              {l:'Comisión pagada',v:fmtMoney(stats.comisionPagada),c:'#34d399'},
            ].map(m=>(
              <div key={m.l} style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'12px',padding:'18px 20px'}}>
                <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'.07em'}}>{m.l}</p>
                <p style={{fontSize:'22px',fontWeight:'800',color:m.c,margin:0,letterSpacing:'-.02em'}}>{m.v}</p>
              </div>
            ))}
          </div>
          {/* Monthly goal progress */}
          {emp.metaMensual>0&&(()=>{
            const pct=Math.min(100,Math.round((stats.montoTotal/(emp.metaMensual))*100));
            const barColor=pct>=100?'#34d399':pct>=60?'#fbbf24':GL_P;
            return(
              <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'14px',padding:'20px 24px',marginBottom:'28px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
                  <div>
                    <p style={{fontSize:'12px',fontWeight:'700',color:'rgba(255,255,255,0.4)',textTransform:'uppercase',letterSpacing:'.07em',margin:'0 0 3px'}}>Meta mensual de ingresos</p>
                    <p style={{fontSize:'13px',color:'rgba(255,255,255,0.7)',margin:0}}>{fmtMoney(stats.montoTotal)} <span style={{color:'rgba(255,255,255,0.3)'}}>de {fmtMoney(emp.metaMensual)}</span></p>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <p style={{fontSize:'28px',fontWeight:'900',color:barColor,margin:0,letterSpacing:'-.04em'}}>{pct}%</p>
                    {pct>=100&&<p style={{fontSize:'11px',color:'#34d399',margin:0,fontWeight:'700'}}>Meta alcanzada</p>}
                  </div>
                </div>
                <div style={{height:'8px',background:'rgba(255,255,255,0.07)',borderRadius:'99px',overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${pct}%`,background:`linear-gradient(90deg,${barColor}80,${barColor})`,borderRadius:'99px',transition:'width .4s ease'}}/>
                </div>
              </div>
            );
          })()}
          {/* Clients table */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'14px'}}>
            <h2 style={{fontSize:'14px',fontWeight:'700',color:'rgba(255,255,255,0.6)',margin:0,letterSpacing:'.04em',textTransform:'uppercase'}}>Clientes asignados</h2>
            {empClients.some(c=>!c.comisionPagada&&(c.montoContrato||0)>0)&&(
              <button onClick={()=>{markAllPaid();reload();}} style={{padding:'6px 14px',background:'rgba(52,211,153,0.1)',border:'1px solid rgba(52,211,153,0.3)',borderRadius:'8px',color:'#34d399',fontSize:'11px',fontWeight:'700',cursor:'pointer',display:'flex',alignItems:'center',gap:'5px'}}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                Marcar todas pagadas
              </button>
            )}
          </div>
          {empClients.length===0&&<p style={{color:'rgba(255,255,255,0.2)',fontSize:'13px'}}>No hay clientes asignados aún.</p>}
          {empClients.map(c=>(
            <div key={c.id} style={{background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'12px',padding:'16px 20px',marginBottom:'10px',display:'flex',alignItems:'center',gap:'16px'}}>
              <div style={{flex:1}}>
                <p style={{fontWeight:'700',fontSize:'14px',margin:'0 0 2px'}}>{c.empresa}</p>
                <p style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',margin:0}}>{c.estado} · {c.correo||'—'}</p>
              </div>
              <div style={{textAlign:'right',minWidth:'120px'}}>
                <p style={{fontSize:'13px',fontWeight:'700',color:'#fbbf24',margin:'0 0 2px'}}>{fmtMoney(c.montoContrato||0)}</p>
                <p style={{fontSize:'11px',color:c.comisionPagada?'#34d399':'rgba(255,255,255,0.3)',margin:0}}>Comisión: {fmtMoney((c.montoContrato||0)*0.5)}</p>
              </div>

  return(

            <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><circle cx="6" cy="5" r="2.5" stroke="#fff" strokeWidth="1.3"/><path d="M1 14c0-2.2 1.8-4 5-4s5 1.8 5 4" stroke="#fff" strokeWidth="1.3" strokeLinecap="round"/><circle cx="13" cy="6" r="2" stroke="#fff" strokeWidth="1.3"/><path d="M17 14c0-1.7-1.1-3.1-2.5-3.5" stroke="#fff" strokeWidth="1.3" strokeLinecap="round"/></svg>
          </div>
          <div>
            <h1 style={{fontSize:'18px',fontWeight:'800',margin:0,letterSpacing:'-.02em'}}>Equipo & Comisiones</h1>
            <p style={{fontSize:'11px',color:'rgba(255,255,255,0.25)',margin:0}}>{emps.filter(e=>e.activo).length} empleados activos</p>
          </div>
        </div>
        <button onClick={()=>{setForm(true);setEditId(null);setData({nombre:'',username:'',password:'',metaMensual:''}); }} style={{display:'flex',alignItems:'center',gap:'7px',padding:'10px 18px',background:`linear-gradient(135deg,${GL_P2},${GL_P})`,border:'none',borderRadius:'10px',color:'#fff',fontSize:'13px',fontWeight:'700',cursor:'pointer'}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

        {/* Add/Edit Form */}
        {form&&(
          <div style={{background:'rgba(255,255,255,0.03)',border:`1px solid rgba(244,114,182,0.25)`,borderRadius:'16px',padding:'28px',marginBottom:'28px'}}>
            <h3 style={{fontSize:'14px',fontWeight:'700',marginBottom:'20px',color:'#fff'}}>{editId?'Editar empleado':'Nuevo empleado'}</h3>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px',marginBottom:'14px'}}>
              {[
                {label:'Nombre completo',key:'nombre',ph:'Ej: Juan García'},

                <div key={f.key}>

                  <input value={data[f.key]} onChange={e=>setData(d=>({...d,[f.key]:e.target.value}))} placeholder={f.ph}

                </div>

                <div style={{position:'relative'}}>
                  <input type={showPw?'text':'password'} value={data.password} onChange={e=>setData(d=>({...d,password:e.target.value}))} placeholder="Contraseña"
                    style={{width:'100%',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',padding:'10px 38px 10px 12px',color:'#fff',fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none',boxSizing:'border-box'}}/>
                  <button onClick={()=>setShowPw(s=>!s)} style={{position:'absolute',right:'10px',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'rgba(255,255,255,0.3)',padding:0}}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">{showPw?<><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></>:<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>}</svg>
                  </button>
                </div>
              </div>
              <div>
                <label style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',display:'block',marginBottom:'6px'}}>Meta mensual ($)</label>
                <input type="number" value={data.metaMensual} onChange={e=>setData(d=>({...d,metaMensual:e.target.value}))} placeholder="0"

              </div>
            </div>
            {/* Permisos de módulos */}
            <div style={{marginBottom:'18px',padding:'16px',background:'rgba(168,85,247,0.04)',border:'1px solid rgba(168,85,247,0.15)',borderRadius:'12px'}}>
              <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:'12px',fontFamily:"'Inter',sans-serif"}}>Permisos de acceso</p>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
                {[
                  {key:'marketing',label:'Marketing',color:WARM},

                  {key:'web',label:'Web',color:WEB_A},

                    <button key={m.key} type="button" onClick={()=>setData(d=>({...d,permisos:{...(d.permisos||{}),  [m.key]:!on}}))}
                      style={{padding:'10px 8px',background:on?`${m.color}15`:'rgba(255,255,255,0.03)',border:`1px solid ${on?m.color+'55':'rgba(255,255,255,0.08)'}`,borderRadius:'8px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'5px',transition:'all .15s'}}>
                      <div style={{width:'8px',height:'8px',borderRadius:'50%',background:on?m.color:'rgba(255,255,255,0.15)'}}/>
                      <span style={{fontSize:'11px',fontWeight:'600',color:on?m.color:'rgba(255,255,255,0.25)',fontFamily:"'Inter',sans-serif"}}>{m.label}</span>
                      <span style={{fontSize:'9px',color:on?`${m.color}99`:'rgba(255,255,255,0.15)',fontFamily:"'Inter',sans-serif"}}>{on?'Permitido':'Bloqueado'}</span>
                    </button>
                  );

              </div>
            </div>
            <div style={{display:'flex',gap:'10px',justifyContent:'flex-end'}}>
              <button onClick={()=>{setForm(false);setEditId(null);}} style={{padding:'9px 18px',background:'transparent',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.4)',fontSize:'13px',cursor:'pointer'}}>Cancelar</button>
              <button onClick={saveEmp} style={{padding:'9px 20px',background:`linear-gradient(135deg,${GL_P2},${GL_P})`,border:'none',borderRadius:'8px',color:'#fff',fontSize:'13px',fontWeight:'700',cursor:'pointer'}}>{editId?'Guardar cambios':'Crear empleado'}</button>
            </div>
          </div>
        )}

        {/* Employee cards */}
        {emps.length===0&&!form&&<div style={{textAlign:'center',padding:'60px',color:'rgba(255,255,255,0.2)',fontSize:'14px'}}>No hay empleados registrados aún.</div>}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:'16px'}}>
          {emps.map(emp=>{
            const stats=getStats(emp.id);
            const metaPct=emp.metaMensual>0?Math.min(100,Math.round(stats.montoTotal/emp.metaMensual*100)):0;
            return(
              <div key={emp.id} style={{background:'rgba(255,255,255,0.02)',border:`1px solid ${emp.activo?'rgba(255,255,255,0.07)':'rgba(255,255,255,0.03)'}`,borderRadius:'16px',padding:'22px',opacity:emp.activo?1:0.5}}>
                <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'16px'}}>
                  <div style={{width:'40px',height:'40px',background:`linear-gradient(135deg,${EMP_A},rgba(168,85,247,0.6))`,borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'16px',fontWeight:'800',color:'#fff',flexShrink:0}}>
                    {emp.nombre.charAt(0).toUpperCase()}
                  </div>
                  <div style={{flex:1}}>
                    <p style={{fontWeight:'700',fontSize:'14px',margin:'0 0 1px'}}>{emp.nombre}</p>
                    <p style={{fontSize:'11px',color:'rgba(255,255,255,0.3)',margin:0}}>@{emp.username} · {emp.ultimaActividad?`Activo ${emp.ultimaActividad}`:'Sin actividad'}</p>
                  </div>
                  <span style={{fontSize:'10px',fontWeight:'700',padding:'3px 8px',background:emp.activo?'rgba(74,222,128,0.1)':'rgba(255,255,255,0.05)',color:emp.activo?'#4ade80':'rgba(255,255,255,0.3)',borderRadius:'4px'}}>{emp.activo?'ACTIVO':'INACTIVO'}</span>
                </div>
                {/* Mini stats */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'14px'}}>
                  {[
                    {l:'Creadas',v:stats.propCreadas},{l:'Enviadas',v:stats.propEnv},{l:'Cerradas',v:stats.cerrados},
                  ].map(s=>(
                    <div key={s.l} style={{background:'rgba(255,255,255,0.03)',borderRadius:'8px',padding:'8px',textAlign:'center'}}>
                      <p style={{fontSize:'18px',fontWeight:'800',color:GL_P3,margin:'0 0 1px'}}>{s.v}</p>
                      <p style={{fontSize:'10px',color:'rgba(255,255,255,0.3)',margin:0}}>{s.l}</p>
                    </div>
                  ))}
                </div>
                {/* Monto + comision */}
                <div style={{background:'rgba(255,255,255,0.02)',borderRadius:'8px',padding:'10px 12px',marginBottom:'12px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
                    <span style={{fontSize:'11px',color:'rgba(255,255,255,0.3)'}}>Monto vendido</span>
                    <span style={{fontSize:'12px',fontWeight:'700',color:'#fbbf24'}}>{fmtMoney(stats.montoTotal)}</span>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:'8px'}}>
                    <span style={{fontSize:'11px',color:'rgba(255,255,255,0.3)'}}>Comisión pend.</span>
                    <span style={{fontSize:'12px',fontWeight:'700',color:EMP_A}}>{fmtMoney(stats.comisionPend)}</span>
                  </div>
                  {emp.metaMensual>0&&(
                    <>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
                        <span style={{fontSize:'10px',color:'rgba(255,255,255,0.25)'}}>Meta mensual</span>
                        <span style={{fontSize:'10px',color:'rgba(255,255,255,0.25)'}}>{metaPct}%</span>
                      </div>
                      <div style={{height:'3px',background:'rgba(255,255,255,0.06)',borderRadius:'2px'}}>
                        <div style={{height:'100%',width:`${metaPct}%`,background:`linear-gradient(90deg,${GL_P2},${EMP_A})`,borderRadius:'2px',transition:'width .3s'}}/>
                      </div>
                    </>
                  )}
                </div>
                {/* Actions */}
                <div style={{display:'flex',gap:'8px'}}>
                  <button onClick={()=>setViewEmp(emp.id)} style={{flex:1,padding:'8px',background:'rgba(168,85,247,0.08)',border:'1px solid rgba(168,85,247,0.2)',borderRadius:'8px',color:GL_P3,fontSize:'12px',fontWeight:'600',cursor:'pointer'}}>Ver detalle</button>
                  <button onClick={()=>startEdit(emp)} style={{padding:'8px 12px',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.5)',fontSize:'12px',cursor:'pointer'}}>Editar</button>
                  <button onClick={()=>toggleActivo(emp.id)} style={{padding:'8px 12px',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'8px',color:'rgba(255,255,255,0.5)',fontSize:'12px',cursor:'pointer'}}>{emp.activo?'Desactivar':'Activar'}</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ── DASHBOARD MODULE ── */
function DashboardModule({onHome}){
  const DB_A='#f59e0b';
  const [agencyGoal,setAgencyGoal]=React.useState(()=>{try{return Number(localStorage.getItem(GOAL_KEY))||0;}catch{return 0;}});
  const [editGoal,setEditGoal]=React.useState(false);
  const [goalInput,setGoalInput]=React.useState('');
  const saveGoal=()=>{const v=Number(goalInput)||0;localStorage.setItem(GOAL_KEY,v);setAgencyGoal(v);setEditGoal(false);};
  const clients=clients_storage.load();
  const emps=emp_storage.load().filter(e=>e.activo);
  const mktSaved=storage.load();
  const iaSaved=ai_storage.load();
  const allProps=[...mktSaved,...iaSaved];

  // Revenue
  const totalMonto=clients.reduce((s,c)=>s+(c.montoContrato||0),0);
  const comisionesPend=clients.filter(c=>!c.comisionPagada&&(c.montoContrato||0)>0).reduce((s,c)=>s+(c.montoContrato||0)*0.5,0);
  const comisionesPagas=clients.filter(c=>c.comisionPagada).reduce((s,c)=>s+(c.montoContrato||0)*0.5,0);

  // Pipeline
  const STAGES=['Lead','Propuesta enviada','Propuesta aceptada','Activo','Finalizado'];
  const STAGE_C=['#9e9e9e','#fb923c','#38bdf8',CL_A,'#a78bfa'];
  const stageCounts=STAGES.map(s=>clients.filter(c=>c.estado===s).length);
  const maxStage=Math.max(...stageCounts,1);

  // Top clients by revenue
  const topClients=[...clients].filter(c=>c.montoContrato>0).sort((a,b)=>(b.montoContrato||0)-(a.montoContrato||0)).slice(0,5);

  // Employee leaderboard
  const empStats=emps.map(emp=>{
    const empClients=clients.filter(c=>c.asignadoA===emp.id);
    const monto=empClients.reduce((s,c)=>s+(c.montoContrato||0),0);
    const propCreadas=allProps.filter(p=>p.creadoPor===emp.id).length;
    const cerradas=empClients.filter(c=>['Activo','Finalizado'].includes(c.estado)).length;
    return {nombre:emp.nombre,monto,propCreadas,cerradas,comision:monto*0.5,pagada:empClients.filter(c=>c.comisionPagada).reduce((s,c)=>s+(c.montoContrato||0)*0.5,0)};
  }).sort((a,b)=>b.monto-a.monto);

  // By service
  const byService={marketing:clients.filter(c=>c.servicios?.includes('marketing')).length,ia:clients.filter(c=>c.servicios?.includes('ia')).length,web:clients.filter(c=>c.servicios?.includes('web')).length};
  const maxSvc=Math.max(byService.marketing,byService.ia,byService.web,1);

  // Conversion rate
  const total=clients.length||1;
  const convRate=Math.round((clients.filter(c=>['Activo','Finalizado'].includes(c.estado)).length/total)*100);

  return(
    <div style={{minHeight:'100vh',background:'#080808',paddingBottom:'60px',fontFamily:"'Inter',sans-serif"}}>
      {/* Header */}
      <div style={{background:'rgba(255,255,255,0.02)',borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'16px 32px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
          <button className="btn-ghost" style={{padding:'7px 12px',fontSize:'12px'}} onClick={onHome}>← Inicio</button>
          <div style={{width:'1px',height:'18px',background:'rgba(255,255,255,0.08)'}}/>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{width:'22px',height:'22px',background:DB_A,borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><rect x="1" y="7" width="3" height="6" rx="1" fill="#000"/><rect x="5.5" y="4" width="3" height="9" rx="1" fill="#000"/><rect x="10" y="1" width="3" height="12" rx="1" fill="#000"/></svg>
            </div>
            <span style={{fontSize:'14px',fontWeight:'700',color:'#fff',letterSpacing:'-.01em'}}>Dashboard</span>
          </div>
        </div>
        <span style={{fontSize:'11px',color:'rgba(255,255,255,0.2)'}}>Actualizado en tiempo real</span>
      </div>

      <div style={{maxWidth:'1200px',margin:'0 auto',padding:'32px'}}>
        {/* KPI row */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'14px',marginBottom:'24px'}}>
          {[
            {l:'Ingresos totales',v:`$${totalMonto.toLocaleString('es-CO')}`,c:DB_A,sub:`${clients.length} clientes`},
            {l:'Comisiones pendientes',v:`$${comisionesPend.toLocaleString('es-CO')}`,c:'#f472b6',sub:'Por pagar al equipo'},
            {l:'Comisiones pagadas',v:`$${comisionesPagas.toLocaleString('es-CO')}`,c:'#34d399',sub:'Historial pagado'},
            {l:'Tasa de conversión',v:`${convRate}%`,c:CL_A,sub:'Lead → Activo/Finalizado'},
          ].map(k=>(
            <div key={k.l} className="glass" style={{padding:'22px',borderTop:`2px solid ${k.c}44`}}>
              <p style={{fontSize:'11px',fontWeight:'600',color:'rgba(255,255,255,0.3)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:'10px'}}>{k.l}</p>
              <p style={{fontSize:'26px',fontWeight:'800',color:k.c,marginBottom:'4px',letterSpacing:'-.02em'}}>{k.v}</p>
              <p style={{fontSize:'11px',color:'rgba(255,255,255,0.25)'}}>{k.sub}</p>
            </div>
          ))}
        </div>

        {/* Revenue Forecast */}
        {(()=>{
          const mrr=clients.filter(c=>c.estado==='Activo').reduce((s,c)=>s+(c.montoContrato||0),0);
          const arr=mrr*12;
          const pipeline=clients.filter(c=>['Propuesta enviada','Propuesta aceptada'].includes(c.estado)).reduce((s,c)=>s+(c.montoContrato||0),0);
          const pipelineHigh=clients.filter(c=>c.estado==='Propuesta aceptada').reduce((s,c)=>s+(c.montoContrato||0),0);
          const totalActive=clients.filter(c=>c.estado==='Activo').length;
          const totalPipeline=clients.filter(c=>['Propuesta enviada','Propuesta aceptada'].includes(c.estado)).length;
          const mrrTarget=emps.reduce((s,e)=>s+(e.metaMensual||0),0);
          const mrrPct=mrrTarget>0?Math.min(100,Math.round((mrr/mrrTarget)*100)):0;
          return(
            <div className="glass" style={{padding:'24px',marginBottom:'24px',borderTop:'2px solid rgba(251,191,36,0.2)'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}}>
                <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.1em',textTransform:'uppercase',margin:0}}>Proyección de Ingresos</p>
                <span style={{fontSize:'11px',color:'rgba(255,255,255,0.2)',background:'rgba(255,255,255,0.04)',padding:'3px 10px',borderRadius:'100px'}}>Datos en tiempo real</span>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'20px',marginBottom:'20px'}}>
                {[
                  {l:'MRR',v:`$${mrr.toLocaleString('es-CO')}`,sub:`${totalActive} clientes activos`,c:'#34d399'},
                  {l:'ARR Proyectado',v:`$${arr.toLocaleString('es-CO')}`,sub:'MRR × 12 meses',c:'#f59e0b'},
                  {l:'Pipeline Total',v:`$${pipeline.toLocaleString('es-CO')}`,sub:`${totalPipeline} oportunidades`,c:'#38bdf8'},
                  {l:'Cierre Probable',v:`$${pipelineHigh.toLocaleString('es-CO')}`,sub:'Propuestas aceptadas',c:'#a78bfa'},
                ].map(f=>(
                  <div key={f.l} style={{padding:'16px',background:'rgba(255,255,255,0.02)',borderRadius:'10px',border:'1px solid rgba(255,255,255,0.05)'}}>
                    <p style={{fontSize:'10.5px',fontWeight:'600',color:'rgba(255,255,255,0.3)',letterSpacing:'.06em',textTransform:'uppercase',margin:'0 0 8px'}}>{f.l}</p>
                    <p style={{fontSize:'20px',fontWeight:'800',color:f.c,margin:'0 0 4px',letterSpacing:'-.02em'}}>{f.v}</p>
                    <p style={{fontSize:'11px',color:'rgba(255,255,255,0.25)',margin:0}}>{f.sub}</p>
                  </div>
                ))}
              </div>
              {/* Agency goal */}
              {(()=>{
                const goalBase=agencyGoal>0?agencyGoal:mrrTarget;
                const goalPct=goalBase>0?Math.min(100,Math.round((mrr/goalBase)*100)):0;
                const goalColor=goalPct>=100?'#34d399':goalPct>=75?'#4ade80':goalPct>=50?'#fbbf24':'#a855f7';

                </div>
                <span style={{fontSize:'11px',color:'rgba(255,255,255,0.25)',fontFamily:"'Inter',sans-serif"}}>Activos · sin interacción 30d+</span>
              </div>

                  <div key={c.id} style={{display:'flex',alignItems:'center',gap:'12px',padding:'10px 14px',background:'rgba(248,113,113,0.04)',border:'1px solid rgba(248,113,113,0.1)',borderRadius:'10px'}}>

                    </div>
                    <span style={{fontSize:'11px',fontWeight:'700',color:'#f87171',fontFamily:"'Inter',sans-serif",whiteSpace:'nowrap',flexShrink:0}}>{c.li?`${c.li.days}d sin contacto`:'Sin actividad'}</span>
                    <div style={{display:'flex',gap:'6px',flexShrink:0}}>
                      {c.telefono&&<a href={`https://wa.me/${c.telefono.replace(/\D/g,'')}`} target="_blank" rel="noopener noreferrer" title="WhatsApp" style={{width:'28px',height:'28px',display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(37,211,102,0.1)',border:'1px solid rgba(37,211,102,0.2)',borderRadius:'7px',color:'#25d366',textDecoration:'none',fontSize:'13px'}}>💬</a>}
                      {c.correo&&<a href={`mailto:${c.correo}`} title="Email" style={{width:'28px',height:'28px',display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(56,189,248,0.1)',border:'1px solid rgba(56,189,248,0.2)',borderRadius:'7px',color:'#38bdf8',textDecoration:'none',fontSize:'13px'}}>✉</a>}

          );

          const activos=clients.filter(c=>c.estado==='Activo'&&(c.montoContrato||0)>0);
          if(activos.length===0) return null;
          const rows=Object.entries(SVC_CFG).map(([k,cfg])=>{
            const svcClients=activos.filter(c=>(c.servicios||[]).includes(k));
            const rev=svcClients.reduce((s,c)=>s+(c.montoContrato||0),0);
            return{k,...cfg,rev,count:svcClients.length};
          }).filter(r=>r.count>0).sort((a,b)=>b.rev-a.rev);
          if(!rows.length) return null;
          const maxRev=rows[0].rev;
          const totalRev=rows.reduce((s,r)=>s+r.rev,0);
          return(
            <div className="glass" style={{padding:'24px',marginTop:'20px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}}>
                <p style={{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.3)',letterSpacing:'.1em',textTransform:'uppercase',margin:0}}>Ingresos por Servicio</p>
                <span style={{fontSize:'12px',fontWeight:'700',color:'rgba(255,255,255,0.5)',fontFamily:"'Inter',sans-serif"}}>Total activo: <span style={{color:'#fbbf24'}}>${totalRev.toLocaleString('es-CO')}</span></span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
                {rows.map(r=>{
                  const pct=maxRev>0?(r.rev/maxRev)*100:0;
                  const share=totalRev>0?Math.round((r.rev/totalRev)*100):0;
                  return(
                    <div key={r.k}>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'7px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                          <span style={{fontSize:'14px'}}>{r.icon}</span>
                          <span style={{fontSize:'13px',fontWeight:'600',color:'rgba(255,255,255,0.8)',fontFamily:"'Inter',sans-serif"}}>{r.l}</span>
                          <span style={{fontSize:'10.5px',color:'rgba(255,255,255,0.25)',fontFamily:"'Inter',sans-serif"}}>{r.count} cliente{r.count!==1?'s':''}</span>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                          <span style={{fontSize:'11px',fontWeight:'600',color:`${r.c}cc`,fontFamily:"'Inter',sans-serif"}}>{share}%</span>
                          <span style={{fontSize:'14px',fontWeight:'800',color:r.c,fontFamily:"'Inter',sans-serif"}}>${r.rev.toLocaleString('es-CO')}</span>
                        </div>
                      </div>
                      <div style={{height:'6px',background:'rgba(255,255,255,0.05)',borderRadius:'100px',overflow:'hidden'}}>
                        <div style={{height:'100%',width:`${pct}%`,background:`linear-gradient(90deg,${r.c}aa,${r.c})`,borderRadius:'100px',transition:'width .5s ease'}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
              {rows.length>1&&(
                <div style={{marginTop:'16px',paddingTop:'14px',borderTop:'1px solid rgba(255,255,255,0.05)',display:'flex',gap:'8px',flexWrap:'wrap'}}>
                  {rows.map(r=>(
                    <div key={r.k} style={{display:'flex',alignItems:'center',gap:'5px',padding:'4px 10px',background:`${r.c}0f`,border:`1px solid ${r.c}25`,borderRadius:'100px'}}>
                      <div style={{width:'6px',height:'6px',borderRadius:'50%',background:r.c}}/>
                      <span style={{fontSize:'10.5px',color:`${r.c}cc`,fontFamily:"'Inter',sans-serif",fontWeight:'600'}}>{r.l.split(' ')[0]}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })()}
      </div>
    </div>
  );
}
